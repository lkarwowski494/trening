# --- Postępy: podsumowanie i rekordy ćwiczenia z kilku sesji ---
# M3 p3 (ZM-06, DEC-09): na górze Postępów jest wykres i rekordy ćwiczenia (bez wyboru — ostatnio trenowane), pod nimi wybór (chipy ćwiczeń z danymi), niżej
# sesje ćwiczenia i ogólny przegląd („Summary”)
- tapOn: "Progress, tab.*"
- extendedWaitUntil: { visible: "RECORDS", timeout: 30000 }
- scrollUntilVisible: { element: "Bench Press \\(Dumbbell\\)", direction: DOWN, timeout: 60000, centerElement: true }
- tapOn: "Bench Press \\(Dumbbell\\)"  # chip wyboru (ćwiczenie ma dane); nowy wykres jest na górze
- extendedWaitUntil: { visible: "RECORDS", timeout: 30000 }
- assertVisible: "Max weight.*"
- assertVisible: "e1RM.*"
- assertVisible: "Chart, 4 sessions.*"
- takeScreenshot: 98-rekordy-cwiczenia-historia
- scrollUntilVisible: { element: "Workouts: [0-9]+, previously .*", direction: DOWN, timeout: 60000 }
- assertVisible: "Workouts: [0-9]+, previously .*"
# --- usunięcie najnowszej sesji przesunięciem: Anuluj zostawia, Usuń usuwa ---
- tapOn: "Plan, tab.*"
- extendedWaitUntil: { visible: "Log a past workout", timeout: 30000 }
- scrollUntilVisible: { element: { id: "session-0" }, direction: DOWN, timeout: 60000, centerElement: true }
- swipe: { from: { id: "session-0" }, direction: LEFT, duration: 400 }
- runFlow:
    when: { visible: { id: "session-0-del" } }
    commands:
      - tapOn: { id: "session-0-del" }
- extendedWaitUntil: { visible: "Delete this session from history\\?", timeout: 15000 }
- tapOn: { text: "Cancel", below: "Delete this session from history\\?" }
- assertVisible: "4 sessions"
- swipe: { from: { id: "session-0" }, direction: LEFT, duration: 400 }
- runFlow:
    when: { visible: { id: "session-0-del" } }
    commands:
      - tapOn: { id: "session-0-del" }
- extendedWaitUntil: { visible: "Delete this session from history\\?", timeout: 15000 }
# run 38563966851: odsłonięty wiersz historii zostaje pod oknem pytania i jego przycisk ma w hierarchii dziecko „Delete” — Maestro wziął pierwsze pasujące (wiersz, y 506–526),
# nie przycisk okna (y 463–511), i okno zostało; run 38607952098: indeks 1 też nie trafił w okno (zrzut: okno zostało). Selektor tekstowy jest dwuznaczny, więc stuknięcie w punkt:
# „Delete” w oknie z dwoma przyciskami leży po prawej, środek [205,463][345,511] = (275, 487) z 402×874 pt = 68%, 56% (zrzuty obu przebiegów) (tests/maestro-e2e38563.test.tsx)
- tapOn: { point: "68%, 56%" }
- extendedWaitUntil: { visible: "3 sessions", timeout: 30000 }
- takeScreenshot: 99-po-usunieciu-sesji
# --- „Delete session” na dole szczegółów (M3 p3, ZM-04 / W2): to samo okno co gest przesunięcia, z tą samą treścią; gest zostaje skrótem (wyżej) ---
- tapOn: { text: "Upper A, .*", index: 0 }  # najnowsza sesja na liście (otwarcie szczegółów)
- extendedWaitUntil: { visible: "Session", timeout: 30000 }
- scrollUntilVisible: { element: { id: "delete-object" }, direction: DOWN, timeout: 30000, centerElement: true }
- assertVisible: "Delete session"
- takeScreenshot: 99a-usun-sesje-przycisk
- tapOn: { id: "delete-object" }
- extendedWaitUntil: { visible: "Delete this session from history\\?", timeout: 15000 }
- tapOn: { text: "Cancel", below: "Delete this session from history\\?" }
- assertVisible: "Delete session"
- tapOn: { id: "delete-object" }
- extendedWaitUntil: { visible: "Delete this session from history\\?", timeout: 15000 }
- tapOn: { text: "Delete", below: "Delete this session from history\\?" }
- extendedWaitUntil: { visible: "2 sessions", timeout: 30000 }  # po usunięciu — z powrotem lista Planu
- takeScreenshot: 99b-po-usunieciu-przyciskiem
