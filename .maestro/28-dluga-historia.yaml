# Długa historia istniejącego użytkownika (katalog przepływów docs/37: HI-03, HI-08, PL-13 w części „kilka sesji”): cztery treningi wstecz z rosnącym ciężarem (4, 3, 2 i 1 dzień temu — jedyna droga w UI do sesji
# z różnych dni bez zmiany zegara, docs/31 pkt 2), potem licznik sesji, rekord w najnowszej sesji, wykres/rekordy ćwiczenia i usunięcie sesji przesunięciem (Anuluj / Usuń).
# Skala (setki sesji): poza Maestro — wytworzenie jej przez UI trwałoby godziny (≈40 s na sesję); sprawdzają ją testy wydajności na wygenerowanych danych (katalog: PR-15).
#
# Literały (EN z lib/i18n.en.ts):
#   "Log a past workout" / "Previous day" / "From a template"  ← panel Planu i ekran „Trening wstecz” (jak 05, 31, 32)
#   w-0-0 / reps-0-0                                          ← testID pól ciężaru i powtórzeń pierwszej serii w edytorze sesji (app/history/edit/[id].tsx; ciężar od 13.10.2026)
#   "Cancel session editing" / "Save session"                 ← nagłówek edytora sesji
#   "PR: .*"                                                  ← 'PR: {rodzaje}' (wiersz rekordu pod serią w sesji, app/history/[id].tsx)
#   session-N / session-N-del / "Delete this session from history\\?" ← testID wiersza listy sesji w Planie (app/(tabs)/history.tsx), przycisk pod nim, pytanie ('Usunąć tę sesję z historii?')
#   delete-object / "Delete session"                          ← przycisk „Usuń sesję” na dole szczegółów sesji (components/DeleteButton.tsx, app/history/[id].tsx; M3 p3) — to samo okno co gest
appId: pl.lukasz.trening
name: Długa historia — kilka sesji, rekordy, usunięcie sesji
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
- runFlow: subflows/szablon-testowy.yaml
- tapOn: "Plan, tab.*"
- extendedWaitUntil: { visible: "Log a past workout", timeout: 30000 }
# --- trening sprzed 4 dni: 20 × 8 ---
- tapOn: "Log a past workout"
- extendedWaitUntil: { visible: "From a template", timeout: 30000 }
- tapOn: "Previous day"
- tapOn: "Previous day"
- tapOn: "Previous day"
- tapOn: "Previous day"
- tapOn: "Upper A, .*"
- extendedWaitUntil: { visible: "Cancel session editing", timeout: 30000 }
# E2E 105 (Q-029): na wolnym symulatorze ginęły pojedyncze znaki wpisu — wpis z asercją wartości w jednej powtórce
- retry:
    maxRetries: 2
    commands:
      - tapOn: { id: "w-0-0" }
      - eraseText: 8
      - inputText: "20"
      - tapOn: { id: "reps-0-0" }
      - eraseText: 8
      - inputText: "8"
      - assertVisible: { id: "w-0-0", text: "20" }
      - assertVisible: { id: "reps-0-0", text: "8" }
- tapOn: "Save session"
- tapOn: { text: "Save", below: "Save changes\\?", optional: true }
- extendedWaitUntil: { visible: "Session", timeout: 30000 }
- tapOn: "Back"
- extendedWaitUntil: { visible: "Log a past workout", timeout: 30000 }
