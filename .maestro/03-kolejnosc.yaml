# Ekran zmiany kolejności w trakcie treningu (samo przeciąganie sprawdzają testy jednostkowe — tu ekran i powrót).
appId: pl.lukasz.trening
name: Kolejność ćwiczeń
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
# Świeża instalacja nie ma szablonów (decyzja 03.10.2026) — szablon „Upper A” tworzy podprzepływ przez UI
- runFlow: subflows/szablon-testowy.yaml
- runFlow: subflows/start-szablonu.yaml
- extendedWaitUntil: { visible: "Set 1 done.*", timeout: 30000 }
# centerElement: od E2 bloki są wyższe („⇄ swap”) i przycisk zatrzymywał się pod paskiem zakładek — stuknięcie trafiało
# w zakładkę More (run 37195812733, zrzut kroku 36).
- scrollUntilVisible:
    element: "Reorder exercises"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "Reorder exercises"
- extendedWaitUntil: { visible: "Exercise order", timeout: 30000 }
- takeScreenshot: 07-kolejnosc
# M1-audytor-generalny-026 (27.10.2026): przyciskowa alternatywa przeciągania — „⋯” przy wierszu → „Move down” (arkusz: tylko możliwe kierunki + Cancel)
- tapOn: { text: "Exercise options: .*", index: 0 }
- extendedWaitUntil: { visible: "Move down", timeout: 30000 }
- tapOn: "Move down"
- scrollUntilVisible: { element: "Done", direction: DOWN, timeout: 60000 }
- tapOn: "Done"
- assertNotVisible: "Exercise order"
- scrollUntilVisible: { element: "Reorder exercises", direction: DOWN, timeout: 90000 }
