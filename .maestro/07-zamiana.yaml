# E2 (docs/14 pkt 7, Maestro 07): zamiana ćwiczenia w trakcie treningu — W1 „tylko dziś”: zamiana w miejscu, cofnięcie, podział po odhaczonej serii.
#
# Literały (EN z lib/i18n.en.ts / lib/equipment.ts, chyba że zaznaczono inaczej):
#   "Other workout", "More, tab.*", "Places and equipment", "Add place", "Back", "Workout, tab.*",
#   "Empty workout", "\+ Add exercise", "Search exercises…", "Cancel", "Place filter: X.*" (chip filtra miejsca)  ← jak przepływ 06
#   "Home,.*"                        ← LOCATION_PRESET_LABEL.home.en 'Home' + hint 'empty — tick what you have' (lib/equipment.ts)
#   sw-Adjustable bench              ← testID przełącznika SwitchRow: 'sw-' + EQUIPMENT bench_adj.en (lib/equipment.ts)
#   sw-Dumbbells \(fixed or quick-adjust\) ← jak wyżej, db_fixed.en; nawiasy poprzedzone \\ (tests/maestro-selectors.test.ts)
#   "Bench Press \(Barbell\),.*"     ← Item pickera „{title}, {sub}”: exName('Bench Press (sztanga)') → 'Bench Press (Barbell)', sub 'barbell · missing: …'
#   "no equipment at Home.*"         ← 'brak sprzętu w: {l}' → 'no equipment at {l}' (components/ActiveWorkout.tsx)
#   "Swap exercise: X"               ← 'Zamień ćwiczenie: {name}' (accessibilityLabel przycisku „⇄ zamień” w bloku)
#   "Suggestion 1: X.*"              ← 'Propozycja {n}: {name}' (app/swap.tsx; ranking lib/swap.ts — w Domu z ławką i hantlami:
#                                      Bench Press (Barbell) → 1. Bench Press (Dumbbell); Overhead Press (Barbell) → 1. Arnold Press — remis
#                                      punktów, kolejność alfabetyczna w języku interfejsu; tabela D7: docs/14a-e2-top3.md)
#   "instead of: X.*"                ← 'zamiast: {name}' (linijka pod nazwą zamiennika)
#   "Undo swap: X"                   ← 'Cofnij zamianę: {name}' (przycisk „↺ cofnij”)
#   "Set N done — X"                 ← 'Seria {n} zrobiona — {ex}' (checkbox serii)
#   "\+ set"                         ← '+ seria'
#   "Finish", "Finish workout\?", "Session" ← jak przepływ 05
appId: pl.lukasz.trening
name: Zamiana ćwiczenia w trakcie treningu (E2 W1)
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }

# --- Miejsce „Home”: ławka regulowana i hantle ---
- tapOn: "More, tab.*"
# 11.10.2026: „Places and equipment” to pozycja ekranu Więcej (z Ustawień zniknęła)
- extendedWaitUntil: { visible: "Places and equipment", timeout: 30000 }
- tapOn: "Places and equipment"
- extendedWaitUntil: { visible: "Add place", timeout: 30000 }
- tapOn: "Add place"
- extendedWaitUntil: { visible: "Home,.*", timeout: 30000 }
- tapOn: "Home,.*"
- extendedWaitUntil: { visible: "Available exercises: .*", timeout: 30000 }
# 05.10.2026: grupy sprzętu zwinięte — rozwinięcie „Wolne ciężary” i „Ławki i stojaki” (EQUIP_GROUP_LABEL)
- scrollUntilVisible: { element: "Free weights.*", direction: DOWN, timeout: 90000 }
- tapOn: "Free weights.*"
- scrollUntilVisible: { element: { id: "sw-Dumbbells \\(fixed or quick-adjust\\)" }, direction: DOWN, timeout: 90000 }
- tapOn: { id: "sw-Dumbbells \\(fixed or quick-adjust\\)" }
- scrollUntilVisible: { element: "Benches and racks.*", direction: DOWN, timeout: 90000 }
- tapOn: "Benches and racks.*"
- scrollUntilVisible: { element: { id: "sw-Adjustable bench" }, direction: DOWN, timeout: 90000 }
- tapOn: { id: "sw-Adjustable bench" }
- takeScreenshot: 30-dom-lawka-hantle
- tapOn: "Back"
- extendedWaitUntil: { visible: "Add place", timeout: 30000 }
- tapOn: "Back"
- extendedWaitUntil: { visible: "Places and equipment", timeout: 30000 }  # lista miejsc → ekran Więcej
- extendedWaitUntil: { visible: "Workout, tab.*", timeout: 30000 }
- tapOn: "Workout, tab.*"

# --- Pusty trening + Bench Press (Barbell) — niedostępny w Domu ---
- extendedWaitUntil: { visible: "Other workout", timeout: 30000 }
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
- tapOn: { text: "Not now", optional: true }   # M1-035: karta „Notification at the end of rest” (czysta instalacja, zgoda nieustalona) przesuwa układ — chowamy ją przed dalszymi krokami
- extendedWaitUntil: { visible: "\\+ Add exercise", timeout: 30000 }
- tapOn: "\\+ Add exercise"
- extendedWaitUntil: { visible: "Place filter: Home.*", timeout: 30000 }
- tapOn: "Place filter: Home.*"
- tapOn: "Search exercises…"
- inputText: "Bench"
- pressKey: Enter   # reguła: po wpisie w wyszukiwarce wyboru ćwiczenia zawsze Enter (klawiatura znika, lista zostaje przefiltrowana)
- tapOn: { text: "Continue", optional: true }
- pressKey: Enter   # chowa klawiaturę (L-013: na 390 pt wiersz wyniku leży przy niej)
- extendedWaitUntil: { visible: "Bench Press \\(Barbell\\),.*", timeout: 30000 }
- tapOn: "Bench Press \\(Barbell\\),.*"
- extendedWaitUntil: { visible: "no equipment at Home.*", timeout: 30000 }
- takeScreenshot: 31-brak-sprzetu

# --- Zamiana w miejscu: propozycje → Bench Press (Dumbbell) ---
- scrollUntilVisible: { element: "Swap exercise: Bench Press \\(Barbell\\)", direction: DOWN, timeout: 30000, centerElement: true }  # run 37738868663: przycisk nad paskiem zakładek
- tapOn: "Swap exercise: Bench Press \\(Barbell\\)"
- extendedWaitUntil: { visible: "Suggestion 1: Bench Press \\(Dumbbell\\).*", timeout: 30000 }
- takeScreenshot: 32-arkusz-propozycje
- tapOn: "Suggestion 1: Bench Press \\(Dumbbell\\).*"
- extendedWaitUntil: { visible: "instead of: Bench Press \\(Barbell\\).*", timeout: 30000 }
- assertVisible: "Set 1 done — Bench Press \\(Dumbbell\\)"
- assertNotVisible: "Set 2 done — Bench Press \\(Dumbbell\\)"   # ta sama liczba serii (pusty trening: 1)
- assertNotVisible: "no equipment at Home.*"
- takeScreenshot: 33-po-zamianie

# --- Cofnięcie i ponowna zamiana ---
# run 38563966851: przy dłuższej treści (panel „Test watch” w buildzie E2E) środek listy leży wyżej — przycisk „↺ cofnij” był nad krawędzią listy (y 35–75, lista od 62),
# a stuknięcie w niego trafiało w pasek stanu; przewinięcie w górę ze środkowaniem przed stuknięciem
- scrollUntilVisible: { element: "Undo swap: Bench Press \\(Dumbbell\\)", direction: UP, timeout: 30000, centerElement: true }
- tapOn: "Undo swap: Bench Press \\(Dumbbell\\)"
- scrollUntilVisible: { element: "Swap exercise: Bench Press \\(Barbell\\)", direction: DOWN, timeout: 30000 }  # M3 fix: przycisk zamiany bywa pod krawędzią (większe cyfry tablicy, 04-studio-projektowe-001)
- extendedWaitUntil: { visible: "Swap exercise: Bench Press \\(Barbell\\)", timeout: 30000 }
- assertNotVisible: "instead of: .*"
- scrollUntilVisible: { element: "Swap exercise: Bench Press \\(Barbell\\)", direction: DOWN, timeout: 30000, centerElement: true }  # run 37738868663: przycisk nad paskiem zakładek
- tapOn: "Swap exercise: Bench Press \\(Barbell\\)"
- extendedWaitUntil: { visible: "Suggestion 1: Bench Press \\(Dumbbell\\).*", timeout: 30000 }
- tapOn: "Suggestion 1: Bench Press \\(Dumbbell\\).*"
- extendedWaitUntil: { visible: "instead of: Bench Press \\(Barbell\\).*", timeout: 30000 }

# --- Podział: drugie ćwiczenie z 3 seriami, 1 odhaczona → zamiana ---
- scrollUntilVisible: { element: "\\+ Add exercise", direction: DOWN, timeout: 60000, centerElement: true }  # run 37730170793: bez wyśrodkowania stuknięcie trafiło w pasek zakładek
- tapOn: "\\+ Add exercise"
- extendedWaitUntil: { visible: "Search exercises…", timeout: 30000 }
- tapOn: "Search exercises…"
- inputText: "Overhead Press"
- pressKey: Enter   # reguła: po wpisie w wyszukiwarce wyboru ćwiczenia zawsze Enter (klawiatura znika, lista zostaje przefiltrowana)
- tapOn: { text: "Continue", optional: true }
- pressKey: Enter   # chowa klawiaturę (L-013: na 390 pt wiersz wyniku leży przy niej)
- extendedWaitUntil: { visible: "Overhead Press \\(Barbell\\),.*", timeout: 30000 }
- tapOn: "Overhead Press \\(Barbell\\),.*"
- extendedWaitUntil: { visible: "Set 1 done — Overhead Press \\(Barbell\\)", timeout: 30000 }
- scrollUntilVisible: { element: { text: "\\+ set", index: 1 }, direction: DOWN, timeout: 60000 }
- tapOn: { text: "\\+ set", index: 1 }
- scrollUntilVisible: { element: { text: "\\+ set", index: 1 }, direction: DOWN, timeout: 60000 }  # M3 fix: tablica z większymi cyframi (04-studio-projektowe-001) — po dodaniu serii „+ set” schodzi pod listę
- tapOn: { text: "\\+ set", index: 1 }
- scrollUntilVisible: { element: "Set 3 done — Overhead Press \\(Barbell\\)", direction: DOWN, timeout: 60000 }
- tapOn: "Set 1 done — Overhead Press \\(Barbell\\)"
- tapOn: { text: "Skip", optional: true }
- scrollUntilVisible: { element: "Swap exercise: Overhead Press \\(Barbell\\)", direction: DOWN, timeout: 60000, centerElement: true }  # jak wyżej — przycisk nad paskiem zakładek
- tapOn: "Swap exercise: Overhead Press \\(Barbell\\)"
- extendedWaitUntil: { visible: "Suggestion 1: Arnold Press.*", timeout: 30000 }
- tapOn: "Suggestion 1: Arnold Press.*"
- extendedWaitUntil: { visible: "instead of: Overhead Press \\(Barbell\\).*", timeout: 30000 }
# E2E 89 (krok 83): po podziale blok Overhead Press (1 odhaczona seria) kurczy się, a lista zostaje przewinięta jak przy przycisku „Swap” —
# odhaczona seria najpewniej wypadała nad widoczny obszar (bez zrzutu tego kroku; w drzewie Jest blok jest na miejscu — tests/maestro-flows.test.tsx).
# Przewinięcie do niej zamiast assertVisible.
- scrollUntilVisible: { element: "Set 1 done — Overhead Press \\(Barbell\\)", direction: UP, timeout: 30000 }
- assertNotVisible: "Set 2 done — Overhead Press \\(Barbell\\)"
- scrollUntilVisible: { element: "Set 1 done — Arnold Press", direction: DOWN, timeout: 30000 }
- scrollUntilVisible: { element: "Set 2 done — Arnold Press", direction: DOWN, timeout: 30000 }
- assertNotVisible: "Set 3 done — Arnold Press"
- takeScreenshot: 34-podzial

# --- Odhaczenie serii B → Zakończ → w historii oba ćwiczenia ---
# run 37480681417 (06.10.2026): ✓ tuż nad paskiem zakładek — stuknięcie nie trafiło, seria nieodhaczona, Arnold Press nie trafił do historii.
# Przewinięcie na środek ekranu przed stuknięciem i sprawdzenie licznika serii (2 z 4) po nim.
- scrollUntilVisible: { element: "Set 1 done — Arnold Press", direction: DOWN, centerElement: true, timeout: 60000 }
- tapOn: "Set 1 done — Arnold Press"
- tapOn: { text: "Skip", optional: true }
# run 39148365522: „Finish” przewinięty tylko do krawędzi (bez środkowania) — stuknięcie w niego nie otworzyło pytania; środkowanie i powtórka stuknięcia jak w 27
- scrollUntilVisible: { element: "Finish", direction: UP, timeout: 60000, centerElement: true }
- extendedWaitUntil: { visible: "Workout progress: 2 of 4 sets", timeout: 30000 }
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Finish"
      - extendedWaitUntil: { visible: "Finish workout\\?", timeout: 10000 }
- tapOn: { text: "Finish", below: "Finish workout\\?" }
- extendedWaitUntil: { visible: "Session", timeout: 30000 }
- assertVisible: ".*Overhead Press \\(Barbell\\).*"
- assertVisible: ".*Arnold Press.*"
- takeScreenshot: 35-historia-po-podziale

# --- D6: przepięcie w edytorze historii (docs/14 pkt 5, krok 7) ---
#   "Edit session", "Save session", "Save changes\?" ← jak przepływ 05; „⇄ zamień” w edytorze ma ten sam opis „Swap exercise: X”
- tapOn: "Edit session"
- extendedWaitUntil: { visible: "Swap exercise: Overhead Press \\(Barbell\\)", timeout: 30000 }
- tapOn: "Swap exercise: Overhead Press \\(Barbell\\)"  # ekran bez paska zakładek (edytor historii)
- extendedWaitUntil: { visible: "Suggestion \\d: Overhead Press \\(Dumbbell\\).*", timeout: 30000 }
- takeScreenshot: 38-edytor-arkusz
- tapOn: "Suggestion \\d: Overhead Press \\(Dumbbell\\).*"
- extendedWaitUntil: { visible: "Swap exercise: Overhead Press \\(Dumbbell\\)", timeout: 30000 }
- tapOn: "Save session"
- tapOn: { text: "Save", below: "Save changes\\?", optional: true }
- extendedWaitUntil: { visible: "Session", timeout: 30000 }
- assertVisible: ".*Overhead Press \\(Dumbbell\\).*"
- assertNotVisible: ".*Overhead Press \\(Barbell\\).*"
- takeScreenshot: 39-historia-po-przepieciu

# --- W3: „Always at Home” w treningu z szablonu i podpowiedź przy ponownym starcie (docs/14 pkt 7, krok 9 — rekomendacja) ---
#   "Always at Home — X"             ← 'Zawsze w: {l} — {name}' (accessibilityLabel przycisku „Zawsze w: Dom” w linijce „zamiast”)
#   "Swap to substitute: X"          ← 'Zamień na zamiennik: {name}' (etykieta tekstu-przycisku „Usually at Home — X. Swap?'; 'Zwykle w: {l} — {name}. Zamienić?')
#   "Discard workout", "Discard workout\?" ← 'Odrzuć trening' / 'Odrzucić trening?' (audyt 0.10 H2: jedna nazwa akcji, dawniej „Cancel workout”)
- tapOn: "Back"
- extendedWaitUntil: { visible: "Other workout", timeout: 30000 }  # układ B (09.10.2026): ekran główny od karty „Dziś” i przycisku startu
- runFlow: subflows/szablon-testowy.yaml
- runFlow: subflows/start-szablonu.yaml
- scrollUntilVisible: { element: "Swap exercise: Bench Press \\(Dumbbell\\)", direction: DOWN, timeout: 30000 }  # M3 fix: przycisk zamiany bywa pod krawędzią (większe cyfry tablicy, 04-studio-projektowe-001)
- extendedWaitUntil: { visible: "Swap exercise: Bench Press \\(Dumbbell\\)", timeout: 30000 }
- scrollUntilVisible: { element: "Swap exercise: Bench Press \\(Dumbbell\\)", direction: DOWN, timeout: 30000, centerElement: true }  # run 37738868663: przycisk nad paskiem zakładek
- tapOn: "Swap exercise: Bench Press \\(Dumbbell\\)"
- extendedWaitUntil: { visible: "Suggestion 1: .*", timeout: 30000 }
- tapOn: "Suggestion 1: .*"
- extendedWaitUntil: { visible: "Always at Home — .*", timeout: 30000 }
# E2E 91: przycisk był przy górnej krawędzi ekranu (y 109–150) — tap w (78, 129) trafił w systemowy baner iOS 26 nad aplikacją (świeży
# symulator: powiadomienie „Apple Intelligence & Siri”), który otworzył Ustawienia → Siri; reszta scenariusza poza aplikacją. Przewinięcie
# z centerElement stawia przycisk na środku ekranu, z dala od pasa banerów (maestro.log przebiegu 91: „Tapping … bounds=[14,109][142,150]”).
- scrollUntilVisible: { element: "Always at Home — .*", direction: DOWN, timeout: 30000, centerElement: true }
- tapOn: "Always at Home — .*"
- assertNotVisible: "Always at Home — .*"
- takeScreenshot: 36-zawsze-w-domu
- scrollUntilVisible: { element: "Discard workout", direction: DOWN, timeout: 60000 }
- tapOn: "Discard workout"
- extendedWaitUntil: { visible: "Discard workout\\?", timeout: 30000 }
# Pod tytułem okna są dwa „Discard workout”: przycisk okna i przycisk w tle (lista przewinięta do dołu) — „below: tytuł”
# trafiał w ten w tle, zasłonięty oknem (run 37197114478, zrzut kroku 150). Przycisk okna: pod „Back”, nad przyciskiem w tle.
# (Do 07.10.2026 kotwicą był opis w tle „The workout in progress saves…” — w kroju Tuleja opis zachodzi na przycisk okna, run 37600735711, krok 154.)
# Run 37900617167 (f2bdca8): od fali 2 (H2) „Back” ma styl 'cancel' — iOS stawia przycisk anulowania NA DOLE okna, pod „Discard workout”
# (zrzut kroku 159). Przycisk okna: nad „Back”; przycisk w tle leży pod oknem, więc pod „Back”.
- tapOn: { text: "Discard workout", above: "Cancel" }
- extendedWaitUntil: { notVisible: "Discard workout\\?", timeout: 30000 }
- runFlow: subflows/start-szablonu.yaml
# 11.10.2026: podpowiedź „Usually at Home — X. Swap?” to tekst-przycisk (bez „Zamień”); etykieta VoiceOver „Swap to substitute: X” — stuknięcie otwiera arkusz zamiany
- extendedWaitUntil: { visible: "Swap to substitute: .*", timeout: 30000 }
# interpreter E2E 91 (tests/maestro-layout.ts): linijka podpowiedzi przesuwa przycisk zamiany pod pasek zakładek (jak przy pierwszym starcie, run 37738868663)
- scrollUntilVisible: { element: "Swap exercise: Bench Press \\(Dumbbell\\)", direction: DOWN, timeout: 30000, centerElement: true }   # podpowiedź nie zmienia bloku sama
- takeScreenshot: 37-podpowiedz-zamiennika
# E2E 0.13.0 (run 38241528019, próba 2): po przewinięciu linijka podpowiedzi leżała przy górnej krawędzi, pod paskiem stanu (zrzut kroku 181 — widać
# tylko jej dolny skraj). Maestro uznał ją za widoczną (hierarchia iOS nie przycina do listy), stuknął w pasek stanu i arkusz zamiany się nie otworzył.
# Najpierw przesunięcie palcem w dół (lista do góry — podpowiedź na górze bloku), potem stuknięcie (wzór: 13, E2E 105). Test: tests/maestro-selectors.test.ts
- swipe: { start: "50%, 30%", end: "50%, 80%", duration: 400 }
- waitForAnimationToEnd
- tapOn: "Swap to substitute: .*"
- extendedWaitUntil: { visible: "Suggestion 1: .*", timeout: 30000 }
- tapOn: "Cancel"
- extendedWaitUntil: { notVisible: "Suggestion 1: .*", timeout: 30000 }
