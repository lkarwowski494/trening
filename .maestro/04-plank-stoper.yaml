# Pusty trening + plank z wyboru ćwiczeń, stoper serii, zakończenie serii.
appId: pl.lukasz.trening
name: Plank ze stoperem
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
# run 37496797683 (06.10.2026): pierwszy scenariusz po starcie symulatora — ekran treningu nie zdążył się pojawić; czekamy jak w 06/07
- extendedWaitUntil: { visible: "\\+ Add exercise", timeout: 30000 }
- tapOn: "\\+ Add exercise"
# Q-029 (0.14.0; runy 38023746057, 38027253177): pierwszy scenariusz po zimnym starcie symulatora gubił znaki wpisu („P” zamiast „Plank”) — jak masa ciała
# w scenariuszu 15 (E2E 105). Znaki osobno (odstęp jak przy ręcznym wpisie), sprawdzenie, że pole ma całe „Plank”, i jedna powtórka całego wpisu.
# Test: tests/maestro-e2e105.test.tsx (Q-029)
- retry:
    maxRetries: 1
    commands:
      - tapOn: "Search exercises…"
      - waitForAnimationToEnd
      - eraseText: 20
      - inputText: "P"
      - inputText: "l"
      - inputText: "a"
      - inputText: "n"
      - inputText: "k"
      - assertVisible: "Plank"  # wartość pola wyszukiwania (zgubiony znak = inny tekst)
- tapOn: { text: "Continue", optional: true }
- pressKey: Enter   # chowa klawiaturę (L-013: na 390 pt wiersz wyniku leży przy niej)
- tapOn: "Plank, body weight"
- extendedWaitUntil: { visible: "Start set stopwatch", timeout: 30000 }
# Audyt 0.10 (LIVE-06, wariant A): karta „teraz” serii na czas — duży „▶ Start” ('Start stopera: {ex}, seria {n}') i mały
# „Odhacz bez pomiaru” ('Odhacz bez pomiaru: {ex}, seria {n}'); etykieta VoiceOver zastępuje tekst przycisku w drzewie dostępności
- assertVisible: "Start stopwatch: Plank, set 1"
- assertVisible: "Tick without timing: Plank, set 1"
- tapOn: { text: "Start set stopwatch", index: 0 }
- assertVisible: "Finish set"
- takeScreenshot: 08-stoper
- tapOn: "Finish set"
- assertNotVisible: "Finish set"
- takeScreenshot: 09-plank-zapisany
