# Pusty trening + plank z wyboru ćwiczeń, stoper serii, zakończenie serii.
appId: pl.lukasz.trening
name: Plank ze stoperem
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Start from a template", timeout: 60000 }
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
# run 37496797683 (06.10.2026): pierwszy scenariusz po starcie symulatora — ekran treningu nie zdążył się pojawić; czekamy jak w 06/07
- extendedWaitUntil: { visible: "\\+ Add exercise", timeout: 30000 }
- tapOn: "\\+ Add exercise"
- tapOn: "Search exercises…"
- inputText: "Plank"
- tapOn: { text: "Continue", optional: true }
- tapOn: "Plank, body weight"
- extendedWaitUntil: { visible: "Start set stopwatch", timeout: 30000 }
- tapOn: { text: "Start set stopwatch", index: 0 }
- assertVisible: "Finish set"
- takeScreenshot: 08-stoper
- tapOn: "Finish set"
- assertNotVisible: "Finish set"
- takeScreenshot: 09-plank-zapisany
