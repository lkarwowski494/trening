# Pierwszy trening: start z szablonu, odhaczenie serii, przerwa, pominięcie, zakończenie, historia.
appId: pl.lukasz.trening
name: Trening z szablonu
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Start from a template", timeout: 60000 }
# Świeża instalacja nie ma szablonów (decyzja 03.10.2026) — szablon „Upper A” tworzy podprzepływ przez UI
- runFlow: subflows/szablon-testowy.yaml
- takeScreenshot: 01-start
- tapOn: "Start: Upper A"
- extendedWaitUntil: { visible: "Set 1 done.*", timeout: 30000 }
- takeScreenshot: 02-trening
# Pauza treningu (08.10.2026, components/ActiveWorkout.tsx SessionClock): „Pause workout” / „Resume workout” ('Pauza treningu' / 'Wznów trening').
- tapOn: "Pause workout"
- extendedWaitUntil: { visible: "Resume workout", timeout: 15000 }
- assertVisible: ".* · paused"
- takeScreenshot: 02b-pauza
- tapOn: "Resume workout"
- extendedWaitUntil: { visible: "Pause workout", timeout: 15000 }
- tapOn: { text: "Set 1 done.*", index: 0 }
- assertVisible: "Skip"
- takeScreenshot: 03-przerwa
- tapOn: "Skip"
- assertNotVisible: "Skip"
- tapOn: "Finish"
- assertVisible: "Finish workout?"
- takeScreenshot: 04-pytanie-o-zakonczenie
- tapOn: { text: "Finish", below: "Finish workout\\?" }
# Po zapisie aplikacja pokazuje zapisaną sesję
- extendedWaitUntil: { visible: "Session", timeout: 30000 }  # tytuł ekranu sesji (07.10.2026 wieczór: przycisku „Delete session” już nie ma — usuwanie przesunięciem na liście)
- assertVisible: "Upper A"
- takeScreenshot: 05-zapisana-sesja
- tapOn: "Back"
- tapOn: "Calendar.*"  # 08.10.2026: zakładka Historia → Kalendarz
- assertVisible: "Upper A.*"
- takeScreenshot: 06-historia
