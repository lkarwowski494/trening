# Pierwszy trening: start z szablonu, odhaczenie serii, przerwa, pominięcie, zakończenie, historia.
appId: pl.lukasz.trening
name: Trening z szablonu
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
# Świeża instalacja nie ma szablonów (decyzja 03.10.2026) — szablon „Upper A” tworzy podprzepływ przez UI
- runFlow: subflows/szablon-testowy.yaml
- takeScreenshot: 01-start
- runFlow: subflows/start-szablonu.yaml
- extendedWaitUntil: { visible: "Set 1 done.*", timeout: 30000 }
- takeScreenshot: 02-trening
# Pauza treningu (08.10.2026): „Pause workout” / „Resume workout” ('Pauza treningu' / 'Wznów trening') — od M3 p2 (ZM-02) w menu „⋯” („Workout options”, 'Opcje treningu').
- tapOn: "Workout options"
- tapOn: "Pause workout"
- extendedWaitUntil: { visible: ".* · paused", timeout: 15000 }
- takeScreenshot: 02b-pauza
- tapOn: "Workout options"
- tapOn: "Resume workout"
- extendedWaitUntil: { visible: "Workout options", timeout: 15000 }
- assertNotVisible: ".* · paused"
- tapOn: { text: "Set 1 done.*", index: 0 }
- assertVisible: "Skip"
- takeScreenshot: 03-przerwa
- tapOn: "Skip"
- assertNotVisible: "Skip"
- tapOn: "Finish"
- assertVisible: "Finish workout?"
- takeScreenshot: 04-pytanie-o-zakonczenie
- tapOn: { text: "Finish", below: "Finish workout\\?" }
# Po zapisie aplikacja pokazuje zapisaną sesję
- extendedWaitUntil: { visible: "Session", timeout: 30000 }  # tytuł ekranu sesji (07.10.2026 wieczór: przycisku „Delete session” już nie ma — usuwanie przesunięciem na liście)
- assertVisible: "Upper A"
- takeScreenshot: 05-zapisana-sesja
- tapOn: "Back"
- tapOn: "Plan, tab.*"  # 11.10.2026: zakładka Kalendarz → Plan (docs/22, wariant A: Trening · Plan · Postępy · Więcej)
- assertVisible: "Upper A.*"
- takeScreenshot: 06-historia
# Dashboard ekranu Trening (08.10.2026, components/Dashboard.tsx): po treningu kafelki „This week” ('Ten tydzień'), „Workouts: 1; Sets: …”
# (od 11.10.2026 bez poprzedniego tygodnia: „Workouts: 1; Sets: …”); ostatni trening (od 09.10.2026, układ B, bez sekcji „Ostatni trening”) w arkuszu „Other workout”
# ('Inny trening'): „Repeat last (Upper A)” ('Powtórz ostatni ({name})', etykieta VoiceOver wiersza), „Cancel” ('Anuluj') zamyka arkusz; karta „Today” bez planu po dzisiejszym treningu: 'Dziś zrobione: {name}'
# („Done today: Upper A”; „No weekly plan” tylko, gdy dziś nic nie zrobiono — audyt 0.10, E2E 89) i podpowiedź 'Ustaw plan tygodnia, by widzieć tu…'.
- tapOn: "Workout, tab.*"
- extendedWaitUntil: { visible: "This week", timeout: 30000 }
# E2E 91: kafelki to jeden przycisk „Postępy” (UX-16 A) — VoiceOver czyta jedną etykietę „Workouts: …; Sets: …; Time: …” (kafelek nie jest osobnym elementem)
- assertVisible: "Workouts: 1;.*"
- assertVisible: "Done today: Upper A"
- assertVisible: "No weekly plan"  # 11.10.2026: nagłówek planu (podpowiedź „Set a weekly plan…” zniknęła); przycisk obok: „Set a plan”
- assertVisible: "Set a plan"
- takeScreenshot: 07-dashboard
- tapOn: "Other workout"
- extendedWaitUntil: { visible: "Repeat last \\(Upper A\\)", timeout: 20000 }
- takeScreenshot: 08-inny-trening
- tapOn: "Cancel"
