# Scenariusz „z życia” (docs/31, persona C), CZĘŚĆ 2: po instalacji BIEŻĄCEJ aplikacji na symulator z danymi poprzedniej wersji (bez odinstalowania, bez
# clearState). Sprawdza, że trening w toku, historia, szablon, masa ciała i jednostka są na miejscu, pokazuje się „Co nowego”, a trening da się dokończyć.
# Tylko e2e-ios.yml (krok „Aktualizacja”); w zwykłym przebiegu pomijany (tag `aktualizacja`). Przerwa mogła się już skończyć (instalacja trwa > 2 min) — nie zakładamy „Skip”.
tags:
  - aktualizacja
appId: pl.lukasz.trening
name: Aktualizacja — dane po instalacji nowej wersji
---
- launchApp:
    clearState: false
- extendedWaitUntil: { visible: "Workout options", timeout: 90000 }
- assertVisible: "Upper A"
- assertVisible: "Workout progress: 1 of 6 sets"
- assertVisible: { id: "w-0-0", text: "40" }  # wpisane wartości i jednostka kg przetrwały aktualizację (wiersz serii)
- assertVisible: "(Bench Press \\(Dumbbell\\), set 2 of 3\\. 40 .*10 reps.*|Rest\\. .*Next: set 2 of 3, 40 kg × 10)"  # tablica „teraz”: seria 2 z wartościami z serii 1 (albo przerwa, jeśli jeszcze trwa)
- takeScreenshot: 101-trening-w-toku-po-aktualizacji
# --- dokończenie treningu ---
- scrollUntilVisible: { element: "Finish", direction: UP, timeout: 60000 }
- retry:  # run 38375488119: stuknięcie „Finish” w trakcie odliczania/przewijania bywa gubione — okno pytania się nie pokazało
    maxRetries: 2
    commands:
      - tapOn: "Finish"
      - extendedWaitUntil: { visible: "Finish workout\\?", timeout: 8000 }
- tapOn: { text: "Finish", below: "Finish workout\\?" }
- extendedWaitUntil: { visible: "Session", timeout: 30000 }
- assertVisible: "Upper A"
- tapOn: "Back"
# --- „Co nowego” po aktualizacji z 0.20: 1.0.0: historia „Co nowego” pusta (decyzja właściciela 14.10.2026, docs/18) — przycisku ✦ nie ma (bez kropki i panelu) ---
- extendedWaitUntil: { visible: "Other workout", timeout: 30000 }
- assertNotVisible: { id: "whats-new-i" }
# --- historia: dwa treningi dzisiaj; szablon i masa ciała na miejscu ---
- tapOn: "Plan, tab.*"
- extendedWaitUntil: { visible: "3 sessions", timeout: 30000 }  # nie „dziś”: instalacja trwa minuty i przebieg bywa przez północ UTC (docs/18)
- tapOn: "Progress, tab.*"
- scrollUntilVisible: { element: "Summary", direction: DOWN, timeout: 30000 }  # M3 p3 (ZM-06): na górze Postępów jest wykres i rekordy ćwiczenia, „Summary” (ogólny przegląd) jest niżej
- scrollUntilVisible: { element: "80 kg · measured .*", direction: DOWN, timeout: 60000 }
- tapOn: "More, tab.*"
- extendedWaitUntil: { visible: "Templates", timeout: 30000 }
- tapOn: "Templates"
- extendedWaitUntil: { visible: "Upper A.*", timeout: 30000 }
- takeScreenshot: 103-szablon-po-aktualizacji
- tapOn: "Back"
# --- 13.10.2026 (katalog przepływów AK-03): plan tygodnia i miejsce „Home” z poprzedniej wersji nadal są (migracja schematu) ---
- tapOn: "Plan, tab.*"
- extendedWaitUntil: { visible: "Planning", timeout: 30000 }
- tapOn: "Planning"
- extendedWaitUntil: { visible: "Monday, Upper A", timeout: 30000 }
- scrollUntilVisible: { element: "Sunday, Upper A", direction: DOWN, timeout: 30000, centerElement: true }
- tapOn: "Back"
- tapOn: "More, tab.*"
- extendedWaitUntil: { visible: "Places and equipment", timeout: 30000 }
- tapOn: "Places and equipment"
- extendedWaitUntil: { visible: "★ Home, main · 1 equipment item", timeout: 30000 }   # miejsce z poprzedniej wersji, z jedną pozycją sprzętu (hantle)
- takeScreenshot: 104-miejsce-po-aktualizacji
# ZM-07 (p5d, 21.10.2026): nowy przełącznik „Haptics” istnieje po aktualizacji z danych bez pola (wibracje za dźwiękiem — wartość sprawdza Jest: tests/m3-p5d-haptics.test.ts, dane 0.20)
- tapOn: "Back"
- extendedWaitUntil: { visible: "Settings", timeout: 30000 }
- tapOn: "Settings"
- extendedWaitUntil: { visible: "Language, Phone setting", timeout: 30000 }
- scrollUntilVisible: { element: { id: "sw-Haptics" }, direction: DOWN, timeout: 60000, centerElement: true }
- assertVisible: { id: "sw-Sound at the end of rest" }
- assertVisible: { id: "sw-Haptics" }
- takeScreenshot: 104b-wibracje-po-aktualizacji
