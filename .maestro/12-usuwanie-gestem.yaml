# Usuwanie przesunięciem w lewo (decyzja właściciela 07.10.2026 wieczór, docs/18): prawdziwy gest palcem — „Nie” zostawia serię,
# „Delete” ją usuwa; ostatnia seria bloku nie ma gestu. Logika i wszystkie miejsca usuwania: tests/swipe-delete.test.tsx.
#
# Literały (EN z lib/i18n.en.ts):
#   set-0-1                 ← testID wiersza serii 2 bloku 0 (components/ActiveWorkout.tsx, SwipeRow)
#   "Delete set\?"          ← 'Usunąć serię?'; przyciski "Cancel" / "Delete" ('Anuluj' / 'Usuń')
#   "\+ set"                ← '+ seria'
#   "Set 2 done.*"          ← 'Seria {n} zrobiona — {ex}' (✓ w wierszu)
# Przesunięcie Maestro po elemencie nie sięga progu „od razu pytaj” (2 szerokości przycisku, components/SwipeRow.tsx swipeDecision) —
# odsłania przycisk „Delete” (testID <wiersz>-del), który scenariusz stuka; potem pytanie (E2E run 37657730493, zrzuty).
appId: pl.lukasz.trening
name: Usuwanie przesunięciem w lewo i „Pomiń dziś”
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
- extendedWaitUntil: { visible: "\\+ Add exercise", timeout: 30000 }
- tapOn: "\\+ Add exercise"
- tapOn: "Search exercises…"
- inputText: "Back Squat"
- pressKey: Enter   # reguła: po wpisie w wyszukiwarce wyboru ćwiczenia zawsze Enter (klawiatura znika, lista zostaje przefiltrowana)
- tapOn: { text: "Continue", optional: true }
- pressKey: Enter   # chowa klawiaturę (L-013: na 390 pt wiersz wyniku leży przy niej)
# run 38607952098: stuknięcie w wiersz „Back Squat” przy rozsuwającej się klawiaturze nie wybrało ćwiczenia (zrzut: wybór wciąż otwarty) — powtórka stuknięcia
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Back Squat,.*"
      - extendedWaitUntil: { visible: "\\+ set", timeout: 10000 }
- tapOn: "\\+ set"
- extendedWaitUntil: { visible: "Set 2 done.*", timeout: 15000 }

# --- przesunięcie w lewo → pytanie; „No” zostawia serię ---
- swipe: { from: { id: "set-0-1" }, direction: LEFT, duration: 400 }
# Krótszy gest odsłania przycisk „Delete” pod wierszem (stan „open”) — wtedy stuknięcie; pełny od razu pyta (E2E run 37657730493).
- runFlow:
    when: { visible: { id: "set-0-1-del" } }
    commands:
      - tapOn: { id: "set-0-1-del" }
- extendedWaitUntil: { visible: "Delete set\\?", timeout: 15000 }
- takeScreenshot: 44-usuwanie-pytanie
- tapOn: { text: "Cancel", below: "Delete set\\?" }
- assertVisible: "Set 2 done.*"

# --- jeszcze raz → „Delete” usuwa serię ---
- swipe: { from: { id: "set-0-1" }, direction: LEFT, duration: 400 }
# Krótszy gest odsłania przycisk „Delete” pod wierszem (stan „open”) — wtedy stuknięcie; pełny od razu pyta (E2E run 37657730493).
- runFlow:
    when: { visible: { id: "set-0-1-del" } }
    commands:
      - tapOn: { id: "set-0-1-del" }
- extendedWaitUntil: { visible: "Delete set\\?", timeout: 15000 }
- tapOn: { text: "Delete", below: "Delete set\\?" }
- extendedWaitUntil: { notVisible: "Set 2 done.*", timeout: 15000 }
- assertVisible: "Set 1 done.*"
- takeScreenshot: 45-usuwanie-po

# --- „Pomiń dziś” ('Pomiń dziś' / 'pominięte dziś' / 'Przywróć'): blok zwija się do jednej linii; „Restore” go przywraca ---
# przycisk ma etykietę VoiceOver „Skip today: Back Squat” — selektor z „.*” (lekcja z run 37600735711)
# L-013 (nocny run 39537208004, iPhone 17e 390 pt): stuknięcie „Skip today” COMPLETED, ale „skipped today” się nie pojawiło. Zrzut z 31 (ten sam mechanizm) pokazuje koniec listy bez
# wiersza — po zwinięciu ćwiczenia lista się skraca i przewija do końca, wiersz zwinięty leży nad ekranem (hipoteza). Zrzuty przed i po stuknięciu rozstrzygną to w 12; wiersz
# wyszukiwany przewinięciem w górę (jak „Restore” w 31, run 38363820424).
- scrollUntilVisible: { element: "Skip today.*", direction: DOWN, timeout: 30000, centerElement: true }
- takeScreenshot: 46a-przed-pominieciem
- tapOn: "Skip today.*"
- takeScreenshot: 46b-po-stukniecie-pomin
- scrollUntilVisible: { element: "skipped today", direction: UP, timeout: 30000, centerElement: true }
- assertNotVisible: "Set 1 done.*"
- takeScreenshot: 46-pominiete-dzis
- scrollUntilVisible: { element: "Restore exercise.*", direction: UP, timeout: 30000, centerElement: true }
- tapOn: "Restore exercise.*"
- extendedWaitUntil: { visible: "Set 1 done.*", timeout: 15000 }
