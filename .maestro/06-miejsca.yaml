# Miejsca treningu (P-003): dodanie miejsca z presetu, włączenie drążka, filtr wyboru ćwiczeń w pustym treningu.
#
# Literały (EN z lib/i18n.en.ts / lib/equipment.ts, chyba że zaznaczono inaczej):
#   "Other workout"                  ← 'Inny trening' (znacznik gotowości ekranu głównego od 11.10.2026)
#   "More, tab.*" / "Workout, tab.*" ← 'Więcej' / 'Trening' + etykieta zakładki „{label}, tab, {i} of {n}” (React Navigation; od SDK 56 jej kopia w expo-router — ten sam format)
#   "Settings"                       ← 'Ustawienia'                         (Item w app/(tabs)/more.tsx)
#   "Places and equipment,.*"             ← 'Miejsca i sprzęt' (audyt 0.10 H2, dawniej 'Miejsca treningu') + sub 'sprzęt w domu, na siłowni, w hotelu…'
#                                      (Item w app/more/settings.tsx; accessibilityLabel „{title}, {sub}”)
#   "Add place"                      ← 'Dodaj miejsce' (etykieta VoiceOver przycisku „+” w nagłówku, app/more/locations.tsx)
#   "Bodyweight only,.*"             ← LOCATION_PRESET_LABEL.bodyweight.en + LOCATION_PRESET_HINT.bodyweight.en 'mat only' (lib/equipment.ts)
#   "Available exercises: .*"        ← 'Dostępne ćwiczenia: {n} z {m}' → 'Available exercises: {n} of {m}' (app/more/location/[id].tsx)
#   "Pull-up bar.*"                  ← EQUIPMENT pullup_bar.en 'Pull-up bar (doorway, wall-mounted)' (lib/equipment.ts; SwitchRow)
#   "Back"                           ← 'Wróć' (headerBackTitle w app/_layout.tsx)
#   ".*Bodyweight only, main.*"      ← Item listy miejsc: '★ ' + nazwa, sub 'główne' → 'main' · '{n} equipment items'
#                                      ('pozycja sprzętu|…' → 'equipment item|equipment items') (app/more/locations.tsx)
#   "Places and equipment,.*Bodyweight only" ← Item w Ustawieniach, sub '{n}, główne: {m}' → '{n}, main: {m}'
#   "Empty workout"                  ← 'Pusty trening'                      (Btn w app/(tabs)/index.tsx)
#   "+ Add exercise"                 ← '+ Dodaj ćwiczenie'                  (jak flow 04)
#   "only available at Bodyweight only.*"     ← 'tylko dostępne w: {l}' → 'only available at {l}' (+ ' · hidden: {n}') (app/picker.tsx)
#   "unavailable at Bodyweight only are greyed out" ← 'niedostępne w: {l} są wyszarzone' → 'unavailable at {l} are greyed out'
#   "Place filter: X.*"             ← 'Filtr miejsca: {l}' (instrukcja w podpowiedzi — A11-18) (chip-etykieta „📍 X ✕” w app/picker.tsx; od 04.10.2026 zamiast przełącznika „Pokaż wszystkie”)
#   "Search exercises…"              ← 'Szukaj ćwiczenia…'                  (jak flow 04)
#   "Pull Up,.*"                     ← nazwa ćwiczenia z lib/seed.ts (EN bez zmian, exName) — wymaga pullup.bar|rings (catalog.generated.ts)
#   "Lat Pulldown,.*"                ← nazwa z lib/seed.ts — wymaga lat_pulldown|cable.high → niedostępne w „Bodyweight only”
#   "missing:"                       ← 'brak: {m}' → 'missing: {m}'
#   "Cancel"                         ← 'Anuluj' (headerLeft pickera, components/CloseButton.tsx — zasada 13.10.2026)
appId: pl.lukasz.trening
name: Miejsca treningu i filtr ćwiczeń
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }

# --- Więcej → Ustawienia → Miejsca treningu ---
- tapOn: "More, tab.*"
# 11.10.2026: „Places and equipment” to pozycja ekranu Więcej (z Ustawień zniknęła)
- extendedWaitUntil: { visible: "Places and equipment", timeout: 30000 }
- tapOn: "Places and equipment"
- extendedWaitUntil: { visible: "Add place", timeout: 30000 }
- takeScreenshot: 20-miejsca-pusto
- tapOn: "Add place"
- extendedWaitUntil: { visible: "Bodyweight only,.*", timeout: 30000 }
- takeScreenshot: 21-presety-miejsc
- tapOn: "Bodyweight only,.*"

# --- Ekran miejsca: włączenie drążka do podciągania ---
- extendedWaitUntil: { visible: "Available exercises: .*", timeout: 30000 }
- copyTextFrom: "Available exercises: .*"
- evalScript: ${output.dostepnePrzed = maestro.copiedText}
# 05.10.2026: grupy sprzętu zwinięte — najpierw rozwinięcie grupy „Drążki i poręcze” (EQUIP_GROUP_LABEL.bars)
- scrollUntilVisible: { element: "Bars and dip stations.*", direction: DOWN, timeout: 90000 }
- tapOn: "Bars and dip stations.*"
- scrollUntilVisible: { element: "Pull-up bar.*", direction: DOWN, timeout: 90000 }
# Wiersz SwitchRow: Text z nazwą (index 0) i systemowy przełącznik z tą samą etykietą (index 1)
# Maestro traktuje id jako wyrażenie regularne — nawiasy w nazwie sprzętu trzeba poprzedzić \\ (przebieg 03.10.2026: „Element not found”).
- tapOn: { id: "sw-Pull-up bar \\(doorway, wall-mounted\\)" }  # testID przełącznika (SwitchRow)
- takeScreenshot: 22-drazek-wlaczony
- scrollUntilVisible: { element: "Available exercises: .*", direction: UP, timeout: 90000 }
- copyTextFrom: "Available exercises: .*"
# Drążek odblokowuje m.in. Pull Up / Chin Up — licznik dostępnych ćwiczeń musi się zmienić
- assertTrue: ${maestro.copiedText != output.dostepnePrzed}

# --- Przycisk „Remove place” na dole ekranu miejsca (M3 p5, ZM-04, W2 a): to samo okno co gest; „Cancel” zostawia miejsce (to jedyne i główne — dalsze kroki go potrzebują) ---
- scrollUntilVisible: { element: "Remove place", direction: DOWN, timeout: 90000 }
- tapOn: "Remove place"
- extendedWaitUntil: { visible: "Delete place?", timeout: 15000 }
- tapOn: "Cancel"
- scrollUntilVisible: { element: "Available exercises: .*", direction: UP, timeout: 90000 }

# --- Powrót do zakładki Trening (miejsce → lista miejsc → ustawienia → zakładki) ---
- tapOn: "Back"
- extendedWaitUntil: { visible: "Add place", timeout: 30000 }
- assertVisible: ".*Bodyweight only, main.*"
- tapOn: "Back"
- extendedWaitUntil: { visible: "Places and equipment", timeout: 30000 }  # lista miejsc → ekran Więcej (od 11.10.2026 wiersz bez podsumowania miejsc)
- extendedWaitUntil: { visible: "Workout, tab.*", timeout: 30000 }
- tapOn: "Workout, tab.*"
- extendedWaitUntil: { visible: "Other workout", timeout: 30000 }
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
- extendedWaitUntil: { visible: "+ Add exercise", timeout: 30000 }
- tapOn: "+ Add exercise"

# --- Wybór ćwiczenia z filtrem miejsca ---
- extendedWaitUntil: { visible: "only available at Bodyweight only.*", timeout: 30000 }
- takeScreenshot: 23-picker-filtr-miejsca
- tapOn: "Search exercises…"
- inputText: "Pull"
- pressKey: Enter
- tapOn: { text: "Continue", optional: true }
- extendedWaitUntil: { visible: "Pull Up,.*", timeout: 30000 }
- assertNotVisible: "Lat Pulldown,.*"
- takeScreenshot: 24-picker-tylko-dostepne
# filtr miejsca jako etykieta: „📍 Bodyweight only ✕” zdejmuje filtr
- tapOn: "Place filter: Bodyweight only.*"
- extendedWaitUntil: { visible: "unavailable at Bodyweight only are greyed out", timeout: 30000 }
# pełna baza (854 ćwiczenia, 04.10.2026): „Pull” daje ~38 wyników — Pull Up i Lat Pulldown bywają poza ekranem (Pull Up sprawdzony wyżej,
# z filtrem); zawężenie wyszukiwania do Lat Pulldown
- tapOn: "Pull"
- eraseText: 10
- inputText: "Lat Pull"
- pressKey: Enter
- tapOn: { text: "Continue", optional: true }
- extendedWaitUntil: { visible: "Lat Pulldown,.*missing:.*", timeout: 30000 }
- takeScreenshot: 25-picker-pokaz-wszystkie
- tapOn: "Cancel"
- assertNotVisible: "Place filter.*"
