# Miejsca treningu (P-003): dodanie miejsca z presetu, włączenie drążka, filtr wyboru ćwiczeń w pustym treningu.
#
# Literały (EN z lib/i18n.en.ts / lib/equipment.ts, chyba że zaznaczono inaczej):
#   "Start from a template"          ← 'Zacznij z szablonu'                 (app/(tabs)/index.tsx)
#   "More, tab.*" / "Workout, tab.*" ← 'Więcej' / 'Trening' + etykieta zakładki „{label}, tab, {i} of {n}” (React Navigation; od SDK 56 jej kopia w expo-router — ten sam format)
#   "Settings"                       ← 'Ustawienia'                         (Item w app/(tabs)/more.tsx)
#   "Training places,.*"             ← 'Miejsca treningu' + sub 'sprzęt w domu, na siłowni, w hotelu…'
#                                      (Item w app/more/settings.tsx; accessibilityLabel „{title}, {sub}”)
#   "\+ Add place"                   ← '+ Dodaj miejsce'                    (app/more/locations.tsx)
#   "Bodyweight only,.*"             ← LOCATION_PRESET_LABEL.bodyweight.en + LOCATION_PRESET_HINT.bodyweight.en 'mat only' (lib/equipment.ts)
#   "Available exercises: .*"        ← 'Dostępne ćwiczenia: {n} z {m}' → 'Available exercises: {n} of {m}' (app/more/location/[id].tsx)
#   "Pull-up bar.*"                  ← EQUIPMENT pullup_bar.en 'Pull-up bar (doorway, wall-mounted)' (lib/equipment.ts; SwitchRow)
#   "Back"                           ← 'Wróć' (headerBackTitle w app/_layout.tsx)
#   ".*Bodyweight only, main.*"      ← Item listy miejsc: '★ ' + nazwa, sub 'główne' → 'main' · '{n} equipment items'
#                                      ('pozycja sprzętu|…' → 'equipment item|equipment items') (app/more/locations.tsx)
#   "Training places,.*Bodyweight only" ← Item w Ustawieniach, sub '{n}, główne: {m}' → '{n}, main: {m}'
#   "Empty workout"                  ← 'Pusty trening'                      (Btn w app/(tabs)/index.tsx)
#   "+ Add exercise"                 ← '+ Dodaj ćwiczenie'                  (jak flow 04)
#   "only available at Bodyweight only.*"     ← 'tylko dostępne w: {l}' → 'only available at {l}' (+ ' · hidden: {n}') (app/picker.tsx)
#   "unavailable at Bodyweight only are greyed out" ← 'niedostępne w: {l} są wyszarzone' → 'unavailable at {l} are greyed out'
#   "Show all"                       ← 'Pokaż wszystkie'                    (SwitchRow w app/picker.tsx)
#   "Search exercises…"              ← 'Szukaj ćwiczenia…'                  (jak flow 04)
#   "Pull Up,.*"                     ← nazwa ćwiczenia z lib/seed.ts (EN bez zmian, exName) — wymaga pullup.bar|rings (catalog.generated.ts)
#   "Lat Pulldown,.*"                ← nazwa z lib/seed.ts — wymaga lat_pulldown|cable.high → niedostępne w „Bodyweight only”
#   "missing:"                       ← 'brak: {m}' → 'missing: {m}'
#   "Cancel"                         ← 'Anuluj' (headerRight pickera)
appId: pl.lukasz.trening
name: Miejsca treningu i filtr ćwiczeń
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Start from a template", timeout: 20000 }

# --- Więcej → Ustawienia → Miejsca treningu ---
- tapOn: "More, tab.*"
- extendedWaitUntil: { visible: "Settings", timeout: 10000 }
- tapOn: "Settings"
- scrollUntilVisible: { element: "Training places,.*", direction: DOWN, timeout: 20000 }
- tapOn: "Training places,.*"
- extendedWaitUntil: { visible: "\\+ Add place", timeout: 10000 }
- takeScreenshot: 20-miejsca-pusto
- tapOn: "\\+ Add place"
- extendedWaitUntil: { visible: "Bodyweight only,.*", timeout: 10000 }
- takeScreenshot: 21-presety-miejsc
- tapOn: "Bodyweight only,.*"

# --- Ekran miejsca: włączenie drążka do podciągania ---
- extendedWaitUntil: { visible: "Available exercises: .*", timeout: 10000 }
- copyTextFrom: "Available exercises: .*"
- evalScript: ${output.dostepnePrzed = maestro.copiedText}
- scrollUntilVisible: { element: "Pull-up bar.*", direction: DOWN, timeout: 30000 }
# Wiersz SwitchRow: Text z nazwą (index 0) i systemowy przełącznik z tą samą etykietą (index 1)
# Maestro traktuje id jako wyrażenie regularne — nawiasy w nazwie sprzętu trzeba poprzedzić \\ (przebieg 03.10.2026: „Element not found”).
- tapOn: { id: "sw-Pull-up bar \\(doorway, wall-mounted\\)" }  # testID przełącznika (SwitchRow)
- takeScreenshot: 22-drazek-wlaczony
- scrollUntilVisible: { element: "Available exercises: .*", direction: UP, timeout: 30000 }
- copyTextFrom: "Available exercises: .*"
# Drążek odblokowuje m.in. Pull Up / Chin Up — licznik dostępnych ćwiczeń musi się zmienić
- assertTrue: ${maestro.copiedText != output.dostepnePrzed}

# --- Powrót do zakładki Trening (miejsce → lista miejsc → ustawienia → zakładki) ---
- tapOn: "Back"
- extendedWaitUntil: { visible: "\\+ Add place", timeout: 10000 }
- assertVisible: ".*Bodyweight only, main.*"
- tapOn: "Back"
- extendedWaitUntil: { visible: "Training places,.*Bodyweight only", timeout: 10000 }
- tapOn: "Back"
- extendedWaitUntil: { visible: "Workout, tab.*", timeout: 10000 }
- tapOn: "Workout, tab.*"
- extendedWaitUntil: { visible: "Start from a template", timeout: 10000 }
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 20000 }
- tapOn: "Empty workout"
- extendedWaitUntil: { visible: "+ Add exercise", timeout: 10000 }
- tapOn: "+ Add exercise"

# --- Wybór ćwiczenia z filtrem miejsca ---
- extendedWaitUntil: { visible: "only available at Bodyweight only.*", timeout: 10000 }
- takeScreenshot: 23-picker-filtr-miejsca
- tapOn: "Search exercises…"
- inputText: "Pull"
- tapOn: { text: "Continue", optional: true }
- extendedWaitUntil: { visible: "Pull Up,.*", timeout: 10000 }
- assertNotVisible: "Lat Pulldown,.*"
- takeScreenshot: 24-picker-tylko-dostepne
# „Show all”: jak wyżej — Text (index 0) i przełącznik (index 1)
- tapOn: { id: "sw-Show all" }
- extendedWaitUntil: { visible: "unavailable at Bodyweight only are greyed out", timeout: 10000 }
- assertVisible: "Lat Pulldown,.*missing:.*"
- assertVisible: "Pull Up,.*"
- takeScreenshot: 25-picker-pokaz-wszystkie
- tapOn: "Cancel"
- assertNotVisible: "Show all"
