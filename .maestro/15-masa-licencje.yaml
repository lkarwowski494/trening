# Audyt 0.10, fala 2 (08.10.2026): masa ciała z datą (Ustawienia → Masa ciała → pomiar) oraz Więcej → O aplikacji → Licencje open source (SEC-08).
#
# Literały (EN z lib/i18n.en.ts):
#   "More, tab.*"                     ← zakładka Więcej
#   "Body weight, not entered.*"      ← Item 'Masa ciała' z opisem 'nie podano — e1RM podciągania i pompek' (app/more/settings.tsx)
#   "Weight unit" / "kg"              ← 'Jednostka ciężaru' / segment kg (app/more/settings.tsx) — symulator en-US startuje w lb (H4, audyt 0.10), E2E 89
#   "Body weight \(kg\)"              ← pole 'Masa ciała ({u})' (app/more/bodymass.tsx)
#   "Save measurement" / "Measurements" ← 'Zapisz pomiar' / 'Pomiary'
#   "80 kg, .*"                       ← wiersz pomiaru (Item: tytuł „80 kg”, opis = data)
#   "About" / "Open-source licences"  ← 'O aplikacji' / 'Licencje open source' (app/more/about.tsx)
#   "Packages \(\d+\)"                ← 'Pakiety ({n})' (app/more/licenses.tsx)
#   "MIT, .*" / "Permission is hereby granted.*" ← pozycja licencji i jej treść (lib/licenses.generated.ts, scripts/licenses.mjs)
appId: pl.lukasz.trening
name: Masa ciała z datą i licencje open source
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Start from a template", timeout: 60000 }

- tapOn: "More, tab.*"
- extendedWaitUntil: { visible: "Settings", timeout: 30000 }
- tapOn: "Settings"
# E2E 89: jednostka z regionu (H4) — symulator en-US startuje w lb („Body weight (lb)”); scenariusz sprawdza kg
- extendedWaitUntil: { visible: "Weight unit", timeout: 30000 }
- tapOn: "kg"
- scrollUntilVisible: { element: "Body weight, not entered.*", direction: DOWN, timeout: 60000 }
- tapOn: "Body weight, not entered.*"
- extendedWaitUntil: { visible: "Save measurement", timeout: 30000 }
- tapOn: { text: "Body weight \\(kg\\)", below: "Body weight \\(kg\\)" }   # E2E 89: tekst etykiety (Field) i pole (accessibilityLabel) — pole jest niżej
- inputText: "80"
- tapOn: "Save measurement"
- extendedWaitUntil: { visible: "80 kg, .*", timeout: 30000 }
- assertVisible: "Measurements"
- takeScreenshot: 70-masa-ciala-pomiary
- tapOn: "Back"
- extendedWaitUntil: { visible: "Body weight, 80 kg · measured .*", timeout: 30000 }
- tapOn: "Back"

- extendedWaitUntil: { visible: "About", timeout: 30000 }
- tapOn: "About"
- extendedWaitUntil: { visible: "Open-source licences.*", timeout: 30000 }
- tapOn: "Open-source licences.*"
# E2E 91: nagłówek „Packages (n)” jest pod 13 licencjami — poza ekranem; najpierw licencja MIT (widoczna bez przewijania) i jej treść, potem przewinięcie do nagłówka
- extendedWaitUntil: { visible: "MIT, .*", timeout: 30000 }
- tapOn: "MIT, .*"
- extendedWaitUntil: { visible: "Permission is hereby granted.*", timeout: 30000 }
- takeScreenshot: 71-licencje
- scrollUntilVisible: { element: "Packages \\(\\d+\\)", direction: DOWN, timeout: 60000 }
