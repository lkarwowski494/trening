# Audyt 0.10, fala 2 (08.10.2026): masa ciała z datą (od 11.10.2026, docs/22 P5 A: zakładka Postępy → sekcja Masa ciała → pomiar; dawniej Ustawienia) oraz Więcej → O aplikacji → Licencje open source (SEC-08).
#
# Literały (EN z lib/i18n.en.ts):
#   "More, tab.*" / "Progress, tab.*" ← zakładki Więcej / Postępy (etykieta „{label}, tab, {i} of 4”)
#   "Body weight — measurements"      ← przycisk 'Masa ciała — pomiary' w sekcji 'Masa ciała' zakładki Postępy (app/(tabs)/progress.tsx)
#   "80 kg · measured .*"             ← '{v} · pomiar z {d}' — ostatni pomiar w tej sekcji
#   "Weight unit" / "kg"              ← 'Jednostka ciężaru' / segment kg (app/more/settings.tsx) — symulator en-US startuje w lb (H4, audyt 0.10), E2E 89
#   "Body weight \(kg\)"              ← pole 'Masa ciała ({u})' (app/more/bodymass.tsx)
#   "Save measurement" / "Measurements" ← 'Zapisz pomiar' / 'Pomiary'
#   "80 kg, .*"                       ← wiersz pomiaru (Item: tytuł „80 kg”, opis = data)
#   "About" / "Open-source licences"  ← 'O aplikacji' / 'Licencje open source' (app/more/about.tsx)
#   "Request a new feature"           ← 'Poproś o nową funkcję' (etykieta VoiceOver wiersza; tylko asercja widoczności)
#   "Write to us"                     ← 'Napisz do nas' (etykieta VoiceOver wiersza; podpis z adresem jest częścią wiersza, nie osobnym elementem) — tylko asercja widoczności
#   "Packages \(\d+\)"                ← 'Pakiety ({n})' (app/more/licenses.tsx)
#   "Native iOS libraries outside npm \(\d+\)" / "folly .*" ← 'Biblioteki natywne iOS spoza npm ({n})' i wiersz biblioteki (SEC2-06, scripts/licenses-native.json)
#   "MIT, .*" / "MIT License.*Permission is hereby granted.*" ← pozycja licencji i jej treść (lib/licenses.generated.ts, scripts/licenses.mjs;
#                                     treść to jeden Text od „MIT License” — Maestro dopasowuje wyrażenie do CAŁEGO tekstu)
appId: pl.lukasz.trening
name: Masa ciała z datą i licencje open source
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }

- tapOn: "More, tab.*"
- extendedWaitUntil: { visible: "Settings", timeout: 30000 }
- tapOn: "Settings"
# E2E 89: jednostka z regionu (H4) — symulator en-US startuje w lb („Body weight (lb)”); scenariusz sprawdza kg
- extendedWaitUntil: { visible: "Weight unit", timeout: 30000 }
- tapOn: "kg"
- tapOn: "Back"  # jednostka ustawiona; pomiary wpisuje się teraz w Postępach (P5 A)
- tapOn: "Progress, tab.*"
- scrollUntilVisible: { element: "Body weight — measurements", direction: DOWN, timeout: 60000 }
- tapOn: "Body weight — measurements"
- extendedWaitUntil: { visible: "Save measurement", timeout: 30000 }
# E2E 105: na wolnym symulatorze ginął znak „80” (38002403800, 38009269888 — zapisane 0, okno „must be greater than zero”; 38014484054 — 8 kg;
# device-simulator.log: drugi klawisz 0,1 s po pierwszym, po zawieszeniu wątku głównego). Znaki osobno (odstęp ok. 1 s jak przy ręcznym wpisie)
# i jedna powtórka całego wpisu — pomiar z tym samym dniem zastępuje poprzedni. Pole po testID (run 37938579595, UX2-11). Test: tests/maestro-e2e105.test.tsx
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          when: { visible: "Body weight must be .*" }
          commands:
            - tapOn: "OK"
      - tapOn: { id: "bodymass-kg" }
      - waitForAnimationToEnd
      - eraseText: 6
      - inputText: "8"
      - inputText: "0"
      - tapOn: "Save measurement"
      - extendedWaitUntil: { visible: "80 kg, .*", timeout: 15000 }
- assertVisible: "Measurements"
- takeScreenshot: 70-masa-ciala-pomiary
- tapOn: "Back"
- scrollUntilVisible: { element: "80 kg · measured .*", direction: DOWN, timeout: 30000 }  # sekcja 'Masa ciała' w Postępach pokazuje ostatni pomiar
- tapOn: "More, tab.*"

- extendedWaitUntil: { visible: "About", timeout: 30000 }
- tapOn: "About"
# 13.10.2026: „Write to us” (mailto:) — wiersz jest widoczny pod wersją; NIE stukamy: otwarcie Mail poza kontrolą Maestro (symulator bez skonfigurowanej poczty, docs/09)
- extendedWaitUntil: { visible: "Write to us", timeout: 30000 }
# 14.10.2026: „Request a new feature” — drugi wiersz pod „Write to us”; też tylko asercja widoczności (poczta poza kontrolą Maestro)
- extendedWaitUntil: { visible: "Request a new feature", timeout: 30000 }
- extendedWaitUntil: { visible: "Open-source licences.*", timeout: 30000 }
- tapOn: "Open-source licences.*"
# E2E 91: nagłówek „Packages (n)” jest pod 13 licencjami — poza ekranem; najpierw licencja MIT (widoczna bez przewijania) i jej treść, potem przewinięcie do nagłówka
- extendedWaitUntil: { visible: "MIT, .*", timeout: 30000 }
# SEC2-06 (09.10.2026): licencja BSL-1.0 bibliotek natywnych — lista licencji dłuższa o wiersz, „MIT” przy dolnej krawędzi; przewinięcie na środek
- scrollUntilVisible: { element: "MIT, .*", direction: DOWN, centerElement: true, timeout: 30000 }
- tapOn: "MIT, .*"
# run 37900617167 (f2bdca8): „Permission is hereby granted.*” nie pasował — treść licencji zaczyna się od „MIT License\n\n” (zrzut kroku 28: tekst na ekranie)
# run 37909583790 (5c24b0c): sam wzorzec pasuje (Maestro dopasowuje też tekst z \n zamienionymi na spacje — Filters.textMatches),
# ale na zrzucie treść licencji zaczyna się przy dolnej krawędzi i wychodzi poza ekran — najpierw przewinięcie do środka ekranu
- scrollUntilVisible: { element: "MIT License.*Permission is hereby granted.*", direction: DOWN, centerElement: true, timeout: 30000 }
- extendedWaitUntil: { visible: "MIT License.*Permission is hereby granted.*", timeout: 30000 }
- takeScreenshot: 71-licencje
# SEC2-06: sekcja bibliotek natywnych spoza npm (folly, glog, …) między licencjami a pakietami npm
- scrollUntilVisible: { element: "Native iOS libraries outside npm \\(\\d+\\)", direction: DOWN, timeout: 60000 }
- scrollUntilVisible: { element: "folly .*", direction: DOWN, timeout: 30000 }
- scrollUntilVisible: { element: "Packages \\(\\d+\\)", direction: DOWN, timeout: 60000 }
