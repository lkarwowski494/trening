# --- Postępy: podsumowanie i rekordy ćwiczenia ---
- tapOn: "Progress, tab.*"
- scrollUntilVisible: { element: "Workouts: [0-9]+, previously .*", direction: DOWN, timeout: 30000 }  # M3 p3 (ZM-06): na górze Postępów jest wykres i rekordy ćwiczenia, „Summary” (ogólny przegląd) jest niżej
- assertVisible: "Workouts: [1-9].*, previously .*"
- takeScreenshot: 90-postepy
- scrollUntilVisible: { element: "Muscle map: .*", direction: DOWN, timeout: 30000 }  # M3 p3: mapa mięśni jest w przeglądzie pod wyborem ćwiczenia
# kafelki „Progression” (te same trzy porównania co dawniej na ekranie Trening) → szczegóły z dwoma słupkami na partię
- scrollUntilVisible: { element: { id: "progress-tile-week" }, direction: DOWN, timeout: 60000, centerElement: true }
- tapOn: { id: "progress-tile-week" }
- extendedWaitUntil: { visible: "Progression", timeout: 30000 }
- takeScreenshot: 89-progresja
- tapOn: "Back"
# run 39855279042 (ponowienie, krok 175): po stuknięciu „Back Squat” (już wybrane) karta rekordów leży nad chipami, a nagłówek „RECORDS” — pod nagłówkiem ekranu, poza
# hierarchią (zrzut: wiersze „Max weight”…, bez nagłówka). Jak w 32: stuknięcie i przewinięcie do nagłówka w jednym retry.
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible: { element: "Back Squat", direction: UP, timeout: 60000, centerElement: true }  # M3 p3: wybór ćwiczenia jest nad przeglądem (ZM-06)
      - waitForAnimationToEnd
      - tapOn: "Back Squat"
      - scrollUntilVisible: { element: "RECORDS", direction: UP, timeout: 30000, centerElement: true }
      - extendedWaitUntil: { visible: "RECORDS", timeout: 15000 }
- takeScreenshot: 91-rekordy-cwiczenia
- assertVisible: "Max weight"
- assertVisible: "Best session \\(volume\\)"
- assertVisible: "e1RM"
# --- Plan po pierwszym tygodniu: plan z generatora wciąż obowiązuje (Plan → Planowanie) ---
- tapOn: "Plan, tab.*"
- extendedWaitUntil: { visible: "Planning", timeout: 30000 }
- tapOn: "Planning"
- extendedWaitUntil: { visible: "Monday, Full Body A", timeout: 30000 }
- takeScreenshot: 92-plan-po-tygodniu
