# Subskrypcja (0.17.0, docs/27; M5 S1 22.10.2026): build E2E ze sztucznym sklepem (EXPO_PUBLIC_STORE_FAKE=1, e2e-ios.yml): przełącznik subskrypcji włączony, limit darmowych dni treningowych = 0
# (E2E_FREE_TRAINING_DAYS; scenariusz nie wytrzyma 20 minut treningu, więc krótki trening nie zużywa dnia i limit 0 blokuje pierwszy start), start z dostępem „na zawsze”. Przepływ: karta „Subscription” w Ustawieniach → ekran zakupu (stan „zakupione”) →
# wygaszenie dostępu panelem „Test store” (wygasa „teraz”) → nagłówek „Train 5 days a month for free…”, nazwy planów i ceny z (sztucznego)
# sklepu, bez „days free” → „Restore purchases” bez zakupów → licznik dni na ekranie startu → start ponad limit otwiera ekran zakupu z tekstem „We're proud of you!” → zakup → trening startuje.
# Prawdziwy StoreKit i okna Apple: lista ręczna w piaskownicy (docs/27 7.2).
#
# Literały (EN z lib/i18n.en.ts):
#   "Subscription", ".*You have access forever.*"                           ← components/SubscriptionCard.tsx, app/paywall.tsx
#   "Your plan: lifetime.*", "See Pro plans.*"                  ← tytuł wiersza w Ustawieniach zależny od stanu: z dostępem 'Masz plan: miesięczny|roczny|dożywotni', darmowy 'Zobacz plany Pro'
#       (components/SubscriptionCard.tsx; M1-037 A, DEC-07 b 27.10.2026)
#   ".*Your plan: .*"                                                       ← nagłówek karty stanu po zakupie: 'Masz plan: miesięczny|roczny|dożywotni' (app/paywall.tsx, DEC-09 a 27.10.2026)
#   "Test store: expire access"                                             ← panel tylko w buildzie E2E (app/paywall.tsx, bez t())
#   "Train 5 days a month for free.*", "Training is part of my week", "Restore purchases", "No purchases found for this Apple account."
#   ".*free training days left this month.*"                                ← 'Pozostało {n} z {limit} darmowych dni treningowych w tym miesiącu' (components/StartPanel.tsx)
#   "We're proud of you!", ".*no ads, no data collection.*"                 ← tekst przy starcie ponad limit (app/paywall.tsx, reason=limit)
#   ".*Your plan: yearly.*", "Change plan", ".*Current plan.*", "Switch to this plan"  ← po zakupie planu: karta stanu, przełącznik zwiniętej listy,
#       oznaczenie posiadanego planu, przycisk zmiany planu (app/paywall.tsx; DEC-09 a 27.10.2026: lista planów zwinięta pod „Change plan”)
#   "Subscribe", "Log a past workout", "Not now", "Close" (id close-modal)
#   "Empty workout", "Other workout", "Finish", "Set 1 done.*", "Skip", "Finish workout\?", "Session", "Upper A" ← jak flow 05
appId: pl.lukasz.trening
name: Subskrypcja — ekran zakupu i limit
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
- runFlow: subflows/szablon-testowy.yaml
- runFlow: subflows/start-szablonu.yaml
- extendedWaitUntil: { visible: "Set 1 done.*", timeout: 30000 }
- tapOn: { text: "Set 1 done.*", index: 0 }
- extendedWaitUntil: { visible: "Skip", timeout: 30000 }
- tapOn: "Skip"
- assertNotVisible: "Skip"
- tapOn: "Finish"
- extendedWaitUntil: { visible: "Finish workout\\?", timeout: 30000 }
- tapOn: { text: "Finish", below: "Finish workout\\?" }
- extendedWaitUntil: { visible: "Session", timeout: 30000 }
- tapOn: "Back"
# --- Ustawienia → karta „Subscription” → ekran zakupu (dostęp aktywny) ---
- tapOn: "More, tab.*"
- extendedWaitUntil: { visible: "Settings", timeout: 30000 }
- tapOn: "Settings"
- extendedWaitUntil: { visible: "Subscription", timeout: 30000 }
- assertVisible: ".*You have access forever.*"
- tapOn: "Your plan: lifetime.*"
- extendedWaitUntil: { visible: ".*You have access forever.*", timeout: 30000 }
- takeScreenshot: 99-zakup-aktywny
- scrollUntilVisible: { element: "Test store: expire access", direction: DOWN, timeout: 60000 }
- tapOn: "Test store: expire access"
# --- po wygaszeniu: ceny ze sklepu, nazwy planów, nagłówek z limitem 5 dni (M5 S1), przywracanie bez zakupów ---
- scrollUntilVisible: { element: "Train 5 days a month for free.*", direction: UP, timeout: 60000 }
- assertVisible: "Train 5 days a month for free.*"
- assertVisible: ".*Training is part of my week.*"
- assertNotVisible: ".*days free.*"
- assertNotVisible: ".*You have access forever.*"
- takeScreenshot: 99-zakup-ceny
- scrollUntilVisible: { element: "Restore purchases", direction: DOWN, timeout: 60000 }
- tapOn: "Restore purchases"
- extendedWaitUntil: { visible: "No purchases found for this Apple account.", timeout: 20000 }
# Ekran zakupu z Ustawień to okno modalne (presentation 'modal', bez „Back” — E2E 38324474808, krok 74): zasada 13.10.2026 — przycisk „Close” w nagłówku
# (components/CloseButton.tsx, testID close-modal), gest w dół tylko dodatkowo.
- assertVisible: { id: "close-modal" }
- tapOn: { id: "close-modal" }
- extendedWaitUntil: { visible: "Subscription", timeout: 30000 }
# M1-037 A: po wygaśnięciu wiersz w Ustawieniach jest wezwaniem do działania, nie nazwą produktu
- assertVisible: "See Pro plans.*"
- assertNotVisible: "Your plan: .*"
- tapOn: "Back"
# --- start po wygaśnięciu dostępu ponad limit dni (build E2E: limit 0 dni; krótki trening < 20 min nie zużywa dnia): licznik na ekranie startu, potem ekran zakupu zamiast startu ---
- tapOn: "Workout, tab.*"
- extendedWaitUntil: { visible: "Other workout", timeout: 30000 }
- assertVisible: ".*free training days left this month.*"
- takeScreenshot: 99-licznik-dni
- tapOn: "Other workout"
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
- extendedWaitUntil: { visible: "We're proud of you!", timeout: 30000 }
- assertVisible: ".*no ads, no data collection.*"
- scrollUntilVisible: { element: "Log a past workout", direction: DOWN, timeout: 60000 }
- takeScreenshot: 99-limit
- scrollUntilVisible: { element: "Subscribe", direction: DOWN, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: "Subscribe"
- extendedWaitUntil: { visible: ".*Your plan: .*", timeout: 30000 }
# --- po zakupie subskrypcji (27.10.2026, uwaga z telefonu; DEC-09 a): nagłówek karty nazywa plan, bez wstępu o darmowych dniach i bez oferty;
#     lista planów zwinięta pod „Change plan”, po rozwinięciu plan posiadany oznaczony, zakup innego planu to „Switch to this plan” ---
- assertVisible: ".*Your plan: yearly.*"
- assertNotVisible: "Train 5 days a month for free.*"
- assertNotVisible: "Subscribe"
- assertNotVisible: ".*Current plan.*"
- takeScreenshot: 99-zakup-plan-aktywny
- scrollUntilVisible: { element: "Change plan", direction: DOWN, timeout: 60000, centerElement: true }
- tapOn: "Change plan"
- scrollUntilVisible: { element: "Switch to this plan", direction: DOWN, timeout: 60000 }
- assertVisible: ".*Current plan.*"
- assertNotVisible: "Subscribe"
- takeScreenshot: 99-zakup-zmiana-planu
- scrollUntilVisible: { element: "Not now", direction: DOWN, timeout: 60000 }
- tapOn: "Not now"
# --- po zakupie start działa ---
- extendedWaitUntil: { visible: "Other workout", timeout: 30000 }
- tapOn: "Other workout"
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
- extendedWaitUntil: { visible: "Finish", timeout: 30000 }
- assertNotVisible: "We're proud of you!"
- takeScreenshot: 99-start-po-zakupie
