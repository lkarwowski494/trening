# Subskrypcja (0.17.0, docs/27): build E2E ze sztucznym sklepem (EXPO_PUBLIC_STORE_FAKE=1, e2e-ios.yml): przełącznik subskrypcji włączony, limit darmowych treningów = 1,
# start z dostępem „na zawsze”. Przepływ: karta „Subscription” w Ustawieniach → ekran zakupu (stan „zakupione”) → wygaszenie dostępu panelem „Test store” →
# ceny z (sztucznego) sklepu i „1 month free, then …” → „Restore purchases” bez zakupów → drugi trening na żywo zablokowany ekranem zakupu →
# zakup (miesiąc za darmo) → trening startuje. Prawdziwy StoreKit i okna Apple: lista ręczna w piaskownicy (docs/27 7.2).
#
# Literały (EN z lib/i18n.en.ts):
#   "Subscription", "Full version", ".*You have access forever.*", "You have the full version"  ← components/SubscriptionCard.tsx, app/paywall.tsx
#   "Test store: expire access"                                             ← panel tylko w buildzie E2E (app/paywall.tsx, bez t())
#   ".*1 month free, then .*", "Restore purchases", "No purchases found for this Apple account."
#   "You've used this month's free workouts .*"                             ← 'Wykorzystano limit darmowych treningów w tym miesiącu ({n}). Kolejne od {date}.'
#   "Start your free month", "Log a past workout", "Not now", "Close" (id close-modal)
#   "Empty workout", "Other workout", "Finish", "Set 1 done.*", "Skip", "Finish workout\?", "Session", "Upper A" ← jak flow 05
appId: pl.lukasz.trening
name: Subskrypcja — ekran zakupu i limit
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
- runFlow: subflows/szablon-testowy.yaml
- runFlow: subflows/start-szablonu.yaml
- extendedWaitUntil: { visible: "Set 1 done.*", timeout: 30000 }
- tapOn: { text: "Set 1 done.*", index: 0 }
- extendedWaitUntil: { visible: "Skip", timeout: 30000 }
- tapOn: "Skip"
- assertNotVisible: "Skip"
- tapOn: "Finish"
- extendedWaitUntil: { visible: "Finish workout\\?", timeout: 30000 }
- tapOn: { text: "Finish", below: "Finish workout\\?" }
- extendedWaitUntil: { visible: "Session", timeout: 30000 }
- tapOn: "Back"
# --- Ustawienia → karta „Subscription” → ekran zakupu (dostęp aktywny) ---
- tapOn: "More, tab.*"
- extendedWaitUntil: { visible: "Settings", timeout: 30000 }
- tapOn: "Settings"
- extendedWaitUntil: { visible: "Subscription", timeout: 30000 }
- assertVisible: ".*You have access forever.*"
- tapOn: "Full version.*"
- extendedWaitUntil: { visible: ".*You have access forever.*", timeout: 30000 }
- takeScreenshot: 99-zakup-aktywny
- scrollUntilVisible: { element: "Test store: expire access", direction: DOWN, timeout: 60000 }
- tapOn: "Test store: expire access"
# --- po wygaszeniu: ceny ze sklepu, miesiąc za darmo, przywracanie bez zakupów ---
- scrollUntilVisible: { element: ".*1 month free, then .*", direction: UP, timeout: 60000 }
- assertVisible: ".*1 month free, then .*"
- assertNotVisible: ".*You have access forever.*"
- takeScreenshot: 99-zakup-ceny
- scrollUntilVisible: { element: "Restore purchases", direction: DOWN, timeout: 60000 }
- tapOn: "Restore purchases"
- extendedWaitUntil: { visible: "No purchases found for this Apple account.", timeout: 20000 }
# Ekran zakupu z Ustawień to okno modalne (presentation 'modal', bez „Back” — E2E 38324474808, krok 74): zasada 13.10.2026 — przycisk „Close” w nagłówku
# (components/CloseButton.tsx, testID close-modal), gest w dół tylko dodatkowo.
- assertVisible: { id: "close-modal" }
- tapOn: { id: "close-modal" }
- extendedWaitUntil: { visible: "Subscription", timeout: 30000 }
- tapOn: "Back"
# --- drugi trening na żywo ponad limit 1: ekran zakupu zamiast startu ---
- tapOn: "Workout, tab.*"
- extendedWaitUntil: { visible: "Other workout", timeout: 30000 }
- tapOn: "Other workout"
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
- extendedWaitUntil: { visible: "You've used this month's free workouts .*", timeout: 30000 }
- assertVisible: "Log a past workout"
- takeScreenshot: 99-limit
- scrollUntilVisible: { element: "Start your free month", direction: DOWN, timeout: 60000 }
- tapOn: "Start your free month"
- extendedWaitUntil: { visible: ".*You have the full version.*", timeout: 30000 }
- scrollUntilVisible: { element: "Not now", direction: DOWN, timeout: 60000 }
- tapOn: "Not now"
# --- po zakupie start działa ---
- extendedWaitUntil: { visible: "Other workout", timeout: 30000 }
- tapOn: "Other workout"
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
- extendedWaitUntil: { visible: "Finish", timeout: 30000 }
- assertNotVisible: "You've used this month's free workouts .*"
- takeScreenshot: 99-start-po-zakupie
