# Edycja zapisanej sesji (zmiana nazwy w edytorze, „Save” w nagłówku) i trening wstecz z szablonu (docs/12).
#
# Literały (EN z lib/i18n.en.ts, chyba że zaznaczono inaczej):
#   "Start from a template"  ← 'Zacznij z szablonu'                         (app/(tabs)/index.tsx)
#   "Start: Upper A"         ← 'Start: {name}' + nazwa szablonu z podprzepływu subflows/szablon-testowy.yaml (accessibilityLabel przycisku Start)
#   "Set 1 done.*"           ← 'Seria {n} zrobiona — {ex}' → 'Set {n} done — {ex}' (jak flow 01)
#   "Skip"                   ← 'Pomiń'
#   "Finish"                 ← 'Zakończ'          (components/ActiveWorkout.tsx: przycisk i przycisk w Alercie)
#   "Finish workout\?"       ← 'Zakończyć trening?'
#   "Edit session"           ← 'Edytuj sesję'     (app/history/[id].tsx — przycisk u góry ekranu zapisanej sesji)
#   "Edit session"           ← 'Edytuj sesję'     (accessibilityLabel przycisku „Edit” w app/history/[id].tsx;
#                                                  uwaga: tytuł edytora 'Edycja sesji' to też „Edit session”)
#   "Cancel"                 ← 'Anuluj'           (headerLeft edytora app/history/edit/[id].tsx)
#   "Save"                   ← 'Zapisz'           (headerRight edytora i przycisk w Alercie „Save changes?”)
#   "Save changes"           ← 'Zapisz zmiany'    (przycisk na dole edytora)
#   "Save changes\?"         ← 'Zapisać zmiany?'  (Alert przy pominiętych seriach / nachodzeniu terminów)
#   "Upper A"                ← wartość pola Nazwa (Input w Field 'Nazwa' = „Name”) — nazwa szablonu z subflows/szablon-testowy.yaml
#   "Upper A E2E"            ← tekst wpisywany w tym teście
#   "Back"                   ← 'Wróć' (headerBackTitle w app/_layout.tsx)
#   "Calendar, tab.*"         ← 'Kalendarz' (08.10.2026, dawniej 'Historia') + etykieta zakładki „{label}, tab, {i} of {n}” (React Navigation; od SDK 56 jej kopia w expo-router — ten sam format)
#   "+ Log a past workout"   ← '+ Dodaj trening wstecz' (app/(tabs)/history.tsx)
#   "From a template"        ← 'Z szablonu'       (app/history/add.tsx)
#   "Upper A, .*"            ← Item: accessibilityLabel „{title}, {sub}” (components/ui.tsx), sub = '{n} ex. · {m} sets' (tu: 2 ex. · 6 sets)
#   "2 sessions"             ← 'sesja|sesje|sesji' → 'session|sessions' (licznik w nagłówku Historii)
appId: pl.lukasz.trening
name: Edycja historii i trening wstecz
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Start from a template", timeout: 60000 }
# Świeża instalacja nie ma szablonów (decyzja 03.10.2026) — szablon „Upper A” tworzy podprzepływ przez UI
- runFlow: subflows/szablon-testowy.yaml
- tapOn: "Start: Upper A"
- extendedWaitUntil: { visible: "Set 1 done.*", timeout: 30000 }
- tapOn: { text: "Set 1 done.*", index: 0 }
- extendedWaitUntil: { visible: "Skip", timeout: 30000 }
- tapOn: "Skip"
- assertNotVisible: "Skip"
- tapOn: "Finish"
- extendedWaitUntil: { visible: "Finish workout\\?", timeout: 30000 }
- tapOn: { text: "Finish", below: "Finish workout\\?" }
# Zapisana sesja
- extendedWaitUntil: { visible: "Session", timeout: 30000 }  # tytuł ekranu zapisanej sesji („Delete session” bywa poza ekranem; „Edit session” to też tytuł edytora)
- assertVisible: "Upper A"
- takeScreenshot: 10-sesja-przed-edycja

# --- Edycja sesji ---
- tapOn: "Edit session"
- extendedWaitUntil: { visible: "Cancel", timeout: 30000 }
- assertVisible: "Save"
- assertVisible: "Save changes"
- takeScreenshot: 11-edytor-sesji
# Pole „Name” (TextInput) ma wartość „Upper A” — dopasowanie po wartości pola (etykieta „Name” jest zdublowana z podpisem pola)
- tapOn: "Upper A"
- eraseText: 30
- inputText: "Upper A E2E"
- takeScreenshot: 12-edytor-nowa-nazwa
- tapOn: "Save"
# Alert pojawia się przy pominiętych seriach, seriach bez ciężaru (szablon testowy nie ma ciężaru startowego — tu zwykle tak) albo nachodzeniu terminów; opcjonalny
- tapOn: { text: "Save", below: "Save changes\\?", optional: true }
# Powrót na ekran sesji z nową nazwą
- extendedWaitUntil: { visible: "Session", timeout: 30000 }  # tytuł ekranu zapisanej sesji („Delete session” bywa poza ekranem; „Edit session” to też tytuł edytora)
- assertVisible: "Upper A E2E"
- assertNotVisible: "Upper A"
- assertNotVisible: "Cancel"
- takeScreenshot: 13-sesja-po-edycji

# --- Trening wstecz ---
- tapOn: "Back"
- tapOn: "Calendar, tab.*"
- extendedWaitUntil: { visible: "Upper A E2E,.*", timeout: 30000 }
- tapOn: "\\+ Log a past workout"
- extendedWaitUntil: { visible: "From a template", timeout: 30000 }
- takeScreenshot: 14-trening-wstecz
- tapOn: "Upper A, .*"
- extendedWaitUntil: { visible: "Cancel", timeout: 30000 }
- assertVisible: "Save"
- takeScreenshot: 15-edytor-treningu-wstecz
# 05.10.2026: nowe ćwiczenie w szablonie nie ma już domyślnego zakresu 8–10 (zakres opcjonalny), więc trening wstecz bez wcześniejszej sesji
# ma puste powtórzenia — wpisujemy wynik pierwszej serii (testID reps-<blok>-<seria> w app/history/edit/[id].tsx); „Save” w nagłówku nad klawiaturą.
- tapOn: { id: "reps-0-0" }
- inputText: "8"
- tapOn: "Save"
# Szablon testowy nie ma ciężaru startowego — serie bez ciężaru („Sets without weight: n.”), więc spodziewany Alert „Save changes?”
- tapOn: { text: "Save", below: "Save changes\\?", optional: true }
# Po zapisie edytor zastępuje się ekranem nowej sesji
- extendedWaitUntil: { visible: "Session", timeout: 30000 }  # tytuł ekranu zapisanej sesji („Delete session” bywa poza ekranem; „Edit session” to też tytuł edytora)
- assertVisible: "Upper A"
- takeScreenshot: 16-sesja-wstecz-zapisana
- tapOn: "Back"
- extendedWaitUntil: { visible: "2 sessions", timeout: 30000 }
- assertVisible: "Upper A, .*"
- assertVisible: "Upper A E2E,.*"
- takeScreenshot: 17-historia-dwie-sesje
# Kalendarz w Historii (07.10.2026 wieczór, components/HistoryCalendar.tsx): dzień z treningiem (testID cal-RRRR-MM-DD) filtruje listę,
# „Show all” ('Pokaż wszystkie') wraca; strzałki „Previous month” / „Next month” ('Poprzedni miesiąc' / 'Następny miesiąc').
- assertVisible: "Previous month"
- tapOn: { text: ".*, [0-9]+ sessions?", index: 0 }  # 08.10.2026: każdy dzień jest przyciskiem (planowanie) — dzień z sesją po etykiecie VoiceOver
- extendedWaitUntil: { visible: "Show all", timeout: 15000 }
- takeScreenshot: 18-kalendarz-dzien
- tapOn: "Show all"
- extendedWaitUntil: { visible: "Upper A E2E,.*", timeout: 15000 }
- tapOn: "Previous month"
- tapOn: "Next month"
- takeScreenshot: 19-kalendarz-miesiac
# Podsumowanie tygodnia / miesiąca w Postępach (08.10.2026, components/PeriodSummary.tsx): „Summary” ('Podsumowanie'), wiersz VoiceOver
# „Workouts: N, previously M” ('{label}: {v}, poprzednio {p}'), „Month” ('Miesiąc'), „Previous period” ('Poprzedni okres').
- tapOn: "More, tab.*"
- tapOn: "Progress.*"
- extendedWaitUntil: { visible: "Summary", timeout: 30000 }
- assertVisible: "Workouts: [1-9].*, previously .*"
- takeScreenshot: 20-podsumowanie-tydzien
# Tydzień deload (pakiet C, 08.10.2026): przełącznik „Deload week” ('Tydzień deload') z opisem „Your own label…”.
- tapOn: "Deload week"
- assertVisible: "Your own label.*"
- takeScreenshot: 20a-tydzien-deload
# Mapa mięśni (08.10.2026, components/MuscleMap.tsx): opis VoiceOver „Muscle map: …” ('Mapa mięśni: {list}'), przewinięcie do niej.
- scrollUntilVisible: { element: "Muscle map: .*", direction: DOWN, timeout: 20000 }
- takeScreenshot: 20b-mapa-miesni
# Znacznik 10 serii na partię tygodniowo (pakiet C, 08.10.2026): opis kreski „Line = 10 sets…” (ACSM 2026).
- scrollUntilVisible: { element: "Line = 10 sets per muscle group per week.*", direction: DOWN, timeout: 20000 }
- takeScreenshot: 20c-kreska-10-serii
- scrollUntilVisible: { element: "Month", direction: UP, timeout: 20000 }  # run 37738868663: po przewinięciu do mapy i kreski „Month” jest nad ekranem
- tapOn: "Month"
- tapOn: "Previous period"
- assertVisible: "Workouts: .*, previously .*"
- takeScreenshot: 21-podsumowanie-miesiac-wstecz
# Deload A+B (decyzje właściciela 08.10.2026): bieżący tydzień oznaczony wyżej („Deload week”) — Kalendarz pokazuje „This week: deload…”
# ('Ten tydzień: deload. …', components/DeloadHint.tsx); „Start: Upper A” pyta „Deload week” ('Tydzień deload') z liczbą serii
# ('Zacząć z mniejszą liczbą serii: {a} zamiast {b} serii roboczych? …' — Upper A: 2 ćw. × 3 serie → 2 + 2 = 4 zamiast 6), „Fewer sets” ('Mniej serii').
- tapOn: "Calendar, tab.*"
- extendedWaitUntil: { visible: "This week: deload.*", timeout: 30000 }
- takeScreenshot: 22-deload-kalendarz
- tapOn: "Workout, tab.*"
- extendedWaitUntil: { visible: "Start: Upper A", timeout: 30000 }
- tapOn: "Start: Upper A"
- extendedWaitUntil: { visible: "Start with fewer sets: 4 instead of 6 working sets.*", timeout: 15000 }
- takeScreenshot: 23-deload-pytanie
- tapOn: "Fewer sets"
- extendedWaitUntil: { visible: "Set 1 done.*", timeout: 30000 }
