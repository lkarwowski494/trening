# Generator szablonów i planu tygodnia (decyzje właściciela 08.10.2026, docs/24). Logika i wszystkie przypadki: tests/generator.test.ts,
# tests/generator-ui.test.tsx. Tu: prawdziwe stuknięcia na symulatorze — wejście z ekranu planu, podgląd, zapis i aktywacja planu.
#
# Literały (EN z lib/i18n.en.ts):
#   "Templates and plan"             ← 'Szablony i plan' (przycisk kroku 1 w „Pierwszych krokach” na ekranie Trening — M1-audytor-generalny-025, 27.10.2026; otwiera ekran planu app/plan.tsx)
#   "Planning"                       ← 'Planowanie' (przycisk kroku 2 w „Pierwszych krokach”; po pierwszym treningu — w nagłówku ekranu i zakładki Plan; otwiera ekran planu)
#   "Generate templates and plan"    ← 'Wygeneruj szablony i plan' (app/templates.tsx, app/plan.tsx)
#   "New templates and plan", "Plan from my templates" ← 'Nowe szablony i plan', 'Plan z moich szablonów' (przełącznik trybu generatora — DEC-03 c, app/generator.tsx)
#   "Preview", "Plan rules" ← 'Podgląd', 'Zasady planu' (app/generator.tsx)
#   "Save templates and plan"        ← 'Zapisz szablony i plan'
#   "The plan .* is now active\\."           ← 'Plan „{name}” jest teraz aktywny.' (zdanie na ekranie planu po zapisie bez aktywnego planu — ZM-03, app/plan.tsx; okno pytania i „Saved” nie występują)
#   "\\+ Add place"                   ← '+ Dodaj miejsce' (chip w generatorze przy braku miejsc — audyt 0.10 UX-10)
#   "Not now"                        ← 'Nie teraz' (okno zgody na przypomnienie — X-11: pierwszy plan z każdej drogi, components/PlanReminderSync)
#   "Guide", "Read: .*", "Weekly plan and Calendar, unread", "Show: Weekly plan and Calendar" ← app/guide.tsx (przewodnik, 08.10.2026)
#   ".*not enough evidence to establish a dose-response relationship.*" ← zdanie R1 pod ⓘ „Zasady planu” ('…za mało dowodów, by stwierdzić zależność dawka–odpowiedź…'; app/generator.tsx)
#   ".*no safety arms in the rack.*"  ← 'bez asekuracji w stojakach' (dopisek przy ćwiczeniu z zaleceniem asekuracji w miejscu bez ramion; audyt M1-015)
#   "day-N" (id)                     ← components/DayPicker.tsx: testID przycisku dnia (pon = 0); wybór dni (decyzja 09.10.2026 B)
#   "Choose training days: 1 to 6\." ← 'Wybierz dni treningowe: od {a} do {b}.' (liczba dni poza zakresem, tu 0 — bez podglądu)
#   "Mon.* Full Body", "One workout a week still brings progress.*" ← 1 dzień (09.10.2026, docs/research/29): sesja 'FBW' → 'Full Body',
#                                      ostrzeżenie „oneday” (lib/generator.ts loadWarnings)
#   "Mon.* Full Body A, Wed.* Full Body B, Sat.* Full Body A" ← nagłówek podglądu: skrót dnia (Intl, en-US) + nazwa sesji
#   "General fitness", "Muscle"      ← 'Ogólny', 'Masa' — chipy celu pod wyborem dni (decyzja 09.10.2026 B: najpierw dni, potem cel; docs/research/30)
#   "General fitness \\(for health\\): 2 sets.*" ← opis celu 'Ogólny (dla zdrowia i sprawności): {s} serie…'
#   "Mon.* Full Body, Wed.* Full Body, Sat.* Full Body" ← „Ogólny” przy 1–3 dniach: pełne FBW ('FBW' → 'Full Body') każdego dnia
#   "sw-Cardio days in the plan" (id) ← SwitchRow 'Dni cardio w planie' (tylko „Ogólny” przy 4–6 dniach, domyślnie wyłączony)
#   "Cardio in the plan: 60 min per week.*" ← 'Cardio w planie: {n} min tygodniowo…' (minuty cardio obok zalecenia WHO)
#   "Monday, Full Body A", "Saturday, Full Body A" ← app/plan.tsx: wiersz dnia '{dzień}, {szablon}' (audyt 0.10 UX-15 A: 7 wierszy; „{dzień}: {szablon}” to chip
#                                      w rozwiniętym wierszu — E2E 89), nazwa szablonu 'FBW A' → 'Full Body A'
appId: pl.lukasz.trening
name: Generator szablonów i planu
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
# 11.10.2026 (wariant A): Szablony są pod Więcej, więc generator otwieramy z ekranu planu (Trening → krok 1 „Templates and plan” → „Generate templates and plan”, B9) —
# stos: Trening → Planowanie → Generator; „Planning” w oknie „Saved” wraca do planu, a „Back” do zakładek.
- tapOn: "Templates and plan"
- extendedWaitUntil: { visible: "Generate templates and plan", timeout: 30000 }
- tapOn: "Generate templates and plan"
- extendedWaitUntil: { visible: "Preview", timeout: 30000 }
# DEC-03 (c, 23.10.2026): przełącznik trybu w generatorze przywrócony — „New templates and plan” zaznaczone, przełączenie na „Plan from my templates” i z powrotem
- assertVisible: "New templates and plan"
- tapOn: "Plan from my templates"
- extendedWaitUntil: { visible: "You have no templates with exercises.*", timeout: 30000 }  # clearState: jeszcze nie ma szablonów, więc tryb własnych szablonów pokazuje komunikat z odesłaniem do „New templates and plan”
- assertNotVisible: "Preview"
- tapOn: "New templates and plan"
- extendedWaitUntil: { visible: "Preview", timeout: 30000 }
- assertVisible: "\\+ Add place"
- assertNotVisible: ".*no safety arms in the rack.*"  # M1-015: bez miejsc = pełna siłownia, więc podgląd nie dopisuje braku asekuracji (dopisek tylko w miejscu bez ramion — tests/audit-m1-015-asekuracja.test.tsx)
# --- wybór dni (09.10.2026 B): propozycja pon/śr/pt → odznacz pt, zaznacz sob; 1 dzień — sesja FBW z ostrzeżeniem; 0 dni — komunikat zamiast podglądu ---
- tapOn: { id: "day-4" }
- tapOn: { id: "day-5" }
- scrollUntilVisible: { element: "Mon.* Full Body A, Wed.* Full Body B, Sat.* Full Body A", direction: DOWN, timeout: 30000 }
- tapOn: { id: "day-2" }
- tapOn: { id: "day-5" }
- scrollUntilVisible: { element: "Mon.* Full Body", direction: DOWN, timeout: 30000 }
# uwaga „oneday” stoi pod celem, NAD podglądem — na małym ekranie po przewinięciu do „Mon.* Full Body” jest nad ekranem (nocny przebieg 40263099163), więc szukamy w górę
- scrollUntilVisible: { element: "One workout a week still brings progress.*", direction: UP, timeout: 30000 }
- takeScreenshot: 70a-generator-1-dzien
- scrollUntilVisible: { element: { id: "day-0" }, direction: UP, timeout: 30000 }
- tapOn: { id: "day-0" }
- assertVisible: "Choose training days: 1 to 6\\."
- assertNotVisible: "Save templates and plan"
- tapOn: { id: "day-0" }
- tapOn: { id: "day-2" }
- tapOn: { id: "day-5" }
- scrollUntilVisible: { element: "Mon.* Full Body A, Wed.* Full Body B, Sat.* Full Body A", direction: DOWN, timeout: 30000 }
# --- cel „Ogólny” (09.10.2026, docs/research/30): pon/śr/sob — pełne FBW każdego dnia, bez przełącznika; + pt (4 dni) → przełącznik cardio → 3 × FBW + cardio ---
- scrollUntilVisible: { element: "General fitness", direction: UP, timeout: 30000 }
- tapOn: "General fitness"
- tapOn: { id: "info-gen-goal" }  # 14.10.2026: opis celu jest pod ⓘ przy polu „Goal” (docs/32 wzorzec 27)
- assertVisible: "General fitness \\(for health\\): 2 sets per exercise.*"
- tapOn: { id: "info-gen-goal" }  # zwinięcie — dalsze kroki jak dotąd
- assertNotVisible: { id: "sw-Cardio days in the plan" }
- scrollUntilVisible: { element: "Mon.* Full Body, Wed.* Full Body, Sat.* Full Body", direction: DOWN, timeout: 30000 }
- scrollUntilVisible: { element: { id: "day-4" }, direction: UP, timeout: 30000 }
- tapOn: { id: "day-4" }
- scrollUntilVisible: { element: { id: "sw-Cardio days in the plan" }, direction: DOWN, timeout: 30000 }
- tapOn: { id: "sw-Cardio days in the plan" }
- scrollUntilVisible: { element: "Cardio in the plan: 60 min per week.*", direction: DOWN, timeout: 30000 }
- takeScreenshot: 70b-generator-ogolny-cardio
- scrollUntilVisible: { element: { id: "sw-Cardio days in the plan" }, direction: UP, timeout: 30000 }
- tapOn: { id: "sw-Cardio days in the plan" }
- scrollUntilVisible: { element: { id: "day-4" }, direction: UP, timeout: 30000 }
- tapOn: { id: "day-4" }
- tapOn: "Muscle"
- scrollUntilVisible: { element: "Mon.* Full Body A, Wed.* Full Body B, Sat.* Full Body A", direction: DOWN, timeout: 30000 }
- takeScreenshot: 70-generator
- scrollUntilVisible: { element: "Plan rules", direction: DOWN, timeout: 30000 }
- tapOn: { id: "info-gen-basis" }  # 14.10.2026: „Zasady planu” — źródła pod ⓘ (treść bez zmian)
# E2E 40309855134 (iPhone 16e, ciemny): rozwinięte punkty leżą przy dolnej krawędzi i są ucięte — assertVisible ich nie widzi; przewijamy do każdego
- scrollUntilVisible: { element: ".*Each major muscle group on at least.*", direction: DOWN, timeout: 30000 }
- scrollUntilVisible: { element: ".*more days do not have to give proportionally more.*", direction: DOWN, timeout: 30000 }  # 25.10.2026: brzmienie bez odwołań do dowodów (druga decyzja właściciela „całkiem anonimowo”)
- takeScreenshot: 71-generator-zrodla
- scrollUntilVisible: { element: "Save templates and plan", direction: DOWN, timeout: 30000, centerElement: true }
- tapOn: "Save templates and plan"
# ZM-03 (21.10.2026): bez aktywnego planu zapis jest jednym krokiem — plan aktywny bez pytania i bez okna „Saved”, ekran Planowanie ze zdaniem „The plan “…” is now active.”
# X-11 (audyt kontrolny 1): pierwszy plan → okno zgody na przypomnienie (zgoda na powiadomienia nieustalona na symulatorze); kolejność okien zależy od iOS
- tapOn: { text: "Not now", optional: true }
- extendedWaitUntil: { visible: "The plan .* is now active\\.", timeout: 30000 }
- assertNotVisible: "Make the new plan active\\?"
- extendedWaitUntil: { visible: "Monday, Full Body A", timeout: 30000 }
- scrollUntilVisible: { element: "Saturday, Full Body A", direction: DOWN, timeout: 30000 }
- takeScreenshot: 72-plan-z-generatora
# --- Przewodnik (08.10.2026): Więcej → Przewodnik → temat → „Show” otwiera Kalendarz ---
- tapOn: "Back"
- tapOn: "More, tab.*"
- tapOn: "Guide.*"
- extendedWaitUntil: { visible: "Read: .*", timeout: 30000 }  # nawigacja jak gdzie indziej 30 s (przebieg 38264871642: zrzut — Więcej z wciśniętym „Guide”, JS wolny)
- tapOn: "Weekly plan and Calendar, unread"
- extendedWaitUntil: { visible: "Show: Weekly plan and Calendar", timeout: 30000 }
- takeScreenshot: 73-przewodnik
- tapOn: "Show: Weekly plan and Calendar"
- extendedWaitUntil: { visible: "Planning", timeout: 30000 }  # przycisk w Kalendarzu (dawniej „Weekly plan”)
