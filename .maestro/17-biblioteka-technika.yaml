# Audyt 0.10, fala 2, obszar TESTY (M3 / TST-03, 09.10.2026): E2E dla dwóch funkcji z 09.10 bez scenariusza Maestro — filtr „Podstawowe” na liście
# Ćwiczeń (research biblioteki, wariant B) i sekcja „Technika” w podglądzie ćwiczenia (wskazówki techniki, etap 1).
# TST2-05 (audyt kontrolny 1): figura ruchu (etap 2–3) — obraz z opisem ruchu i pauza/wznowienie animacji (logika i ekran: tests/figures.test.tsx).
# Logika i ekrany: tests/catalog-library25.test.tsx, tests/audit-0.10-tst-ui.test.tsx, tests/scenario-0.10.test.tsx (restart), tests/cues.test.tsx.
#
# Literały (EN z lib/i18n.en.ts):
#   "More, tab.*" → "Exercises"                              ← 'Więcej' + 'Ćwiczenia' (Item na liście Więcej; 11.10.2026, wariant A: Ćwiczenia pod Więcej) (jak w 16)
#   "Filter: basic exercises"                        ← 'Filtr: podstawowe ćwiczenia' (accessibilityLabel chipa „Basic ✕”, components/LibScope.tsx)
#   "Showing all exercises, including niche ones"    ← 'Pokazane wszystkie ćwiczenia, także niszowe' (ten sam chip po zdjęciu filtra)
#   "Search exercises…" / "Back Squat, barbell.*"             ← jak w 16
#   "Technique"                                      ← 'Technika' (przycisk sekcji, components/ExerciseCues.tsx; od 27.10.2026 karta ćwiczenia otwiera ją rozwiniętą — pierwsze stuknięcie zwija, drugie rozwija)
#   "Setup" / "The app does not give medical advice.*"  ← 'Ustawienie' / zdanie o poradach medycznych na końcu sekcji (stopka „Na podstawie…” usunięta 23.10.2026 — źródła są w Ustawienia → Źródła wiedzy)
#   "Movement drawing: .*"                           ← 'Rysunek ruchu: {opis}' (etykieta VoiceOver obrazu figury, components/ExerciseFigure.tsx)
#   lib-row-1 / exercises-search / exercise-cues / exercise-figure-v2-image  ← testID: wiersz listy Ćwiczenia (jeden wynik), pole wyszukiwania (app/exercises.tsx), sekcja Technika, obraz figury v2 (101-22: Deadlift (Barbell))
#   "Pause animation" / "Resume animation"          ← 'Zatrzymaj animację' / 'Wznów animację' (przycisk pod figurą, WCAG 2.2.2)
# Audyt kontrolny 1, fala 2b (09.10.2026):
#   UX2-01 — dawna nazwa z katalogu znajduje obecne ćwiczenie: "Back Squat, barbell · formerly: Narrow Stance Squats" ← 'dawniej: {n}' (dopisek wiersza
#            listy Ćwiczeń); bez "Create .*" ← 'Utwórz „{name}”'.
#   UX2-05 — technika z treningu: "Empty workout", "\+ Add exercise", "Search exercises…" (jak 04), "Technique: Back Squat" ← 'Technika: {name}'
#            (etykieta VoiceOver przycisku „Technika ›” w karcie ćwiczenia, components/ExerciseCues.tsx TechniqueLink) → podgląd z rozwiniętą sekcją
#            („Setup” widoczne bez tapnięcia „Technique”).
appId: pl.lukasz.trening
name: Filtr „Podstawowe” i sekcja „Technika”
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
- tapOn: "More, tab.*"
- tapOn: "Exercises"  # 11.10.2026: Ćwiczenia to ekran pod Więcej (bez własnej zakładki)
- extendedWaitUntil: { visible: "Filter: basic exercises", timeout: 30000 }
- tapOn: "Filter: basic exercises"
- extendedWaitUntil: { visible: "Showing all exercises, including niche ones", timeout: 15000 }
- takeScreenshot: 80-biblioteka-wszystkie
- tapOn: "Showing all exercises, including niche ones"
- extendedWaitUntil: { visible: "Filter: basic exercises", timeout: 15000 }

- tapOn: { id: "exercises-search" }   # 101-22: pole listy Ćwiczenia po id (M1-034)
- inputText: "Back Squat"
- pressKey: Enter   # reguła: po wpisie w wyszukiwarce wyboru ćwiczenia zawsze Enter (klawiatura znika, lista zostaje przefiltrowana)
- tapOn: { text: "Continue", optional: true }
- pressKey: Enter   # chowa klawiaturę (L-013: na 390 pt wiersz wyniku leży przy niej)
- tapOn: "Back Squat, barbell.*"
- extendedWaitUntil: { visible: "Technique", timeout: 30000 }
# 27.10.2026 (wariant B, docs/18): karta ćwiczenia otwiera się z sekcją „Technika” ROZWINIĘTĄ — rysunek widać bez tapnięcia; przycisk zwija i rozwija
# 29.10.2026 (scalenie main do linii 1.1, bramka 4): rysunek v2 pokazuje tylko rodzina z aktualnym wpisem recenzji ruchu (lib/figures/data.json, pole v2); do czasu
# recenzji 1.1 rodzina squat jest ukryta, a karta ma same wskazówki tekstowe — kroki rysunku są warunkowe (wracają do twardych po recenzji; docs/18, tests/recenzja-wyjatki-1-1.json)
- extendedWaitUntil: { visible: "Movement drawing: .*", timeout: 8000, optional: true }
- runFlow:
    when: { visible: "Movement drawing: .*" }
    commands:
      - tapOn: "Technique"
      - assertNotVisible: "Movement drawing: .*"
      - tapOn: "Technique"
      # TST2-05: figura ruchu nad tekstem sekcji — przycisk pauzy pod rysunkiem (ustawienie „Ogranicz ruch” na symulatorze wyłączone — animacja)
      - scrollUntilVisible: { element: "Pause animation", direction: DOWN, timeout: 30000, centerElement: true }
      - assertVisible: "Movement drawing: .*"
      - tapOn: "Pause animation"
      - extendedWaitUntil: { visible: "Resume animation", timeout: 15000 }
      - takeScreenshot: 82-figura-pauza
      - tapOn: "Resume animation"
      - extendedWaitUntil: { visible: "Pause animation", timeout: 15000 }
# E2E 91: sekcja zaczyna się rysunkiem ruchu (wysoki) — „Setup” jest pod krawędzią ekranu
- scrollUntilVisible: { element: "Setup", direction: DOWN, timeout: 30000 }
- scrollUntilVisible: { element: "The app does not give medical advice.*", direction: DOWN, timeout: 30000 }
- takeScreenshot: 81-technika

# --- UX2-01: dawna nazwa (scalone 09.10) → obecne ćwiczenie, bez „Create …” ---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
- tapOn: "More, tab.*"
- tapOn: "Exercises"  # 11.10.2026: Ćwiczenia to ekran pod Więcej (bez własnej zakładki)
- extendedWaitUntil: { visible: "Search exercises…", timeout: 30000 }
- tapOn: { id: "exercises-search" }
- inputText: "Narrow Stance Squats"
- pressKey: Enter   # reguła: po wpisie w wyszukiwarce wyboru ćwiczenia zawsze Enter (klawiatura znika, lista zostaje przefiltrowana)
- tapOn: { text: "Continue", optional: true }
- pressKey: Enter   # chowa klawiaturę (L-013: na 390 pt wiersz wyniku leży przy niej)
- extendedWaitUntil: { visible: "Back Squat, barbell · formerly: Narrow Stance Squats", timeout: 15000 }
- assertNotVisible: "Create .*"
- takeScreenshot: 83-dawna-nazwa

# --- 101-22: karta Deadlift (sztanga) z rysunkiem v2 (rodzina „zawias biodrowy”); pole listy po id, wiersz wyniku po id (M1-034) ---
- tapOn: { id: "exercises-search" }
- eraseText: 40
- inputText: "Deadlift (Barbell)"
- pressKey: Enter   # reguła: po wpisie w wyszukiwarce zawsze Enter
- pressKey: Enter   # chowa klawiaturę (L-013)
- extendedWaitUntil: { visible: "Deadlift \\(Barbell\\), barbell.*", timeout: 15000 }
- tapOn: { id: "lib-row-1" }   # jeden wynik wyszukiwania (wzór: 27)
- extendedWaitUntil: { visible: "Technique", timeout: 30000 }
# 31.10.2026 (scalenie wersja-1-0-1-r2 do linii 1.1): rodzina hinge ukryta do recenzji 1.1 (bramka 4) — krok rysunku warunkowy jak wyżej (wraca do twardego po recenzji)
- extendedWaitUntil: { visible: "Movement drawing: .*", timeout: 8000, optional: true }
- runFlow:
    when: { visible: "Movement drawing: .*" }
    commands:
      - scrollUntilVisible: { element: { id: "exercise-figure-v2-image" }, direction: DOWN, timeout: 30000, centerElement: true }
      - assertVisible: { id: "exercise-figure-v2-image" }
- takeScreenshot: 87-deadlift-sztanga-technika

# --- UX2-05: „Technika ›” w treningu na żywo → podgląd ćwiczenia z rozwiniętą sekcją ---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
- extendedWaitUntil: { visible: "\\+ Add exercise", timeout: 30000 }
- tapOn: "\\+ Add exercise"
- tapOn: "Search exercises…"
- inputText: "Back Squat"
- pressKey: Enter   # reguła: po wpisie w wyszukiwarce wyboru ćwiczenia zawsze Enter (klawiatura znika, lista zostaje przefiltrowana)
- tapOn: { text: "Continue", optional: true }
- pressKey: Enter   # chowa klawiaturę (L-013: na 390 pt wiersz wyniku leży przy niej)
- tapOn: "Back Squat, barbell"
- scrollUntilVisible: { element: "Technique: Back Squat", direction: DOWN, timeout: 30000, centerElement: true }
- tapOn: "Technique: Back Squat"
# 29.10.2026 (bramka 4): rysunek squat ukryty do recenzji 1.1 — przycisk pauzy tylko przy rysunku; rozwinięcie sekcji potwierdza „Setup” niżej
- extendedWaitUntil: { visible: "Pause animation", timeout: 8000, optional: true }
# sekcja rozwinięta bez tapnięcia „Technique” (centerElement — inny krok niż wyżej; tests/maestro-e2e91 podmienia ostatnie „Setup” bez niego)
- scrollUntilVisible: { element: "Setup", direction: DOWN, timeout: 30000, centerElement: true }
- takeScreenshot: 84-technika-z-treningu
