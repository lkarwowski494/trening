# Styl „Tuleja” (07.10.2026): widok skupiony na bieżącej serii, przełącznik „Widok treningu”. 20.10.2026 (DEC-06, audyt M1): pasek talerzy „na każdą stronę” usunięty — scenariusz sprawdza, że go nie ma.
#
# Literały (EN z lib/i18n.en.ts / lib/equipment.ts):
#   "Measurement system" / "kg"          ← 'System miar' / segment kg (app/more/settings.tsx) — symulator en-US startuje w lb (H4), E2E 89
#   "Full gym,.*"                 ← LOCATION_PRESET_LABEL.gym.en + hint (preset: sztanga 20 kg + talerze 25…1,25)
#   "Back Squat,.*"               ← nazwa z lib/seed.ts (picker: „{nazwa}, …”)
#   w-0-0 / r-0-0                 ← testID pól ciężaru i powtórzeń serii (components/ActiveWorkout.tsx)
#   "Back Squat, set 1 of 1\\. 80 kilograms, 5 reps.*" ← opis tablicy „teraz” (M3 p2, ZM-01: accessibilityLabel grupy; liczby czytane z jednostką)
#   board-input-weight / board-value-reps ← testID pola ciężaru (wpis na tablicy) i liczby powtórzeń (stuknięcie otwiera wpis)
#   "Increase weight by 2.5 kg" / "Decrease weight by 2.5 kg" / "Add one rep" / "Remove one rep" ← przyciski ± tablicy
#   "Each side.*"                 ← dawne 'Na każdą stronę: {p}' (pasek talerzy usunięty 20.10.2026) — assertNotVisible
#   "Set done.*"                  ← 'Seria zrobiona' (przycisk karty); etykieta VoiceOver „Set done: {ex}, set {n}” zastępuje tekst
#                                   przycisku w drzewie dostępności — sam „Set done” nie pasuje (run 37600735711, krok 27)
#   "All sets ticked off"         ← 'Wszystkie serie odhaczone'
#   "set 1 of 1"                  ← 'seria {n} z {all}' (nagłówek karty, zwykły tekst — tap chowa klawiaturę)
#   "Skip"                        ← 'Pomiń' (przerwa w karcie „teraz”, RestPanel w components/ActiveWorkout.tsx)
#   "Workout view"/"List"/"Focused" ← 'Widok treningu' / 'Lista' / 'Skupiony' (app/more/settings.tsx)
appId: pl.lukasz.trening
name: Widok skupiony (bez paska talerzy)
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }

# --- miejsce „Full gym” (sztanga + talerze) ---
- tapOn: "More, tab.*"
- extendedWaitUntil: { visible: "Settings", timeout: 30000 }
- tapOn: "Settings"
# E2E 89: świeża instalacja bierze jednostkę z regionu (H4, audyt 0.10 UX-12) — symulator en-US → lb („Now: 80 lb × 5”, talerze w lb).
# Scenariusz sprawdza talerze w kg, więc najpierw kg (PRZED dodaniem miejsca — preset bierze talerze w bieżącej jednostce).
- extendedWaitUntil: { visible: "Measurement system", timeout: 30000 }
- tapOn: { id: "unit-system-kg" }
- tapOn: "Back"
- extendedWaitUntil: { visible: "Places and equipment", timeout: 30000 }  # 11.10.2026: pozycja ekranu Więcej, nie Ustawień
- tapOn: "Places and equipment"
- extendedWaitUntil: { visible: "Add place", timeout: 30000 }
- tapOn: "Add place"
- extendedWaitUntil: { visible: "Full gym,.*", timeout: 30000 }
- tapOn: "Full gym,.*"
- extendedWaitUntil: { visible: "Available exercises: .*", timeout: 30000 }
- tapOn: "Back"
- tapOn: "Back"

# --- pusty trening + przysiad ze sztangą ---
- tapOn: "Workout, tab.*"
- scrollUntilVisible: { element: "Empty workout", direction: DOWN, timeout: 60000 }
- tapOn: "Empty workout"
- extendedWaitUntil: { visible: "\\+ Add exercise", timeout: 30000 }
- tapOn: "\\+ Add exercise"
- tapOn: "Search exercises…"
- inputText: "Back Squat"
- pressKey: Enter   # po wpisie w polu szukania ćwiczeń zawsze Enter (reguła z main) — klawiatura znika, lista zostaje przefiltrowana
- tapOn: { text: "Continue", optional: true }
- pressKey: Enter   # chowa klawiaturę (L-013: na 390 pt wiersz wyniku leży przy niej)
- tapOn: "Back Squat,.*"
- extendedWaitUntil: { visible: "Set done.*", timeout: 30000 }
- takeScreenshot: 40-tablica-pusta
# M3 p2 (ZM-01, wz. 29): „Set done” bez ciężaru nie odhacza serii — ustawia kursor w polu ciężaru na tablicy (komunikatu nie ma, brak wartości widać po polu)
- tapOn: "Set done.*"
- extendedWaitUntil: { visible: { id: "board-input-weight" }, timeout: 15000 }
- assertVisible: "Workout progress: 0 of 1 sets"
- assertNotVisible: "Skip"
# wpis na tablicy: ciężar w polu, które dostało kursor, powtórzenia po stuknięciu liczby; na wolnym symulatorze ginie pierwszy znak (31, 15, 04) — znaki osobno i sprawdzenie skutku
- retry:
    maxRetries: 2
    commands:
      - tapOn: { id: "board-input-weight" }
      - eraseText: 10
      - inputText: "8"
      - inputText: "0"
      - tapOn: { id: "board-value-reps" }
      - tapOn: { id: "board-input-reps" }   # stuknięcie liczby otwiera pole z kursorem; drugie stuknięcie w samo pole nic nie zmienia
      - eraseText: 10
      - inputText: "5"
      - tapOn: "Back Squat"   # klawiatura numeryczna nie ma „Gotowe”; fokus zdejmuje stuknięcie w nazwę ćwiczenia nad wierszami (nagłówek bloku)
      - assertVisible: "Back Squat, set 1 of 1\\. 80 kilograms, 5 reps.*"
- assertNotVisible: "Each side.*"  # DEC-06: pasek talerzy usunięty
- assertNotVisible: "empty bar"
- takeScreenshot: 41-tablica-z-wartosciami
# ± na tablicy: ciężar o najbliższy dostępny talerz (miejsce z opisanym sprzętem: 82,5), powtórzenia o 1
- tapOn: "Increase weight by 2.5 kg"
- assertVisible: "Back Squat, set 1 of 1\\. 82.5 kilograms, 5 reps.*"
- tapOn: "Decrease weight by 2.5 kg"
- tapOn: "Add one rep"
- assertVisible: "Back Squat, set 1 of 1\\. 80 kilograms, 6 reps.*"
- tapOn: "Remove one rep"
- assertVisible: "Back Squat, set 1 of 1\\. 80 kilograms, 5 reps.*"
- tapOn: "Set done.*"
- extendedWaitUntil: { visible: "Skip", timeout: 15000 }  # build 1004: przerwa w tablicy — odliczanie i „Skip”, nie w dolnym pasku
- takeScreenshot: 42-przerwa-w-tablicy
- tapOn: "Skip"
- assertNotVisible: "Skip"
- extendedWaitUntil: { visible: "All sets ticked off", timeout: 15000 }

# --- przełącznik: widok listy chowa kartę ---
- tapOn: "More, tab.*"
- tapOn: "Settings"
- extendedWaitUntil: { visible: "Workout view", timeout: 30000 }
- tapOn: "List"
- tapOn: "Back"
- tapOn: "Workout, tab.*"
- assertNotVisible: "All sets ticked off"
- assertNotVisible: "Set done.*"
- takeScreenshot: 43-widok-listy
