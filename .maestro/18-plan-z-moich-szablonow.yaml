# Plan z moich szablonów i „+ Nowy szablon” w edytorze planu (decyzje właściciela 09.10.2026, wariant B; docs/18 ok. 14:45 i 14:55).
# Logika i wszystkie przypadki: tests/plan-own-templates.test.ts, tests/plan-own-templates-ui.test.tsx. Tu: prawdziwe stuknięcia na symulatorze —
# „Pierwsze kroki” → „Plan z moich szablonów” → podgląd → zapis i aktywacja → Plan tygodnia → „+ Nowy szablon” na wtorek → „Zapisz” → wtorek z nowym szablonem.
#
# Literały (EN z lib/i18n.en.ts):
#   "Plan from my templates"          ← 'Plan z moich szablonów' (components/Dashboard.tsx „Pierwsze kroki”, app/plan.tsx; bez przełącznika trybu w generatorze — ZM-03)
#   "Training days per week"          ← 'Dni treningowe w tygodniu' (components/OwnPlan.tsx)
#   "Template in the plan: Upper A"   ← 'Szablon w planie: {name}' (chip wyboru szablonu, przełącznik)
#   "Preview", "Save plan"            ← 'Podgląd', 'Zapisz plan'
#   "The plan .* is now active\\."            ← 'Plan „{name}” jest teraz aktywny.' (ZM-03: zdanie na ekranie planu po zapisie bez aktywnego planu; bez okna pytania i „Saved”)
#   "Planning"                        ← 'Planowanie' (przycisk w „Pierwszych krokach” i tytuł ekranu planu)
#   "Not now"                        ← 'Nie teraz' (okno zgody na przypomnienie — X-11: pierwszy plan z każdej drogi, components/PlanReminderSync)
#   "Monday, Upper A", "Tuesday, Rest" ← app/plan.tsx: wiersz dnia '{dzień}, {szablon albo Wolne}' (1 szablon × 3 dni → pon., śr., sob. po wyborze dni)
#   "day-N" (id)                      ← components/DayPicker.tsx: testID przycisku dnia (pon = 0); wybór dni (decyzja 09.10.2026 B):
#                                       propozycja pon./śr./pt. → pt. odznaczony, sob. zaznaczona → "Saturday, Upper A", piątek wolny
#   "Tuesday: \+ New template"        ← app/plan.tsx: '{dzień}: ' + '+ Nowy szablon' (przycisk w rozwiniętym wierszu dnia)
#   "\+ Add exercise", "Search exercises…", "Save template", "Edit template", "Back" ← jak w subflows/szablon-testowy.yaml
#   "Tuesday, Lower B"                ← wiersz dnia po „Zapisz” nowego szablonu (przypisanie: lib/plan.ts assignNewTemplate)
appId: pl.lukasz.trening
name: Plan z moich szablonów
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Other workout", timeout: 60000 }
- runFlow: subflows/szablon-testowy.yaml
# --- „Pierwsze kroki” (krok 2, bez planu): przycisk „Planning” → ekran planu → „Plan z moich szablonów” (11.10.2026; lista „Start from a template” i przyciski kroków zniknęły) ---
- tapOn: "Planning"
- extendedWaitUntil: { visible: "Plan from my templates", timeout: 30000 }
- tapOn: "Plan from my templates"
- extendedWaitUntil: { visible: "Training days per week", timeout: 30000 }
- assertVisible: "Template in the plan: Upper A"
- tapOn: { id: "day-4" }
- tapOn: { id: "day-5" }
- assertVisible: "Preview"
- takeScreenshot: 80-plan-z-moich-szablonow
- scrollUntilVisible: { element: "Save plan", direction: DOWN, timeout: 30000, centerElement: true }
- tapOn: "Save plan"
# ZM-03 (21.10.2026): bez aktywnego planu zapis jest jednym krokiem — plan aktywny bez pytania i bez okna „Saved”, ekran Planowanie ze zdaniem „The plan “…” is now active.”
# X-11 (audyt kontrolny 1): pierwszy plan → okno zgody na przypomnienie (zgoda na powiadomienia nieustalona na symulatorze); kolejność okien zależy od iOS
- tapOn: { text: "Not now", optional: true }
- extendedWaitUntil: { visible: "The plan .* is now active\\.", timeout: 30000 }
- assertNotVisible: "Make the new plan active\\?"
- extendedWaitUntil: { visible: "Monday, Upper A", timeout: 30000 }
- assertVisible: "Friday, Rest"
- assertVisible: "Saturday, Upper A"
- takeScreenshot: 81-plan-aktywny
# --- „+ Nowy szablon” na wtorek: edycja → ćwiczenie → „Zapisz” → szablon od razu na wtorku ---
- tapOn: "Tuesday, Rest"
- tapOn: "Tuesday: \\+ New template"
- extendedWaitUntil: { visible: "\\+ Add exercise", timeout: 30000 }
- tapOn: { text: "New template", below: "Name" }
- eraseText: 30
- inputText: "Lower B"
- pressKey: Enter
- tapOn: "\\+ Add exercise"
- extendedWaitUntil: { visible: "Search exercises…", timeout: 30000 }
- tapOn: "Search exercises…"
- inputText: "Bent Over Row"
- pressKey: Enter   # reguła: po wpisie w wyszukiwarce wyboru ćwiczenia zawsze Enter (klawiatura znika, lista zostaje przefiltrowana)
- tapOn: { text: "Continue", optional: true }
- pressKey: Enter   # chowa klawiaturę (L-013: na 390 pt wiersz wyniku leży przy niej)
- tapOn: "Bent Over Row \\(Dumbbell\\), dumbbells"
- extendedWaitUntil: { visible: "Bent Over Row \\(Dumbbell\\)", timeout: 30000 }
- tapOn: "Save template"
- extendedWaitUntil: { visible: "Edit template", timeout: 30000 }
- tapOn: "Back"
- extendedWaitUntil: { visible: "Tuesday, Lower B", timeout: 30000 }
- takeScreenshot: 82-nowy-szablon-na-wtorku
# --- Wyłączenie planu (11.10.2026, docs/18 pkt 5): ikona przy planie na ekranie planu (etykieta VoiceOver „Turn off plan: <name>”) → okno z potwierdzeniem →
# plan trafia do „Other plans”, nie ma „Active plan”. Obie strony zawsze z oknem (żeby nikt nie wyłączył planu przypadkiem).
- scrollUntilVisible: { element: "Turn off plan: .*", direction: UP, timeout: 30000, centerElement: true }
- tapOn: "Turn off plan: .*"
- extendedWaitUntil: { visible: "Turn off the plan\\?", timeout: 15000 }
- takeScreenshot: 83-wylaczenie-planu-pytanie
- tapOn: { text: "Turn off", below: "Turn off the plan\\?" }
- extendedWaitUntil: { notVisible: "Active plan", timeout: 15000 }
- scrollUntilVisible: { element: "Other plans", direction: DOWN, timeout: 30000 }
- takeScreenshot: 84-plan-wylaczony
