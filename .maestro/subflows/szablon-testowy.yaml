# Podprzepływ (runFlow) — szablon testowy „Upper A” tworzony przez UI.
# Od 03.10.2026 (decyzja właściciela, 08:11: „Nie przenoś do aplikacji żadnych moich szablonów. Sam je ustawię.”) świeża instalacja
# nie ma szablonów, a przepływy 01, 02, 03 i 05 startują z czystej instalacji (clearState) — każdy najpierw woła ten podprzepływ.
# Wołać na ekranie głównym zaraz po starcie (widać „Start from a template”). Wynik: szablon „Upper A” z dwoma ćwiczeniami
# (Bench Press (hantle), Bent Over Row (hantle); domyślnie 3 serie, 8–10 pow., bez ciężaru startowego) i przycisk „Start: Upper A”.
# Dwa ćwiczenia — przepływ 03 potrzebuje przycisku „Reorder exercises” (pokazywany od 2 ćwiczeń w treningu).
# Nie jest na liście w config.yaml — uruchamiany tylko przez runFlow.
#
# Literały (EN z lib/i18n.en.ts, chyba że zaznaczono inaczej):
#   "\+ New template"             ← '+ Nowy szablon'   (Btn w „Pierwszych krokach” albo w karcie Planowania — układ B, 09.10.2026; accessibilityLabel = tytuł)
#   "\+ Add exercise"             ← '+ Dodaj ćwiczenie' (Btn w app/template/[id].tsx)
#   "New template"                ← wartość pola Nazwa nowego szablonu: 'Nowy szablon' (lib/store.ts newTemplate) — dopasowanie po wartości pola
#                                    (E2E 89: tytuł nagłówka edycji nowego szablonu — DraftHeader title 'Nowy szablon' — to ten sam tekst i stoi wyżej;
#                                    stuknięcie trafiało w tytuł, nazwa zostawała „New template” → selektor { text, below: "Name" } — 'Nazwa', etykieta pola)
#   "Search exercises…"           ← 'Szukaj ćwiczenia…' (placeholder pola w app/picker.tsx, jak przepływ 04)
#   "Bench Press \(Dumbbell\), dumbbells" ← Item w app/picker.tsx: accessibilityLabel „{title}, {sub}” (components/ui.tsx);
#                                    title = exName('Bench Press (hantle)') → 'Bench Press (Dumbbell)' (lib/i18n.ts EX_PAREN), sub = sprzęt 'hantle' → 'dumbbells'
#   "Bent Over Row \(Dumbbell\), dumbbells" ← jak wyżej dla 'Bent Over Row (hantle)'
#   "Bench Press \(Dumbbell\)"    ← nazwa ćwiczenia w wierszu pozycji edytora szablonu (Txt w app/template/[id].tsx)
#   "Save template" / "Edit template" ← 'Zapisz szablon' (nagłówek edycji, components/DraftHeader.tsx) / 'Edytuj szablon' (podgląd szablonu)
#   "Back"                        ← 'Wróć' (headerBackTitle w app/_layout.tsx; w podglądzie szablonu — po zapisie)
#   "Start: Upper A"              ← 'Start: {name}' (accessibilityLabel przycisku Start na ekranie głównym)
appId: pl.lukasz.trening
---
- scrollUntilVisible: { element: "\\+ New template", direction: DOWN, timeout: 60000 }
# (E2E 88) pusty stan „No templates yet…” nie jest pokazywany przy „First steps” (UX-12 A) — bez asercji tutaj; pusty stan: tests/audit-0.10-ui.test.tsx
- tapOn: "\\+ New template"
- extendedWaitUntil: { visible: "\\+ Add exercise", timeout: 30000 }
# Pole „Name” ma wartość „New template” (zaznacza się całe przy fokusie)
- tapOn: { text: "New template", below: "Name" }   # E2E 89: tytuł nagłówka edycji nowego szablonu to też „New template” — pole pod etykietą „Name”
- eraseText: 30
- inputText: "Upper A"
# 05.10.2026: szablon jak trening (wiersze serii) — ekran wyższy; otwarta klawiatura zasłaniała „+ Add exercise” (przebieg 37323737583:
# tap trafił w klawisz „t” — nazwa „Upper At”). Enter zatwierdza nazwę i chowa klawiaturę.
- pressKey: Enter
# --- ćwiczenie 1 ---
- tapOn: "\\+ Add exercise"
- extendedWaitUntil: { visible: "Search exercises…", timeout: 30000 }
- tapOn: "Search exercises…"
- inputText: "Bench Press"
- tapOn: { text: "Continue", optional: true }
- tapOn: "Bench Press \\(Dumbbell\\), dumbbells"
- extendedWaitUntil: { visible: "Bench Press \\(Dumbbell\\)", timeout: 30000 }
# --- ćwiczenie 2 ---
- scrollUntilVisible: { element: "\\+ Add exercise", direction: DOWN, timeout: 60000 }
- tapOn: "\\+ Add exercise"
- extendedWaitUntil: { visible: "Search exercises…", timeout: 30000 }
- tapOn: "Search exercises…"
- inputText: "Bent Over Row"
- tapOn: { text: "Continue", optional: true }
- tapOn: "Bent Over Row \\(Dumbbell\\), dumbbells"
- extendedWaitUntil: { visible: "Bent Over Row \\(Dumbbell\\)", timeout: 30000 }
- takeScreenshot: 00-szablon-testowy
# --- edycja na żądanie (08.10.2026): „+ New template” otwiera edycję — zapis „Save template”, potem podgląd z „Edit template” ---
- tapOn: "Save template"
- extendedWaitUntil: { visible: "Edit template", timeout: 30000 }
# --- powrót na ekran główny ---
- tapOn: "Back"
- extendedWaitUntil: { visible: "Other workout", timeout: 30000 }
# run 37973427584 (249e373): karta „Dziś” wyższa (znaczniki dni, „Zrobione dziś”) — lista szablonów pod ekranem; przewinięcie do wiersza szablonu
- scrollUntilVisible: { element: "Start: Upper A", direction: DOWN, timeout: 30000, centerElement: true }
