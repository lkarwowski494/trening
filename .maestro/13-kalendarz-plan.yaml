# Kalendarz z planem tygodnia (decyzje właściciela 08.10.2026: 1A zakładka Kalendarz, 2A plan tygodnia + dwa tryby przesuwania).
# Logika i wszystkie przypadki: tests/plan-calendar.test.ts, tests/plan-calendar-ui.test.tsx. Tu: prawdziwe stuknięcia na symulatorze.
#
# Literały (EN z lib/i18n.en.ts):
#   "Calendar, tab.*"               ← 'Kalendarz' + etykieta zakładki
#   "Weekly plan"                   ← 'Plan tygodnia' (przycisk w Kalendarzu i tytuł ekranu)
#   "Monday, Rest" … "Sunday, Rest" ← app/plan.tsx: wiersz dnia '{dzień tygodnia}, {szablon albo Wolne}' (audyt 0.10 UX-15 A: 7 wierszy zamiast chipów)
#   "Monday: Upper A" … "Sunday: Upper A" ← app/plan.tsx: '{dzień tygodnia}: {szablon}' (chip w rozwiniętym wierszu)
#   "+ New plan", "This plan is not active yet.*", "Make active: New plan", "Set", "My plan \\(.*" ← app/plan.tsx, lib/plan.ts:
#        '+ Nowy plan', 'Ten plan jeszcze nie obowiązuje…', 'Ustaw jako aktywny: {name}', 'Ustaw', 'Mój plan ({date})' (audyt 0.10 B2 A: nowy plan edytowany
#        przed aktywacją; plan bez nazwy po wyłączeniu dostaje datę)
#   ".*, planned: Upper A"          ← components/HistoryCalendar.tsx: '{data}[, dziś], zaplanowany: {name}' (dziś i dalej)
#   "Planned: Upper A", "Rest · plan changed" ← 'Zaplanowany: {name}', 'Wolne' + ' · ' + 'zmiana planu'
#   "Move or skip", "Apply: Move plan by 1 day", "Days changed: .*" ← components/DayPanel.tsx: 'Przesuń albo pomiń', 'Zastosuj: {title}',
#        'Przesuń plan o 1 dzień', 'Zmienione dni: {n}' (audyt 0.10 UX-13 A: jedna lista przesunięć zamiast „Propozycji” i osobnych przycisków)
#   "More options", "Restore from plan" ← 'Więcej opcji', 'Przywróć z planu'
#   "Not now"                       ← 'Nie teraz' (okno zgody na przypomnienie, lib/planReminder.ts askReminderPermission)
#   "Today: Upper A", "Start planned workout: Upper A" ← components/TodayPlan.tsx
#   "What's new", "In this version", "Close"   ← components/WhatsNew.tsx: 'Co nowego' (etykieta „i”), 'W tej wersji', 'Zamknij' (08.10.2026)
appId: pl.lukasz.trening
name: Kalendarz z planem tygodnia
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil: { visible: "Start from a template", timeout: 60000 }
- runFlow: subflows/szablon-testowy.yaml
# --- Plan tygodnia: Upper A każdego dnia (dzień symulatora nieznany — dziś zawsze zaplanowany); wiersz dnia → wybór szablonu ---
- tapOn: "Calendar, tab.*"
- extendedWaitUntil: { visible: "Weekly plan", timeout: 30000 }
- tapOn: "Weekly plan"
- extendedWaitUntil: { visible: "Monday, Rest", timeout: 30000 }
- tapOn: "Monday, Rest"
- tapOn: "Monday: Upper A"
# E2E 91 (audyt 0.10 I1): pierwszy dzień w planie → okno „Reminder for planned workouts” (zgoda na powiadomienia jeszcze nieustalona —
# `permissions: all: allow` nie obejmuje powiadomień na symulatorze); zasłaniało wiersze dni. „Not now” — bez systemowego pytania iOS.
# run 37973427584 (249e373): od X-11 okno zgody pokazuje PlanReminderSync po zmianie stanu planu — chwilę po wyborze dnia; krótkie czekanie
- extendedWaitUntil: { visible: "Not now", timeout: 8000, optional: true }
- tapOn: { text: "Not now", optional: true }
- tapOn: "Tuesday, Rest"
- tapOn: "Tuesday: Upper A"
- tapOn: "Wednesday, Rest"
- tapOn: "Wednesday: Upper A"
- scrollUntilVisible: { element: "Sunday, Rest", direction: DOWN, timeout: 30000, centerElement: true }
- tapOn: "Thursday, Rest"
- tapOn: "Thursday: Upper A"
- tapOn: "Friday, Rest"
- tapOn: "Friday: Upper A"
- tapOn: "Saturday, Rest"
- tapOn: "Saturday: Upper A"
- scrollUntilVisible: { element: "Sunday, Rest", direction: DOWN, timeout: 30000, centerElement: true }
- tapOn: "Sunday, Rest"
- tapOn: "Sunday: Upper A"
- takeScreenshot: 60-plan-tygodnia
# --- Kilka planów (audyt 0.10 B2 A): „+ New plan” — osobny wpis edytowany przed aktywacją (te same dni — reszta scenariusza bez zmian) ---
- scrollUntilVisible: { element: "\\+ New plan", direction: UP, timeout: 30000, centerElement: true }
- tapOn: "\\+ New plan"
- extendedWaitUntil: { visible: "This plan is not active yet.*", timeout: 15000 }
- tapOn: "Make active: New plan"
- extendedWaitUntil: { visible: "Set", timeout: 15000 }
- takeScreenshot: 60a-inne-plany
- tapOn: "Set"
- extendedWaitUntil: { visible: "My plan \\(.*", timeout: 15000 }  # plan bez nazwy po wyłączeniu: „Mój plan (<data>)” (UX2-10) (wiersz „tytuł, dni” — regex obejmuje całość, tests/plans-multi-ui)
- tapOn: "Back"
# --- Kalendarz: dziś zaplanowany; „Move or skip” → przesunięcie planu o 1 dzień i powrót („More options” → „Restore from plan”) ---
- extendedWaitUntil: { visible: ".*, planned: Upper A", timeout: 30000 }
- tapOn: { text: ".*, planned: Upper A", index: 0 }
- extendedWaitUntil: { visible: "Planned: Upper A", timeout: 15000 }
- takeScreenshot: 61-panel-dnia
- tapOn: "Move or skip"
- extendedWaitUntil: { visible: "Days changed: .*", timeout: 15000 }
- takeScreenshot: 64-propozycje
- tapOn: "Apply: Move plan by 1 day"
- extendedWaitUntil: { visible: "Rest · plan changed", timeout: 15000 }
- tapOn: "More options"
- tapOn: "Restore from plan"
- extendedWaitUntil: { visible: "Planned: Upper A", timeout: 15000 }
# --- Ekran treningu: „Today: Upper A” i start ---
- tapOn: "Workout, tab.*"
- extendedWaitUntil: { visible: "Today: Upper A", timeout: 30000 }
- takeScreenshot: 63-dzis
# --- „i” — Co nowego (nowa instalacja: bez kropki) ---
# E2E 105 (run 38014484054): ekran Trening został przewinięty w podscenariuszu (do „Start: Upper A”) i zakładka trzyma przewinięcie — „i” leżało
# pod paskiem stanu (hierarchia: y 27–59 przy stuknięciu, 81–113 po nim), Maestro stuknął w pasek stanu, iOS przewinął listę do góry, panel się nie
# otworzył. Najpierw przesunięcie palcem w dół (lista do góry), potem „i”. Test: tests/maestro-e2e105.test.tsx
- swipe: { start: "50%, 30%", end: "50%, 80%", duration: 400 }
- waitForAnimationToEnd
- tapOn: { id: "whats-new-i" }  # przycisk po testID (etykieta z kropką „nowe zmiany” byłaby inna)
- extendedWaitUntil: { visible: "In this version|Test build [0-9]+ · .*", timeout: 15000 }  # bieżący wpis: niewydany albo z numerem buildu (wydanie 0.11, build 1005)
- takeScreenshot: 65-co-nowego
# run 37900617167 (f2bdca8): rozwinięta sekcja (lista zmian dla nowej osoby) spycha „Close” pod pasek zakładek — stuknięcie trafiło w zakładkę
# „Exercises” (zrzut kroku 85). Przewinięcie z wyśrodkowaniem przed stuknięciem; po zwinięciu sekcji powrót w górę do karty dnia.
- scrollUntilVisible: { element: "Close", direction: DOWN, timeout: 30000, centerElement: true }
- tapOn: "Close"
- assertNotVisible: "In this version|Test build [0-9]+ · .*"
- scrollUntilVisible: { element: "Start planned workout: Upper A", direction: UP, timeout: 30000, centerElement: true }
- tapOn: "Start planned workout: Upper A"
- extendedWaitUntil: { visible: "Set 1 done.*", timeout: 30000 }
