<title>Baza wiedzy funkcji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Układ: pasek filtrów → macierz (pierwsza kolumna przyklejona) → panel szczegółów wybranej funkcji. Akcent = bursztyn z aplikacji Trening. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --fg:#1d2126; --muted:#5f6670; --line:#dcdfe0; --accent:#b97c0e; --accent-soft:#f6e6c4;
  --yes:#2f7d4f; --yes-bg:#e1f1e6; --paid:#6b55b5; --paid-bg:#ece7f8; --part:#9a6a00; --part-bg:#fbf0d6; --no:#a33a33; --no-bg:#f7e2df; --unk:#7b818a; --unk-bg:#eceef0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171b; --panel:#1c2026; --fg:#e7e9ec; --muted:#9aa1ab; --line:#2c3139; --accent:#f2b441; --accent-soft:#3a2f17;
  --yes:#7fd19b; --yes-bg:#1d3326; --paid:#b9a6f2; --paid-bg:#2a2540; --part:#f2c25a; --part-bg:#3a3017; --no:#f0928a; --no-bg:#3d2220; --unk:#a3a9b2; --unk-bg:#272b31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --panel:#1c2026; --fg:#e7e9ec; --muted:#9aa1ab; --line:#2c3139; --accent:#f2b441; --accent-soft:#3a2f17;
  --yes:#7fd19b; --yes-bg:#1d3326; --paid:#b9a6f2; --paid-bg:#2a2540; --part:#f2c25a; --part-bg:#3a3017; --no:#f0928a; --no-bg:#3d2220; --unk:#a3a9b2; --unk-bg:#272b31; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 2.1rem/1.05 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font:700 1.35rem/1.1 var(--f-display);margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.s{display:inline-grid;place-items:center;min-width:26px;height:24px;border-radius:6px;font:500 13px/1 var(--f-mono)}
.s-yes{color:var(--yes);background:var(--yes-bg)} .s-paid{color:var(--paid);background:var(--paid-bg)} .s-partial{color:var(--part);background:var(--part-bg)}
.s-no{color:var(--no);background:var(--no-bg)} .s-unknown{color:var(--unk);background:var(--unk-bg)} .s-none{color:var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:600 15px var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls input[type=search],.controls select{font:15px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.controls input[type=search]{flex:1 1 220px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.count{font:500 13px var(--f-mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1100px){.grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.tbl{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--panel);z-index:2;font:600 12px var(--f-body);color:var(--muted);vertical-align:bottom}
thead th.app{writing-mode:vertical-rl;transform:rotate(180deg);height:118px;text-align:left;padding:8px 4px}
th.us,td.us{background:var(--accent-soft)}
td.f,th.f{position:sticky;left:0;background:var(--panel);text-align:left;z-index:1;white-space:normal;min-width:190px;max-width:260px}
thead th.f{z-index:3}
td.f .area{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font:500 12px var(--f-mono);color:var(--muted)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,var(--panel))}
tbody tr.sel td{background:var(--accent-soft)}
tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;align-self:start}
@media (min-width:1100px){.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto}}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding-top:10px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.item .app{font-weight:600}
.item p{margin:0;grid-column:2;color:var(--fg)}
.item .fb{color:var(--muted);font-size:14px}
.item .src{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.item .src a{color:var(--accent);word-break:break-all}
.muted{color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{font:700 1.2rem var(--f-display);margin:0}
.card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:14px}
.card dt{color:var(--muted)} .card dd{margin:0}
.note{font-size:13px;color:var(--muted);max-width:90ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">

    <h1>Baza wiedzy funkcji</h1>

    </div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </section>

  <section id="view-a" hidden><div class="apps" id="apps"></div></section>
</div>

s found in the docs; weight can be left empty and typed at completion.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/timed-sets", "https://www.liftosaur.com/features/liftoscript"]}, {"has": "yes", "how": "Each exercise defines its variables at creation (strength exercises must include weight; reps, time and distance variants exist; cardio tracks distance/pace). Data can only be moved between exercises with the same variables.", "fb": "", "src": ["https://help.strengthlog.com/help-article/adding-a-new-exercise/", "https://help.strengthlog.com/help-article/how-do-i-change-delete-an-exercise/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "yes", "how": "Strength sets log weight x reps; cardio exercises support a duration per set, and since v17.0.8 (May 2026) interval timers let you set a target time per set and see logged times alongside weight and reps. Distance-type metrics are implied (feet/meter unit conversion fix in v17.0.15) but not documented.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/meet-jefits-all-new-unified-workout-editing-screen", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "yes", "how": "Sets log weight x reps (+ optional RPE/RIR); timed exercises can be programmed in minutes/seconds; AMRAP sets supported in programs. Distance metrics not documented (app is strength-focused, little cardio).", "fb": "App Store review: desktop creator can't switch an exercise's duration from minutes to seconds (mobile only).", "src": ["https://www.boostcamp.app/workout-tracker", "https://www.boostcamp.app/custom-program", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://www.garagegymreviews.com/boostcamp-review"]}, {"has": "yes", "how": "Each exercise in a routine has sets, reps, weight and rest; any exercise can be switched to time-based via the 'HIIT (Duration Based Exercise)' toggle. Per-set different reps/weight are added via Edit > 'Add New Set'. Heart rate, calories and distance come from the HealthKit workout session, not per-set fields.", "fb": "", "src": ["https://help.smartgymapp.com/article/75-exercise-time-based", "https://help.smartgymapp.com/article/112-add-multiple-sets-with-different-reps-and-weight", "https://smartgymapp.com/features.html"]}, {"has": "yes", "how": "Track tab: per set reps OR time plus weight (exercise type rep- or time-based). Dumbbell = weight of one dumbbell, barbell = total incl. bar. Field order Weight-before-Reps configurable (default for new users since 5.4). Cardio is a separate activity type (time, distance, calories, pace).", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001220076-how-do-i-log-dumbbell-weights-", "https://feedback.caliberstrong.com/announcements/caliber-540-custom-keyboard-automatic-rest-timer-default-exercise-settings-sundaymonday-start-date-g", "https://feedback.caliberstrong.com/announcements/caliber-330-new-cardio-activities-cardio-notes-activity-ui-enhancements"]}]}, {"id": "log_set_types", "area": "log", "areaPL": "Logowanie treningu", "label": "Typy serii (rozgrzewka, drop, do upadku)", "others": 8.0, "cells": [{"has": "yes", "how": "Tap the set number to open an ActionSheet with Normal / Warm-up (W) / Drop set (D) / To failure (F) and a set note. Warm-ups are excluded from volume, records and 'Previously' numbering and can have their own rest. A drop set gets no rest before it and is excluded from e1RM and max reps. 'Failure' is not copied to the next set or into 'Repeat last'.", "fb": "", "src": ["lib/seed.ts:SET_KINDS", "components/ActiveWorkout.tsx:setMenu", "lib/store.ts:addSet", "lib/store.ts:restAfter", "lib/stats.ts:e1rmR"]}, {"has": "yes", "how": "Tap the set number to open the Set Tag menu: Warm-up, Drop Set, Failure (tap again to untag). Warm-up sets are excluded from charts/metrics. 'Failure' means one additional rep was attempted and failed (5 reps + Failure = 6th rep failed; 0 reps + Failure = failed 1RM attempt).", "fb": "", "src": ["https://help.strongapp.io/article/166-set-tags"]}, {"has": "yes", "how": "Tap the set number: W-Warm-up, Normal, F-Failure, D-Dropset. Rest timer does not start if the next set is a drop set. Failure = log the last completed rep (0 reps not allowed). Setting 'Warm-up Sets' toggles whether warm-ups count in stats (total sets, volume, PRs) and recalculates history.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34896293707927-Set-Types-in-Hevy-Explained-Drop-Sets-Warm-Up-Sets-and-More", "https://help.hevyapp.com/hc/en-us/articles/34953606698903-Build-a-Workout-Program-Create-Organize-Routines", "https://www.hevyapp.com/features/workout-settings/", "https://api.hevyapp.com/docs/"]}, {"has": "partial", "how": "Explicit set types are limited: optional auto-generated warm-up sets (toggle in My Plan; 'Add Warm-Up Set' from More menu), AMRAP sets marked '+ reps' on Max Effort Days, and timed-interval sets. No documented drop-set or failure-set type in the help center.", "fb": "A 2026 third-party review claims 'frictionless logging for supersets, drop sets, AMRAP' but no official doc for drop sets (sensai.fit).", "src": ["https://help.fitbod.me/hc/en-us/articles/360006337634-Warm-Up-Sets", "https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/360033675553-Max-Effort-Day", "https://help.fitbod.me/hc/en-us/articles/360041831493-Timed-Intervals"]}, {"has": "partial", "how": "Working sets, dropsets (app calculates drop weight from last working set; generator can add them), supersets, and warm-up sets from the Pro warm-up calculator - warm-ups aren't logged as sets but can be copied into notes with one tap. No documented failure/AMRAP set type.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator"]}, {"has": "partial", "how": "Warm-up sets (auto-generated or 'warmup:' section), working sets, AMRAP ('5+'), ask-RPE ('@8+'), ask-weight ('100lb+' / '?+'), set labels like '(Main)', timed/count-up sets and EMOM/Tabata via 'auto'. No dedicated drop-set or failure tag; drop sets must be written as extra set groups.", "fb": "", "src": ["https://www.liftosaur.com/features/set-types", "https://www.liftosaur.com/features/timed-sets", "https://www.liftosaur.com/features/liftoscript"]}, {"has": "yes", "how": "Warm-up vs working set (long-press set number to toggle), drop sets with '+ New drop', 'Max reps' and 'Fail' flags (fail counts to volume but not records); special sets: superset, circuit, complex, EMOM, Tabata, AMRAP.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/", "https://help.strengthlog.com/help-article/drop-sets/", "https://help.strengthlog.com/help-article/mark-sets-as-fails-or-max-reps/", "https://help.strengthlog.com/help-article/special-sets/"]}, {"has": "yes", "how": "Since Apr 2025 every set can be tagged Warm-up, Working, Drop or Failure, both in the routine editor and while logging (tap set, pick type, Log); set types also show on the Apple Watch since Oct 2025. Load progression filters warm-ups out of strength estimates.", "fb": "", "src": ["https://www.jefit.com/blog/set-types-new-in-jefit-customize-your-workouts-with-set-types", "https://www.jefit.com/blog/newtrack-heart-rate-calories-in-real-time-with-jefit-apple-watch", "https://www.jefit.com/blog/the-science-behind-jefits-load-progression-engine", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "yes", "how": "Tap the set number to mark it Work, Warm-up, Drop or Failure set; drop sets can be added to any working set.", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.boostcamp.app/workout-tracker"]}, {"has": "yes", "how": "Sets can be typed as regular, warm-up or drop sets (set types added in SmartGym 6, set-type editing on Watch in v7). Since 7.11 (Jul 2026) the set type can be changed directly from the custom in-app keyboard. No evidence of a dedicated failure-set type.", "fb": "Older aggregated App Store reviews listed 'no drop sets' as missing (pre-dates set types) - https://justuseapp.com/en/app/922744883/smartgym-gym-home-workouts/reviews", "src": ["https://9to5mac.com/2022/05/05/smartgym-for-ios-watchos-mac-major-update/", "https://alternativeto.net/news/2023/6/smartgym-7-has-been-released-with-new-exercises-progress-tracking-and-enhanced-apple-watch-app", "https://9to5mac.com/2026/07/23/smartgym-update-makes-it-easier-to-manually-adjust-and-log-exercises-on-the-go/", "https://smartgymapp.com/releases/smartgym-7-11"]}, {"has": "partial", "how": "Only 'smart warm-up' sets, generated per exercise from the target weight (added/removed in exercise edit). Logging drop sets and tagging own sets as warm-up are open requests ('Under Consideration', 248 and 161 votes). No failure tag.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-3119-adjustable-warm-up-targets-expanded-emoji-reactions-exercise-videos-while-offline", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/logging-dropsets", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/mark-sets-as-warmups"]}]}, {"id": "log_rpe_rir", "area": "log", "areaPL": "Logowanie treningu", "label": "RPE/RIR", "others": 7.5, "cells": [{"has": "yes", "how": "An optional RPE column, off by default, is turned on in Settings ('RPE / RIR przy serii'). It is one numeric field per set, 0–10 in 0.1 steps. It does not affect volume or records. It is shown in history and exported to the CSV RPE column. There is no separate RIR field; the same field is labelled RPE/RIR.", "fb": "", "src": ["lib/seed.ts:Settings.showRpe", "components/ActiveWorkout.tsx:ExerciseBlock", "app/more/settings.tsx", "lib/backup.ts:buildCsv"]}, {"has": "yes", "how": "RPE logged per set on a 6–10 scale with half steps; select the Reps cell and tap the RPE button on the custom keyboard (tap again to clear). No separate RIR field — help center gives an RPE→RIR mapping table (e.g. RPE 8 = 2 RIR, 9.5 = 0-1). RPE also editable on Apple Watch set screen.", "fb": "Android Premium user (May 2026) asked for built-in RIR, goal sets/reps, rest, tempo, body-side and equipment fields per exercise (GP review).", "src": ["https://help.strongapp.io/article/230-about-rpe", "https://help.strongapp.io/article/224-workout-on-apple-watch"]}, {"has": "yes", "how": "Enable Settings > Workouts > RPE Tracking → extra RPE column on rep-based exercises; pick 6, 7, 7.5, 8, 8.5, 9, 9.5, 10 with RIR descriptions; can leave blank. No separate RIR mode. Previous column then shows e.g. '50lbs x 10 @ 8.5'. Aug 2026 set-row redesign added an RPE colour scale. Not available while building routines.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35687721776663-How-to-Use-RPE-Rate-of-Perceived-Exertion", "https://help.hevyapp.com/hc/en-us/articles/34490600233111-RPE-vs-RIR-What-They-Mean-and-How-to-Use-Them-in-Hevy", "https://api.hevyapp.com/docs/", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350", "https://www.hevyapp.com/features/exercise-programming-options/"]}, {"has": "yes", "how": "Reps in Reserve (formerly Exertion Rating/RPE) prompt after an exercise: 0, 1, 2, 3, 4+ RiR. For supersets/circuits prompt appears after all sets; can be logged manually via More menu and edited later in the log. Not for timed/distance exercises. Feeds the recommendation algorithm (consistently high RiR -> heavier).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360033133174-Reps-in-Reserve-RiR-Formerly-Exertion-Rating-RPE", "https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight", "https://help.fitbod.me/hc/en-us/articles/30721437384215-How-to-Navigate-the-Exercise-Details-Screen"]}, {"has": "paid", "how": "RIR (not RPE) is a Pro feature, toggled per plan or workout; half values allowed (e.g. 1.5). Once enabled, RIR must be entered for every set. Plans can carry RIR targets that recommendations aim for; without tracking the algorithm infers RIR.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations"]}, {"has": "yes", "how": "RPE is native: '@8' sets a target RPE, '@8+' asks for completed RPE (0-10, step 0.5) after the set; RPE with no weight auto-derives weight from 1RM+reps+RPE. RIR is not a native field (can be emulated with a user-prompted state variable).", "fb": "", "src": ["https://www.liftosaur.com/features/set-types", "https://www.liftosaur.com/features/liftoscript"]}, {"has": "paid", "how": "Premium: toggle RPE or RiR per set or permanently per exercise; RPE calculator (premium) suggests weights for target reps/RPE from your last set; RPE/RIR also usable when building programs.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-activate-rpe-rir-in-your-workouts/", "https://help.strengthlog.com/help-article/rpe-calculator/", "https://help.strengthlog.com/help-article/strengthlog-premium/"]}, {"has": "no", "how": "JEFIT's own July 2026 comparison table lists 'RPE/RIR capture: No' for Jefit ('The gap: no RPE/RIR field'); effort is instead inferred by the engine from rep patterns/drop-off.", "fb": "App Store review 'Minimal planning features': user complains they cannot enter an RPE or a %1RM in plans (App Store).", "src": ["https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared", "https://www.jefit.com/blog/the-science-behind-jefits-load-progression-engine"]}, {"has": "yes", "how": "Every set has optional RPE (5-10) and RIR fields, free; stored for fatigue trends across a block and RPE-based programs.", "fb": "", "src": ["https://www.boostcamp.app/features", "https://www.boostcamp.app/workout-tracker", "https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared"]}, {"has": "partial", "how": "No per-set RPE/RIR field found. Since 7.9 (Mar 2026) the user rates whole-workout 'Workout Effort' after each session (breathing-synchronized animation), which feeds a training-load picture.", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-9", "https://smartgymapp.com/features.html"]}, {"has": "no", "how": "No per-set RPE: 'RPE for sets' is on the board as Planned (182 votes). Only a post-workout rating slider + note per workout.", "fb": "", "src": ["https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/rpe-for-sets", "https://feedback.caliberstrong.com/announcements/caliber-420-workout-overview-screen-updates", "https://feedback.caliberstrong.com/announcements/caliber-5120-realtime-prs-new-workout-summary-screen-various-bug-fixes"]}]}, {"id": "log_previous_values", "area": "log", "areaPL": "Logowanie treningu", "label": "Wartości z poprzedniego razu", "others": 9.5, "cells": [{"has": "yes", "how": "A 'Previously' column shows the matching working set from the last finished workout containing that exercise. It matches within set family (normal/failure ↔ normal, drop ↔ drop); warm-ups get none and don't shift numbering. Sessions with only drop sets are skipped. When an exercise appears several times in a template, it matches by template item id or block index. On narrow screens the column moves under the row.", "fb": "", "src": ["lib/store.ts:previousBlockFor", "lib/store.ts:hintFor", "lib/store.ts:prevCache", "components/ActiveWorkout.tsx:rowLayout"]}, {"has": "yes", "how": "During a workout each set shows the previous performance for that exercise (last time it was performed); the Apple Watch app also shows previous performance for the current set. Focus Metric compares today's metric to the last time the exercise was performed. No documented option to restrict 'previous' to the same template.", "fb": "", "src": ["https://www.thenerdystudent.com/2021/08/strong-review/", "https://help.strongapp.io/article/226-focus-metric"]}, {"has": "yes", "how": "PREVIOUS column on the left of each set. Setting 'Previous Workout Values': 'Any workout' (last time the exercise was done anywhere) or 'Same routine' (last time within this routine).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/36011896355479-How-to-Use-Previous-Workout-Values-to-Improve-Performance-in-Hevy", "https://help.hevyapp.com/hc/en-us/articles/34105442929943-Previous-Workout-Values-Vs-Routine-Values-How-to-Adjust-in-Settings"]}, {"has": "partial", "how": "Exercise Details screen gives 'quick access to your past workout data' (History tab with Results/Trends; notes per past session). Recommended sets are AI-generated rather than a literal copy of last session; no documented inline 'previous' column like Strong.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/30721437384215-How-to-Navigate-the-Exercise-Details-Screen", "https://help.fitbod.me/hc/en-us/articles/21486783720087-Exercise-Notes", "https://help.fitbod.me/hc/en-us/articles/12732749777047-Fitbod-Metrics-Records"]}, {"has": "yes", "how": "Previous sets and notes stay visible in the logger. 'Reference workout' setting (Settings > Training): 'Same plan day' (default; previous performance of that exercise on the same plan day, fallback to most recent) or 'Last workout' (most recent regardless of plan).", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations"]}, {"has": "yes", "how": "The expanded set shows 'Last', 'Best' and (multi-week programs) 'Same day' results with dates; AMRAP sets show 'Best AMRAP'. 'Add Set' copies the last set or the last set of the previous workout; the target column can be cycled to 'Previous Set'.", "fb": "App Store 2024-04 (3*): it 'pulls my reps and weight from a different day' when the same exercise has different targets on different days. https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/workout-screen"]}, {"has": "yes", "how": "App shows previous performance per exercise; swipe exercise > History lists all past sessions (with set comments) and lets you copy a block in (replace or add). Premium 'quick stats' per set show rep-PR at that weight and average reps.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/", "https://help.strengthlog.com/help-article/retrieve-from-training-log/", "https://www.strengthlog.com/strengthlog-bodybuilding-app/"]}, {"has": "yes", "how": "Logging screen pre-fills the last logged weight/reps for the exercise ('remember weights you lifted last time'); exercise history and charts were merged into one page in 2026 (tap a chart point to see that day's logs).", "fb": "", "src": ["https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://play.google.com/store/apps/details?id=je.fit"]}, {"has": "yes", "how": "Logging screen shows a 'previous' column with last session's (previous week's, in programs) sets, reps and weight; exercise detail shows past performance and PRs.", "fb": "App Store reviews: previous weights sometimes missing (e.g. OHP in Candito program); wish it saved rep counts too.", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.garagegymreviews.com/boostcamp-review", "https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared"]}, {"has": "yes", "how": "During a workout a 'Vs Previous' button lets you pick a metric and compare the current exercise with the last time you did it, updating in real time as sets are logged (7.4). Inline Logging (7.11) shows a badge with the planned (routine) value in each field.", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-4", "https://smartgymapp.com/releases/smartgym-7-11", "https://smartgymapp.com/features.html"]}, {"has": "yes", "how": "Under each set field the last logged value from the most recent session of that exercise is shown (e.g. 'Last: 95 lbs'); exercise History tab (also on the warm-up screen) shows past sessions and PR dates.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-3119-adjustable-warm-up-targets-expanded-emoji-reactions-exercise-videos-while-offline", "https://feedback.caliberstrong.com/announcements/caliber-5122-reset-exercise-prs-see-their-dates"]}]}, {"id": "log_autofill", "area": "log", "areaPL": "Logowanie treningu", "label": "Automatyczne wypełnianie", "others": 9.0, "cells": [{"has": "yes", "how": "Starting from a template pre-fills each set from the previous session's working sets, falling back to the template start weight. Time targets come from the template, never from the old result. Ticking an empty set fills its empty fields from the visible 'Previously' hint, or reps from the template's rep-range minimum. Manually typed fields copy to the next unticked set of the same family; time does not. Un-ticking clears only the values that were auto-filled.", "fb": "", "src": ["lib/store.ts:startFromTemplate", "lib/store.ts:fillFromHints", "lib/store.ts:toggleDone"]}, {"has": "partial", "how": "Templates carry their own weights/reps; after a template-based workout the 'Update Values Only' / 'Update Template and Values' prompt writes the weights and reps you used back into the template, so the next session starts from last values. No documented auto-fill of a blank set from history beyond the 'previous' display.", "fb": "", "src": ["https://help.strongapp.io/article/177-update-template"]}, {"has": "yes", "how": "Adding an exercise you've done before pre-fills number of sets, weight and reps; routine weight/reps values auto-update after each workout unless 'Update Routine Values' is toggled off on the Save screen; exercises with a Rep Range don't update. Routine structure changes (reorder/add/remove) trigger an 'Update Routine' vs 'Keep Original Routine' prompt.", "fb": "", "src": ["https://www.hevyapp.com/features/exercise-programming-options/", "https://help.hevyapp.com/hc/en-us/articles/34105442929943-Previous-Workout-Values-Vs-Routine-Values-How-to-Adjust-in-Settings", "https://help.hevyapp.com/hc/en-us/articles/38387296276375-Update-Routine-vs-Keep-Original-Routine"]}, {"has": "yes", "how": "Every generated workout pre-fills sets, reps and weight from the algorithm (history + mStrength variation). Saved workouts can be loaded with 'Maintain sets, reps, and weight', 'Generate new sets, reps, and weight' or 'Generate new weight only' (varied rep schemes get standardized).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight", "https://help.fitbod.me/hc/en-us/articles/6259258835863-Save-a-Workout"]}, {"has": "yes", "how": "Editable weight/reps fields are pre-filled with values from the reference workout; Pro recommendation shown separately as a blue bubble under the same set.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations"]}, {"has": "yes", "how": "Targets come from the program text after progression scripts ran; % of 1RM and RPE targets are resolved to concrete weights and rounded to your loadable plates. Swapped-in exercises get weights converted from your history at the closest rep count/RPE, or from 1RM/default starting weight.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/changing-a-workout"]}, {"has": "yes", "how": "'Copy sets from last workout' checkbox when adding an exercise; templates/programs can use 'Retrieve from log' (finds last set with the same rep count, or a heavier one with more reps; warm-ups match warm-ups); 'Train again' clones a whole past workout (premium: bulk +/- weight/reps).", "fb": "", "src": ["https://help.strengthlog.com/help-article/copy-sets-from-last-workout/", "https://help.strengthlog.com/help-article/retrieve-from-training-log/", "https://help.strengthlog.com/help-article/train-again/"]}, {"has": "yes", "how": "Sets are pre-filled from the last log, or from plan targets; with Elite Load Progression / Periodization the next session's weight and rep targets are written automatically and rounded to the user's own equipment.", "fb": "", "src": ["https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared", "https://www.jefit.com/blog/periodization-on-your-own-plan", "https://www.jefit.com/blog/the-science-behind-jefits-load-progression-engine"]}, {"has": "yes", "how": "Tap the previous column to copy weight/reps into today's set; program auto-progression pre-loads next session's weights (bumps after hitting reps, adjusts down after misses).", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.boostcamp.app/workout-tracker"]}, {"has": "yes", "how": "Model is 'always a base routine': planned sets/reps/weight come from the routine (own, pre-made or Smart Trainer) and a single tap on the set number logs the planned values. 'Log Different Sets' logs deviating values to history without overwriting the routine; editing the exercise overwrites it for future sessions.", "fb": "Users complain that recording actual reps/weight different from plan is clunky ('no ability to record actual weight and actual rep count ... without changing for that set') - https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json", "src": ["https://help.smartgymapp.com/article/106-log-exercises", "https://help.smartgymapp.com/article/60-log-different-sets"]}, {"has": "partial", "how": "Fields are not pre-filled automatically; tapping the 'Last' text or the custom keyboard's 'Last' button (5.4) copies previous weight/reps/time into the field. Default exercise targets (sets/reps/time/rest) apply to exercises without own targets.", "fb": "'having to constantly edit and add weights instead of it having a baseline button that fills in last workouts numbers' - https://itunes.apple.com/us/rss/customerreviews/page=2/id=1482405410/sortby=mostrecent/json", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-540-custom-keyboard-automatic-rest-timer-default-exercise-settings-sundaymonday-start-date-g"]}]}, {"id": "log_notes", "area": "log", "areaPL": "Logowanie treningu", "label": "Notatki", "others": 9.5, "cells": [{"has": "yes", "how": "There are three note levels. A workout note is a free-text field at the bottom of the active workout (max 1000 chars). A set note is added from the set-number menu (max 300 chars) and shown as • plus text under the set. Exercise 'technical notes' (max 2000 chars) live in the exercise editor but are not shown during the workout. Set and workout notes go to the CSV Notes / Workout Notes columns.", "fb": "", "src": ["components/ActiveWorkout.tsx", "app/exercise/[id].tsx", "lib/backup.ts:buildCsv"]}, {"has": "yes", "how": "Three note types: Workout Notes (top of Log Workout screen, shown in History), Exercise Notes (via exercise ... > Add a Note, per workout) and Pinned/'sticky' notes (pin an exercise note; shown in yellow every time the exercise is performed, not in History). No length limit. No per-set notes documented.", "fb": "Android user: replacing an exercise erases its notes and sticky notes (GP review, May 2026).", "src": ["https://help.strongapp.io/article/134-about-notes"]}, {"has": "yes", "how": "Routine notes per exercise (persist every time the routine is used, can include clickable links, not visible to others) and workout exercise notes (saved with the session, visible to followers; shown greyed out once at the next session). Workout description on the finish screen. Exercise-level persistent notes announced as 'on our radar' (Jul 2026).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34463684392983-How-do-the-exercise-notes-routine-and-workout-notes-work", "https://help.hevyapp.com/hc/en-us/articles/36011779117591-How-to-Use-Exercise-Notes-in-Hevy-for-Better-Workout-Tracking", "https://www.hevyapp.com/community-updates/july-26/"]}, {"has": "partial", "how": "Per-exercise notes (More > Notes) saved per session and viewable later in History > Results; can be attached in saved workouts. No documented workout-level or set-level notes.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/21486783720087-Exercise-Notes", "https://help.fitbod.me/hc/en-us/articles/30721437384215-How-to-Navigate-the-Exercise-Details-Screen"]}, {"has": "yes", "how": "Any number of notes per exercise in a workout. Two kinds: temporary workout notes (shown later as previous-workout info) and pinned exercise notes (shown every time, editable on exercise page); toggle by (un)pinning. Notes aren't included when sharing plans.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Per-workout notes (kebab > Show Workout Notes) and per-exercise workout notes, shown next time as 'Previous Note' for two months; persistent Markdown exercise notes on the exercise screen; Markdown program descriptions per exercise/day/week ('//' lines). No per-set notes found.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/workout-history", "https://www.liftosaur.com/features/liftoscript"]}, {"has": "yes", "how": "Set comments (swipe set), pinned exercise comments shown every time (machine settings/cues), workout-specific exercise comments (v9.0), and a workout comment plus name at save.", "fb": "App Store 2026-09 (1*): after 9.0 it is 'harder to access notes for your workouts'. https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json", "src": ["https://help.strengthlog.com/help-article/adding-set-comments/", "https://help.strengthlog.com/help-article/exercise-comments/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "yes", "how": "Each exercise can be tracked with sets, reps, weight and notes; exercise notes live in the logging screen's three-dots menu; workouts accept notes and progress photos. Notes can also be turned into 140-char 'Audio Cue Tips' read aloud during the exercise (Elite).", "fb": "etechshout (Jan 2026) lists 'adding notes on the calendar' as missing; an older App Store review complained notes/descriptions could not be added to a plan.", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/jefits-new-personal-audio-coach-feature"]}, {"has": "yes", "how": "Workout notes (general) plus exercise-specific notes (Dec 2024); programs carry coach notes per day/week.", "fb": "", "src": ["https://www.boostcamp.app/blogs/new-boostcamp-lifting-app-features-december-2024", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "yes", "how": "Routines have a Notes field; v7 added notes on routines and exercises in History; exercise notes are viewable on Watch via the exercise More button. No evidence of per-set notes.", "fb": "", "src": ["https://help.smartgymapp.com/article/57-create-custom-routine", "https://alternativeto.net/news/2023/6/smartgym-7-has-been-released-with-new-exercises-progress-tracking-and-enhanced-apple-watch-app", "https://help.smartgymapp.com/article/59-apple-watch-app"]}, {"has": "yes", "how": "Exercise notes tab next to Track (enlarged in 5.12), optional workout note + rating at completion (all users since 4.2), custom workout instructions on templates; Premium: cardio notes to coach.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-316-streamlined-rest-timer-stopwatch-revamped-exercise-notes", "https://feedback.caliberstrong.com/announcements/caliber-420-workout-overview-screen-updates", "https://feedback.caliberstrong.com/announcements/caliber-5120-realtime-prs-new-workout-summary-screen-various-bug-fixes", "https://feedback.caliberstrong.com/announcements/caliber-330-new-cardio-activities-cardio-notes-activity-ui-enhancements"]}]}, {"id": "log_supersets", "area": "log", "areaPL": "Logowanie treningu", "label": "Supersety/obwody", "others": 10, "cells": [{"has": "yes", "how": "'⇅ SS' links an exercise with the next one, in the workout or template; '✂' removes it. Groups must be contiguous with 2+ exercises (normalizeGroups) and are labelled SS A, B, C… Groups can have N exercises, so circuits work. The rest timer starts only when the round closes, counted by completed sets rather than tick order. The rest used is that of the group's last exercise.", "fb": "", "src": ["lib/store.ts:linkWithNext", "lib/store.ts:normalizeGroups", "lib/store.ts:restAfter", "lib/store.ts:roundRest"]}, {"has": "yes", "how": "Supersets/circuits group exercises shown with a vertical line; the 'Next' button jumps to the next set in superset order (A1,B1,A2,B2…). iPhone: Add Exercise > multi-select > Superset; Android: ... > Create Superset and link with chain icon. Also available on Apple Watch (exercise ... menu).", "fb": "Strong itself says the superset UX differs between iPhone and Android and will be unified later; reviewers call the UI dated vs Hevy (aitoolsbakery).", "src": ["https://help.strongapp.io/article/98-supersets-and-circuits", "https://help.strongapp.io/article/224-workout-on-apple-watch"]}, {"has": "yes", "how": "Exercise ... > '+ Add To Superset' and pick partner; add more exercises for giant sets/circuits; multiple supersets get different colours. 'Smart Superset Scrolling' auto-scrolls to the next superset exercise on set completion; rest timer on the last exercise defines a circuit round.", "fb": "Watch app reportedly lags during supersets with quick transitions (findyouredge).", "src": ["https://help.hevyapp.com/hc/en-us/articles/35650286563095-The-Complete-Guide-to-Supersets-and-Smart-Superset-Scrolling", "https://help.hevyapp.com/hc/en-us/articles/36954623739415-Circuits-Intervals-and-Supersets-Explained-How-to-Build-Them-in-the-Hevy-App"]}, {"has": "yes", "how": "Supersets (2 exercises) and circuits (3+, unlimited) can be auto-generated (toggle in My Plan) or built manually via '...' > Build superset/circuit, before or during a workout. Group menu: Add Exercises, Log All Exercises, Duplicate, Normalize Weights (iOS only; same weight across group), Reorder Sections, Unbundle. Long-press to drag groups or move exercises in/out.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006427813-Circuits-Supersets", "https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod"]}, {"has": "yes", "how": "Supersets supported in plans and workouts (also usable to shorten sessions); generator output editable to add supersets. No circuits/giant-set terminology documented.", "fb": "Older review: can't modify supersets mid-workout (thefitnesstribe, undated/older).", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator"]}, {"has": "yes", "how": "Any number of exercises share a group name ('superset: A'); after each working set the screen jumps to the next exercise in the group, skipping finished ones; colored line under thumbnails. Groups can be set in program text, editor, or ad hoc during a workout; separate Superset rest timer.", "fb": "", "src": ["https://www.liftosaur.com/features/supersets"]}, {"has": "yes", "how": "'+ Special set' > Superset is exactly two exercises (each marked done individually; can split or reorder); Circuit for 3+ exercises/rounds; Complex for same-weight barbell sequences completed as one set.", "fb": "", "src": ["https://help.strengthlog.com/help-article/special-sets/"]}, {"has": "yes", "how": "Exercises can be grouped into supersets from the three-dots menu on the logging screen and in the routine builder (web planner too). Circuit/giant-set behaviour not documented.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens", "https://www.jefit.com/blog/stay-ahead-with-jefit-online-workout-planner-enhancements"]}, {"has": "yes", "how": "Group exercises into supersets in the workout editor and program creator.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://www.boostcamp.app/custom-program"]}, {"has": "yes", "how": "Superset = enable the superset toggle on every exercise except the last of the group (2+ exercises, i.e. also circuits); optional rest at the end of the round. Since 7.5.4 can be toggled by swiping an exercise row.", "fb": "Reviews: superset flow 'not intuitive and will not automatically revert back to the first exercise'; another: 'Doesn't support circuits' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json", "src": ["https://help.smartgymapp.com/article/74-create-supersets", "https://help.smartgymapp.com/article/65-superset", "https://help.smartgymapp.com/article/57-create-custom-routine"]}, {"has": "paid", "how": "Supersets created/edited in a bottom sheet on the workout screen (5.3); auto rest timer is triggered between superset exercises; keyboard 'Next Set' jumps to next exercise in the superset. Listed as Plus feature on App Store. Substituting inside supersets is 'In Progress'.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-530-exercise-search-screen-revamp-and-more", "https://feedback.caliberstrong.com/announcements/caliber-540-custom-keyboard-automatic-rest-timer-default-exercise-settings-sundaymonday-start-date-g", "https://apps.apple.com/us/app/caliber-strength-training/id1482405410", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/substitute-exercises-in-supersets"]}]}, {"id": "log_reorder", "area": "log", "areaPL": "Logowanie treningu", "label": "Zmiana kolejności w treningu", "others": 8.0, "cells": [{"has": "yes", "how": "'≡ Kolejność' opens a drag-to-reorder screen, available during a workout and in the template editor. You drag by the ≡ handle with haptic feedback and auto-scroll at the edges. A superset moves as one block, and you reorder inside it with its own handles; membership never changes. VoiceOver gets move up/down actions. The template editor also has ↑/↓ buttons.", "fb": "", "src": ["app/reorder.tsx", "components/DragList.tsx", "lib/store.ts:moveBlockOf", "lib/store.ts:moveInGroup"]}, {"has": "yes", "how": "Drag and drop on the exercise name during a workout (phone); on Apple Watch reorder via ... on the Workout Overview screen.", "fb": "", "src": ["https://help.strongapp.io/article/229-my-first-workout", "https://help.strongapp.io/article/224-workout-on-apple-watch"]}, {"has": "yes", "how": "Exercise ... menu > Reorder (drag and drop) in routines and live workouts; Trainer workouts too.", "fb": "", "src": ["https://www.hevyapp.com/features/exercise-programming-options/", "https://www.hevyapp.com/features/workout-plan-generator/"]}, {"has": "yes", "how": "Tap-and-hold an exercise and drag to reorder on the Workout tab; supersets/circuits and timed intervals also drag-reorderable.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/360006427813-Circuits-Supersets", "https://help.fitbod.me/hc/en-us/articles/360041831493-Timed-Intervals"]}, {"has": "yes", "how": "Long-press an exercise thumbnail in the workout header and drag; plan editor allows moving exercises between days (v6.4, Jan 2026) and importing workouts/days from other plans.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Long-tap an exercise thumbnail in the top strip and drag to reorder during the workout; program editor grid supports drag of exercises/days/weeks.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/program-editor"]}, {"has": "yes", "how": "Long-press an exercise border (or ... > Handle exercise > Reorder) opens a drag-and-drop list; sets can be moved up/down via set menu arrows.", "fb": "", "src": ["https://help.strengthlog.com/help-article/reorder-exercises/", "https://help.strengthlog.com/help-article/how-to-record-a-workout/"]}, {"has": "partial", "how": "Routine builder (2025) supports drag-and-drop reordering of exercises/days; reordering inside a live workout is not documented. Swiping left/right moves between exercises during logging.", "fb": "", "src": ["https://www.jefit.com/blog/introducing-new-routine-builder-workout-planning-simplified", "https://www.jefit.com/blog/stay-ahead-with-jefit-online-workout-planner-enhancements", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens"]}, {"has": "unknown", "how": "Not documented.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker"]}, {"has": "partial", "how": "Exercises are reordered in routine Edit mode by long-pressing the three-line handle and dragging. No evidence of reordering inside an active session without editing the routine.", "fb": "", "src": ["https://help.smartgymapp.com/article/72-change-the-order-of-the-exercises", "https://help.smartgymapp.com/article/57-create-custom-routine"]}, {"has": "yes", "how": "Long-press an exercise on the Workout Overview screen to drag-reorder (4.2), incl. reordering within a superset; templates reordered in Plans via reorder icon.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-420-workout-overview-screen-updates", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "log_replace_exercise", "area": "log", "areaPL": "Logowanie treningu", "label": "Zamiana ćwiczenia w trakcie", "others": 10, "cells": [{"has": "no", "how": "There is no swap/replace action. During a workout you can only 'usuń' (remove) an exercise and '+ Dodaj ćwiczenie' (add) another, which is appended at the end.", "fb": "", "src": ["components/ActiveWorkout.tsx:ExerciseBlock", "lib/store.ts:addExerciseToActive"]}, {"has": "yes", "how": "Replace an exercise via the exercise More (...) menu; Apple Watch got a 'Replace exercise' option in 6.1.0 (Jun 2025). Separate 'Transfer Exercise Data' merges history recorded under the wrong exercise (same category only, irreversible).", "fb": "Replacing an exercise drops its notes/sticky notes (Android user, GP review 2026).", "src": ["https://help.strongapp.io/article/224-workout-on-apple-watch", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577", "https://help.strongapp.io/article/209-how-do-i-merge-data-between-two-exercises"]}, {"has": "yes", "how": "Exercise ... > Replace Exercise from the library; in Hevy Trainer, choose from 4 suggested alternatives and decide whether the swap is for this session only or permanent.", "fb": "", "src": ["https://www.hevyapp.com/features/exercise-programming-options/", "https://www.hevyapp.com/features/workout-plan-generator/", "https://www.hevyapp.com/community-updates/july-26/"]}, {"has": "yes", "how": "Swipe left > Replace. Replace list sortable by Best Replacements / Most Logged / Least Logged / Never Logged and filterable by Your Equipment, No Equipment, Same Equipment, Different Equipment. Replacements are also treated as preference signals by the algorithm.", "fb": "Complaint: 'Difficult exercise replacement interface' (justuseapp review aggregation).", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/43489509474455-How-does-Fitbod-choose-which-exercises-to-give-me"]}, {"has": "yes", "how": "Replace shows a list of similar exercises (e.g., different equipment when machine is taken) or normal search/filters; targets kept where possible (v6.5). At workout end, prompt asks whether to apply changes to the plan or keep them only for today.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Cog > Swap Exercise; picker has Ad-hoc and From Program tabs, 'Similar Muscles' sort, and a Recent list (last 5 swaps). Weights are recalculated from history for the new exercise; swap affects this workout only; pre-defined alternatives with their own progression can be kept via 'used: none'.", "fb": "", "src": ["https://www.liftosaur.com/features/changing-a-workout", "https://www.liftosaur.com/features/exercise-library"]}, {"has": "yes", "how": "Swipe exercise > Change: library opens with similar exercises suggested first; weights are kept as-is (or fetch from history/update 1RM).", "fb": "", "src": ["https://help.strengthlog.com/help-article/similar-exercises/", "https://help.strengthlog.com/help-article/shortcuts-in-an-active-workout/"]}, {"has": "yes", "how": "Swap Exercise in the logging screen's three-dots menu; v17.0.9 (Jun 2026) added smarter, injury-aware substitution recommendations; Adaptive Plan swaps stay within the same movement pattern and the week preview explains why an exercise was swapped (injury, difficulty, equipment).", "fb": "", "src": ["https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/adaptive-mesocycle-training-jefits-smarter-way-to-progress"]}, {"has": "yes", "how": "Swap icon shows coach-suggested alternatives (or '•••' to pick any exercise); weights carry over to the substitute and the app asks whether to apply the swap only today or to future workouts. 'Similar Exercises' recommendations for every exercise added Oct 2026.", "fb": "Play Store review (Feb 2025): some substitution functions locked behind subscription; App Store review: only about half of 'save for future' swaps stick.", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.garagegymreviews.com/boostcamp-review", "https://www.boostcamp.app/features", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "yes", "how": "'Alternative exercise' (7.4): swap an exercise for the current session only (routine stays intact); Smart Trainer suggests the most similar exercises filtered by the routine's equipment list; works offline on Apple Watch. 'Edit > Replace Exercise' changes it permanently. 7.6 added search in alternatives.", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-4", "https://smartgymapp.com/releases/smartgym-7-6", "https://help.smartgymapp.com/article/136-different-equipment-lists", "https://smartgymapp.com/watch.html"]}, {"has": "paid", "how": "Substitute from active workout or template; substitution list pre-filtered by primary muscle use-the-Plate-Calculator-Logging-and-Adding-Custom-Plates-and-Bars", "https://www.hevyapp.com/features/workout-settings/"]}, {"has": "yes", "how": "For barbell exercises: button next to History or swipe right on a set; for other plate-loaded kit (EZ bar, trap bar, Smith, yoke, leg press, hack squat, calf machine, Hammer Strength, T-bar) swipe right on a set. Uses bars/plates from available equipment; if exact weight impossible shows nearest loadable weight. No custom bar weight for barbell; not on Watch/Wear OS.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360007700013-Plate-Calculator"]}, {"has": "paid", "how": "Pro: built into the weight picker for bar-and-plate exercises (uses bar weight + plate inventory of active gym); if target can't be built shows next lower achievable weight.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/subscribe"]}, {"has": "paid", "how": "Plates per side shown under the expanded set, under the weight keyboard and as a Plates column; free users see a 'See plates for each side' link. Rounding to loadable weights itself is free.", "fb": "", "src": ["https://www.liftosaur.com/features/premium", "https://www.liftosaur.com/features/equipment-and-gyms"]}, {"has": "yes", "how": "Free: loading image above keyboard for barbell exercises, full calculator in Settings > Calculators; profiles per gym with plate counts, plate colors, barbells and collars; link exercises to a specific bar (e.g., 28 kg trap bar; 0 kg bar for plate-loaded machines).", "fb": "", "src": ["https://help.strengthlog.com/help-article/plate-calculator/"]}, {"has": "unknown", "how": "No mention of a plate-loading calculator in JEFIT's FAQ, store listings or blog; weights are, however, rounded to the user's declared plates/dumbbells by the progression engine.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https . Assisted Pull Up) but how assistance is logged is not documented. Resistance bands: user defines a band collection (Handle/Mini/Loop bands, colors, tensions); band exercises are recommended by reps, not weight.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/29486697282711-Exercise-Details-Screen-Sets-Reps-and-Weight-Fields-Explained", "https://help.fitbod.me/hc/en-us/articles/16254175592215-Fitbod-s-Algorithm-Q-A", "https://help.fitbod.me/hc/en-us/articles/12732749777047-Fitbod-Metrics-Records", "https://help.fitbod.me/hc/en-us/articles/4404204105367-Resistance-Bands-Collections", "https://help.fitbod.me/hc/en-us/articles/42459670227223-Exercise-Percentile-Ranking"]}, {"has": "yes", "how": "Each built-in bodyweight exercise stores the % of bodyweight moved (custom exercises: user sets 0-100%). User logs only added weight or assistance (e.g., -15 kg on assisted dips); bodyweight is included in e1RM/e10RM and recommendations. Resistance bands available as equipment.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Equipment switches 'Bodyweight for Bar' and 'Is assisting?' model weighted and assisted pull-ups/dips; bands are added as 'plates' with assistance weight. Requires a small update script (weights = bodyweight +/- originalWeights) documented with examples.", "fb": "", "src": ["https://www.liftosaur.com/features/equipment-and-gyms"]}, {"has": "partial", "how": "Exercises can carry a 'bodyweight factor' that adds a share of bodyweight to lifted weight/volume (editable or 0 to exclude). No dedicated assisted/band-assistance mode documented.", "fb": "", "src": ["https://help.strengthlog.com/help-article/bodyweight-factors/", "https://help.strengthlog.com/help-article/adding-a-new-exercise/"]}, {"has": "partial", "how": "Assisted exercises are recognized by the load progression engine ('less resistance means harder', v17.2.4, Sep 2026). Logging added weight on bodyweight moves or bands is
