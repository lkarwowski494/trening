kout-tracker"]}, {"has": "unknown", "how": "No documentation of per-side logging found.", "fb": "", "src": ["https://smartgymapp.com/features.html"]}, {"has": "unknown", "how": "No per-side logging documented.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "log_tempo", "area": "log", "areaPL": "Logowanie treningu", "label": "Tempo", "others": 0.5, "cells": [{"has": "partial", "how": "Each exercise has an optional free-text tempo field (e.g. '3-1-1', max 20 chars). It appears in the exercise header during the workout and in the exercise list. There is no per-set tempo and no tempo metronome or timer.", "fb": "", "src": ["lib/seed.ts:Exercise.tempo", "app/exercise/[id].tsx", "components/ActiveWorkout.tsx:headMeta"]}, {"has": "no", "how": "No tempo field in the documented set fields or CSV export columns; a 2026 Play Store review from a Premium user requests a built-in tempo field.", "fb": "", "src": ["https://github.com/DuarteSantos8/openGym/issues/302", "https://play.google.com/store/apps/details?id=io.strongapp.strong"]}, {"has": "unknown", "how": "No tempo field in the API set schema or help center.", "fb": "", "src": ["https://api.hevyapp.com/docs/"]}, {"has": "unknown", "how": "No tempo field found in the help center (99 articles checked).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/30721437384215-How-to-Navigate-the-Exercise-Details-Screen"]}, {"has": "unknown", "how": "No tempo field documented.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "partial", "how": "No tempo field or tempo timer in Liftoscript; tempo can only be written as an exercise description ('//' Markdown) or a set label (max 8 chars).", "fb": "App Store 2026-06 (5*): user keeps 'tempos, RIR targets ... all of it' in the Liftoscript text. https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/doc/liftoscript"]}, {"has": "no", "how": "No tempo field or tempo timer found in help center; users request it.", "fb": "App Store 2026-07 (5*): 'just need a tempo timer with concentric and eccentric'. https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/", "https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json"]}, {"has": "unknown", "how": "Only JEFIT's own marketing listicle claims tempo logging in the free version; not found in FAQ, store text or product posts.", "fb": "", "src": ["https://www.jefit.com/blog/best-strength-training-apps-for-2026-7-options-tested-by-lifters"]}, {"has": "unknown", "how": "Not documented.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker"]}, {"has": "unknown", "how": "No tempo field documented.", "fb": "", "src": ["https://smartgymapp.com/features.html"]}, {"has": "unknown", "how": "No tempo field documented.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "log_empty_workout", "area": "log", "areaPL": "Logowanie treningu", "label": "Pusty trening", "others": 8.5, "cells": [{"has": "yes", "how": "The 'Pusty trening' button on the Trening tab starts a workout with no template; you add exercises with the picker.", "fb": "", "src": ["lib/store.ts:startEmpty", "app/(tabs)/index.tsx:Home"]}, {"has": "yes", "how": "Start an Empty Workout or a Template from the Start Workout tab; after finishing an empty workout the app prompts to save it as a new template.", "fb": "", "src": ["https://help.strongapp.io/article/229-my-first-workout", "https://help.strongapp.io/article/177-update-template"]}, {"has": "yes", "how": "Workout tab > '+ Start Empty Workout'; also 'Copy Workout' from any past workout (yours or another user's) and Quick Access widget.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35361530647959-How-to-Log-a-Workout-in-the-Hevy-App-Step-by-Step-Guide", "https://help.hevyapp.com/hc/en-us/articles/33703513582871-Workouts-vs-Routines-in-Hevy-What-They-Mean-and-How-to-Use-Them"]}, {"has": "yes", "how": "Swap menu > 'Create Workout From Scratch' builds a custom workout exercise by exercise; Android also offers 'Import Workout' from a photo/screenshot.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/38318585683991-Customizing-Today-s-Workout"]}, {"has": "yes", "how": "Free: create a standalone workout from scratch; Pro can generate a standalone workout.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "'Ad-Hoc Workout' starts an empty workout and opens the Add Exercises picker (multi-select). After finishing, 'Create Program Day' turns it into a new or existing program's day.", "fb": "App Store 2026-07 (4*): complained there was no way to save a past training day to a program (current docs describe a Create Program Day action). https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/changing-a-workout"]}, {"has": "yes", "how": "+ (bottom menu) > Start New Workout, then '+ Exercise' from Most used / All exercises.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/"]}, {"has": "partial", "how": "Ad-hoc sessions are done via 'Instant Workout' (choose duration, muscles, equipment, then Generate; edit/swap afterwards) or the watch's quick workout by target muscle; a pure blank 'empty workout' flow isn't documented, and a quick 'add exercise on the spot' (lightning) button was removed.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/watch-guide-elevate-your-workout-with-jefit-wear-os", "https://etechshout.com/jefit-app-review/"]}, {"has": "yes", "how": "Start a freestyle/empty workout without a program; Pro auto-progression also works with empty workouts (v266).", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "partial", "how": "Logging is routine-based ('SmartGym works with always having a base routine'). 'Start Workout' starts a HealthKit session and you pick a routine; iOS 18 Lock Screen button can start 'an open workout'. No documented ad-hoc exercise-by-exercise logging without a routine.", "fb": "", "src": ["https://help.smartgymapp.com/article/106-log-exercises", "https://help.smartgymapp.com/article/61-start-workout-session", "https://smartgymapp.com/releases/smartgym-7-5"]}, {"has": "partial", "how": "Workouts are started from a plan template via red + > Strength; ad-hoc additions to an active workout are possible (add exercises, update template prompt). No pure blank 'empty workout' flow documented.", "fb": "'I don't get why I can't just build a workout I want, then pull that one up and log it' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=1482405410/sortby=mostrecent/json", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/option-to-create-new-template-in-addition-to-update-template-prompt"]}]}, {"id": "log_edit_past", "area": "log", "areaPL": "Logowanie treningu", "label": "Edycja/wsteczne dodanie treningu", "others": 9.0, "cells": [{"has": "no", "how": "The finished-session screen (history/[id]) is read-only except for 'Usuń sesję' (delete). You cannot edit sets, add sets or backdate a workout. Start and finish time are always 'now', apart from the abandoned-workout end time.", "fb": "", "src": ["app/history/[id].tsx", "lib/store.ts:deleteWorkout"]}, {"has": "yes", "how": "History > workout ... > Edit Workout to change sets, date and start/end time. To log a past workout: start a workout, ... > Adjust Start/End Time, turn OFF Automatic Timing and set times. 'Start History From' setting hides older history from stats without deleting it.", "fb": "", "src": ["https://help.strongapp.io/article/249-how-do-i-edit-a-past-workout", "https://help.strongapp.io/article/167-adjust-workout-date", "https://help.strongapp.io/article/250-can-i-reset-my-workout-history"]}, {"has": "yes", "how": "Workout ... > Edit Workout (sets, duration, etc.); date/time/duration adjustable on the Save Workout screen (used to backfill a missed week and restore streak); Calendar lets you tap a past date and 'Log a workout'.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34513981310615-How-to-I-adjust-duration-and-pause-a-workout", "https://help.hevyapp.com/hc/en-us/articles/34467766576279-How-to-Get-Your-Weekly-Streak-Back-in-the-Hevy-App", "https://help.hevyapp.com/hc/en-us/articles/35380117933207-Track-Your-Workout-Consistency-with-the-Calendar-and-Streak-Features"]}, {"has": "yes", "how": "Log tab > workout: edit reps/sets/weight, add (+) or delete exercises; '...' to edit duration, delete, or save as a new workout. Saved workouts can be logged for a past date via 'Add as Past Workout' (date + time). Apple Health resync only same calendar day.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/6259258835863-Save-a-Workout", "https://help.fitbod.me/hc/en-us/articles/360047357794-Apple-Health"]}, {"has": "yes", "how": "Past workouts can be opened, edited or deleted; changes propagate to stats. Past workouts can be added manually (suggested in lieu of import).", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Open a past workout from Home: edit sets, swap/remove exercises, change date and length (hh:mm), add notes, delete. Saving does not rerun progressions. Past workouts can also be imported via CSV.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-history"]}, {"has": "yes", "how": "Edit any saved workout (sets, name, time, ratings); backdate by logging and changing date/time at save; v9.0 home calendar lets you backlog forgotten workouts; delete from home widget or log.", "fb": "", "src": ["https://help.strengthlog.com/help-article/make-changes-to-a-saved-workout/", "https://help.strengthlog.com/help-article/backdating-a-workout/", "https://help.strengthlog.com/help-article/how-to-delete-a-workout/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "yes", "how": "Logged workouts can be edited anytime from the calendar view in the Progress tab (fix mistakes, add details).", "fb": "etechshout: cannot edit an in-progress workout's plan easily; 'Add exercise' changes the whole program.", "src": ["https://www.jefit.com/support/faq"]}, {"has": "partial", "how": "History tab lists past workouts (view by month since v265) and lets you open one and save it as a template; editing/backdating finished sessions is not documented.", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "partial", "how": "History entries can be deleted (including on Watch, v7); routine/exercise checkmark can manually log an exercise for today. No documented backdating of a workout to a past date.", "fb": "Aggregated older reviews list 'No retroactive workout logging' - https://justuseapp.com/en/app/922744883/smartgym-gym-home-workouts/reviews", "src": ["https://alternativeto.net/news/2023/6/smartgym-7-has-been-released-with-new-exercises-progress-tracking-and-enhanced-apple-watch-app", "https://help.smartgymapp.com/article/63-what-is-the-checkmark"]}, {"has": "yes", "how": "Select a past date on dashboard/calendar + red + to record a previous workout; completed workouts editable via View/Edit; editing a workout's date was released (2025).", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001152861-how-do-i-log-a-strength-workout-", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/edit-date-of-a-workout"]}]}, {"id": "log_one_hand_ux", "area": "log", "areaPL": "Logowanie treningu", "label": "Obsługa jedną ręką", "others": 7.0, "cells": [{"has": "yes", "how": "✓, ▶, set number and band targets are 44 pt (tested). The keyboard hides on ✓ or stopwatch start so the rest bar stays visible. Fields use number-pad or decimal-pad, or numbers-and-punctuation for ±kg because the iOS number pad has no minus. Fields accept comma or dot decimals and select their text on focus. A compact column layout is used for 320 pt screens. Typical start-to-first-set flow is 2 taps (Start, ✓).", "fb": "", "src": ["components/ui.tsx:NumInput", "components/ActiveWorkout.tsx:rowLayout", "components/ActiveWorkout.tsx:onDone", "docs/09-plan-testow.md:C1-C4"]}, {"has": "partial", "how": "Custom numeric keyboard with RPE and plate-calculator buttons and a 'Next' key that advances to the next set (superset-aware); swipe-to-delete sets; full-screen rest timer option. Apple Watch: Digital Crown pickers, long-press menus, action-button set completion and an Apple Watch 'Button Repeat' toggle (6.3.3).", "fb": "Widely praised as the fastest/simplest logging UI ('easy to use even when exhausted' – Lifehacker quote on homepage; GGR pros). 2026 fixes for stuck keyboard / RPE keyboard on iOS 27.", "src": ["https://help.strongapp.io/article/230-about-rpe", "https://help.strongapp.io/article/169-plate-calculator", "https://help.strongapp.io/article/98-supersets-and-circuits", "https://help.strongapp.io/article/231-rest-timer", "https://help.strongapp.io/article/224-workout-on-apple-watch", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, {"has": "yes", "how": "Keep Awake During Workout setting; Live Activity lets you mark sets complete and adjust rest ±15 s from the lock screen; Smart Superset Scrolling; set-check sound and haptics; duration input restored as text input (May 2026); Set Row redesign with clearer active/checked states (Aug 2026). 150-set cap per workout/routine.", "fb": "Reviews consistently call logging fast and clean; some Strong users find Hevy 'busier' (aitoolsbakery).", "src": ["https://www.hevyapp.com/features/workout-settings/", "https://help.hevyapp.com/hc/en-us/articles/35649846517399-How-to-Use-Hevy-s-Live-Activity-on-iOS-and-Android", "https://help.hevyapp.com/hc/en-us/articles/35650286563095-The-Complete-Guide-to-Supersets-and-Smart-Superset-Scrolling", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350", "https://help.hevyapp.com/hc/en-us/articles/34896183826455-Hevy-Set-Limit-Explained-Why-Workouts-and-Routines-Have-a-150-Set-Cap"]}, {"has": "partial", "how": "Notable hands-free option: AirPods Pro head gestures (nod, shake or tilt, adjustable sensitivity) log sets; Apple Watch / Wear OS logging; Timed Intervals Auto-Play advances hands-free. No documented keyboard/large-target design notes.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360056464934-Apple-AirPod-Pros", "https://help.fitbod.me/hc/en-us/articles/360006499194-Apple-Watch", "https://help.fitbod.me/hc/en-us/articles/360041831493-Timed-Intervals"]}, {"has": "partial", "how": "Custom 'Picker' for weight/reps/RIR shows a sorted list of likely values plus keyboard ('Weight, reps and RIR in two taps'); horizontal thumbnail tab bar to switch exercises.", "fb": "Older review: text entry lag in exercise search (thefitnesstribe).", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Big Reps/Weight fields and big checkmark; custom keypad with +/- that steps by the smallest loadable weight; swipe between exercises; sets can be completed from the iOS Live Activity / Android notification without unlocking (Premium). Text-size slider 12-24 and optional Always On Display.", "fb": "App Store 2026-05 (3*): 'slow input' - typing faster than the app keeps up drops input. https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/lock-screen-and-notifications", "https://www.liftosaur.com/features/first-run-and-settings"]}, {"has": "partial", "how": "Tap set number to mark done (turns green); swipe actions on sets/exercises; long-press shortcuts; optional XL timer. Users report the done-tap target and 9.0 navigation as unclear.", "fb": "App Store 2023 (3*): 'not made very clear how to mark a workout as done, you end up having to tap the small blank space'; 2026-05 (3*): 'powerful ... buried under baffling UX decisions'. https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json", "src": ["https://help.strengthlog.com/help-article/mark-a-set-as-done/", "https://help.strengthlog.com/help-article/shortcuts-in-an-active-workout/", "https://help.strengthlog.com/help-article/how-to-use-the-timer/"]}, {"has": "partial", "how": "2023 redesign moved swap/notes/superset into a three-dots menu, swipe between exercises, foldable video; 2026: timer stays visible in the log button when the keyboard is open, local decimal separator accepted, Liquid Glass UI on iOS 26.", "fb": "Long-time users complain about scroll-wheel weight/rep input replacing the keyboard, extra pop-ups and frequent UI changes (App Store review; etechshout).", "src": ["https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "partial", "how": "Tap a set to log it and the rest timer starts; since v265 (Sep 2026) the current set stays highlighted and finished exercises collapse; swipe left to delete a set/exercise.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app"]}, {"has": "yes", "how": "7.11 Inline Logging shows one set at a time with values editable in place; custom keyboard with +/- 1 buttons for weight/reps and set-type button. Smart Action Button predicts next step (log set+rest, next exercise, end). Can be bound to iPhone Action Button; on Watch: Double Tap and Ultra Action Button drive the whole workout.", "fb": "Some users find it confusing: 'each exercise has a different way to start a rest time' - https://itunes.apple.com/us/rss/customerreviews/page=2/id=922744883/sortby=mostrecent/json", "src": ["https://smartgymapp.com/releases/smartgym-7-11", "https://9to5mac.com/2026/07/23/smartgym-update-makes-it-easier-to-manually-adjust-and-log-exercises-on-the-go/", "https://help.smartgymapp.com/article/138-configure-iphones-action-button", "https://help.smartgymapp.com/article/141-double-tap-action-button"]}, {"has": "yes", "how": "Custom keyboard (5.4) with context button (Next field / Complete exercise / Next Set in superset / Update) and 'Last' button; rest timer, add set and complete buttons tappable with keyboard open (5.1).", "fb": "'constantly accidentally ending my workout' - https://itunes.apple.com/us/rss/customerreviews/page=2/id=1482405410/sortby=mostrecent/json; 'Are you sure? when clicking complete workout' is Planned (286 votes) - https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/are-you-sure-when-clicking-complete-workout", "src": ["https://feedback.caliberstrong.com/announcements/caliber-540-custom-keyboard-automatic-rest-timer-default-exercise-settings-sundaymonday-start-date-g", "https://feedback.caliberstrong.com/announcements/caliber-510-track-tab-enhancements-more-dark-mode-screens-bug-fixes"]}]}, {"id": "timer_auto_rest", "area": "timer", "areaPL": "Przerwy i czas", "label": "Automatyczna przerwa", "others": 10, "cells": [{"has": "yes", "how": "Ticking a set starts the rest countdown, shown in a bottom bar with −15 / +15 / Pomiń (skip). Exceptions: no rest before an unticked drop set; inside a superset only after the round closes; rest 0 means no timer. Un-ticking stops the rest only if that set started it. After a timed set, rest counts from the set's end time.", "fb": "", "src": ["components/ActiveWorkout.tsx:onDone", "lib/store.ts:restAfter", "lib/timer.ts:start", "lib/timer.ts:adjust"]}, {"has": "yes", "how": "Default rest timer 2:00 starts immediately when a set is checked off; shown top-left of the workout screen, tap to expand to full screen to adjust or Skip; can be made full-screen by default. Can also be started manually.", "fb": "", "src": ["https://help.strongapp.io/article/231-rest-timer"]}, {"has": "yes", "how": "Per-exercise rest timer (tap 'Rest Timer' under exercise name); starts when a set is checked; notifies at zero. 'Default Rest Timer' setting applies to newly added exercises only (not retroactive). Can be off per exercise.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35385404949143-Rest-Timer-Default-Rest-Timer-How-to-Add-Adjust-Volume-and-Sound", "https://www.hevyapp.com/features/exercise-programming-options/"]}, {"has": "yes", "how": "Once a set is logged the countdown starts automatically with tone/vibration at the end; toggle timer icon per exercise ON/OFF. Watch logging on Wear OS does NOT start the rest timer.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006340194-Rest-Timer", "https://help.fitbod.me/hc/en-us/articles/4406074415383-WearOS-on-Android"]}, {"has": "yes", "how": "Starts automatically on set completion; alarm at zero; by default counts past zero to show actual rest. Rest timer is in the free tier.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Rest timer starts automatically when a set is checked (or when the AMRAP/RPE popup is submitted); pill shows elapsed vs target, turns red past target and keeps counting; -15s/+15s.", "fb": "", "src": ["https://www.liftosaur.com/features/rest-timer"]}, {"has": "yes", "how": "Timer settings let it start automatically on set completion; progress bar in background; +/-30 s buttons or manual entry; count-up mode.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-use-the-timer/"]}, {"has": "yes", "how": "Rest time is logged automatically between sets; after logging a set the interval panel automatically switches to the rest timer.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens"]}, {"has": "yes", "how": "Rest timer auto-starts when a set is logged.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker"]}, {"has": "yes", "how": "Rest timer and set logging are tied: tapping the timer/set logs the set and starts the countdown (Watch and iPhone). 'Restart' restarts the timer between exercises without logging an extra set. Since 7.6 the running rest timer persists when switching exercises.", "fb": "", "src": ["https://help.smartgymapp.com/article/59-apple-watch-app", "https://help.smartgymapp.com/article/64-start-a-rest-timer-after-all-sets-are-done", "https://smartgymapp.com/releases/smartgym-7-6"]}, {"has": "paid", "how": "Optional automatic rest timer (5.4, Plus/Premium): starts when reps/time of a completed set are entered; uses exercise rest target or default; deliberately NOT triggered between exercises (except supersets). Otherwise single tap starts timer with the exercise's rest target; long-press for other durations.", "fb": "'The rest timer is possessed... works half the time despite the global and per-exercise auto-timer setting being on' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=1482405410/sortby=mostrecent/json", "src": ["https://feedback.caliberstrong.com/announcements/caliber-540-custom-keyboard-automatic-rest-timer-default-exercise-settings-sundaymonday-start-date-g", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-316-streamlined-rest-timer-stopwatch-revamped-exercise-notes"]}]}, {"id": "timer_per_exercise", "area": "timer", "areaPL": "Przerwy i czas", "label": "Przerwa per ćwiczenie", "others": 9.5, "cells": [{"has": "yes", "how": "Rest is resolved in this order: template item rest, then exercise rest, then global default (90 s, max 1800 s). Each exercise can also have a separate post-warm-up rest. During a workout the ⏱ button asks 'Tylko teraz' (this block only) or 'Zapamiętaj' (save to the exercise and the source template item).", "fb": "", "src": ["lib/store.ts:restFor", "lib/store.ts:startFromTemplate", "components/ActiveWorkout.tsx:rememberRest", "app/exercise/[id].tsx"]}, {"has": "yes", "how": "Per exercise via the ... menu, with separate durations for Warm-up sets and Working (regular) sets. Timer sound and behaviour in Settings > Rest Timer. Apple Watch cannot change all timers of an exercise (iPhone changes sync).", "fb": "", "src": ["https://help.strongapp.io/article/231-rest-timer", "https://help.strongapp.io/article/224-workout-on-apple-watch"]}, {"has": "partial", "how": "Per exercise only (stored in routine; API field rest_seconds per exercise). No per-set-type durations documented; timer skipped before drop sets. Trainer offers Short/Medium/Long rest presets.", "fb": "Play review (Sep 2026): wishes rest length per exercise would be remembered across workouts.", "src": ["https://help.hevyapp.com/hc/en-us/articles/35385404949143-Rest-Timer-Default-Rest-Timer-How-to-Add-Adjust-Volume-and-Sound", "https://api.hevyapp.com/docs/", "https://help.hevyapp.com/hc/en-us/articles/43572343844247-How-Hevy-Trainer-Settings-Work"]}, {"has": "yes", "how": "Rest time is generated per exercise per workout depending on difficulty/goal (longer for strength, shorter for conditioning). Adjusting it pre-workout changes all timers for that exercise; mid-workout adjustment only affects the current timer; changes don't persist to future workouts.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006340194-Rest-Timer", "https://help.fitbod.me/hc/en-us/articles/15948615409687-Fitness-Goals"]}, {"has": "yes", "how": "Defaults per exercise type (e.g., longer for large compounds, shorter for isolation) plus per-exercise override; current rest can be adjusted without changing the default.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Priority: per-set rest in program text ('3x5 90s') > Superset timer > Warmup (default 90s) or Workout (default 180s) timer from Me > Timers.", "fb": "", "src": ["https://www.liftosaur.com/features/rest-timer"]}, {"has": "yes", "how": "Exercise-specific rest timers set in timer settings or via ... > Handle Exercise > Exercise specific rest timer; 'Reset to default'.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-use-the-timer/"]}, {"has": "yes", "how": "Rest can be set per individual set in the unified editor (May 2025) and per exercise in the builder; v17.0.10 (Jun 2026) added 'apply rest time to every set at once' and stopwatch/countdown toggle. Global rest settings live in Profile > Settings.", "fb": "etechshout: rest timer keeps re-enabling and there is no master switch to turn it off everywhere.", "src": ["https://www.jefit.com/blog/meet-jefits-all-new-unified-workout-editing-screen", "https://www.jefit.com/blog/introducing-new-routine-builder-workout-planning-simplified", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens"]}, {"has": "yes", "how -workout-tracker-gym-log/id464254577"]}, {"has": "yes", "how": "Settings > Notifications > Rest Timer; 5 timer sounds, separate volumes (off/low/normal/high) for timer, set-check and PR sounds.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/33845807003671-Account-Settings-Preferences-Profile-Information-Adjust-username-password-or-email-address-Notifications", "https://help.hevyapp.com/hc/en-us/articles/35385404949143-Rest-Timer-Default-Rest-Timer-How-to-Add-Adjust-Volume-and-Sound", "https://www.hevyapp.com/features/workout-settings/"]}, {"has": "yes", "how": "Settings > Workout Settings > Notifications > 'When rest timer has ended' sends a push notification when app is backgrounded/locked (sound only if app is open). Apple Watch gives haptic + audio cues but timer pauses when the screen dims (no Always On support).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006340194-Rest-Timer", "https://help.fitbod.me/hc/en-us/articles/360006499194-Apple-Watch"]}, {"has": "partial", "how": "'Rest timer with alarm'; live countdown in iOS Live Activity / Android live notification. Whether a push alert fires when backgrounded isn't explicitly documented.", "fb": "Review lists 'No audio cues' as a con (fitnessdrum 2026).", "src": ["https://alphaprogression.com/en", "https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "paid", "how": "With Premium: push notification when rest ends, with next set and plates ('Next Set: Bench Press, 5 reps, 100lb'); chime over other audio, via headphones when locked with Apple Watch paired; Android 'Ignore Do Not Disturb'.", "fb": "App Store 2026-07 (4*): Apple Watch notifications bugged. https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/lock-screen-and-notifications", "https://www.liftosaur.com/features/premium"]}, {"has": "yes", "how": "Rest-over notifications with selectable sound (permission required; no sound ntly; time-based exercises have target times.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-316-streamlined-rest-timer-stopwatch-revamped-exercise-notes", "https://feedback.caliberstrong.com/announcements/caliber-3113-3115-exercise-edit-screen-redesign-bulk-edit-exercises-report-messages", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "timer_workout_duration", "area": "timer", "areaPL": "Przerwy i czas", "label": "Czas treningu", "others": 9, "cells": [{"has": "yes", "how": "The workout header shows start time and an elapsed clock (h:mm:ss) updated every second. Duration is stored as startedAt/finishedAt and shown in history and the CSV Duration column.", "fb": "", "src": ["components/ActiveWorkout.tsx:SessionClock", "app/(tabs)/history.tsx", "lib/backup.ts:buildCsv"]}, {"has": "yes", "how": "Workouts are timed automatically ('Automatic Timing'); start/end time can be adjusted during or after the workout.", "fb": "", "src": ["https://help.strongapp.io/article/167-adjust-workout-date"]}, {"has": "yes", "how": "Workout timer runs from start; tap duration to pause/resume (phone only, not watch); duration editable on Save screen or later via Edit Workout.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34513981310615-How-to-I-adjust-duration-and-pause-a-workout"]}, {"has": "yes", "how": "Workout timer at top of the in-progress screen (tap to pause); duration editable after logging ('Edit Workout Duration'). Workout length target 15 min-1h30 drives number of exercises (4 ex ~27-51 min, 5 ~35-60, 6 ~39-63).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/23376692769559-Pause-a-Workout", "https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/43488199311767-How-long-are-Fitbod-workouts-and-can-I-make-them-shorter"]}, {"has": "unknown", "how": "Generator shows an estimated workout duration (incl. warm-ups, rest, transitions); whether the in-workout elapsed timer exists is not documented.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator"]}, {"has": "yes", "how": "Header shows workout time with a pause/resume button; duration shown on summary and history cards and editable on past workouts.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/workout-history"]}, {"has": "yes", "how": "Workout clock with fullscreen pause (since v5.10.2); paused time can be entered manually at save; duration feeds calorie estimate.", "fb": "", "src": ["https://help.strengthlog.com/help-article/pause-your-workout/"]}, {"has": "yes", "how": "Workout time is tracked and charted ('workout time' charts); compare-records benchmark includes total workout time; Year in Review shows total training time.", "fb": "", "src": ["https://www.jefit.com/", "https://www.jefit.com/blog/how-do-you-compare-try-jefits-new-records-feature", "https://www.jefit.com/blog/jefit-year-in-review-2025-a-look-back-at-your-strength-journey"]}, {"has": "yes", "how": "Reports show number of workouts and minutes trained over time.", "fb": "", "src": ["https://fortune.com/article/boostcamp-review/"]}, {"has": "yes", "how": "Workout session runs a duration timer; ending the session stops it and syncs to Apple Fitness/Health. Duration is charted in widgets and Routine Progress.", "fb": "", "src": ["https://help.smartgymapp.com/article/125-how-to-use-smartgym", "https://help.smartgymapp.com/article/140-complications-smart-stack"]}, {"has": "yes", "how": "Duration shown on workout completion summary (since 3.1.22). Estimated workout duration before start is Planned (533 votes).", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-3122-workout-syncing-to-apple-health-workout-completion-flow-revamp", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/estimated-workout-duration"]}]}, {"id": "timer_abandoned_workout", "area": "timer", "areaPL": "Przerwy i czas", "label": "Porzucony trening", "others": 4.5, "cells": [{"has": "yes", "how": "After 2 h without a ticked set (or since the last 'Kontynuuj'), opening the app shows a dialog: Continue / Finish and save (end = last set time) / Discard, with confirmation. After 6 h it auto-finishes silently, but only if working sets exist, and shows an alert. A running stopwatch counts as activity, and future-dated timestamps are ignored.", "fb": "", "src": ["lib/store.ts:STALE_ASK_MS", "lib/store.ts:staleSince", "lib/store.ts:autoFinishStale", "components/ActiveWorkout.tsx:askStale", "app/_layout.tsx"]}, {"has": "unknown", "how": "No documentation found on reminders or auto-finish for forgotten workouts.", "fb": "", "src": []}, {"has": "partial", "how": "Unsaved in-progress workouts are stored on the device and can be resumed (lost if app is uninstalled before saving). No auto-finish/reminder documented.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/38223672272791-What-will-happen-to-my-information-if-I-uninstall-and-reinstall-the-Hevy-app"]}, {"has": "yes", "how": "Workouts can be paused (tap timer) for up to 3 hours; after that Fitbod automatically logs the workout. Apple Watch keeps tracking during pause.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/23376692769559-Pause-a-Workout"]}, {"has": "partial", "how": "An 'active workout reminder' notification exists (v7.0 fixed it firing after a completed workout); resume of workouts referenced. Auto-finish behaviour not documented.", "fb": "", "src": ["https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "If you leave the app with a workout running, a 'Workout reminder' notification fires after a delay (default 900 s, configurable, 0=off). The cloud keeps one open workout per account; it can be continued on another device or discarded.", "fb": "", "src": ["https://www.liftosaur.com/features/lock-screen-and-notifications", "https://www.liftosaur.com/features/sync-and-offline"]}, {"has": "partial", "how": "No auto-end; at save you can correct time/paused time, and unfinished sets/exercises can be deleted or moved to a new planned workout.", "fb": "", "src": ["https://help.strengthlog.com/help-article/pause-your-workout/", "https://help.strengthlog.com/help-article/unfinished-sets-exercises/"]}, {"has": "partial", "how": "If a workout isn't finished, on next open the app says a workout cannot last longer than 4 hours (per user report it then logged the whole elapsed time). v17.1.3 (Aug 2026) made in-progress Autoplay workouts resume after relaunch.", "fb": "App Store review: 70+ hour workouts logged (and synced to Apple Health) after forgetting to finish; etechshout: no resume option if you accidentally leave a session.", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "unknown", "how": "Not documented.", "fb": "Older reviews (2023-2025): completed workout not registered (next day repeats) and freezes on the 'complete workout' summary screen.", "src": ["https://www.boostcamp.app/workout-tracker"]}, {"has": "partial", "how": "No auto-end found. If a session stays active the Watch app keeps returning to screen until ended manually. 7.11 Smart Action recognizes 'returning after an interruption' and surfaces the resume action.", "fb": "Review: 'can't get it to close on my watch ... immediately reopens' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json", "src": ["https://help.smartgymapp.com/article/105-apple-watch-app-wont-close", "https://smartgymapp.com/releases/smartgym-7-11"]}, {"has": "unknown", "how": "No documented auto-finish/recovery of forgotten sessions.", "fb": "'it aborted my workout on the 23rd of 24 sets. No saved state upon restart' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=1482405410/sortby=mostrecent/json", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "plan_templates", "area": "plan", "areaPL": "Szablony i programy", "label": "Szablony", "others": 10, "cells": [{"has": "yes", "how": "Templates (Szablony tab) are lists of items. Each item has sets (1–50), a rep range ('pow. od'/'do'; empty = max), rest, start weight (or ±kg) and target seconds for timed metrics, plus superset grouping. Four templates are seeded (Upper A, Upper B, Legs — gym, Legs — home). Start is on the Home list or in the editor.", "fb": "", "src": ["lib/seed.ts:TemplateItem", "lib/seed.ts:seedState", "app/template/[id].tsx", "app/(tabs)/templates.tsx"]}, {"has": "yes", "how": "'Templates' (formerly Routines) store exercises/sets; created via '+ Template', inside a folder, or 'Save as Template' from History / after an empty workout. Free tier limited to 3 templates; PRO unlimited. After a template workout you are prompted: Update Template / Update Values Only / Update Template and Values / Keep Original (prompt can be hidden). Template Search added 6.3.0 (Mar 2026).", "fb": "", "src": ["https://help.strongapp.io/article/105-about-templates", "https://help.strongapp.io/article/177-update-template", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, {"has": "yes", "how": "'Routines': Workout tab > New Routine; free tier 4 routines (existing kept on downgrade), Pro unlimited. Routine sets can use rep ranges (e.g. 6–8). Duplicate routine supported.", "fb": "App Store copy still says 'unlimited routines' while help center caps free at 4 (aitoolsbakery).", "src": ["https://help.hevyapp.com/hc/en-us/articles/34953606698903-Build-a-Workout-Program-Create-Organize-Routines", "https://help.hevyapp.com/hc/en-us/articles/35119778922263-Hevy-Pro-Subscription-How-to-get-Pro-and-What-Does-It-Include", "https://help.hevyapp.com/hc/en-us/articles/38279350428695-What-will-happen-to-my-account-if-I-switch-from-Pro-to-the-free-version", "https://www.hevyapp.com/features/exercise-programming-options/", "https://help.hevyapp.com/hc/en-us/articles/35119576252951-Reset-Data-Duplicate-Exercise-Routines-and-Manual-Deletion"]}, {"has": "yes", "how": "'Saved Workouts': save current workout or a logged one with a name; load via Swap > Saved Workouts with 3 modes (maintain / regenerate everything / regenerate weight only). Saved workouts don't transfer between iOS and Android.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/6259258835863-Save-a-Workout", "https://help.fitbod.me/hc/en-us/articles/360049362174-How-to-Transfer-Your-Fitbod-Account-Between-iOS-and-Android"]}, {"has": "yes", "how": "Free: unlimited manual plans (multi-day) and standalone workouts. Plan editor with bulk editing across all exercises, a day, or a week of a periodized plan; edit sets, rep targets, dropsets; import days from other plans.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Workouts are days inside a program; you can have multiple programs and switch the current one. A day can also be created from an ad-hoc workout.", "fb": "", "src": ["https://www.liftosaur.com/features/program-editor", "https://www.liftosaur.com/features/changing-a-workout"]}, {"has": "yes", "how": "Mine > + > Workout: named, colored templates with set weight, retrieve-from-log or % of 1RM (premium) per set; any logged workout can be saved as a template; favorites appear on home.", "fb": "", "src": ["https://help.strengthlog.com/help-article/save-a-workout-template/"]}, {"has": "yes", "how": "Custom 'workout plans' (routines) made of days; create in app (Workout tab > Find Workout Plan > Create my Own) or in the web routine builder, with per-set weight/reps/rest/set type. Free tier includes custom routines.", "fb": "", "src": ["https://jefit.zendesk.com/hc/en-us/articles/360018367531-How-to-Create-a-Customized-Routine-", "https://www.jefit.com/blog/introducing-new-routine-builder-workout-planning-simplified", "https://www.jefit.com/elite"]}, {"has": "yes", "how": "Single-day workout templates under 'All Templates'; any past workout in History can be saved as a template.", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app"]}, {"has": "yes", "how": "Routines with name, days, goal, tags, renewal date, notes, exercises. Create from scratch, from Explore, via Smart Trainer ('Trust Us'/'Create For Muscles'), from text, or by natural language (8.0). Duplicate, rename, archive; drafts auto-saved (7.9); optional Main/Warm-Up/Cool-Down segments.", "fb": "", "src": ["https://help.smartgymapp.com/article/57-create-custom-routine", "https://help.smartgymapp.com/article/118-duplicate-a-routine", "https://help.smartgymapp.com/article/117-archive-a-routine", "https://smartgymapp.com/releases/smartgym-7-9"]}, {"has": "yes", "how": "Workout plans contain multiple workouts; create from scratch (choose number of workouts), via Workout Wizard, from Library or Pro; duplicate workouts and whole plans (5.7); bulk-edit exercise parameters across a workout (3.1.13).", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-570-export-workout-data-plans-section-rebuild-dark-mode", "https://feedback.caliberstrong.com/announcements/caliber-3113-3115-exercise-edit-screen-redesign-bulk-edit-exercises-report-messages", "https://feedback.caliberstrong.com/announcements/release-notes-caliber-220-create-workouts-from-scratch-in-app-feature-requests"]}]}, {"id": "plan_folders", "area": "plan", "areaPL": "Szablony i programy", "label": "Foldery szablonów", "others": 4.5, "cells": [{"has": "no", "how": "Templates are a single flat list; there are no folders or tags.", "fb": "", "src": ["app/(tabs)/templates.tsx"]}, {"has": "yes", "how": "Folders with drag-and-drop, collapsible; Archive folder for unused templates; example templates can be hidden (Settings > Bonus Options). Help article says folders are iPhone-only ('coming to Android soon').", "fb": "", "src": ["https://help.strongapp.io/article/107-organize-templates", "https://help.strongapp.io/article/106-edit-template"]}, {"has": "yes", "how": "Folder icon in Workout tab; drag-and-drop routines between folders; folders can be shared; program saves create a folder.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34953606698903-Build-a-Workout-Program-Create-Organize-Routines", "https://help.hevyapp.com/hc/en-us/articles/36011518408983-How-to-Access-and-Use-Hevy-s-Routine-and-Program-Library"]}, {"has": "unknown", "how": "No folders for saved workouts documented in help center.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/6259258835863-Save-a-Workout"]}, {"has": "unknown", "how": "No folders documented.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "no", "how": "Programs are a flat 'Yours' list next to 'Built-in'; no folders/categories described. Not described anywhere in the official per-feature docs, which claim to cover 'everything the app does' (checked 2026-10-02).", "fb": "", "src": ["https://www.liftosaur.com/features/built-in-programs", "https://www.liftosaur.com/features"]}, {"has": "yes", "how": "Workout categories: create categories and 'Move to...' templates into them.", "fb": "", "src": ["https://help.strengthlog.com/help-article/save-a-workout-template/"]}, {"has": "unknown", "how": "No folder concept documented; routine list sorts by most recently performed with a recency badge (v17.0.6).", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "partial", "how": "No folders documented; since v263 (Jul 2026) 'Save' bookmarks coach/user programs into one tab.", "fb": "", "src": ["https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "partial", "how": "No folders; organisation via comma-separated Tags, Archive, equipment-list tags as filters on the Routines tab, and grouping of Smart Trainer routines.", "fb": "", "src": ["https://help.smartgymapp.com/article/57-create-custom-routine", "https://help.smartgymapp.com/article/117-archive-a-routine", "https://help.smartgymapp.com/article/136-different-equipment-lists", "https://help.smartgymapp.com/article/145-how-often-smart-trainer-refreshes-your-routines"]}, {"has": "partial", "how": "No folders; multiple plans ('workout groups') act as containers with one default plan.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001222755-how-do-i-rename-a-workout-group-", "https://feedback.caliberstrong.com/announcements/caliber-3112-startscheduling-ux-updates-training-plan-screen-adjustments"]}]}, {"id": "plan_programs", "area": "plan", "areaPL": "Szablony i programy", "label": "Programy wielotygodniowe", "others": 8.5, "cells": [{"has": "no", "how": "There are no multi-week programs and no program library. Only individual templates exist.", "fb": "", "src": ["lib/seed.ts:State"]}, {"has": "partial", "how": "No multi-week program library; only a few built-in example templates. App Store says it is optimised for progressive barbell routines like Starting Strength / StrongLifts 5x5 but you build them yourself.", "fb": "", "src": ["https://help.strongapp.io/article/105-about-templates", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577", "https://aitoolsbakery.com/blog/strong-app-review/"]}, {"has": "yes", "how": "Explore library: 26 programs (filter by Level, Goal, Equipment) + 7 routine categories (At home, Travel, Dumbbells only, Band, Cardio & HIIT, Gym, Bodyweight); 'Save Program' creates a folder of routines. Blog articles link extra routines.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/36011518408983-How-to-Access-and-Use-Hevy-s-Routine-and-Program-Library"]}, {"has": "partial", "how": "No classic multi-week program library. Instead: algorithmic daily workouts within a split; 'Focus Exercises' run a 4-week, 4-phase cycle (Build Momentum, Dial It In, Close to Peak Effort, Final Push) on main compound lifts; iOS 'On Demand Workouts' are 9 pre-built sessions (bodyweight, dumbbell, kettlebell, bands, BOSU, TRX; 15-30 min).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/35301260960663-Focus-Exercises", "https://help.fitbod.me/hc/en-us/articles/28568837402775-On-Demand-Workouts", "https://help.fitbod.me/hc/en-us/articles/34336407191191-My-Plan"]}, {"has": "partial", "how": "Multi-week plans: generated plans 4-7 weeks (default 4) or indefinite; manual plans 1-52 weeks or indefinite; repeat/extend/regenerate at the end. No curated library of named programs - entry points are generate, build own, or open a shared plan link.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator"]}, {"has": "yes", "how": "About 60 built-in programs (GZCLP and GZCL family, 5/3/1 variants, Starting Strength, PHUL, Basic Beginner Routine, Strong Curves...) filterable by experience, days/week, session length and goal; preview every day; clone into your own editable copy.", "fb": "", "src": ["https://www.liftosaur.com/features/built-in-programs", "https://apps.apple.com/us/app/liftosaur-scriptable-workouts/id1661880849"]}, {"has": "yes", "how": "200+ programs and stand-alone workouts (powerlifting, bodybuilding, powerbuilding, PPL, sport-specific) filterable by Free/Premium, level and category; 'Follow program' puts next workout on home; skip/unfollow; full catalog is Premium.", "fb": "", "src": ["https://help.strengthlog.com/help-article/follow-a-program/", "https://www.strengthlog.com/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "yes", "how": "Routine database with ~26,800 plans filterable by goal/level/days (community + JEFIT); 'Elite' professionally designed plans are paywalled.", "fb": "", "src": ["https://www.jefit.com/routines", "https://www.jefit.com/elite", "https://www.jefit.com/support/faq"]}, {"has": "yes", "how": "Core of the app: 11,000+ programs incl. 130+ coach-designed (Wendler 5/3/1, nSuns, GZCLP, PHUL/PHAT, Reddit PPL, Sheiko, Candito, Helms, Nuñez...), filterable by level, goal, days/week; ~20 coach programs are Pro-exclusive. You can join multiple programs at once.", "fb": "", "src": ["https://www.boostcamp.app/features", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://fortune.com/article/boostcamp-review/"]}, {"has": "paid", "how": "Explore tab: 130+ pre-made workouts by personal trainers, in categories; can be adjusted to your equipment list and edited once added. Only on the Premium+ plan.", "fb": "", "src": ["https://help.smartgymapp.com/article/125-how-to-use-smartgym", "https://help.smartgymapp.com/article/81-access-pre-made-workouts", "https://help.smartgymapp.com/article/95-already-premium-pre-made-workouts", "https://smartgymapp.com/"]}, {"has": "paid", "how": "Workout Library (Plus): 120+ coach-designed plans with filters (duration, frequency, equipment...), coach bio, editable after adding; 28 new 45-min plans in 5.7; mobility workouts addable to plans; pregnancy/postpartum plans. Pro: new 4-week plans monthly.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-400-workout-library-nutrition-targets-updated-plans-screen-uxui", "https://feedback.caliberstrong.com/announcements/caliber-570-export-workout-data-plans-section-rebuild-dark-mode", "https://apps.apple.com/us/app/caliber-strength-training/id1482405410", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257573-caliber-pro-user-guide", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/pregnancy-and-postpartum-specific-plans"]}]}, {"id": "plan_periodization", "area": "plan", "areaPL": "Szablony i programy", "label": "Periodyzacja/% 1RM/deload", "others": 6.5, "cells": [{"has": "no", "how": "No deload weeks, blocks or %1RM-based prescriptions. A template's start weight is an absolute value.", "fb": "", "src": ["lib/seed.ts:TemplateItem"]}, {"has": "no", "how": "No % of 1RM prescriptions, blocks or deload scheduling documented; Strong is described by itself and reviewers as a logger that does not build programmes.", "fb": "", "src": ["https://aitoolsbakery.com/blog/strong-app-review/", "https://help.strongapp.io/article/133-1rm"]}, {"has": "partial", "how": "Hevy Trainer 'Program Variety': Consistent / Balanced (exercises rotate ~every 6 weeks) / Variable (weekly). Percentage-based warm-up calculator. No % of 1RM working-set prescriptions or deload scheduling documented.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/43572343844247-How-Hevy-Trainer-Settings-Work", "https://www.hevyapp.com/features/workout-plan-generator/", "https://help.hevyapp.com/hc/en-us/articles/35650921359639-How-to-Use-the-Warm-Up-Calculator-for-Percentage-Based-Warm-Up-Sets"]}, {"has": "partial", "how": "Automatic non-linear periodization: mStrength varies intensity/volume between sessions (heavy-low rep vs light-high rep days); Focus Exercises 4-phase/4-week cycle; Max Effort Days (ramp sets + 2 AMRAP sets) recalibrate. No user-defined %1RM blocks or scheduled deloads.", "fb": "Review: 'Mechanical plateau handling (weight reduction only, not strategic deloads)' (sensai.fit 2026).", "src": ["https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight", "https://help.fitbod.me/hc/en-us/articles/35301260960663-Focus-Exercises", "https://help.fitbod.me/hc/en-us/articles/360033675553-Max-Effort-Day", "https://apps.apple.com/us/app/fitbod-gym-fitness-planner/id1041517543"]}, {"has": "paid", "how": "Pro: periodization across a mesocycle (plans >=2 weeks) varies sets, rep targets, dropsets and RIR targets week to week; optional deload at plan end (not for indefinite plans) or mark any workout as deload. Not %1RM-based.", "fb": "Advanced users praise built-in periodization replacing Excel (App Store reviews).", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator"]}, {"has": "yes", "how": "Multi-week programs ('# Week N'), % of 1RM, RPE targets, set variations, per-week overrides, deload weeks via 'progress: none', lp() with deload-after-N-failures parameters; everything scriptable.", "fb": "", "src": ["https://www.liftosaur.com/doc/liftoscript", "https://www.liftosaur.com/features/progressions"]}, {"has": "yes", "how": "Multi-week program builder (copy week to next week and edit), % of 1RM sets (premium) using stored 'My 1RMs', RPE/RIR-based sets (premium), retrieve-from-log + fixed progression increment (premium). v9.0 adds Simple and Detailed builders with Smart Blocks.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-build-a-program/", "https://help.strengthlog.com/help-article/1rm-for-programs/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "paid", "how": "Elite: Adaptive Plan builds three 4-phase mesocycles (On-Ramp, Accumulation, Intensification, Deload; ~1 week per phase) for 3-6 days/wk; since Aug 2026 'Auto-apply periodization' runs the same phase wave on user-built plans, changing only weights/reps, with Bridge weeks when a phase underperforms. %1RM entry is not supported.", "fb": "", "src": ["https://www.jefit.com/blog/adaptive-mesocycle-training-jefits-smarter-way-to-progress", "https://www.jefit.com/blog/periodization-on-your-own-plan", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "yes", "how": "Programs encode percentages of training max, AMRAP targets, waves and deloads; you enter starting lifts and weights are calculated weekly. Custom builder supports multi-week mesocycles and training-max waves.", "fb": "", "src": ["https://www.boostcamp.app/vs/hevy", "https://www.boostcamp.app/features", "https://www.garagegymreviews.com/boostcamp-review"]}, {"has": "partial", "how": "Smart Trainer claims NSCA-style periodization: refine the routine after each workout, then rewrite the whole program at a 'transition point' (plateau, end of block). Refresh frequency configurable (Automatic / more often / 'Never'). No %1RM-based programming or explicit deload weeks documented.", "fb": "", "src": ["https://smartgymapp.com/features.html", "https://help.smartgymapp.com/article/145-how-often-smart-trainer-refreshes-your-routines", "https://smartgymapp.com/releases/smartgym-7-9"]}, {"has": "no", "how": "No %1RM, block or deload programming in the app; FAQ: 'Do my workouts change automatically each week? No.' Periodization only via human coach (Premium) or monthly Pro plans.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://www.garagegymreviews.com/caliber-app-review"]}]}, {"id": "plan_generator", "area": "plan", "areaPL": "Szablony i programy", "label": "Generator treningów (AI/algorytm)", "others": 7.5, "cells": [{"has": "no", "how": "No algorithmic or AI workout generation. The 'recommendations' module is a disabled placeholder ('wkrótce').", "fb": "", "src": ["lib/seed.ts:MODULES_AVAILABLE"]}, {"has": "no", "how": "No AI or algorithmic workout generation on Strong's official pages (research-based review, Sep 2026).", "fb": "", "src": ["https://aitoolsbakery.com/blog/strong-app-review/", "https://prpath.app/blog/strong-vs-hevy-2026.html"]}, {"has": "paid", "how": "Hevy Trainer (Pro, launched Feb 2026): onboarding questions (goal Gain Strength/Build Muscle/Fat Loss, level, sex, age, weight, height, equipment, frequency 1–6/wk, cardio, duration, focus muscle) → algorithmic (explicitly not AI) program. Default split by frequency: 1–3 Full Body, 4 Upper/Lower, 5 PPL+UL, 6 PPL×2. Supports injuries, excluded exercises, equipment presets/custom. Also plan generation via the Hevy app in ChatGPT (@hevy).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/38385724273047-Hevy-Trainer-Explained-How-It-Builds-Your-Workout-Program", "https://help.hevyapp.com/hc/en-us/articles/43572343844247-How-Hevy-Trainer-Settings-Work", "https://www.hevyapp.com/features/workout-plan-generator/", "https://help.hevyapp.com/hc/en-us/articles/43652076665239-What-is-the-Hevy-App-on-ChatGPT", "https://prpath.app/blog/strong-vs-hevy-2026.html"]}, {"has": "yes", "how": "Core of the app. Inputs: goal (7 goals incl. Powerlifting, Olympic WL), experience (Beginner/Intermediate/Advanced), equipment per gym, split (PPL, Upper/Lower, Full Body, Fresh Muscle Groups; more with Focus Exercises), duration, variability, warm-ups, cardio, stretching, supersets, timed intervals, injuries. Selection uses effectiveness data from 87M+ logged workouts, per-muscle recovery and explicit/implicit preferences. Workout regenerates when history, equipment or settings change (edits before Start are lost).", "fb": "Common complaints: illogical exercise order/weights, repetitive after months, neglects muscle groups (justuseapp; lasta.app).", "src": ["https://help.fitbod.me/hc/en-us/articles/360004429814-How-Fitbod-Creates-Your-Workout", "https://help.fitbod.me/hc/en-us/articles/43489509474455-How-does-Fitbod-choose-which-exercises-to-give-me", "https://help.fitbod.me/hc/en-us/articles/34336407191191-My-Plan", "https://help.fitbod.me/hc/en-us/articles/42333470514455-Why-did-my-workout-change-Understanding-workout-refreshes", "https://help.fitbod.me/hc/en-us/articles/15948615409687-Fitness-Goals"]}, {"has": "paid", "how": "Pro, server-side (needs internet). Inputs: gender, experience (Beginner <6 mo, Intermediate 6+ mo, Advanced 1.5+ y, Pro 4+ y, Elite 8+ y), gym equipment, goal (Max strength / Muscle gain / Strength endurance -> rep targets), frequency, relative duration, muscle priorities (prioritize/deprioritize, relative), split (Automatic incl. hybrids, Full body, Upper-lower, Push-pull, PPL, PPL-upper-lower), plan length, optional RIR/periodization/deload. Outputs split, exercises, order, sets, reps, dropsets; some randomness among equal options. Standalone workout generator: Full body/Upper/Lower with nested focus (e.g., Upper > Push > Chest) or auto-focus from recent training.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator", "https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/subscribe"]}, {"has": "partial", "how": "No built-in generator; AI generation happens in external assistants (ChatGPT plugin, Claude/Gemini via MCP) that read the Liftoscript reference, write a program, test it with run_playground and save it. Account-touching tools need Premium.", "fb": "App Store 2026-09 (5*): 'I told ChatGPT what I wanted ... it created a workout program for me, and now I track everything in Liftosaur.' https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/chatgpt-claude-and-ai"]}, {"has": "partial", "how": "No AI generator. Minigames (Name Game, Dice Game, Card Game) generate randomized bodyweight-style sets; Smart Blocks automate progression but you pick exercises.", "fb": "", "src": ["https://help.strengthlog.com/help-article/minigames/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "partial", "how": "Instant Workout / 'Mix' generates a session from duration, target muscles (optionally auto-picked from 80-100% recovered muscles) and equipment; limited uses free, unlimited for Elite. Adaptive Plan generates a 12-week program from goal, level, frequency, equipment and session length (Elite; 7-day free trial since v17.0.13).", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/jefit-app-new-release-mix-workout-feature", "https://www.jefit.com/blog/adaptive-mesocycle-training-jefits-smarter-way-to-progress", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "paid", "how": "'AI Coach' / personalized programs: short questionnaire (goal, experience, schedule, equipment) builds a multi-week starter periodization plan you can edit (Pro); 'Create programs with AI' added Mar 2026.", "fb": "", "src": ["https://www.boostcamp.app/pro", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "yes", "how": "Smart Trainer builds routines from equipment list, goal, experience (beginner/intermediate/advanced), target muscles, duration and days/week (PPL 3- or 6-day option). Import From Text (Apple Foundation Models, on-device, iOS 26) and natural-language workout creation (8.0, cloud 'SmartGym Intelligence' via AWS Bedrock, opt-in), also on Watch.", "fb": "Critical review (2024): 'skill levels do not mean anything ... routines have no rhyme or reason ... does not create supersets' - https://apps.apple.com/us/app/smartgym-gym-home-workouts/id922744883", "src": ["https://help.smartgymapp.com/article/127-what-is-smart-trainer", "https://help.smartgymapp.com/article/129-how-do-i-use-smart-trainer", "https://help.smartgymapp.com/article/147-ppl-workouts-smart-trainer", "https://help.smartgymapp.com/article/150-import-routine-from-text", "https://apps.apple.com/us/app/smartgym-gym-home-workouts/id922744883", "https://smartgymapp.com/privacy/"]}, {"has": "yes", "how": "Workout Wizard: answer questions (goal, experience, equipment incl. 'No Equipment', schedule) to generate a plan. Not AI; company states it has not used AI in-app.", "fb": "'changing your goals when you sign up ... doesn't change any of the workout plans the wizard comes up with' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=1482405410/sortby=mostrecent/json", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://apps.apple.com/us/app/caliber-strength-training/id1482405410", "https://feedback.caliberstrong.com/announcements/caliber-514-515-improvements-to-exercise-search-progress-photo-gallery-revamp-mcp-support-for-chatgp"]}]}, {"id": "plan_schedule", "area": "plan", "areaPL": "Szablony i programy", "label": "Kalendarz/plan tygodnia", "others": 6.0, "cells": [{"has": "no", "how": "No calendar or weekly plan. The Home list only shows the last date each template was used ('ostatnio <date>').", "fb": "", "src": ["app/(tabs)/index.tsx:Home"]}, {"has": "partial", "how": "Homepage feature list mentions 'Workout Scheduling'; Workouts-per-Week profile/home-screen widget with weekly goal; Calendar widget (6.4.0) shows monthly workouts and weekly streaks. No help article describes planning workouts on future dates.", "fb": "", "src": ["https://www.strong.app/", "https://help.strongapp.io/article/239-profile-widgets", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, {"has": "partial", "how": "Calendar shows completed workouts only ('cannot be used to plan'); 'Routine of the Day' widget assigns routines to weekdays; Trainer assigns workouts per week with weekly tracker.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35380117933207-Track-Your-Workout-Consistency-with-the-Calendar-and-Streak-Features", "https://help.hevyapp.com/hc/en-us/articles/36956630666647-Hevy-App-Widgets-Explained-Setup-Features-and-How-to-Use-Them", "https://help.hevyapp.com/hc/en-us/articles/43572343844247-How-Hevy-Trainer-Settings-Work"]}, {"has": "partial", "how": "Workouts/Week as count or specific days with optional workout preview notifications; start-of-week setting (iOS). No built-in weekly planner/calendar of future workouts - help suggests saving named workouts per day as a workaround.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360013245993-Weekly-Workout-Goal-Previews-Streaks", "https://help.fitbod.me/hc/en-us/articles/34336407191191-My-Plan", "https://help.fitbod.me/hc/en-us/articles/6259258835863-Save-a-Workout"]}, {"has": "no", "how": "Plans are a sequence, not calendar-bound: missed workouts just continue with the next; only a weekly workout target (1-7) for streaks.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator", "https://alphaprogression.com/en/support"]}, {"has": "partial", "how": "Programs run as an ordered sequence of days with a 'Next Day' pointer; you can pick any day as next. No calendar-date scheduling; week start (Sun/Mon) setting only affects history/insights.", "fb": "", "src": ["https://www.liftosaur.com/features/changing-a-workout", "https://www.liftosaur.com/features/program-editor", "https://www.liftosaur.com/features/first-run-and-settings"]}, {"has": "yes", "how": "Plan a workout for a date (home widget + calendar); v9.0 home calendar to start, plan, add events and schedule followed programs.", "fb": "App Store 2026-09 (1*): 'I used to be able to easily plan a workout. That option is no longer available' after 9.0. https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json", "src": ["https://help.strengthlog.com/help-article/how-to-plan-a-workout-for-later/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "yes", "how": "Calendar in Progress tab; Adaptive Plan lets you pick training days by weekday with workout reminders at 5 PM; week start day configurable; progression plans auto-advance to the next day.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/periodization-on-your-own-plan"]}, {"has": "yes", "how": "Planner icon shows scheduled workouts across all weeks of a program; app proposes the next day in sequence; push notifications preview next workout and calendar invites are available.", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.garagegymreviews.com/boostcamp-review", "https://fortune.com/article/boostcamp-review/"]}, {"has": "partial", "how": "Routine 'Days' field is only a label (or a number of days/week since 7.3); 'Up Next' shows the next routine. No calendar planner; AlarmKit alarms (7.7) can be scheduled as gym reminders.", "fb": "", "src": ["https://help.smartgymapp.com/article/131-change-days-routines", "https://smartgymapp.com/releases/smartgym-7-3", "https://smartgymapp.com/releases/smartgym-7-7", "https://9to5mac.com/2023/01/19/smartgym-for-ios-and-apple-watch-update/"]}, {"has": "partial", "how": "Select a future date + red + to schedule a workout; calendar with month view and unlimited history. Recurring scheduling not available yet (Planned, 1004 votes); coaches can set recurring for Premium clients.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-3127-home-screen-and-calendar-revamp-activity-summaries", "https://feedback.caliberstrong.com/announcements/caliber-3120-unlimited-calendar-visibility-performance-enhancements", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/recurring-activity-scheduling"]}]}, {"id": "plan_share_templates", "area": "plan", "areaPL": "Szablony i programy", "label": "Udostępnianie szablonów", "others": 10, "cells": [{"has": "no", "how": "Templates can't be shared individually. They only move as part of the full JSON backup.", "fb": "", "src": ["lib/backup.ts:exportBackup"]}, {"has": "yes", "how": "Template/workout ... > Share uses system share sheet with a link; recipient taps link to import (needs Strong installed and an account). Strong 6 changed link format — old links incompatible.", "fb": "", "src": ["https://help.strongapp.io/article/109-share-workout-or-template", "https://help.strongapp.io/article/255-share-links", "https://help.strongapp.io/article/143-strong-account"]}, {"has": "yes", "how": "Share Routine / folder via link; viewable without Hevy account; recipient sees exercises but your weights/reps are not shared (their own history fills in) — rep ranges are shared. Others' workouts can be 'Save as Routine' or 'Copy Workout'.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34953501503895-How-to-Share-Workouts-and-Routines-in-Hevy", "https://help.hevyapp.com/hc/en-us/articles/35688036014231-Hevy-App-Social-Guide-Connect-Follow-and-Share-Your-Workouts"]}, {"has": "yes", "how": "'Share Workout Link' sends a workout; the recipient's copy adapts sets/reps/weights to their own history (same exercises/order). Workouts with custom exercises can't be shared. Gym location (equipment) setups can also be shared.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006427453-Sharing-a-Workout-Gym-Location-Settings", "https://help.fitbod.me/hc/en-us/articles/34336407191191-My-Plan"]}, {"has": "yes", "how": "Free: share plans or workouts via unique link and QR code; includes name, exercises (also custom), targets, supersets - no logged sets or notes. Recipient gets an editable copy.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Program menu: public short link (liftosaur.com/p/...) with custom exercises and units, program image with QR code, private link for laptop editing, export all programs as text. Links are immutable snapshots.", "fb": "", "src": ["https://www.liftosaur.com/features/sharing-programs"]}, {"has": "paid", "how": "Share own program, planned or completed workout via link (share sheet); sharer needs Premium, receiver needs app v6.0+; only standard exercises; receiver needs Premium if it uses premium features.", "fb": "", "src": ["https://help.strengthlog.com/help-article/share-workouts/"]}, {"has": "yes", "how": "Custom routines get a share code + QR/link after publishing; pre-built routines share via link; web builder shares a plan by copying its link.", "fb": "", "src": ["https://www.jefit.com/blog/routine-sharing-code-and-how-to-generate-one", "https://www.jefit.com/blog/introducing-new-routine-builder-workout-planning-simplified"]}, {"has": "yes", "how": "Custom programs can be shared via private link (recipient taps Save) or published to the community library; programs can be forked.", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.boostcamp.app/custom-program", "https://www.boostcamp.app/features"]}, {"has": "yes", "how": "Routine shared as a file (AirDrop, email, iMessage, WhatsApp) and imported into SmartGym; also shareable as text or image (for Android users).", "fb": "", "src": ["https://help.smartgymapp.com/article/120-share-a-routine", "https://help.smartgymapp.com/article/121-import-a-routine", "https://help.smartgymapp.com/article/97-students-routines-android"]}, {"has": "paid", "how": "Share workouts/plans via link, inside groups or QR code (3.1.0); custom exercises travel with the shared workout. Sharing custom workouts listed as Plus feature.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-310-workout-sharing-disable-strength-score-for-workouts-fix-for-logout-issue", "https://feedback.caliberstrong.com/announcements/caliber-3118-custom-exercises", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257778-account-management-user-guide"]}]}, {"id": "lib_size", "area": "lib", "areaPL": "Biblioteka ćwiczeń", "label": "Liczba ćwiczeń", "others": 9.5, "cells": [{"has": "yes", "how": "125 built-in exercises across 11 groups (chest, back, shoulders, biceps, triceps, legs, glutes, calves, core, cardio, other). Equipment types: dumbbell, barbell, bodyweight, machine, cable, other.", "fb": "", "src": ["lib/seed.ts:LIB", "lib/seed.ts:GROUPS"]}, {"has": "yes", "how": "'Over 200 built in exercises' per help center (third-party claims of 300–450+ conflict with this).", "fb": "", "src": ["https://help.strongapp.io/article/97-create-custom-exercises", "https://help.strongapp.io/article/236-best-way-to-train", "https://aitoolsbakery.com/blog/strong-app-review/"]}, {"has": "yes", "how": "400+ exercises (Hevy Coach also says 400+); covers barbell, plate, dumbbell, kettlebell, machine, band, suspension, bodyweight; HYROX/functional exercises added May 2026.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35688251991575-Hevy-Exercise-Library-400-Exercises-and-Custom-Exercises", "https://hevycoach.com/pricing/", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350"]}, {"has": "yes", "how": "1,600+ exercises per help center (App Store text still says 1000+; older articles 1,500+). Includes cardio, stretching/mobility, soft tissue, primers, 30+ pregnancy-safe exercises.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360004429814-How-Fitbod-Creates-Your-Workout", "https://help.fitbod.me/hc/en-us/articles/31891449815703-Fitbod-for-Business-Program-Overview-Benefits", "https://apps.apple.com/us/app/fitbod-gym-fitness-planner/id1041517543", "https://help.fitbod.me/hc/en-us/articles/26850494278551-Pregnancy"]}, {"has": "yes", "how": "795 built-in exercises (Sept 2026), curated for strength/hypertrophy, plus home, stability and cardio exercises.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/fact-sheet"]}, {"has": "yes", "how": "Docs say 'hundreds of built-in exercises'; the public directory lists ~364 exercise+equipment combinations (counted 2026-10-02).", "fb": "", "src": ["https://www.liftosaur.com/features/exercise-library", "https://www.liftosaur.com/exercises"]}, {"has": "yes", "how": "Help center (Apr 2026) says 'over 600 exercises'; store listing says 500+ strength, mobility and cardio exercises (website still says
