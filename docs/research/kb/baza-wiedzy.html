/en-us/articles/35688251991575-Hevy-Exercise-Library-400-Exercises-and-Custom-Exercises"]}, {"has": "yes", "how": "Create via +Add Exercise > search > Create New Exercise: name, primary + secondary muscles, tracking (reps or timed, weighted or bodyweight), unilateral/bilateral, optional equipment. Cannot be edited after creation (delete & recreate); excluded from auto-recommendations and progression; count toward recovery and calories; no distance tracking; private.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/28062570249623-Custom-Exercises"]}, {"has": "yes", "how": "Create or copy an existing exercise: name, image (Pro, from camera/library), equipment, main muscle, multiple auxiliary muscles, type (compound/isolation...), metrics, bodyweight involvement 0-100%. Not used by generators.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Name, image (library/camera/photo, account needed to upload), target/synergist muscles, types, Markdown notes; 'Autofill Muscles and Types' asks an AI model; 'Clone from another exercise'. Renaming updates program text.", "fb": "", "src": ["https://www.liftosaur.com/features/custom-exercises"]}, {"has": "yes", "how": "Unlimited custom exercises (free): from scratch or copied from existing; type (strength/cardio/mobility), variables, primary/secondary muscles, bodyweight factor, one-sided flag. Delete requires moving logged data to an exercise with same variables.", "fb": "", "src": ["https://help.strengthlog.com/help-article/adding-a-new-exercise/", "https://help.strengthlog.com/help-article/how-do-i-change-delete-an-exercise/"]}, {"has": "yes", "how": "Custom exercises with primary/secondary equipment and optional muscle groups (redesigned flow v17.0.12); custom images can be uploaded on the web. JEFIT's own listicle lists 'unlimited custom exercise creation' as an Elite perk, implying a free cap.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/best-strength-training-apps-for-2026-7-options-tested-by-lifters"]}, {"has": "yes", "how": "Custom exercises allowed, free, no cap.", "fb": "", "src": ["https://www.boostcamp.app/features", "https://www.garagegymreviews.com/boostcamp-review"]}, {"has": "yes", "how": "Custom exercises with own images; since 7.10 support secondary muscles and equipment and can be used by Smart Trainer. Renamed via More > Manage Added Exercises. Built-in exercises can be removed/restored (7.6).", "fb": "Praised: 'ability to easily create custom exercises with your own images is one of the best implementations' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json", "src": ["https://help.smartgymapp.com/article/76-own-custom-exercise", "https://help.smartgymapp.com/article/115-rename-custom-exercise", "https://smartgymapp.com/releases/smartgym-7-10", "https://help.smartgymapp.com/article/143-how-to-remove-exercises-from-the-app"]}, {"has": "paid", "how": "Custom exercises (3.1.18) with name, muscle groups, equipment, rep- or time-based; private to user; deleting one deletes its history. Listed as Plus on App Store.", "fb": "Request for photos/thumbnails on custom exercises - https://itunes.apple.com/us/rss/customerreviews/page=3/id=1482405410/sortby=mostrecent/json", "src": ["https://feedback.caliberstrong.com/announcements/caliber-3118-custom-exercises", "https://apps.apple.com/us/app/caliber-strength-training/id1482405410"]}]}, {"id": "lib_muscles", "area": "lib", "areaPL": "Biblioteka ćwiczeń", "label": "Mięśnie główne/pomocnicze", "others": 9.5, "cells": [{"has": "yes", "how": "Each exercise has primary muscles (count 1 set) and secondary muscles (count 0.5 set) from 11 muscles: chest, back, shoulders, biceps, triceps, quads, hamstrings, glutes, calves, core, forearms. Main lifts are pre-mapped; others default from their group. Both are editable as chips.", "fb": "", "src": ["lib/seed.ts:MUSCLES", "lib/seed.ts:MUSCLES_BY_NAME", "app/exercise/[id].tsx"]}, {"has": "partial", "how": "Exercises are categorised by body part (e.g. arms, back); primary/secondary muscle mapping not documented. Homepage mentions a 'Muscle Heat Map'.", "fb": "", "src": ["https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577", "https://www.strong.app/"]}, {"has": "yes", "how": "Primary and secondary muscle targets; muscle groups incl. abdominals, shoulders, biceps, triceps, forearms, quads, hamstrings, calves, glutes, abductors, adductors, lats, upper back, traps, lower back, chest, neck, full body.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34264544382615-How-to-Create-Edit-and-Duplicate-Custom-Exercises-in-Hevy", "https://api.hevyapp.com/docs/"]}, {"has": "yes", "how": "Each exercise has Primary and secondary muscle targets (How To > Target tab). Primary sets count 1, secondary 0.5 for weekly set targets (another section says only primary counts).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/24739986755223-Weekly-Set-Targets", "https://help.fitbod.me/hc/en-us/articles/28062570249623-Custom-Exercises"]}, {"has": "yes", "how": "Main targeted muscle + auxiliary muscles per exercise; muscle filter; charts for sets per muscle.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Target and synergist muscles and groups per exercise; per-user 'Override Muscles' with 0-1 multipliers; custom muscle groups (e.g., split delts), hide built-in groups.", "fb": "", "src": ["https://www.liftosaur.com/features/exercise-library", "https://www.liftosaur.com/features/custom-exercises"]}, {"has": "yes", "how": "Primary (dark red) and secondary (pink) muscles per exercise drive the muscle map.", "fb": "", "src": ["https://help.strengthlog.com/help-article/adding-a-new-exercise/", "https://help.strengthlog.com/help-article/finding-the-right-excercises/"]}, {"has": "yes", "how": "Exe nd target muscle; equipment categories none/barbell/dumbbell/kettlebell/machine/plate/band/suspension/other.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35688251991575-Hevy-Exercise-Library-400-Exercises-and-Custom-Exercises", "https://api.hevyapp.com/docs/"]}, {"has": "yes", "how": "Equipment is a hard filter for generation; add-exercise filter 'only exercises that match your available equipment'; categories By Equipment, Weighted, Bodyweight Only, Bodyweight with Equipment, Cardio, Stretching & Mobility, Pregnancy.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/43489509474455-How-does-Fitbod-choose-which-exercises-to-give-me"]}, {"has": "yes", "how": "Database shows only exercises available with the active gym's equipment (custom always shown); per-exercise whitelist/blacklist overrides.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Filter by equipment, type (Core/Pull/Push/Legs/Upper/Lower), muscle groups or single muscles; 'Show only available equipment' hides exercises needing hidden equipment.", "fb": "", "src": ["https://www.liftosaur.com/features/exercise-library"]}, {"has": "yes", "how": "Filter by equipment type (long-press to isolate one), by muscle via tappable body map, and standard vs own exercises.", "fb": "", "src": ["https://help.strengthlog.com/help-article/finding-the-right-excercises/"]}, {"has": "yes", "how": "Database filters by 11 muscle groups and 12 equipment types (Body Weight, Bands, Barbell, Bench, Dumbbell, Exercise Ball, EZ Bar, Kettlebell, Cardio Machine, Strength Machine, Pull-up Bar, Weight Plate).", "fb": "", "src": ["https://www.jefit.com/exercises"]}, {"has": "partial", "how": "Exercises are categorized by equipment (barbell, dumbbell, kettlebell, machine, bodyweight, cable) on the web guide; in-app filtering not documented.", "fb": "", "src": ["https://www.boostcamp.app/exercises"]}, {"has": "yes", "how": "Exercise list can be filtered to a selected Equipment List (up to 5).", "fb": "", "src": ["https://help.smartgymapp.com/article/136-different-equipment-lists"]}, {"has": "yes", "how": "Equipment filters combinable with muscle-group and Type (Strength/Mobility) filters.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-3116-exercise-search-screen-revamp-added-equipment-filters", "https://feedback.caliberstrong.com/announcements/caliber-530-exercise-search-screen-revamp-and-more"]}]}, {"id": "lib_search", "area": "lib", "areaPL": "Biblioteka ćwiczeń", "label": "Wyszukiwanie", "others": 10, "cells": [{"has": "yes", "how": "Search in the Exercises tab, picker and Progress screen ignores case and Polish diacritics ('lydki' finds 'Łydki'). It matches both the stored and translated names. An exact match is shown even when it falls outside the group filter. Archived matches offer 'Przywróć' (restore), and no match offers to create the exercise.", "fb": "", "src": ["lib/i18n.ts:fold", "app/picker.tsx", "app/(tabs)/exercises.tsx"]}, {"has": "yes", "how": "Search bar in the exercise library; 6.3.2 (Apr 2026) added highlighting of matched characters and improved ranking.", "fb": "", "src": ["https://help.strongapp.io/article/97-create-custom-exercises", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, {"has": "yes", "how": "Search bar in library; recently logged exercises listed first, then custom ones.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35382889578135-Exercise-Performance-Tracking-in-Library-Weight-Bodyweight-Cardio-and-Duration-Based-Exercises"]}, {"has": "yes", "how": "Search by keyword; tabs All / By Muscle / Categories (incl. Recently Added, Added by Me); sort alphabetically or by Most Logged.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://apps.apple.com/us/app/fitbod-gym-fitness-planner/id1041517543"]}, {"has": "yes", "how": "Search plus filters (muscle, equipment, type: large compound/medium/small isolation/stability/cardio) and sorts: Most used, Most recent (shows time since last), Most popular (default; based on 25M workouts), A-Z; shows count performed.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Search matches name and equipment words ('incline dumbbell'); favorites star; multi-select add; sort by name or Similar Muscles.", "fb": "", "src": ["https://www.liftosaur.com/features/exercise-library"]}, {"has": "yes", "how": "Search plus 'Most used' list that adapts to your own usage; sort alphabetically or by usage.", "fb": "", "src": ["https://help.strengthlog.com/help-article/finding-the-right-excercises/"]}, {"has": "yes", "how": "Searchable/filterable exercise database in app and web; routine search by sharing code.", "fb": "", "src": ["https://www.jefit.com/exercises", "https://www.jefit.com/blog/routine-sharing-code-and-how-to-generate-one"]}, {"has": "yes", "how": "Exercise search in the program creator; programs can be searched by exercise (Mar 2026).", "fb": "", "src": ["https://www.boostcamp.app/custom-program", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "yes", "how": "Exercise list is searchable; alternative-exercise picker has search (7.6).", "fb": "'Searching for weight training exercises is hard' - https://itunes.apple.com/us/rss/customerreviews/page=1/id=922744883/sortby=mostrecent/json", "src": ["https://smartgymapp.com/releases/smartgym-7-6"]}, {"has": "yes", "how": "Incremental search; since 5.14 results and filters ranked by exercise popularity (users completing it). Favorites are In Progress; semantic/alias search planned.", "fb": "'if I don't know the specific wording that the app uses, the exercise doesn't come up' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=1482405410/sortby=mostrecent/json", "src": ["https://feedback.caliberstrong.com/announcements/caliber-514-515-improvements-to-exercise-search-progress-photo-gallery-revamp-mcp-support-for-chatgp", "https://feedback.caliberstrong.com/announcements/caliber-530-exercise-search-screen-revamp-and-more", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/exercise-favoriting"]}]}, {"id": "lib_localization", "area": "lib", "areaPL": "Biblioteka ćwiczeń", "label": "Języki biblioteki", "others": 4.5, "cells": [{"has": "yes", "how": "Library names are canonical (mostly English with Polish suffixes). In English, exName() translates full Polish names and the bracket suffixes (sztanga → Barbell). Custom or renamed exercises are shown as typed. Groups, equipment and muscles are translated at display time.", "fb": "", "src": ["lib/i18n.ts:exName", "lib/i18n.en.ts"]}, {"has": "partial", "how": "App available in 11 languages (EN, FR, DE, IT, JA, KO, PT, RU, zh-Hans, ES, zh-Hant); no Polish. Whether exercise names are localized is not documented.", "fb": "", "src": ["https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, {"has": "yes", "how": "App in 16 languages incl. Polish (App Store) with 5 more added Sep 2026 'across the app and hevy.com'. Strong CSV import requires English exports.", "fb": "", "src": ["https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350", "https://help.hevyapp.com/hc/en-us/articles/35687878672663-Importing-Strong-Data-into-Hevy"]}, {"has": "partial", "how": "Exercise content in app languages only: English, Spanish, Portuguese.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/26850917322519-Is-Fitbod-available-in-other-languages"]}, {"has": "yes", "how": "Exercise content in 13 app languages (EN, DE, ES, FR, PT-BR, IT, PL, TR, NL, SV, NO, DA, JA).", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "no", "how": "App Store lists English only; docs and exercise names are English.", "fb": "", "src": ["https://apps.apple.com/us/app/liftosaur-scriptable-workouts/id1661880849"]}, {"has": "partial", "how": "App Store lists English only; the official web build contains a full Swedish translation and an in-app language switch (English/Swedish). (evidence: UI strings in StrengthLog's official Flutter web build; release status in mobile app not confirmed by help center)", "fb": "", "src": ["https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662", "https://app.strengthlog.com/main.dart.js"]}, {"has": "partial", "how": "App UI in English, French, German, Italian, Simplified Chinese, Spanish; whether exercise names/instructions are translated is not documented.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "no", "how": "App Store lists English as the only language.", "fb": "", "src": ["https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "partial", "how": "Exercise instructions natively in English and Portuguese; on-demand translation to Spanish, French, Italian, German via iOS 18 Translation framework.", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-5"]}, {"has": "no", "how": "App and content English only.", "fb": "", "src": ["https://apps.apple.com/us/app/caliber-strength-training/id1482405410"]}]}, {"id": "prog_suggestions", "area": "prog", "areaPL": "Progresja", "label": "Podpowiedzi ciężaru/powtórzeń", "others": 7.0, "cells": [{"has": "yes", "how": "A silent '↑ spróbuj X' hint appears in the exercise header; it never changes entered values and can be turned off in Settings. Condition: weight+reps metric, the template has a rep max, and every previous working set (failure counts, drops excluded, none with a band) reached that max. Steps: barbell/machine +2.5 kg (+5 lb); dumbbell or unilateral +1 kg (+2.5 lb); bodyweight with assistance reduces assistance by 2.5 kg (to 0 = 'bez asysty'), with added load +2.5 kg, with no load +1 rep.", "fb": "", "src": ["lib/store.ts:progressionFor", "components/ActiveWorkout.tsx:progText", "app/more/settings.tsx"]}, {"has": "no", "how": "No next-weight/rep suggestions; 'Strong logs what you do, it doesn't tell you what to do next' (reviews). Focus Metric only compares against last session.", "fb": "", "src": ["https://aitoolsbakery.com/blog/strong-app-review/", "https://www.findyouredge.app/news/best-strength-training-apps-apple-watch-2026", "https://help.strongapp.io/article/226-focus-metric"]}, {"has": "paid", "how": "Only inside Hevy Trainer (Pro): recommended starting weight if the exercise was logged at least once; automatic weight increases; 'push harder' reminders when progress stalls; progress markers on exercises. Outside Trainer, routines simply carry forward last values.", "fb": "", "src": ["https://www.hevyapp.com/features/workout-plan-generator/", "https://help.hevyapp.com/hc/en-us/articles/38385724273047-Hevy-Trainer-Explained-How-It-Builds-Your-Workout-Program", "https://help.hevyapp.com/hc/en-us/articles/34105442929943-Previous-Workout-Values-Vs-Routine-Values-How-to-Adjust-in-Settings"]}, {"has": "yes", "how": "Every set has recommended reps/weight from logged history: comfortable completion -> gradual load/rep increase; struggle -> ease back; after a break or for new exercises -> conservative weights (seeded from aggregate data). mStrength deliberately alternates heavy/light sessions. RiR and Max Effort Day AMRAP results refine 'Estimated Strength'. Weights respect available plate/dumbbell increments.", "fb": "Users often see lower-than-expected weights; Fitbod explains it as deliberate light days (help FAQ).", "src": ["https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight", "https://help.fitbod.me/hc/en-us/articles/43492523917207-How-does-Fitbod-adapt-as-I-get-stronger", "https://help.fitbod.me/hc/en-us/articles/34320813009431-Took-a-Break-Here-s-How-to-Recalibrate-Your-Fitbod-Recommendations", "https://www.sensai.fit/blog/fitbod-review-2026"]}, {"has": "paid", "how": "Pro, per working set: estimates achievable performance via an internal estimated 10RM from reference workout + today's completed sets, then picks a weight (hard constraint: available weights in active gym) and reps close to plan target, weighting deviations; optional RIR target. Updates set to set within a workout, can go down after underperformance, can trade weight for reps (e.g., 20kg x 10 -> 20kg x 11 ... 20kg x 15 -> 25kg x 6). No recommendation on first exercise use. Works with own plans and offline.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations", "https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Rule-based: per-exercise 'progress:' runs at workout finish and rewrites program text: lp(increment, successes, ..., deload weight, failures), dp(), sum(), or custom() scripts with state variables reading completedReps/RPE/weights. Preview of 'Exercise Changes' shown under the sets; can be suppressed once.", "fb": "", "src": ["https://www.liftosaur.com/features/progressions"]}, {"has": "yes", "how": "Rule-based, not adaptive: v9.0 Smart Blocks with Linear (weight up when all reps done), Double (rep range then weight) and Triple progression (reps, then sets, then weight); older Retrieve-from-log + fixed increment (premium); % of 1RM programs.", "fb": "Third-party review: 'the decision of when to add weight, when to deload ... sits with you' (pre-9.0 assessment). https://steelrep.app/blog/best-workout-apps-strength-training/", "src": ["https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662", "https://app.strengthlog.com/main.dart.js", "https://help.strengthlog.com/help-article/how-to-build-a-program/"]}, {"has": "paid", "how": "Elite Load Progression Engine: after each workout it evaluates working-set quality, Hard-Set Equivalents, rep drop-off (fatigue), short-term trend, goal and exercise role; primary lifts progress when the top of the rep range is hit with stable reps, accessories when most sets hit the top; jumps typically 2.5-5% (or next dumbbell / one machine pin). A purple star explains each target.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/the-science-behind-jefits-load-progression-engine", "https://www.jefit.com/blog/periodization-on-your-own-plan"]}, {"has": "partial", "how": "Free: program-defined auto-progression (coach rules / % of training max) fills next weights, bumps after hitting reps and adjusts down after misses. Pro (v266, Oct 2026): 'Auto Progression' personalized weight targets based on performance, for programs and empty workouts.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://www.boostcamp.app/vs/hevy", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "partial", "how": "For Smart Trainer (and imported-from-text) routines, Smart Trainer analyses logged sets and suggests reps/weight changes or exercise swaps via a blue banner; each suggestion can be disabled, with AI explanations (7.7). Not applied to purely custom routines per user reports.", "fb": "'Static Custom Routines ... custom routines feel more like a digital notepad than a smart coach' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json; 'lack of suggested weights' - https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json", "src": ["https://help.smartgymapp.com/article/129-how-do-i-use-smart-trainer", "https://help.smartgymapp.com/article/133-smart-trainer-update", "https://smartgymapp.com/releases/smartgym-7-7"]}, {"has": "no", "how": "No automatic weight/rep suggestions yet; 'Adaptive weight suggestions' In Progress (1122 votes) and 'guided progressions' announced as next backend work (Sep 2026).", "fb": "", "src": ["https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/adaptive-weight-suggestions", "https://feedback.caliberstrong.com/announcements/caliber-514-515-improvements-to-exercise-search-progress-photo-gallery-revamp-mcp-support-for-chatgp"]}]}, {"id": "prog_double_progression", "area": "prog", "areaPL": "Progresja", "label": "Podwójna progresja", "others": 5.5, "cells": [{"has": "yes", "how": "This is the progression model: you work up the template's rep range, and once all working sets hit the top, the hint proposes the next load step. There is no automatic rep-target change after a load increase.", "fb": "", "src": ["lib/store.ts:progressionFor"]}, {"has": "no", "how": "No progression rules engine documented.", "fb": "", "src": ["https://aitoolsbakery.com/blog/strong-app-review/", "https://www.findyouredge.app/news/best-strength-training-apps-apple-watch-2026"]}, {"has": "paid", "how": "Trainer rule: weight increases only after hitting the top of the rep range on all prescribed sets with that weight; since Aug 2026 also supports reps-only exercises (pull-ups, push-ups).", "fb": "", "src": ["https://www.hevyapp.com/features/workout-plan-generator/", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350"]}, {"has": "unknown", "how": "Progression is algorithmic (weight or reps increased); no explicit double-progression rule documented.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight"]}, {"has": "yes", "how": "Effectively double progression driven by available increments: adds reps at the same load until the next weight step is appropriate (worked examples in docs), not a fixed rep-range rule.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations"]}, {"has": "yes", "how": "dp(5lb, 8, 12): reps climb within the range until the top on every set, then weight increases and reps reset.", "fb": "", "src": ["https://www.liftosaur.com/features/progressions"]}, {"has": "yes", "how": "Smart Block 'Double progression': choose rep range and weight increase; when top of range is hit on all sets, weight rises and reps reset.", "fb": "", "src": ["https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662", "https://app.strengthlog.com/main.dart.js"]}, {"has": "paid", "how": "Effectively double progression inside a dynamic rep range: weight steps up only once the top of the range is reached; missed sets never lower the weight (only deloads/returns do).", "fb": "", "src": ["https://www.jefit.com/blog/periodization-on-your-own-plan", "https://www.jefit.com/support/faq"]}, {"has": "partial", "how": "Available only if the chosen program encodes it; no generic double-progression setting documented.", "fb": "", "src": ["https://www.boostcamp.app/vs/hevy"]}, {"has": "unknown", "how": "Rules of Smart Trainer progression are not published.", "fb": "", "src": ["https://help.smartgymapp.com/article/133-smart-trainer-update"]}, {"has": "no", "how": "No progression logic implemented (see prog_suggestions).", "fb": "", "src": ["https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/adaptive-weight-suggestions"]}]}, {"id": "prog_deload", "area": "prog", "areaPL": "Progresja", "label": "Deload", "others": 4.0, "cells": [{"has": "no", "how": "No deload detection or suggestion. The hint only ever proposes an increase.", "fb": "", "src": ["lib/store.ts:progressionFor"]}, {"has": "no", "how": "No recovery/readiness or deload model documented.", "fb": "", "src": ["https://aitoolsbakery.com/blog/strong-app-review/"]}, {"has": "unknown", "how": "No deload or readiness/fatigue model documented; Trainer has injury management (avoid/warn on exercises for flagged areas).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/43572343844247-How-Hevy-Trainer-Settings-Work"]}, {"has": "partial", "how": "No user-scheduled deloads. Automatic easing: lower weights after inactivity, when strength scores decline, and mStrength light days; Focus Exercise cycle ends with a phase refresh.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/43492523917207-How-does-Fitbod-adapt-as-I-get-stronger", "https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight", "https://help.fitbod.me/hc/en-us/articles/35301260960663-Focus-Exercises"]}, {"has": "paid", "how": "Planned deload at end of a plan or mark any workout as deload; recommendations are reduced accordingly (Pro).", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations"]}, {"has": "yes", "how": "lp() takes a deload amount and number of failed sessions; editor pill 'Add deload on failure'; deload weeks via 'progress: none'; custom scripts can implement any reset logic.", "fb": "", "src": ["https://www.liftosaur.com/features/progressions", "https://www.liftosaur.com/features/program-editor", "https://www.liftosaur.com/doc/liftoscript"]}, {"has": "no", "how": "No automatic deload rules documented in the help center; third-party review states it has no deload logic.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-build-a-program/", "https://steelrep.app/blog/best-workout-apps-strength-training/"]}, {"has": "paid", "how": "Deload is a built-in phase of every mesocycle; high fatigue can trigger an early deload; weak momentum yields a 'Bridge week'; weight progressions pause during deload (v17.2.1).", "fb": "", "src": ["https://www.jefit.com/blog/adaptive-mesocycle-training-jefits-smarter-way-to-progress", "https://www.jefit.com/blog/periodization-on-your-own-plan", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "partial", "how": "Deloads are built into coach programs' schedules; no reactive, fatigue-triggered deload.", "fb": "", "src": ["https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://www.boostcamp.app/vs/hevy"]}, {"has": "unknown", "how": "No explicit deload weeks documented; Smart Trainer only states it may 'scale things back' and rewrites programs at block ends.", "fb": "", "src": ["https://smartgymapp.com/features.html"]}, {"has": "no", "how": "No fatigue/readiness model. Workaround: exclude a workout (e.g. deload, injury, travel) from Strength Score; 'Suggested workout changes' Under Consideration.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-310-workout-sharing-disable-strength-score-for-workouts-fix-for-logout-issue", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/suggested-workout-changes"]}]}, {"id": "prog_fatigue", "area": "prog", "areaPL": "Progresja", "label": "Zmęczenie/regeneracja", "others": 3.0, "cells": [{"has": "no", "how": "No fatigue or recovery model. The morning check-in (BB/sleep) is only displayed in the workout header and does not affect suggestions.", "fb": "", "src": ["components/ActiveWorkout.tsx:readinessLine", "lib/store.ts:todayReadiness"]}, {"has": "no", "how": "No recovery/readiness/fatigue model; reviewers note no HRV/sleep/WHOOP/Oura integration and no recommendations.", "fb": "", "src": ["https://repreturn.com/strong-app-review/", "https://aitoolsbakery.com/blog/strong-app-review/"]}, {"has": "unknown", "how": "No muscle-recovery/fatigue model documented; Trainer adapts only to logged performance, injuries and settings.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/43572343844247-How-Hevy-Trainer-Settings-Work"]}, {"has": "yes", "how": "Per-muscle recovery model: each muscle group 0-100%, full recovery ~6-7 days depending on volume/intensity, body stats and cardio; imported Apple Health/Health Connect/Strava/Fitbit activities affect recovery. Fresher muscles prioritized; user can manually override recovery %. Accessory muscles capped at 1-2 exercises per workout.", "fb": "Review: 'Recovery estimates may not always match how users feel' (lasta.app); no HRV/sleep inputs (sensai.fit).", "src": ["https://help.fitbod.me/hc/en-us/articles/360006269014-Muscle-Recovery", "https://help.fitbod.me/hc/en-us/articles/43492170863895-How-does-Fitbod-know-my-muscles-are-still-recovering", "https://help.fitbod.me/hc/en-us/articles/360047357794-Apple-Health"]}, {"has": "partial", "how": "Intra-workout fatigue: recommendations change between sets because 'set 3 is not set 1'. No per-muscle recovery or readiness model - recovery handled by program structure.", "fb": "", "src": ["https://apps.apple.com/us/app/alpha-progression/id1462277793", "https://alphaprogression.com/en/blog/alpha-progression-vs-fitbod"]}, {"has": "no", "how": "No readiness/recovery model; sleep, calories and protein are only read from Health for display/API. Not described anywhere in the official per-feature docs, which claim to cover 'everything the app does' (checked 2026-10-02).", "fb": "", "src": ["https://www.liftosaur.com/features/measurements", "https://www.liftosaur.com/features"]}, {"has": "partial", "how": "At save you rate sleep, stress, calorie intake and how the workout felt ('shape'); premium stats compare e.g. experienced shape vs reps. No readiness model adjusting training.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/", "https://help.strengthlog.com/help-article/strengthlog-premium/", "https://app.strengthlog.com/main.dart.js"]}, {"has": "partial", "how": "Muscle recovery chart estimates which muscles are recovered (used to auto-pick 80-100% recovered muscles in Mix); Stimulus Volume engine tracks weekly HSE load. No sleep/HRV input.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/jefit-app-new-release-mix-workout-feature", "https://www.jefit.com/blog/the-north-star-progress-index-nspi"]}, {"has": "no", "how": "No readiness/recovery model; Pro shows RPE drift and volume trends only.", "fb": "", "src": ["https://www.boostcamp.app/pro"]}, {"has": "partial", "how": "No explicit deload. Muscle Fatigue/Recovery visualisation (since v6, on main screen since 2023) estimates muscle recovery time from history; Workout Effort / training load (7.9). Smart Trainer claims to consider recovery.", "fb": "", "src": ["https://9to5mac.com/2022/05/05/smartgym-for-ios-watchos-mac-major-update/", "https://9to5mac.com/2023/01/19/smartgym-for-ios-and-apple-watch-update/", "https://smartgymapp.com/releases/smartgym-7-9", "https://smartgymapp.com/features.html"]}, {"has": "no", "how": "No recovery/fatigue or readiness model; sleep sync only Planned.", "fb": "", "src": ["https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/sleep-tracking", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257574-strength-score-user-guide"]}]}, {"id": "prog_ai_coach", "area": "prog", "areaPL": "Progresja", "label": "Trener AI", "others": 5.0, "cells": [{"has": "no", "how": "No AI coach. There are no network calls at all.", "fb": "", "src": ["lib/store.ts", "package.json"]}, {"has": "no", "how": "No AI or coaching features found on official pages (Sep 2026).", "fb": "", "src": ["https://aitoolsbakery.com/blog/strong-app-review/", "https://prpath.app/blog/strong-vs-hevy-2026.html"]}, {"has": "partial", "how": "Trainer is algorithmic, 'do[es] not rely on AI'. AI via external chat: Hevy app inside ChatGPT (@hevy) analyses history, graphs lifts, builds plans saved to Hevy (replaced HevyGPT); 3.1.12+ can send workouts to ChatGPT & Claude from the finish screen.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/38385724273047-Hevy-Trainer-Explained-How-It-Builds-Your-Workout-Program", "https://help.hevyapp.com/hc/en-us/articles/43652076665239-What-is-the-Hevy-App-on-ChatGPT", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350"]}, {"has": "partial", "how": "Not a conversational coach. 'Injuries/Limitations' uses free-text description + follow-up questions to suggest exclusions/alternatives; 'Workout Insights' (App Store event) gives coaching tips and explains why exercises were recommended; human 'Ask a Trainer' email service included in subscription.", "fb": "'a generator not a coach' - no conversational coaching or mid-workout dialogue (sensai.fit 2026).", "src": ["https://help.fitbod.me/hc/en-us/articles/37629269518103-Injuries-and-Limitations", "https://apps.apple.com/us/app/fitbod-gym-fitness-planner/id1041517543", "https://help.fitbod.me/hc/en-us/articles/1500012605521-Fitbod-s-Ask-a-Trainer-Program"]}, {"has": "no", "how": "No conversational/AI coach; algorithmic generators and recommendations only. Human support via email.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/support"]}, {"has": "partial", "how": "No in-app AI coach; ChatGPT plugin and MCP server (Claude, Gemini) let an assistant edit programs, log workouts and analyze history including sleep/protein. In-app AI only autofills custom exercise muscles.", "fb": "App Store 2026-03 (5*): 'The MCP tool with Claude makes it super easy for programming workout plans.' https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/chatgpt-claude-and-ai", "https://www.liftosaur.com/doc/mcp"]}, {"has": "no", "how": "No AI coach in help center (65 articles), store listing or release notes.", "fb": "", "src": ["https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662", "https://help.strengthlog.com/"]}, {"has": "paid", "how": "'Progressive Overload System' (Nov 2025): Strength, Stimulus Volume and Movement Balance engines feed the NSPI score; Adaptive Plan adjusts weekly with a Weekly Recap explaining what changed and why. Elite only.", "fb": "", "src": ["https://www.jefit.com/blog/the-new-era-of-jefit-the-progressive-overload-system", "https://www.jefit.com/blog/the-north-star-progress-index-nspi", "https://www.jefit.com/blog/adaptive-mesocycle-training-jefits-smarter-way-to-progress"]}, {"has": "paid", "how": "'AI Coach' builds a customized multi-week program from a questionnaire; no conversational coaching or form feedback (reviewers: 'no individualized coaching').", "fb": "", "src": ["https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://www.boostcamp.app/pro", "https://www.garagegymreviews.com/boostcamp-review"]}, {"has": "yes", "how": "Smart Trainer (algorithmic) + Apple Intelligence features: Smart Greeting, AI personalities (Super Motivational / Balanced / Mean), explained suggestions, written monthly/routine summaries, exercise Q&A. 8.0 adds opt-in cloud 'SmartGym Intelligence' / 'Ask Smart Trainer' and Siri AI integration.", "fb": "Sep 2026 review: 'Too many SmartGym Intelligence unavailable error messages' - https://itunes.apple.com/us/rss/customerreviews/page=1/id=922744883/sortby=mostrecent/json", "src": ["https://smartgymapp.com/releases/smartgym-7-7", "https://9to5mac.com/2025/09/15/smart-gym-apple-intelligence-ios-26/", "https://apps.apple.com/us/app/smartgym-gym-home-workouts/id922744883", "https://smartgymapp.com/privacy/"]}, {"has": "partial", "how": "No in-app AI coach (deliberate). Instead human coaching (Pro group / Premium 1-on-1) and an MCP server so ChatGPT/Claude can read Caliber data (Menu > Connected Apps).", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-514-515-improvements-to-exercise-search-progress-photo-gallery-revamp-mcp-support-for-chatgp", "https://apps.apple.com/us/app/caliber-strength-training/id1482405410", "https://caliberstrong.com/faqs/"]}]}, {"id": "stats_prs", "area": "stats", "areaPL": "Rekordy i statystyki", "label": "Rekordy", "others": 9.5, "cells": [{"has": "yes", "how": "The record is the best per-workout total by metric: volume (weight×reps), total unassisted reps (bodyweight/reps-only), total time or total distance; e1RM also counts. A PR badge appears live next to the set that beats it, once per exercise per workout. The first session of an exercise never gives a PR. Max load, best-set volume, max reps (with/without assist), longest set and longest distance are shown as info on the records card without badges.", "fb": "", "src": ["lib/stats.ts:prMap", "lib/stats.ts:totalKind", "lib/stats.ts:setPRs", "app/more/progress.tsx"]}, {"has": "yes", "how": "Exercise Records tab: all-time bests (estimated 1RM, max weight, max volume) with history, plus best actual performance at each rep count next to a predicted value; only sets ≤12 reps count. History cards show number of PRs per workout. Best Set ignores 0-rep sets.", "fb": "", "src": ["https://help.strongapp.io/article/216-exercise-records-screen", "https://help.strongapp.io/article/237-about-exercise-detail", "https://www.thenerdystudent.com/2021/08/strong-review/", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, {"has": "yes", "how": "PR types by exercise type: weight&reps → Heaviest Weight, Best 1RM, Best Set Volume, Best Session Volume; bodyweight → Best Set (reps), Most Session Reps; assisted → reps only; weighted bodyweight → Heaviest, Best Set Volume; duration → Best Time; cardio → Longest Distance/Time. Live PR banner + sound during workout; medals on sets. Separate 'Set Records' table = heaviest weight per rep count (no live PR).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35649367857175-Personal-Records-PRs-and-Set-Records-Explained-How-They-Work-in-the-Hevy-App", "https://help.hevyapp.com/hc/en-us/articles/38279531346455-Set-Records-vs-Personal-Records", "https://help.hevyapp.com/hc/en-us/articles/36012016405655-Hevy-Live-PR-Notifications-Get-Instant-Updates-on-Your-Best-Lifts"]}, {"has": "yes", "how": "Records per exercise: Estimated Strength, Volume, Reps (max in a set), Weight (heaviest), Exercise Time, Total Time, Distance, Total Distance, Split (best pace).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/12732749777047-Fitbod-Metrics-Records"]}, {"has": "yes", "how": "Free: weight, reps, volume, estimated 1RM, estimated 10RM records and best performance per muscle group, surfaced in workout summary.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Per exercise: Max Weight and Max 1RM (e1RM) with date and set; trophy on history cards; finish screen lists new PRs; Week Insights shows PRs vs previous best; Last/Best/Best AMRAP during sets. No per-rep-count record table described.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/graphs", "https://www.liftosaur.com/features/week-insights"]}, {"has": "yes", "how": "Automatic PR for every rep count (1RM..nRM), Yearly Records ('YR!') and PR ('PR!') badges inline while logging, Time PR; records page per year; add old PRs manually, delete bad records; attach videos to records.", "fb": "", "src": ["https://help.strengthlog.com/help-article/personal-records-and-yearly-records/", "https://help.strengthlog.com/help-article/how-to-register-old-personal-records/", "https://help.strengthlog.com/help-article/remove-old-personal-records/"]}, {"has": "partial", "how": "Automatic record detection with instant 'record breaker' notifications per set (since Dec 2023) and 1RM share cards; exact record types beyond 1RM are not documented.", "fb": "", "src": ["https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/best-strength-training-apps-for-2026-7-options-tested-by-lifters"]}, {"has": "yes", "how": "Automatic PRs: max weight per rep range, max volume per session, max reps at a weight, 'Max Weight Reps', e1RM, lifetime bests; flagged in-session with confetti and badge; PRs can be reset to a new baseline while keeping history (v262).", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "yes", "how": "Dedicated Personal Records screen (since v6); PR share cards. Exact record types not documented.", "fb": "", "src": ["https://9to5mac.com/2022/05/05/smartgym-for-ios-watchos-mac-major-update/", "https://smartgymapp.com/features.html"]}, {"has": "yes", "how": "PR types: Estimated 1RM, Max Weight, Max Volume (set), Max Reps, Max Time. Realtime PR screen right after completing an exercise (5.12, can be disabled); PR dates on history; reset PRs per exercise or all (5.12.2) keeping history.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-5130-progress-section-revamp-1", "https://feedback.caliberstrong.com/announcements/caliber-5120-realtime-prs-new-workout-summary-screen-various-bug-fixes", "https://feedback.caliberstrong.com/announcements/caliber-5122-reset-exercise-prs-see-their-dates", "https://feedback.caliberstrong.com/announcements/bodyweightassisted-exercise-adjustment-excluding-high-rep-sets-from-1rm"]}]}, {"id": "stats_e1rm", "area": "stats", "areaPL": "Rekordy i statystyki", "label": "e1RM", "others": 9.5, "cells": [{"has": "yes", "how": "Uses the Epley formula: load × (1 + reps/30), and load itself when reps = 1. It only counts sets with ≤10 reps that are not drop sets and not band sets with unknown kg. It is calculated per dumbbell or per side according to load mode. For bodyweight exercises only added load counts.", "fb": "", "src": ["lib/stats.ts:e1rm", "lib/stats.ts:E1RM_MAX_REPS", "lib/stats.ts:recE1"]}, {"has": "yes", "how": "Brzycki formula; Strong warns estimates break down above 12 reps (records limited to ≤12 reps).", "fb": "", "src": ["https://help.strongapp.io/article/133-1rm", "https://help.strongapp.io/article/216-exercise-records-screen"]}, {"has": "yes", "how": "Rep-to-percentage table: 1=100%, 2=97, 3=94, 4=92, 5=89, 6=86, 7=83, 8=81, 9=78, 10=75, 11=73, 12=71 … 20=60 … 30+=50%; e1RM = weight ÷ percentage.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/36954464726167-Understanding-Your-Estimated-One-Rep-Max-1RM-in-Hevy"]}, {"has": "partial", "how": "'Estimated Strength' (formerly Projected 1RM) from sets/reps/weight over time with recency decay (drops if exercise not logged recently); for bodyweight exercises it's estimated max reps. Formula proprietary/not published; cannot be edited manually.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/12732749777047-Fitbod-Metrics-Records", "https://help.fitbod.me/hc/en-us/articles/43492523917207-How-does-Fitbod-adapt-as-I-get-stronger"]}, {"has": "yes", "how": "Estimated 1RM and 10RM per set (setting chooses which metric is displayed). Internal 10RM uses AP's own method; public RM calculator combines Epley and Brzycki.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations", "https://alphaprogression.com/en/tools/rm-calculator", "https://alphaprogression.com/en/blog/10rm-1rm-relationship"]}, {"has": "yes", "how": "e1RM = weight / (share of 1RM from an RPE chart for reps at RPE), RPE 10 assumed if none logged; chart follows the OpenPowerlifting RPE calculator (5 reps @ 200 lb -> ~231 lb). Unilateral uses average of sides.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/set-types"]}, {"has": "yes", "how": "Estimated 1RM graphs per exercise; 1RM calculator uses Epley; logged RPE/RIR adjusts e1RM (easier RPE -> higher e1RM). Separate 'My 1RMs' registry for %1RM programs (premium).", "fb": "", "src": ["https://help.strengthlog.com/help-article/calculators/", "https://help.strengthlog.com/help-article/rpe-calculator/", "https://help.strengthlog.com/help-article/1rm-for-programs/", "https://app.strengthlog.com/main.dart.js"]}, {"has": "yes", "how": "Automatic 1RM calculation for every exercise, updated set by set, with %1RM and 3/6-month history; formula not published.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens"]}, {"has": "yes", "how": "e1RM curve calculated from top sets; formula not published.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://www.boostcamp.app/features"]}, {"has": "yes", "how": "Exercise Progress has a 1RM chart computed from all logged values; formula not published.", "fb": "", "src": ["https://help.smartgymapp.com/article/108-track-1rm", "https://smartgymapp.com/features.html"]}, {"has": "yes", "how": "Estimated 1RM used for charts, PRs and Strength Score; sets >15 reps excluded from 1RM. Formula not published (help example: 200x8 = 250, 210x6 = 247).", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/bodyweightassisted-exercise-adjustment-excluding-high-rep-sets-from-1rm", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001225489-why-did-my-muscle-group-strength-score-drop-even-though-i-increased-weight-on-an-exercise-"]}]}, {"id": "stats_charts_exercise", "area": "stats", "areaPL": "Rekordy i statystyki", "label": "Wykresy ćwiczenia", "others": 9.0, "cells": [{"has": "yes", "how": "More → Postępy → pick an exercise, or use the Postępy button in the exercise editor. You get a per-session line chart with metric chips (session total, volume, e1RM, max load/±, max reps, max time, max distance, depending on metric). Below it are a records card and the last 20 sessions with their best set. Charts are custom SVG (react-native-svg) with time-aware axis steps.", "fb": "", "src": ["app/more/progress.tsx", "lib/stats.ts:chartKeysFor", "components/Chart elp.fitbod.me/hc/en-us/articles/360006572594-Can-I-use-Fitbod-without-an-internet-connection"]}, {"has": "yes", "how": "Optional free account syncs to backend across devices/iOS-Android incl. subscription; guest data local only and cannot be merged later.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/support"]}, {"has": "yes", "how": "Offline-first: data saved on device, optional account syncs after every change and pushes to other devices; per-entity last-write-wins merge; live workout continues across phone/web.", "fb": "", "src": ["https://www.liftosaur.com/features/sync-and-offline"]}, {"has": "yes", "how": "Account-based cloud sync; data appears on a new device after login; subscriptions do not transfer between iOS and Android.", "fb": "", "src": ["https://www.strengthlog.com/", "https://help.strengthlog.com/help-article/possible-issues-with-your-data/", "https://www.strengthlog.com/app-terms-privacy/"]}, {"has": "yes", "how": "Account-based cloud sync across phone, watch and web planner (routines download to the app).", "fb": "App Store review: ~70 unsynced sessions were lost after a forced logout.", "src": ["https://www.jefit.com/blog/introducing-new-routine-builder-workout-planning-simplified", "https://www.jefit.com/blog/stay-ahead-with-jefit-online-workout-planner-enhancements"]}, {"has": "yes", "how": "Cloud account (iCloud/Google sign-in) backs up data across devices; web app for program creation/history with QR-code login (Dec 2024).", "fb": "", "src": ["https://www.boostcamp.app/features", "https://www.boostcamp.app/blogs/new-boostcamp-lifting-app-features-december-2024", "https://chromewebstore.google.com/detail/boostcamp-history-%E2%86%92-csv/ndldfeicfhokabalcjmjhhdhinjilllo"]}, {"has": "yes", "how": "Premium account syncs to SmartGym cloud across iPhone/iPad/Mac/Watch/visionOS; Watch stores offline and syncs later. 'Local Features' plan keeps data on device (Watch syncs to iPhone , API. 50%-off first year sales a few times a year (not lifetime). Web purchase via Paddle; no Family Sharing.", "fb": "Generally rated the best value in the category (lifetime < Strong Forever).", "src": ["https://help.hevyapp.com/hc/en-us/articles/35119778922263-Hevy-Pro-Subscription-How-to-get-Pro-and-What-Does-It-Include", "https://help.hevyapp.com/hc/en-us/articles/33106320824727-Everything-You-Need-to-Know-About-the-Hevy-App-2025-Features-Guide", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350", "https://help.hevyapp.com/hc/en-us/articles/38223834432279-Hevy-Pro-Sale-50-Off-First-Year", "https://help.hevyapp.com/hc/en-us/articles/38385995539735-What-is-a-Family-Sharing-plan-and-is-Hevy-a-part-of-it"]}, {"has": "paid", "how": "No free tier: 7-day trial (requires choosing monthly/yearly plan) then $15.99/mo or $95.99/yr (US; legacy $12.99/$79.99 and lower). After expiry can view history but not log new workouts. Lifetime (only ~1,000 sold at Black Friday), Family Plan (Duo 2 / Family 5, annual only, web purchase), Fitbod for Business (5-100+ seats), HSA/FSA eligible, monthly subscription pause offers.", "fb": "Price is a frequent complaint; 3-workout free limit in older versions (TechRadar 2023).", "src": ["https://help.fitbod.me/hc/en-us/articles/30542136101527-How-the-Trial-Works", "https://help.fitbod.me/hc/en-us/articles/360004904714-How-to-Subscribe-to-Fitbod", "https://help.fitbod.me/hc/en-us/articles/27915497464855-Lifetime-Fitbod-Membership-FAQ", "https://help.fitbod.me/hc/en-us/articles/42280653162519-Fitbod-Family-Plan", "https://help.fitbod.me/hc/en-us/articles/31891449815703-Fitbod-for-Business-Program-Overview-Benefits", "https://help.fitbod.me/hc/en-us/articles/360006368934-How-to-Cancel-or-Request-a-Refund-for-Your-Fitbod-Subscription", "https://apps.apple.com/us/app/fitbod-gym-fitness-planner/id1041517543", "https://fitbod.me"]}, {"has": "yes", "how": "Free forever, no ads, no account: unlimited logging, own plans, 795 exercise videos, rest timer, records, achievements, measurements, sharing, CSV. Pro $12.99/mo or $79.99/yr (US; 14-day trial only on yearly), via App Store, Play or web (web allows promo codes). Full refund on request. After expiry: generated-plan workouts can't be started; manual plans run without Pro settings.", "fb": "Free users ask for periodization in free tier (App Store review).", "src": ["https://alphaprogression.com/en", "https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/subscribe", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Core is free (programs, editor, Liftoscript, progressions, logging, history, measurement entry, equipment, sharing, import/export, sync). Premium (US: $4.99/mo, $39.99/yr, $99.99 lifetime; 14-day trial on subs; store-localized prices) unlocks plates per side, graphs, muscle views, rest-timer notifications/Live Activity, Week Insights, Apple Watch, API & MCP. Bought only in iOS/Android apps, works on all platforms.", "fb": "App Store 2025-11/2026-03 (5*): praised lifetime option; 'everything you need including progression is free'. https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/premium", "https://apps.apple.com/us/app/liftosaur-scriptable-workouts/id1661880849"]}, {"has": "yes", "how": "Free: unlimited logging, no ads, custom exercises, basic stats, PRs, plate calculator, timer, many programs, basic program builder, limited goals/streaks. Premium (US App Store: $16.90/month, $37.90/3 months, $109/year; 14-day trial per blog): full program catalog, advanced stats/reports, muscle map, RPE/RIR, %1RM programming, quick stats, Train-again modifications, sharing, unlimited goals/streaks. Sweden: wellness-stipend invoices. Cannot be bought on web.", "fb": "App Store 2025-06 (1*) '$16 / month!', 2025-01 (3*) 'Pro is wayyy too expensive'; many 5* reviews praise the generous free tier. https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json", "src": ["https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662", "https://help.strengthlog.com/help-article/strengthlog-premium/", "https://www.strengthlog.com/the-best-gym-app-for-apple-watch-is-here/", "https://help.strengthlog.com/help-article/wellness-stipend-for-premium/"]}, {"has": "yes", "how": "Free tier with ads (custom routines, 1,400+ exercises, logging/history, community). Elite $12.99/mo or $69.99/yr (legacy $6.99/$39.99 tiers exist): pro plans, analytics, watch, HD video, ad-free, Adaptive Plan, Load Progression, Periodization. 7-day Adaptive Plan trial for free users since Jul 2026; Iron Points can be redeemed for Elite weeks.", "fb": "Reviews: constant push to upgrade and ads on free tier (etechshout).", "src": ["https://www.jefit.com/elite", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/support/faq"]}, {"has": "yes", "how": "Free tier (no ads claimed) with full logger, 11,000+ programs, RPE/RIR, plate calc, PRs, weekly reports, unlimited custom programs. Pro $59.99/yr with 7-day trial or $14.99/mo without trial (App Store also shows $11.99-$79.99 variants and $48.99 offers): Strength Score, heatmap, AI programs, 20+ exclusive programs, advanced analytics, bodyweight tracker, Pro auto-progression.", "fb": "GGR: recommends Pro to unlock data/charts; Play review: basic substitution paywalled; App Store review: dark mode used to be paid.", "src": ["https://www.boostcamp.app/pro", "https://www.boostcamp.app/features", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "yes", "how": "Freemium: free tier = 2 routines, 3 workouts (App Store) / 10 histories (privacy policy), 2 measures. US IAPs: Premium+ $9.99/mo or $59.99/yr (adds pre-made workouts), User Account $6.99/mo or $39.99/yr, Family Premium+ $16.99/mo / $99.99/yr (Family Sharing), Legacy $29.99, trainer s save when reconnecting. A third-party comparison lists offline logging with cloud sync; not documented officially.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/38223672272791-What-will-happen-to-my-information-if-I-uninstall-and-reinstall-the-Hevy-app", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350", "https://straightsetapp.com/use-cases/best-offline-gym-app.html"]}, {"has": "yes", "how": "Offline: local algorithm generates workouts, log/save workouts (sync later), cached thumbnails/videos. Online needed for Focus Exercise split alignment, uncached videos, full records/history.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006572594-Can-I-use-Fitbod-without-an-internet-connection", "https://help.fitbod.me/hc/en-us/articles/35301260960663-Focus-Exercises"]}, {"has": "yes", "how": "Almost fully offline incl. Pro recommendations; videos in lower resolution; generators need internet; sync when back online.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en"]}, {"has": "yes", "how": "Works fully without account or connection; only the built-in program list needs a connection; web app caches itself for offline use.", "fb": "", "src": ["https://www.liftosaur.com/features/sync-and-offline"]}, {"has": "partial", "how": "Data is stored locally and backed up to servers only when online; a temporary (anonymous) account exists, but the FAQ says an account is required. Premium status may fail to load on bad connection.", "fb": "", "src": ["https://www.strengthlog.com/app-terms-privacy/", "https://www.strengthlog.com/", "https://help.strengthlog.com/help-article/premium-stopped-working/", "https://app.strengthlog.com/main.dart.js"]}, {"has": "partial", "how": "Watch app records offline and syncs later; phone offline behaviour not documented; app is strongly cloud-tied.", "fb": "", "src": ["https://www.jefit.com/blog/watch-guide-elevate-your-workout-with-jefit-wear-os", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "yes", "how": "Offline mode since Mar 2024: works without internet once a program is loaded, syncs later.", "fb": "Pre-2024 review: data lost on network errors.", "src": ["https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://www.boostcamp.app/features", "https://www.garagegymreviews.com/boostcamp-review"]}, {"has": "partial", "how": "Watch is fully offline-capable; iPhone historically needed connection to sync edits (2021 complaint, dev promised fix). Apple Intelligence features run on-device.", "fb": "", "src": ["https://help.smartgymapp.com/article/85-iphone-nearby", "https://apps.apple.com/us/app/smartgym-gym-home-workouts/id922744883", "https://smartgymapp.com/features.html"]}, {"has": "partial", "how": "Offline mode: start/track/save workouts, view dashboard/plans; cached videos only; other screens unavailable.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/release-notes-caliber-224-offline-mode", "https://feedback.caliberstrong.com/announcements/caliber-422-improved-offline-mode-bug-fixes", "https://feedback.caliberstrong.com/announcements/caliber-3119-adjustable-warm-up-targets-expanded-emoji-reactions-exercise-videos-while-offline"]}]}, {"id": "ux_privacy", "area": "ux", "areaPL": "Ustawienia i wygoda", "label": "Prywatność/konto", "others": 7.5, "cells": [{"has": "yes", "how": "No account. Data stays in the app's private Library/SQLite, which is included in device backups but not visible in Files. Only the auto-backup JSONs are in Documents/Backup. Health access is write-only and opt-in. There is no analytics code.", "fb": "", "src": ["lib/store.ts:dbDirectory", "lib/backup.ts:autoBackup", "lib/health.ts", "package.json"]}, {"has": "yes", "how": "Account required (email/Facebook/Apple). Data stored on servers in the US and other countries, retained until account deletion (in-app). Analytics via Fathom (web) and Sentry; no personal data sent. Workouts private unless shared. App Store label: health & fitness, email, IDs linked to you; no tracking.", "fb": "", "src": ["https://strong.app/privacy", "https://help.strongapp.io/article/143-strong-account", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, {"has": "partial", "how": "Account required; data on Hevy servers. Profiles public by default; private profile, per-workout privacy and default visibility settings. App Store label: purchases, contact info, contacts, usage data linked to you. In-app account deletion.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34461853165079-How-to-keep-my-information-private-Account-Single-Private-Workout-Remove-Social-Media-Features", "https://help.hevyapp.com/hc/en-us/articles/38223672272791-What-will-happen-to-my-information-if-I-uninstall-and-reinstall-the-Hevy-app", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350", "https://help.hevyapp.com/hc/en-us/articles/34895456326423-Delete-Your-Hevy-or-Hevy-Coach-Account-Easily-Full-Tutorial"]}, {"has": "partial", "how": "Account required. Stores body profile, workout data, preferences; GDPR-compliant deletion (in-app Permanently Delete Account). App Store label: Usage Data used to track; Health & Fitness, contact info, identifiers linked to you.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360004702573-What-kind-of-data-do-we-store", "https://help.fitbod.me/hc/en-us/articles/19559573010583-How-to-Delete-Your-Fitbod-Account", "https://help.fitbod.me/hc/en-us/articles/15932124434199-How-to-Sign-Up-Log-in", "https://apps.apple.com/us/app/fitbod-gym-fitness-planner/id1041517543"]}, {"has": "yes", "how": "No account required (guest data local only). German GmbH, GDPR; uses Firebase, Adjust, RevenueCat/Stripe. App Store label: purchases and identifiers used to track; third-party advertising data.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/privacy-policy", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "No account required; sign-in with Apple/Google/email optional; several local accounts per phone; 'Delete Current Cloud Account' wipes server data (payment records kept). App Store label lists health/fitness, email, IDs and usage data linked to identity.", "fb": "", "src": ["https://www.liftosaur.com/features/account", "https://apps.apple.com/us/app/liftosaur-scriptable-workouts/id1661880849"]}, {"has": "yes", "how": "Account required (Google, Apple, Facebook or email); GDPR rights incl. portability; processors outside EU/EEA under SCCs; account deletion via email request; de-identified data used for Strength Levels. App Store: contact info, user ID, diagnostics linked to identity.", "fb": "", "src": ["https://www.strengthlog.com/", "https://www.strengthlog.com/app-terms-privacy/", "https://help.strengthlog.com/help-article/manage-your-account/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "partial", "how": "Account-based (web features require login); App Store: usage data used to track across apps, data 'not linked to you' incl. fitness, location, contacts. 2021 data breach exposed usernames, emails, salted password hashes for accounts created before Sep 2020.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/introducing-new-routine-builder-workout-planning-simplified", "https://www.jefit.com/blog/jefit-data-incident-public-announcement"]}, {"has": "partial", "how": "Account required; App Store privacy: identifiers used for tracking/third-party advertising; email/name collected. Play: may share personal info with third parties.", "fb": "", "src": ["https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://play.google.com/store/apps/details?id=com.bpmhealth.boostcamp"]}, {"has": "yes", "how": "Account only created after subscribing; option to keep data only on device. Anonymous Mixpanel analytics; HealthKit data never shared. Cloud LLM features off by default, sent anonymised to AWS Bedrock. Data may be deleted 60 days after subscription expiry.", "fb": "", "src": ["https://smartgymapp.com/privacy/", "https://apps.apple.com/us/app/smartgym-gym-home-workouts/id922744883"]}, {"has": "partial", "how": "Account required (email); App Store: Health & Fitness, contact info, photos/videos, identifiers linked to identity. Account deletion in-app deletes all data.", "fb": "", "src": ["https://apps.apple.com/us/app/caliber-strength-training/id1482405410", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001256908-how-do-i-delete-my-caliber-account-"]}]}, {"id": "new:abandoned_workout_notification", "area": "new", "areaPL": "Inne (spoza listy)", "label": "abandoned workout notification", "others": 0, "cells": [{"has": "yes", "how": "While a workout is active, a local notification 'Trening wciąż trwa' is scheduled 2 h after the last activity. Its text depends on state: working sets done / warm-up only / nothing ticked. It is cancelled on finish or discard.", "fb": "", "src": ["lib/timer.ts:scheduleStaleReminder", "lib/timer.ts:staleBody", "components/ActiveWorkout.tsx"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:achievements", "area": "new", "areaPL": "Inne (spoza listy)", "label": "achievements", "others": 2, "cells": [null, null, null, null, null, null, {"has": "yes", "how": "Multi-level achievements (Log Workouts 10 levels, Compound Hero, Follow a Program, etc.) with badges on profile.", "fb": "", "src": ["https://www.strengthlog.com/new-features-in-the-best-free-workout-tracker-app/"]}, {"has": "yes", "how": "Gamified reward points earned for workouts, social activity, referrals and contests; each event has a badge; consumable points redeem for Elite time.", "fb": "", "src": ["https://www.jefit.com/support/faq"]}, null, null, null]}, {"id": "new:action_button_smart_action", "area": "new", "areaPL": "Inne (spoza listy)", "label": "action button smart action", "others": 1, "cells": [null, null, null, null, null, null, null, null, null, {"has": "yes", "how": "Predictive 'Smart Action': iPhone Action Button (15 Pro+, iOS 18, v7.5) and Watch Ultra Action Button / Double Tap trigger the next logical step (log set + start rest, cancel timer, next exercise, end workout). Ultra button can start a workout even when app closed; 3-s countdown cancel.", "fb": "", "src": ["https://help.smartgymapp.com/article/123-apple-watch-ultra-action-button", "https://help.smartgymapp.com/article/138-configure-iphones-action-button", "https://help.smartgymapp.com/article/141-double-tap-action-button"]}, null]}, {"id": "new:actual_rest_logging", "area": "new", "areaPL": "Inne (spoza listy)", "label": "actual rest logging", "others": 0, "cells": [{"has": "yes", "how": "Each ticked set stores actualRest: the time since the previous tick in the workout, under 1 h, otherwise null. It is shown in the session detail's 'przerwa' column.", "fb": "", "src": ["lib/store.ts:toggleDone", "app/history/[id].tsx"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:ai_connectors", "area": "new", "areaPL": "Inne (spoza listy)", "label": "ai connectors", "others": 3, "cells": [null, null, {"has": "yes", "how": "Hevy app in ChatGPT (@hevy) for plans/analysis; send finished workouts to ChatGPT & Claude (3.1.12+).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/43652076665239-What-is-the-Hevy-App-on-ChatGPT", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350"]}, null, null, {"has": "paid", "how": "MCP server at liftosaur.com/mcp (OAuth or API key) for Claude/Gemini/other clients plus a ChatGPT plugin: tools to CRUD programs, history, custom exercises, gyms, measurements, run_playground and get_program_stats. Reference tools free; account tool _guidance", "area": "new", "areaPL": "Inne (spoza listy)", "label": "audio guidance", "others": 1.5, "cells": [null, null, null, null, null, null, null, {"has": "partial", "how": "Audio cue module: spoken 'Ready, go', exercise name, halfway and end-of-set cues (free); Elite adds coach 'Pro Tips' and user-written personal audio tips per exercise.", "fb": "", "src": ["https://www.jefit.com/blog/new-audio-cue-module-to-be-released-soon-on-jefit", "https://www.jefit.com/blog/jefits-new-personal-audio-coach-feature"]}, null, {"has": "yes", "how": "HIIT sequences with voice guidance on iPhone or Watch; can sync sequence across devices. | Exercise instructions read aloud, iPhone and Watch (7.6).", "fb": "", "src": ["https://help.smartgymapp.com/article/66-listen-to-music-voice-guidance", "https://apps.apple.com/us/app/smartgym-gym-home-workouts/id922744883", "https://smartgymapp.com/releases/smartgym-7-6"]}, null]}, {"id": "new:auto_backup_files", "area": "new", "areaPL": "Inne (spoza listy)", "label": "auto backup files", "others": 0, "cells": [{"has": "yes", "how": "After every saved workout (Finish, abandoned-workout save or silent 6 h save), a JSON backup is written to Documents/Backup/trening-YYYY-MM-DD-HHMMSS.json. It is visible in Files → On My iPhone → Trening → Backup (UIFileSharingEnabled). The newest 10 are kept, and user files in the folder are untouched. It is on by default and can be turned off in Settings.", "fb": "", "src": ["lib/backup.ts:autoBackup", "lib/backup.ts:onWorkoutSaved", "app.json"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:autoplay_mode", "area": "new", "areaPL": "Inne (spoza listy)", "label": "autoplay mode", "others": 1, "cells": [null, null, null, null, null, null, null, {"has": "yes", "how": "Two workout modes: Autoplay (guided, timer-driven) vs Traditional; mode locks at session start and Autoplay resumes after relaunch (v17.1.3).", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens"]}, null, null, null]}, {"id": "new:band_assist", "area": "new", "areaPL": "Inne (spoza listy)", "label": "band assist", "others": 0, "cells": [{"has": "yes", "how": "Band inventory (More → Gumy): colour, level 1–7 and optional nominal assist kg. The band column cycles through bands by level, and a band with kg fills −kg into the ±kg field as a pair; removing the band removes its assistance. A band without kg makes the load unknown, so the set is excluded from e1RM and volume records. Deleted bands show '?' in history.", "fb": "", "src": ["app/more/bands.tsx", "lib/store.ts:applyBandAssist", "lib/store.ts:pairAssist", "lib/stats.ts:unknownAssist"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:calculators", "area": "new", "areaPL": "Inne (spoza listy)", "label": "calculators", "others": 1, "cells": [null, null, null, null, null, null, {"has": "yes", "how": "1RM (Epley), plate, RPE (premium), warm-up for max attempt, powerlifting attempt selection (91/96/100%), Wilks & IPF GL, Sinclair, daily calories, protein, body fat & fat-free mass.", "fb": "", "src": ["https://help.strengthlog.com/help-article/calculators/"]}, null, null, null, null]}, {"id": "new:calendar_events", "area": "new", "areaPL": "Inne (spoza listy)", "label": "calendar events", "others": 1, "cells": [null, null, null, null, null, null, {"has": "yes", "how": "Tag dates with events (sick, vacation, period, injury) and overlay them on statistics graphs.", "fb": "", "src": ["https://help.strengthlog.com/help-article/calendar-events/"]}, null, null, null, null]}, {"id": "new:caliber_lessons", "area": "new", "areaPL": "Inne (spoza listy)", "label": "caliber lessons", "others": 1, "cells": [null, null, null, null, null, null, null, null, null, null, {"has": "paid", "how": "Weekly expert lessons on training, nutrition, habits (Plus).", "fb": "", "src": ["https://apps.apple.com/us/app/caliber-strength-training/id1482405410", "https://caliberstrong.com/membership/"]}]}, {"id": "new:calorie_estimates", "area": "new", "areaPL": "Inne (spoza listy)", "label": "calorie estimates", "others": 2, "cells": [null, null, null, {"has": "yes", "how": "Calories from sets, estimated duration, exercise type and bodyweight; with Apple Watch/Health Connect uses heart rate, age, weight, gender (uses wearable calories if provided). Not manually editable.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360004826434-How-Fitbod-Calculates-Calories"]}, null, null, {"has": "yes", "how": "Estimated kcal per workout from duration (and bodyweight); can be sent to Apple Health Active Energy.", "fb": "", "src": ["https://www.strengthlog.com/new-features-in-the-best-free-workout-tracker-app/", "https://help.strengthlog.com/help-article/pause-your-workout/", "https://app.strengthlog.com/main.dart.js"]}, null, null, null, null]}, {"id": "new:cardio_and_habits", "area": "new", "areaPL": "Inne (spoza listy)", "label": "cardio and habits", "others": 1, "cells": [null, null, null, null, null, null, null, null, null, null, {"has": "yes", "how": "Cardio activities (incl. custom), steps, nutrition logged/synced as Home 'activities' and charted under Habits/Cardio.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-330-new-cardio-activities-cardio-notes-activity-ui-enhancements", "https://feedback.caliberstrong.com/announcements/caliber-5130-progress-section-revamp-1", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001152382-how-do-i-log-a-cardio-workout-"]}]}, {"id": "new:coach_data_model_skeleton", "area": "new", "areaPL": "Inne (spoza listy)", "label": "coach data model skeleton", "others": 0, "cells": [{"has": "partial", "how": "Data model only, with no UI. Every entity has UUID, ownerId and createdAt/updatedAt. Workouts carry loggedBy and sessionMode (solo/remote/in_gym). The state includes relations home-screen/"]}, null, null, null, null]}, {"id": "new:data_integrity_recovery", "area": "new", "areaPL": "Inne (spoza listy)", "label": "data integrity recovery", "others": 0, "cells": [{"has": "yes", "how": "An unreadable saved state is never overwritten; it is moved to a 'state_corrupt_<ts>' key and a banner offers to send that copy (as an importable 'trening-recovery' envelope). A failed write shows a retry banner. Saves are sequenced with a counter so a clock change can't restore stale data. A failed DB open shows an error screen with retry instead of an empty app.", "fb": "", "src": ["lib/store.ts:init", "lib/store.ts:readRecovery", "lib/store.ts:persistRun", "app/(tabs)/index.tsx:DataBanners"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:default_exercise_targets", "area": "new", "areaPL": "Inne (spoza listy)", "label": "default exercise targets", "others": 1, "cells": [null, null, null, null, null, null, null, null, null, null, {"has": "yes", "how": "Global default sets/reps/time/rest for exercises without own targets (5.4).", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-540-custom-keyboard-automatic-rest-timer-default-exercise-settings-sundaymonday-start-date-g"]}]}, {"id": "new:exclude_from_stats", "area": "new", "areaPL": "Inne (spoza listy)", "label": "exclude from stats", "others": 3, "cells": [null, {"has": "yes", "how": "Settings > Start History From sets a date before which history is ignored in stats/records, as a non-destructive 'reset'.", "fb": "", "src": ["https://help.strongapp.io/article/250-can-i-reset-my-workout-history", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, null, null, null, null, null, null, null, {"has": "yes", "how": "Choose which exercise types count in stats (exclude warm-ups, cool-downs, stretches) (7.9).", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-9"]}, {"has": "yes", "how": "Per-workout toggle 'Exclude from Stren
