.strongapp.io/article/177-update-template"]}, {"has": "yes", "how": "Zakładka Workout > „+ Start Empty Workout”; także „Copy Workout” z dowolnego przeszłego treningu (własnego lub innego użytkownika) oraz widżet Quick Access.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35361530647959-How-to-Log-a-Workout-in-the-Hevy-App-Step-by-Step-Guide", "https://help.hevyapp.com/hc/en-us/articles/33703513582871-Workouts-vs-Routines-in-Hevy-What-They-Mean-and-How-to-Use-Them"]}, {"has": "yes", "how": "Menu Swap > „Create Workout From Scratch” buduje własny trening ćwiczenie po ćwiczeniu; Android oferuje też „Import Workout” ze zdjęcia/zrzutu ekranu.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/38318585683991-Customizing-Today-s-Workout"]}, {"has": "yes", "how": "Darmowe: tworzenie samodzielnego treningu od zera; Pro może wygenerować samodzielny trening.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "„Ad-Hoc Workout” rozpoczyna pusty trening i otwiera selektor „Add Exercises” (wielokrotny wybór). Po zakończeniu „Create Program Day” zamienia go w nowy dzień nowego lub istniejącego programu.", "fb": "App Store 2026-07 (4*): skarga, że nie ma sposobu na zapisanie minionego dnia treningowego do programu (aktualna dokumentacja opisuje akcję Create Program Day). https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/changing-a-workout"]}, {"has": "yes", "how": "+ (dolne menu) > Start New Workout, następnie „+ Exercise” z list „Most used” / „All exercises”.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/"]}, {"has": "partial", "how": "Sesje ad hoc robi się przez „Instant Workout” (wybierz czas trwania, mięśnie, sprzęt, potem Generate; edycja/zamiana potem) lub szybki trening na zegarku według docelowego mięśnia; czysty przepływ „pustego treningu” nie jest udokumentowany, a przycisk szybkiego „dodaj ćwiczenie na miejscu” (błyskawica) został usunięty.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/watch-guide-elevate-your-workout-with-jefit-wear-os", "https://etechshout.com/jefit-app-review/"]}, {"has": "yes", "how": "Rozpoczęcie treningu dowolnego/pustego bez programu; autoprogresja Pro działa także z pustymi treningami (v266).", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "partial", "how": "Logowanie opiera się na rutynach („SmartGym works with always having a base routine”). „Start Workout” uruchamia sesję HealthKit i wybierasz rutynę; przycisk na ekranie blokady w iOS 18 może rozpocząć „an open workout”. Brak udokumentowanego logowania doraźnego, ćwiczenie po ćwiczeniu, bez rutyny.", "fb": "", "src": ["https://help.smartgymapp.com/article/106-log-exercises", "https://help.smartgymapp.com/article/61-start-workout-session", "https://smartgymapp.com/releases/smartgym-7-5"]}, {"has": "partial", "how": "Treningi rozpoczyna się z szablonu planu przez czerwony + > Strength; w aktywnym treningu można doraźnie dodawać elementy (dodawanie ćwiczeń, monit o aktualizację szablonu). Nie udokumentowano czystego przepływu „pusty trening”.", "fb": "„I don't get why I can't just build a workout I want, then pull that one up and log it” - https://itunes.apple.com/us/rss/customerreviews/page=3/id=1482405410/sortby=mostrecent/json", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/option-to-create-new-template-in-addition-to-update-template-prompt"]}]}, {"id": "log_edit_past", "area": "log", "areaPL": "Logowanie treningu", "label": "Edycja/wsteczne dodanie treningu", "others": 9.0, "cells": [{"has": "no", "how": "Ekran zakończonej sesji (history/[id]) jest tylko do odczytu poza „Usuń sesję” (usunięcie). Nie można edytować serii, dodawać serii ani datować treningu wstecz. Czas startu i końca to zawsze „teraz”, poza czasem zakończenia porzuconego treningu.", "fb": "", "src": ["app/history/[id].tsx", "lib/store.ts:deleteWorkout"]}, {"has": "yes", "how": "History > trening ... > Edit Workout pozwala zmienić serie, datę oraz godzinę rozpoczęcia/zakończenia. Aby zalogować trening z przeszłości: rozpocznij trening, ... > Adjust Start/End Time, wyłącz Automatic Timing i ustaw godziny. Ustawienie „Start History From” ukrywa starszą historię w statystykach bez jej usuwania.", "fb": "", "src": ["https://help.strongapp.io/article/249-how-do-i-edit-a-past-workout", "https://help.strongapp.io/article/167-adjust-workout-date", "https://help.strongapp.io/article/250-can-i-reset-my-workout-history"]}, {"has": "yes", "how": "Trening ... > Edit Workout (serie, czas trwania itd.); datę/godzinę/czas trwania można zmienić na ekranie Save Workout (używane do uzupełnienia pominiętego tygodnia i przywrócenia serii); Calendar pozwala stuknąć przeszłą datę i „Log a workout”.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34513981310615-How-to-I-adjust-duration-and-pause-a-workout", "https://help.hevyapp.com/hc/en-us/articles/34467766576279-How-to-Get-Your-Weekly-Streak-Back-in-the-Hevy-App", "https://help.hevyapp.com/hc/en-us/articles/35380117933207-Track-Your-Workout-Consistency-with-the-Calendar-and-Streak-Features"]}, {"has": "yes", "how": "Zakładka Log > trening: edycja powtórzeń/serii/ciężaru, dodawanie (+) lub usuwanie ćwiczeń; „...” pozwala edytować czas trwania, usunąć lub zapisać jako nowy trening. Zapisane treningi można zalogować z datą wsteczną przez „Add as Past Workout” (data + godzina). Ponowna synchronizacja z Apple Health tylko tego samego dnia kalendarzowego.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/6259258835863-Save-a-Workout", "https://help.fitbod.me/hc/en-us/articles/360047357794-Apple-Health"]}, {"has": "yes", "how": "Przeszłe treningi można otwierać, edytować lub usuwać; zmiany propagują się do statystyk. Przeszłe treningi można dodawać ręcznie (sugerowane zamiast importu).", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Otwórz miniony trening z ekranu Home: edytuj serie, wymieniaj/usuwaj ćwiczenia, zmień datę i czas trwania (gg:mm), dodaj notatki, usuń. Zapis nie uruchamia ponownie progresji. Minione treningi można też zaimportować przez CSV.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-history"]}, {"has": "yes", "how": "Edycja dowolnego zapisanego treningu (serie, nazwa, czas, oceny); wsteczne dodanie przez zalogowanie i zmianę daty/godziny przy zapisie; kalendarz na ekranie głównym z v9.0 pozwala uzupełnić zapomniane treningi; usuwanie z widżetu ekranu głównego lub z dziennika.", "fb": "", "src": ["https://help.strengthlog.com/help-article/make-changes-to-a-saved-workout/", "https://help.strengthlog.com/help-article/backdating-a-workout/", "https://help.strengthlog.com/help-article/how-to-delete-a-workout/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "yes", "how": "Zalogowane treningi można edytować w każdej chwili z widoku kalendarza w zakładce Progress (poprawianie błędów, dodawanie szczegółów).", "fb": "etechshout: nie można łatwo edytować planu trwającego treningu; „Add exercise” zmienia cały program.", "src": ["https://www.jefit.com/support/faq"]}, {"has": "partial", "how": "Zakładka History listuje minione treningi (widok według miesięcy od v265) i pozwala otworzyć jeden i zapisać go jako szablon; edycja/uzupełnianie wsteczne zakończonych sesji nie jest udokumentowane.", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "partial", "how": "Wpisy w historii można usuwać (także na zegarku, v7); znacznik przy rutynie/ćwiczeniu pozwala ręcznie zalogować ćwiczenie na dziś. Brak udokumentowanego datowania treningu wstecz.", "fb": "Starsze zbiorcze recenzje wymieniają „No retroactive workout logging” - https://justuseapp.com/en/app/922744883/smartgym-gym-home-workouts/reviews", "src": ["https://alternativeto.net/news/2023/6/smartgym-7-has-been-released-with-new-exercises-progress-tracking-and-enhanced-apple-watch-app", "https://help.smartgymapp.com/article/63-what-is-the-checkmark"]}, {"has": "yes", "how": "Wybierz przeszłą datę na pulpicie/w kalendarzu + czerwony +, aby zapisać wcześniejszy trening; ukończone treningi można edytować przez View/Edit; edycja daty treningu została udostępniona (2025).", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001152861-how-do-i-log-a-strength-workout-", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/edit-date-of-a-workout"]}]}, {"id": "log_one_hand_ux", "area": "log", "areaPL": "Logowanie treningu", "label": "Obsługa jedną ręką", "others": 7.0, "cells": [{"has": "yes", "how": "✓, ▶, numer serii i cele gum mają 44 pt (przetestowane). Klawiatura chowa się po ✓ lub starcie stopera, żeby pasek przerwy pozostał widoczny. Pola używają klawiatury numerycznej lub dziesiętnej, a dla ±kg numbers-and-punctuation, bo numeryczna klawiatura iOS nie ma minusa. Pola akceptują przecinek lub kropkę dziesiętną i zaznaczają tekst po aktywacji. Dla ekranów 320 pt stosowany jest kompaktowy układ kolumn. Typowy przebieg od startu do pierwszej serii to 2 stuknięcia (Start, ✓).", "fb": "", "src": ["components/ui.tsx:NumInput", "components/ActiveWorkout.tsx:rowLayout", "components/ActiveWorkout.tsx:onDone", "docs/09-plan-testow.md:C1-C4"]}, {"has": "partial", "how": "Własna klawiatura numeryczna z przyciskami RPE i kalkulatora talerzy oraz klawiszem „Next”, który przechodzi do następnej serii (z uwzględnieniem superserii); usuwanie serii przeciągnięciem; opcja pełnoekranowego timera przerwy. Apple Watch: pickery Digital Crown, menu długiego naciśnięcia, kończenie serii przyciskiem Action oraz przełącznik „Button Repeat” na Apple Watch (6.3.3).", "fb": "Powszechnie chwalony jako najszybszy/najprostszy interfejs logowania („easy to use even when exhausted” – cytat z Lifehacker na stronie głównej; zalety wg GGR). Poprawki z 2026 dla zawieszającej się klawiatury / klawiatury RPE w iOS 27.", "src": ["https://help.strongapp.io/article/230-about-rpe", "https://help.strongapp.io/article/169-plate-calculator", "https://help.strongapp.io/article/98-supersets-and-circuits", "https://help.strongapp.io/article/231-rest-timer", "https://help.strongapp.io/article/224-workout-on-apple-watch", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, {"has": "yes", "how": "Ustawienie Keep Awake During Workout; Live Activity pozwala oznaczać serie jako ukończone i zmieniać przerwę ±15 s z ekranu blokady; Smart Superset Scrolling; dźwięk i haptyka odhaczenia serii; wprowadzanie czasu przywrócone jako pole tekstowe (maj 2026); przeprojektowanie Set Row z wyraźniejszymi stanami aktywny/odhaczony (sierpień 2026). Limit 150 serii na trening/rutynę.", "fb": "Recenzje konsekwentnie nazywają logowanie szybkim i czystym; niektórzy użytkownicy Strong uważają Hevy za „bardziej zatłoczone” (aitoolsbakery).", "src": ["https://www.hevyapp.com/features/workout-settings/", "https://help.hevyapp.com/hc/en-us/articles/35649846517399-How-to-Use-Hevy-s-Live-Activity-on-iOS-and-Android", "https://help.hevyapp.com/hc/en-us/articles/35650286563095-The-Complete-Guide-to-Supersets-and-Smart-Superset-Scrolling", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350", "https://help.hevyapp.com/hc/en-us/articles/34896183826455-Hevy-Set-Limit-Explained-Why-Workouts-and-Routines-Have-a-150-Set-Cap"]}, {"has": "partial", "how": "Wyróżniająca się opcja bez rąk: gesty głową w AirPods Pro (kiwnięcie, potrząśnięcie lub przechylenie, regulowana czułość) logują serie; logowanie z Apple Watch / Wear OS; Auto-Play w Timed Intervals przechodzi dalej bez dotykania. Brak udokumentowanych uwag o klawiaturze/dużych polach dotyku.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360056464934-Apple-AirPod-Pros", "https://help.fitbod.me/hc/en-us/articles/360006499194-Apple-Watch", "https://help.fitbod.me/hc/en-us/articles/360041831493-Timed-Intervals"]}, {"has": "partial", "how": "Własny „Picker” dla ciężaru/powtórzeń/RIR pokazuje posortowaną listę prawdopodobnych wartości plus klawiaturę („Weight, reps and RIR in two taps”); pozioma pasek miniatur do przełączania ćwiczeń.", "fb": "Starsza recenzja: opóźnienia wpisywania tekstu w wyszukiwarce ćwiczeń (thefitnesstribe).", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Duże pola Reps/Weight i duży znacznik ukończenia; własna klawiatura numeryczna z +/- krokującym o najmniejszy możliwy do załadowania ciężar; przesuwanie między ćwiczeniami; serie można kończyć z iOS Live Activity / powiadomienia Androida bez odblokowywania (Premium). Suwak rozmiaru tekstu 12-24 i opcjonalny Always On Display.", "fb": "App Store 2026-05 (3*): „wolne wprowadzanie” - szybsze pisanie, niż aplikacja nadąża, gubi wpisy. https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/lock-screen-and-notifications", "https://www.liftosaur.com/features/first-run-and-settings"]}, {"has": "partial", "how": "Dotknięcie numeru serii oznacza ją jako ukończoną (robi się zielona); gesty przesunięcia na seriach/ćwiczeniach; skróty długiego przytrzymania; opcjonalny timer XL. Użytkownicy zgłaszają, że pole do oznaczania ukończenia i nawigacja z 9.0 są niejasne.", "fb": "App Store 2023 (3*): „niezbyt jasne, jak oznaczyć trening jako ukończony, trzeba stukać w małe puste miejsce”; 2026-05 (3*): „potężna ... pogrzebana pod zdumiewającymi decyzjami UX”. https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json", "src": ["https://help.strengthlog.com/help-article/mark-a-set-as-done/", "https://help.strengthlog.com/help-article/shortcuts-in-an-active-workout/", "https://help.strengthlog.com/help-article/how-to-use-the-timer/"]}, {"has": "partial", "how": "Redesign z 2023 przeniósł swap/notatki/superset do menu trzech kropek, przesuwanie między ćwiczeniami, składany film; 2026: timer pozostaje widoczny w przycisku logowania przy otwartej klawiaturze, akceptowany lokalny separator dziesiętny, interfejs Liquid Glass na iOS 26.", "fb": "Wieloletni użytkownicy narzekają na wprowadzanie ciężaru/powtórzeń kółkiem przewijania zamiast klawiatury, dodatkowe wyskakujące okna i częste zmiany UI (recenzja z App Store; etechshout).", "src": ["https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "partial", "how": "Dotknij serię, aby ją zalogować, a timer przerwy startuje; od v265 (wrz 2026) bieżąca seria pozostaje podświetlona, a ukończone ćwiczenia się zwijają; przesunięcie w lewo usuwa serię/ćwiczenie.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app"]}, {"has": "yes", "how": "Inline Logging z 7.11 pokazuje jedną serię naraz z wartościami edytowalnymi na miejscu; własna klawiatura z przyciskami +/- 1 dla ciężaru/powtórzeń i przyciskiem typu serii. Smart Action Button przewiduje kolejny krok (zaloguj serię + przerwa, następne ćwiczenie, zerwa liczona jest od czasu zakończenia serii.", "fb": "", "src": ["components/ActiveWorkout.tsx:onDone", "lib/store.ts:restAfter", "lib/timer.ts:start", "lib/timer.ts:adjust"]}, {"has": "yes", "how": "Domyślny timer przerwy 2:00 startuje natychmiast po odhaczeniu serii; wyświetlany w lewym górnym rogu ekranu treningu, stuknięcie rozwija go na pełny ekran, gdzie można dostosować czas lub „Skip”; można ustawić pełny ekran jako domyślny. Można też uruchomić go ręcznie.", "fb": "", "src": ["https://help.strongapp.io/article/231-rest-timer"]}, {"has": "yes", "how": "Timer przerwy per ćwiczenie (stuknij „Rest Timer” pod nazwą ćwiczenia); startuje po odhaczeniu serii; powiadamia po dojściu do zera. Ustawienie „Default Rest Timer” dotyczy tylko nowo dodanych ćwiczeń (nie działa wstecz). Można wyłączyć dla danego ćwiczenia.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35385404949143-Rest-Timer-Default-Rest-Timer-How-to-Add-Adjust-Volume-and-Sound", "https://www.hevyapp.com/features/exercise-programming-options/"]}, {"has": "yes", "how": "Po zalogowaniu serii odliczanie startuje automatycznie z sygnałem dźwiękowym/wibracją na końcu; ikona timera przy ćwiczeniu włącza/wyłącza (ON/OFF). Logowanie z zegarka na Wear OS NIE uruchamia timera przerwy.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006340194-Rest-Timer", "https://help.fitbod.me/hc/en-us/articles/4406074415383-WearOS-on-Android"]}, {"has": "yes", "how": "Startuje automatycznie po ukończeniu serii; alarm przy zerze; domyślnie liczy dalej poniżej zera, by pokazać rzeczywistą przerwę. Timer przerwy jest w darmowym planie.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Timer przerwy startuje automatycznie po zaznaczeniu serii (lub po zatwierdzeniu okna AMRAP/RPE); pigułka pokazuje czas upłynięty vs docelowy, robi się czerwona po przekroczeniu celu i liczy dalej; -15s/+15s.", "fb": "", "src": ["https://www.liftosaur.com/feat niu.", "fb": "Recenzja z App Store: zalogowano treningi trwające 70+ godzin (i zsynchronizowano je z Apple Health) po zapomnieniu o zakończeniu; etechshout: brak opcji wznowienia, jeśli przypadkiem opuścisz sesję.", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "unknown", "how": "Nie udokumentowano.", "fb": "Starsze recenzje (2023-2025): ukończony trening nie zostaje zarejestrowany (następnego dnia się powtarza) i zawiesza się na ekranie podsumowania „complete workout”.", "src": ["https://www.boostcamp.app/workout-tracker"]}, {"has": "partial", "how": "Nie znaleziono automatycznego kończenia. Jeśli sesja pozostaje aktywna, aplikacja na zegarku wciąż wraca na ekran, dopóki nie zakończy się jej ręcznie. Smart Action z 7.11 rozpoznaje „returning after an interruption” i pokazuje akcję wznowienia.", "fb": "Recenzja: „can't get it to close on my watch ... immediately reopens” - https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json", "src": ["https://help.smartgymapp.com/article/105-apple-watch-app-wont-close", "https://smartgymapp.com/releases/smartgym-7-11"]}, {"has": "unknown", "how": "Nie udokumentowano automatycznego kończenia/odzyskiwania zapomnianych sesji.", "fb": "„it aborted my workout on the 23rd of 24 sets. No saved state upon restart” - https://itunes.apple.com/us/rss/customerreviews/page=3/id=1482405410/sortby=mostrecent/json", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "plan_templates", "area": "plan", "areaPL": "Szablony i programy", "label": "Szablony", "others": 10, "cells": [{"has": "yes", "how": "Szablony (karta Szablony) to listy elementów. Każdy element ma serie (1–50), zakres powtórzeń („pow. od”/„do”; puste = maks.), przerwę, ciężar startowy (lub ±kg) i docelowe sekundy dla metryk czasowych, plus grupowanie w superserie. Zasiane są cztery szablony (Upper A, Upper B, Legs — gym, Legs — home). Start z listy Home lub z edytora.", "fb": "", "src": ["lib/seed.ts:TemplateItem", "lib/seed.ts:seedState", "app/template/[id].tsx", "app/(tabs)/templates.tsx"]}, {"has": "yes", "how": "„Templates” (dawniej Routines) przechowują ćwiczenia/serie; tworzone przez „+ Template”, wewnątrz folderu lub „Save as Template” z History / po pustym treningu. Darmowy plan ogranicza do 3 szablonów; PRO — nielimitowane. Po treningu z szablonu pojawia się pytanie: Update Template / Update Values Only / Update Template and Values / Keep Original (komunikat można ukryć). Template Search dodano w 6.3.0 (marzec 2026).", "fb": "", "src": ["https://help.strongapp.io/article/105-about-templates", "https://help.strongapp.io/article/177-update-template", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577"]}, {"has": "yes", "how": "„Routines”: zakładka Workout > New Routine; darmowy plan 4 rutyny (istniejące zostają po obniżeniu planu), Pro nielimitowane. Serie w rutynie mogą używać zakresów powtórzeń (np. 6–8). Obsługiwane duplikowanie rutyny.", "fb": "Opis w App Store nadal mówi „unlimited routines”, podczas gdy centrum pomocy ogranicza darmowy plan do 4 (aitoolsbakery).", "src": ["https://help.hevyapp.com/hc/en-us/articles/34953606698903-Build-a-Workout-Program-Create-Organize-Routines", "https://help.hevyapp.com/hc/en-us/articles/35119778922263-Hevy-Pro-Subscription-How-to-get-Pro-and-What-Does-It-Include", "https://help.hevyapp.com/hc/en-us/articles/38279350428695-What-will-happen-to-my-account-if-I-switch-from-Pro-to-the-free-version", "https://www.hevyapp.com/features/exercise-programming-options/", "https://help.hevyapp.com/hc/en-us/articles/35119576252951-Reset-Data-Duplicate-Exercise-Routines-and-Manual-Deletion"]}, {"has": "yes", "how": "„Saved Workouts”: zapis bieżącego lub zalogowanego treningu pod nazwą; wczytanie przez Swap > Saved Workouts w 3 trybach (zachowaj / wygeneruj wszystko od nowa / wygeneruj tylko ciężar). Zapisane treningi nie przenoszą się między iOS a Androidem.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/6259258835863-Save-a-Workout", "https://help.fitbod.me/hc/en-us/articles/360049362174-How-to-Transfer-Your-Fitbod-Account-Between-iOS-and-Android"]}, {"has": "yes", "how": "Darmowe: nielimitowane ręczne plany (wielodniowe) i samodzielne treningi. Edytor planu z edycją zbiorczą dla wszystkich ćwiczeń, dnia lub tygodnia planu zperiodyzowanego; edycja serii, celów powtórzeń, dropsetów; import dni z innych planów.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Treningi to dni w programie; można mieć wiele programów i przełączać bieżący. Dzień można też utworzyć z treningu ad hoc.", "fb": "", "src": ["https://www.liftosaur.com/features/program-editor", "https://www.liftosaur.com/features/changing-a-workout"]}, {"has": "yes", "how": "Mine > + > Workout: nazwane, kolorowe szablony z ciężarem serii, „retrieve-from-log” lub % 1RM (premium) dla każdej serii; dowolny zalogowany trening można zapisać jako szablon; ulubione pojawiają się na ekranie głównym.", "fb": "", "src": ["https://help.strengthlog.com/help-article/save-a-workout-template/"]}, {"has": "yes", "how": "Własne „workout plans” (rutyny) złożone z dni; tworzone w aplikacji (zakładka Workout > Find Workout Plan > Create my Own) lub w webowym kreatorze rutyn, z ciężarem/powtórzeniami/przerwą/typem serii dla każdej serii. Darmowy poziom obejmuje własne rutyny.", "fb": "", "src": ["https://jefit.zendesk.com/hc/en-us/articles/360018367531-How-to-Create-a-Customized-Routine-", "https://www.jefit.com/blog/introducing-new-routine-builder-workout-planning-simplified", "https://www.jefit.com/elite"]}, {"has": "yes", "how": "Jednodniowe szablony treningów w „All Templates”; dowolny miniony trening z History można zapisać jako szablon.", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app"]}, {"has": "yes", "how": "Rutyny z nazwą, dniami, celem, tagami, datą odnowienia, notatkami i ćwiczeniami. Tworzenie od zera, z Explore, przez Smart Trainera („Trust Us”/„Create For Muscles”), z tekstu lub językiem naturalnym (8.0). Duplikowanie, zmiana nazwy, archiwizacja; wersje robocze zapisują się automatycznie (7.9); opcjonalne segmenty Main/Warm-Up/Cool-Down.", "fb": "", "src": ["https://help.smartgymapp.com/article/57-create-custom-routine", "https://help.smartgymapp.com/article/118-duplicate-a-routine", "https://help.smartgymapp.com/article/117-archive-a-routine", "https://smartgymapp.com/releases/smartgym-7-9"]}, {"has": "yes", "how": "Plany treningowe zawierają wiele treningów; tworzenie od zera (wybór liczby treningów), przez Workout Wizard, z Library lub Pro; duplikowanie treningów i całych planów (5.7); zbiorcza edycja parametrów ćwiczeń w treningu (3.1.13).", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-570-export-workout-data-plans-section-rebuild-dark-mode", "https://feedback.caliberstrong.com/announcements/caliber-3113-3115-exercise-edit-screen-redesign-bulk-edit-exercises-report-messages", "https://feedback.caliberstrong.com/announcements/release-notes-caliber-220-create-workouts-from-scratch-in-app-feature-requests"]}]}, {"id": "plan_folders", "area": "plan", "areaPL": "Szablony i programy", "label": "Foldery szablonów", "others": 4.5, "cells": [{"has": "no", "how": "Szablony to jedna płaska lista; brak folderów i tagów.", "fb": "", "src": ["app/(tabs)/templates.tsx"]}, {"has": "yes", "how": "Foldery z przeciąganiem i upuszczaniem, zwijane; folder Archive na nieużywane szablony; przykładowe szablony można ukryć (Settings > Bonus Options). Artykuł pomocy mówi, że foldery są tylko na iPhone'a („coming to Android soon”).", "fb": "", "src": ["https://help.strongapp.io/article/107-organize-templates", "https://help. utyn Smart Trainera.", "fb": "", "src": ["https://help.smartgymapp.com/article/57-create-custom-routine", "https://help.smartgymapp.com/article/117-archive-a-routine", "https://help.smartgymapp.com/article/136-different-equipment-lists", "https://help.smartgymapp.com/article/145-how-often-smart-trainer-refreshes-your-routines"]}, {"has": "partial", "how": "Brak folderów; wiele planów („workout groups”) działa jak kontenery z jednym planem domyślnym.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001222755-how-do-i-rename-a-workout-group-", "https://feedback.caliberstrong.com/announcements/caliber-3112-startscheduling-ux-updates-training-plan-screen-adjustments"]}]}, {"id": "plan_programs", "area": "plan", "areaPL": "Szablony i programy", "label": "Programy wielotygodniowe", "others": 8.5, "cells": [{"has": "no", "how": "Brak programów wielotygodniowych i biblioteki programów. Istnieją tylko pojedyncze szablony.", "fb": "", "src": ["lib/seed.ts:State"]}, {"has": "partial", "how": "Brak biblioteki programów wielotygodniowych; tylko kilka wbudowanych przykładowych szablonów. App Store podaje, że aplikacja jest zoptymalizowana pod progresywne rutyny ze sztangą, jak Starting Strength / StrongLifts 5x5, ale buduje się je samodzielnie.", "fb": "", "src": ["https://help.strongapp.io/article/105-about-templates", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577", "https://aitoolsbakery.com/blog/strong-app-review/"]}, {"has": "yes", "how": "Biblioteka Explore: 26 programów (filtry Level, Goal, Equipment) + 7 kategorii rutyn (At home, Travel, Dumbbells only, Band, Cardio & HIIT, Gym, Bodyweight); „Save Program” tworzy folder rutyn. Artykuły na blogu linkują dodatkowe rutyny.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/36011518408983-How-to-Access-and-Use-Hevy-s-Routine-and-Program-Library"]}, {"has": "partial", "how": "Brak klasycznej biblioteki programów wielotygodniowych. Zamiast tego: algorytmiczne dzienne treningi w obrębie podziału; „Focus Exercises” działają w 4-tygodniowym, 4-fazowym cyklu (Build Momentum, Dial It In, Close to Peak Effort, Final Push) na głównych bojach złożonych; „On Demand Workouts” na iOS to 9 gotowych sesji (masa ciała, hantle, kettlebell, gumy, BOSU, TRX; 15–30 min).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/35301260960663-Focus-Exercises", "https://help.fitbod.me/hc/en-us/articles/28568837402775-On-Demand-Workouts", "https://help.fitbod.me/hc/en-us/articles/34336407191191-My-Plan"]}, {"has": "partial", "how": "Plany wielotygodniowe: generowane plany 4–7 tygodni (domyślnie 4) lub bezterminowe; plany ręczne 1–52 tygodnie lub bezterminowe; powtórzenie/przedłużenie/regeneracja na końcu. Brak kuratorowanej biblioteki nazwanych programów — punkty wejścia to wygenerowanie, zbudowanie własnego lub otwarcie linku do udostępnionego planu.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator"]}, {"has": "yes", "how": "Około 60 wbudowanych programów (GZCLP i rodzina GZCL, warianty 5/3/1, Starting Strength, PHUL, Basic Beginner Routine, Strong Curves...) filtrowanych według doświadczenia, dni/tydzień, długości sesji i celu; podgląd każdego dnia; klonowanie do własnej edytowalnej kopii.", "fb": "", "src": ["https://www.liftosaur.com/features/built-in-programs", "https://apps.apple.com/us/app/liftosaur-scriptable-workouts/id1661880849"]}, {"has": "yes", "how": "Ponad 200 programów i samodzielnych treningów (trójbój siłowy, kulturystyka, powerbuilding, PPL, specyficzne dla sportu) filtrowanych według Free/Premium, poziomu i kategorii; „Follow program” umieszcza następny trening na ekranie głównym; pominięcie/zaprzestanie śledzenia; pełny katalog jest w Premium.", "fb": "", "src": ["https://help.strengthlog.com/help-article/follow-a-program/", "https://www.strengthlog.com/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "yes", "how": "Baza rutyn z ok. 26 800 planami filtrowanymi według celu/poziomu/dni (społeczność + JEFIT); profesjonalnie zaprojektowane plany „Elite” są za paywallem.", "fb": "", "src": ["https://www.jefit.com/routines", "https://www.jefit.com/elite", "https://www.jefit.com/support/faq"]}, {"has": "yes", "how": "Rdzeń aplikacji: 11 000+ programów, w tym 130+ zaprojektowanych przez trenerów (Wendler 5/3/1, nSuns, GZCLP, PHUL/PHAT, Reddit PPL, Sheiko, Candito, Helms, Nuñez...), filtrowanych według poziomu, celu, dni/tydzień; ok. 20 programów trenerskich jest ekskluzywnych dla Pro. Można dołączyć do wielu programów naraz.", "fb": "", "src": ["https://www.boostcamp.app/features", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://fortune.com/article/boostcamp-review/"]}, {"has": "paid", "how": "Karta Explore: ponad 130 gotowych treningów od trenerów personalnych, w kategoriach; można je dopasować do listy sprzętu i edytować po dodaniu. Tylko w planie Premium+.", "fb": "", "src": ["https://help.smartgymapp.com/article/125-how-to-use-smartgym", "https://help.smartgymapp.com/article/81-access-pre-made-workouts", "https://help.smartgymapp.com/article/95-already-premium-pre-made-workouts", "https://smartgymapp.com/"]}, {"has": "paid", "how": "Workout Library (Plus): ponad 120 planów od trenerów z filtrami (czas, częstotliwość, sprzęt...), bio trenera, edytowalne po dodaniu; 28 nowych 45-minutowych planów w 5.7; treningi mobilności można dodawać do planów; plany dla kobiet w ciąży/po porodzie. Pro: nowe 4-tygodniowe plany co miesiąc.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-400-workout-library-nutrition-targets-updated-plans-screen-uxui", "https://feedback.caliberstrong.com/announcements/caliber-570-export-workout-data-plans-section-rebuild-dark-mode", "https://apps.apple.com/us/app/caliber-strength-training/id1482405410", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257573-caliber-pro-user-guide", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/pregnancy-and-postpartum-specific-plans"]}]}, {"id": "plan_periodization", "area": "plan", "areaPL": "Szablony i programy", "label": "Periodyzacja/% 1RM/deload", "others": 6.5, "cells": [{"has": "no", "how": "Brak tygodni deload, bloków ani zaleceń opartych na %1RM. Ciężar startowy szablonu to wartość bezwzględna.", "fb": "", "src": ["lib/seed.ts:TemplateItem"]}, {"has": "no", "how": "Brak udokumentowanych zapisów w % 1RM, bloków ani planowania deloadu; sam Strong i recenzenci opisują go jako dziennik, który nie buduje programów.", "fb": "", "src": ["https://aitoolsbakery.com/blog/strong-app-review/", "https://help.strongapp.io/article/133-1rm"]}, {"has": "partial", "how": "„Program Variety” w Hevy Trainer: Consistent / Balanced (ćwiczenia rotują mniej więcej co 6 tygodni) / Variable (co tydzień). Kalkulator rozgrzewki oparty na procentach. Brak udokumentowanych zapisów serii roboczych w % 1RM ani planowania deloadu.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/43572343844247-How-Hevy-Trainer-Settings-Work", "https://www.hevyapp.com/features/workout-plan-generator/", "https://help.hevyapp.com/hc/en-us/articles/35650921359639-How-to-Use-the-Warm-Up-Calculator-for-Percentage-Based-Warm-Up-Sets"]}, {"has": "partial", "how": "Automatyczna periodyzacja nieliniowa: mStrength zmienia intensywność/objętość między sesjami (dni ciężkie z małą liczbą powtórzeń vs lekkie z dużą); 4-fazowy/4-tygodniowy cykl Focus Exercises; Max Effort Days (serie narastające + 2 serie AMRAP) rekalibrują. Brak definiowanych przez użytkownika bloków %1RM ani zaplanowanych deloadów.", "fb": "Recenzja: „Mechanical plateau handling (weight reduction only, not strategic deloads)” (sensai.fit 2026).", "src": ["https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight", "https://help.fitbod.me/hc/en-us/articles/35301260960663-Focus-Exercises", "https://help.fitbod.me/hc/en-us/articles/360033675553-Max-Effort-Day", "https://apps.apple.com/us/app/fitbod-gym-fitness-planner/id1041517543"]}, {"has": "paid", "how": "Pro: periodyzacja w mezocyklu (plany ≥2 tygodnie) zmienia serie, cele powtórzeń, dropsety i cele RIR z tygodnia na tydzień; opcjonalny deload na końcu planu (nie dla planów bezterminowych) lub oznaczenie dowolnego treningu jako deload. Nie opiera się na %1RM.", "fb": "Zaawansowani użytkownicy chwalą wbudowaną periodyzację zastępującą Excela (recenzje w App Store).", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator"]}, {"has": "yes", "how": "Programy wielotygodniowe („# Week N”), % 1RM, cele RPE, wariacje serii, nadpisania dla poszczególnych tygodni, tygodnie deload przez „progress: none”, lp() z parametrami deloadu po N porażkach; wszystko skryptowalne.", "fb": "", "src": ["https://www.liftosaur.com/doc/liftoscript", "https://www.liftosaur.com/features/progressions"]}, {"has": "yes", "how": "Wielotygodniowy kreator programów (kopiuj tydzień do następnego i edytuj), serie w % 1RM (premium) z użyciem zapisanych „My 1RMs”, serie oparte na RPE/RIR (premium), retrieve-from-log + stały przyrost progresji (premium). v9.0 dodaje kreatory Simple i Detailed z Smart Blocks.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-build-a-program/", "https://help.strengthlog.com/help-article/1rm-for-programs/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "paid", "how": "Elite: Adaptive Plan buduje trzy 4-fazowe mezocykle (On-Ramp, Accumulation, Intensification, Deload; ok. 1 tydzień na fazę) dla 3-6 dni/tydz.; od sie 2026 „Auto-apply periodization” stosuje tę samą falę faz do planów zbudowanych przez użytkownika, zmieniając tylko ciężary/powtórzenia, z tygodniami Bridge, gdy faza wypada słabo. Wpisywanie %1RM nie jest obsługiwane.", "fb": "", "src": ["https://www.jefit.com/blog/adaptive-mesocycle-training-jefits-smarter-way-to-progress", "https://www.jefit.com/blog/periodization-on-your-own-plan", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "yes", "how": "Programy kodują procenty maksimum treningowego, cele AMRAP, fale i deloady; wpisujesz wyjściowe boje, a ciężary są wyliczane co tydzień. Własny kreator obsługuje wielotygodniowe mezocykle i fale maksimum treningowego.", "fb": "", "src": ["https://www.boostcamp.app/vs/hevy", "https://www.boostcamp.app/features", "https://www.garagegymreviews.com/boostcamp-review"]}, {"has": "partial", "how": "Smart Trainer deklaruje periodyzację w stylu NSCA: dopracowuje rutynę po każdym treningu, a cały program przepisuje w „punkcie przejścia” (plateau, koniec bloku). Częstotliwość odświeżania jest konfigurowalna (Automatic / częściej / „Never”). Brak udokumentowanego programowania opartego na %1RM ani jawnych tygodni deload.", "fb": "", "src": ["https://smartgymapp.com/features.html", "https://help.smartgymapp.com/article/145-how-often-smart-trainer-refreshes-your-routines", "https://smartgymapp.com/releases/smartgym-7-9"]}, {"has": "no", "how": "Brak w aplikacji programowania opartego na %1RM, blokach czy deloadzie; FAQ: „Do my workouts change automatically each week? No.” Periodyzacja tylko przez trenera-człowieka (Premium) lub miesięczne plany Pro.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://www.garagegymreviews.com/caliber-app-review"]}]}, {"id": "plan_generator", "area": "plan", "areaPL": "Szablony i programy", "label": "Generator treningów (AI/algorytm)", "others": 7.5, "cells": [{"has": "no", "how": "Brak algorytmicznego ani AI generowania treningów. Moduł „recommendations” to wyłączony placeholder („wkrótce”).", "fb": "", "src": ["lib/seed.ts:MODULES_AVAILABLE"]}, {"has": "no", "how": "Brak generowania treningów przez AI lub algo /en/blog/alpha-progression-progression-recommendations", "https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Oparte na regułach: „progress:” dla ćwiczenia uruchamia się po zakończeniu treningu i przepisuje tekst programu: lp(increment, successes, ..., deload weight, failures), dp(), sum() lub skrypty custom() ze zmiennymi stanu czytającymi completedReps/RPE/weights. Podgląd „Exercise Changes” widać pod seriami; można go jednorazowo wyłączyć.", "fb": "", "src": ["https://www.liftosaur.com/features/progressions"]}, {"has": "yes", "how": "Oparte na regułach, nie adaptacyjne: Smart Blocks z v9.0 z progresją Linear (ciężar rośnie, gdy wykonano wszystkie powtórzenia), Double (zakres powtórzeń, potem ciężar) i Triple (powtórzenia, potem serie, potem ciężar); starsze Retrieve-from-log + stały przyrost (premium); programy % 1RM.", "fb": "Recenzja zewnętrzna: „decyzja, kiedy dodać ciężar, kiedy zrobić deload ... należy do Ciebie” (ocena sprzed 9.0). https://steelrep.app/blog/best-workout-apps-strength-training/", "src": ["https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662", "https://app.strengthlog.com/main.dart.js", "https://help.strengthlog.com/help-article/how-to-build-a-program/"]}, {"has": "paid", "how": "Elite Load Progression Engine: po każdym treningu ocenia jakość serii roboczych, Hard-Set Equivalents, spadek powtórzeń (zmęczenie), krótkoterminowy trend, cel i rolę ćwiczenia; główne boje progresują, gdy osiągnięta zostanie górna granica zakresu powtórzeń przy stabilnych powtórzeniach, akcesoria, gdy większość serii osiągnie górną granicę; skoki zwykle 2,5-5% (lub następna hantla / jeden kołek maszyny). Fioletowa gwiazdka wyjaśnia każdy cel.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/the-science-behind-jefits-load-progression-engine", "https://www.jefit.com/blog/periodization-on-your-own-plan"]}, {"has": "partial", "how": "Za darmo: autoprogresja zdefiniowana przez progr nik może ręcznie nadpisać % regeneracji. Mięśnie pomocnicze ograniczone do 1–2 ćwiczeń na trening.", "fb": "Recenzja: „Recovery estimates may not always match how users feel” (lasta.app); brak danych HRV/snu (sensai.fit).", "src": ["https://help.fitbod.me/hc/en-us/articles/360006269014-Muscle-Recovery", "https://help.fitbod.me/hc/en-us/articles/43492170863895-How-does-Fitbod-know-my-muscles-are-still-recovering", "https://help.fitbod.me/hc/en-us/articles/360047357794-Apple-Health"]}, {"has": "partial", "how": "Zmęczenie w trakcie treningu: rekomendacje zmieniają się między seriami, bo „set 3 is not set 1”. Brak modelu regeneracji per mięsień ani gotowości — regenerację obsługuje struktura programu.", "fb": "", "src": ["https://apps.apple.com/us/app/alpha-progression/id1462277793", "https://alphaprogression.com/en/blog/alpha-progression-vs-fitbod"]}, {"has": "no", "how": "Brak modelu gotowości/regeneracji; sen, kalorie i białko są tylko odczytywane ze Zdrowia na potrzeby wyświetlania/API. Nie opisano nigdzie w oficjalnej dokumentacji poszczególnych funkcji, która deklaruje opis „wszystkiego, co robi aplikacja” (sprawdzono 2026-10-02).", "fb": "", "src": ["https://www.liftosaur.com/features/measurements", "https://www.liftosaur.com/features"]}, {"has": "partial", "how": "Przy zapisie oceniasz sen, stres, spożycie kalorii i to, jak minął trening („shape”); statystyki premium porównują np. odczuwaną formę z powtórzeniami. Brak modelu gotowości dostosowującego trening.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/", "https://help.strengthlog.com/help-article/strengthlog-premium/", "https://app.strengthlog.com/main.dart.js"]}, {"has": "partial", "how": "Wykres regeneracji mięśni szacuje, które mięśnie są zregenerowane (używany do automatycznego wyboru mięśni zregenerowanych w 80-100% w Mix); silnik Stimulus Volume śledzi tygodniowe obciążenie HSE. Brak danych o śnie/HRV.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-wor nce/Time. Baner PR na żywo + dźwięk podczas treningu; medale przy seriach. Osobna tabela „Set Records” = najcięższy ciężar dla każdej liczby powtórzeń (bez PR na żywo).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35649367857175-Personal-Records-PRs-and-Set-Records-Explained-How-They-Work-in-the-Hevy-App", "https://help.hevyapp.com/hc/en-us/articles/38279531346455-Set-Records-vs-Personal-Records", "https://help.hevyapp.com/hc/en-us/articles/36012016405655-Hevy-Live-PR-Notifications-Get-Instant-Updates-on-Your-Best-Lifts"]}, {"has": "yes", "how": "Rekordy per ćwiczenie: Estimated Strength, Volume, Reps (maks. w serii), Weight (najcięższy), Exercise Time, Total Time, Distance, Total Distance, Split (najlepsze tempo).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/12732749777047-Fitbod-Metrics-Records"]}, {"has": "yes", "how": "Darmowe: rekordy ciężaru, powtórzeń, objętości, szacowanego 1RM, szacowanego 10RM oraz najlepszy wynik na grupę mięśniową, pokazywane w podsumowaniu treningu.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Dla ćwiczenia: Max Weight i Max 1RM (e1RM) z datą i serią; puchar na kartach historii; ekran końcowy listuje nowe rekordy; Week Insights pokazuje rekordy względem poprzedniego najlepszego; Last/Best/Best AMRAP w trakcie serii. Nie opisano tabeli rekordów dla poszczególnych liczb powtórzeń.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/graphs", "https://www.liftosaur.com/features/week-insights"]}, {"has": "yes", "how": "Automatyczny rekord dla każdej liczby powtórzeń (1RM..nRM), odznaki Yearly Records („YR!”) i PR („PR!”) wyświetlane na bieżąco podczas logowania, Time PR; strona rekordów dla każdego roku; ręczne dodawanie starych rekordów, usuwanie błędnych; dołączanie filmów do rekordów.", "fb": "", "src": ["https://help.str -9"]}, {"has": "yes", "how": "Przełącznik „Exclude from Strength Score” dla każdego treningu (deload/kontuzja/podróż).", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-310-workout-sharing-disable-strength-score-for-workouts-fix-for-logout-issue", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "new:exercise_evaluations", "area": "new", "areaPL": "Inne (spoza listy)", "label": "exercise evaluations", "others": 1, "cells": [null, null, null, null, {"has": "paid", "how": "Pro: ocenia przydatność każdego ćwiczenia do budowania mięśni na podstawie zakresu ruchu i stabilności.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/subscribe"]}, null, null, null, null, null, null]}, {"id": "new:exercise_preferences", "area": "new", "areaPL": "Inne (spoza listy)", "label": "exercise preferences", "others": 1, "cells": [null, null, null, {"has": "yes", "how": "Recommend More Often (+40–60% prawdopodobieństwa), Recommend Less Often (−20–40%), Don't Recommend Again (wykluczenie, natychmiast). Zarządzane per ćwiczenie z „...” lub My Plan > Manage Exercises; brak zbiorczego resetu. Niejawne uczenie się z pominięć, zamian, usunięć i ręcznych dodań.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/9093233634711-Recommend-More-Less-or-Exclude-Exercises", "https://help.fitbod.me/hc/en-us/articles/43489509474455-How-does-Fitbod-choose-which-exercises-to-give-me"]}, null, null, null, null, null, null, null]}, {"id": "new:exercise_variability", "area": "new", "areaPL": "Inne (spoza listy)", "label": "exercise variability", "others": 1, "cells": [null, null, null, {"has": "yes", "how": "More Consistent (zachowuje 70–80% ćwiczeń tygodniowo), Balanced (domyślnie), More Variable.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/29976242163223-Exercise-Variability"]}, null, null, null, null, null, null, null]}, { s, Reps/Set, Total/Average Time, Total Distance. Brak na Apple Watch.", "fb": "", "src": ["https://help.strongapp.io/article/226-focus-metric"]}, null, null, null, null, null, null, null, null, null]}, {"id": "new:fork_programs", "area": "new", "areaPL": "Inne (spoza listy)", "label": "fork programs", "others": 1, "cells": [null, null, null, null, null, null, null, null, {"has": "yes", "how": "Forkowanie dowolnego programu z biblioteki i edycja jako własnego.", "fb": "", "src": ["https://www.boostcamp.app/features"]}, null, null]}, {"id": "new:goal_and_experience_profiles", "area": "new", "areaPL": "Inne (spoza listy)", "label": "goal and experience profiles", "others": 1, "cells": [null, null, null, {"has": "yes", "how": "7 celów (Build Muscle, Get Lean, Get Stronger, Reduce Bodyweight, Improve Fitness, Practice Powerlifting, Practice Olympic Weightlifting) ustawia zakresy powtórzeń (np. siła 4–6, hipertrofia 8–12), przerwy i udział cardio; poziom doświadczenia odblokowuje złożoność ćwiczeń. Żadne z nich nie dostosowuje się automatycznie.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/15948615409687-Fitness-Goals", "https://help.fitbod.me/hc/en-us/articles/29976088485143-Fitness-Experience"]}, null, null, null, null, null, null, null]}, {"id": "new:goals", "area": "new", "areaPL": "Inne (spoza listy)", "label": "goals", "others": 2, "cells": [null, null, null, null, null, null, {"has": "paid", "how": "9 typów celów: powtórzenia, objętość, serie, liczba treningów, PR, e1RM, time PR, cel powtórzeń przy ciężarze, pomiar ciała; zakres dat, ćwiczenia lub grupy mięśniowej, wykres postępu na żywo; za darmo ograniczone, w premium bez limitu.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-set-up-a-goal/", "https://help.strengthlog.com/help-article/strengthlog-premium/"]}, null, null, {"has": "yes", "how": "Cele liczby treningów na tydzień/miesiąc/rok z seriami, „Custom Goals Insights” od AI (7.6/7.7).", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-6", "https://apps.apple.com/us/app/smartgym-gym-home-workouts/id922744883"]}, null]}, {"id": "new:heart_rate", "area": "new", "areaPL": "Inne (spoza listy)", "label": "heart rate", "others": 3, "cells": [null, null, null, {"has": "yes", "how": "Na żywo BPM, średnia/min/maks. i sparkline podczas treningów z Apple Watch lub AirPods Pro 3 (iOS 26+) albo dowolnego nadajnika tętna BLE na Androidzie (Garmin, Polar, WHOOP). Tylko wyświetlanie — nie używane do kalorii ani rekomendacji.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/39224086573207-Live-Heart-Rate-Tracking"]}, null, {"has": "yes", "how": "Tętno na ekranie treningu z Apple Watch lub z AirPods, jeśli nie ma zegarka (v122, wrz 2026).", "fb": "", "src": ["https://apps.apple.com/us/app/liftosaur-scriptable-workouts/id1661880849", "https://www.liftosaur.com/features/apple-watch"]}, null, null, null, {"has": "yes", "how": "Kolorowe strefy tętna w czasie rzeczywistym na iPhonie i zegarku (zmienia się kolor tła zegarka), czas w strefach na trening, wstecznie kompatybilne; własne strefy (7.10, np. dla osób przyjmujących beta-blokery); kalorie ze wzoru Keytela na podstawie tętna. | Live Workout Builder (iOS 26) śledzi tętno, strefy i kalorie z AirPods Pro 3 / Powerbeats Pro 2 bez zegarka.", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-3", "https://smartgymapp.com/releases/smartgym-7-6", "https://smartgymapp.com/releases/smartgym-7-10", "https://smartgymapp.com/features.html", "https://smartgymapp.com/releases/smartgym-7-7", "https://smartgymapp.com/features.html"]}, null]}, {"id": "new:history_list_and_session_detail", "area": "new", "areaPL": "Inne (spoza listy)", "label": "history list and session detail", "others": 0, "cells": [{"has": "yes", "how": "Karta Historia wyświetla sesje z datą/godziną, czasem trwania, liczbą serii roboczych i objętością (zwirtualizowany FlatList). Widok szczegółów pokazuje każdą serię (W/numerowana + D/F), ciężar, powtórzenia, dystans, czas, RPE, gumę, faktyczną przerwę, etykiety PR i notatki. Etykiety superserii są zachowane.", "fb": "", "src": ["app/(tabs)/history.tsx", "app/history/[id].tsx"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:in_workout_update_scripts", "area": "new", "areaPL": "Inne (spoza listy)", "label": "in workout update scripts", "others": 1, "cells": [null, null, null, null, null, {"has": "yes", "how": "„update: custom()” uruchamia się przed pierwszą serią i po każdej ukończonej serii, aby zmodyfikować pozostałe serie w bieżącym treningu (np. dodać serię, jeśli powtórzenia osiągnęły cel, ustawić ciężar = masa ciała).", "fb": "", "src": ["https://www.liftosaur.com/features/progressions"]}, null, null, null, null, null]}, {"id": "new:injuries", "area": "new", "areaPL": "Inne (spoza listy)", "label": "injuries", "others": 3, "cells": [null, null, {"has": "paid", "how": "Oznacz kontuzjowane obszary, a Trainer będzie unikać/ostrzegać przed ryzykownymi ćwiczeniami (sierpień 2026).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/43572343844247-How-Hevy-Trainer-Settings-Work", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350"]}, {"has": "yes", "how": "My Plan > Injuries/Limitations: wolny tekst lub szybki wybór obszaru (Lower Back, Shoulder, Knee...), odpowiedzi na pytania, sugerowane wykluczenia/alternatywy, „Update Plan”; lista pokazuje datę zgłoszenia i dotknięte ćwiczenia; „Mark As Not Injured”. Nie nadpisuje Focus Exercises.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/37629269518103-Injuries-and-Limitations"]}, null, null, null, {"has": "yes", "how": "Zapis kontuzji ocenianych jako lekkie/ciężkie; aplikacja wysyła przypomnienia o check-inie regeneracji przed następną sesją i zamienia ćwiczenia z uwzględnieniem kontuzji.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, null, null, null]}, {"id": "new:interval_special_sets", "area": "new", "areaPL": "Inne (spoza listy)", "label": "interval special sets", "others": 1, "cells": [null, null, null, null, null, null, {"has": "yes", "how": "EMOM (interwały w krokach co 15 s, bloki na przemian), Tabata (domyślnie 20/10 x8), AMRAP (limit czasu, dodawanie rund przy działającym timerze) i Complex, z pełnoekranowym timerem, odliczaniem i sygnałami dźwiękowymi.", "fb": "", "src": ["https://help.strengthlog.com/help-article/special-sets/"]}, null, null, null, null]}, {"id": "new:keep_screen_awake", "area": "new", "areaPL": "Inne (spoza listy)", "label": "keep screen awake", "others": 1, "cells": [{"has": "yes", "how": "Przy ustawieniu „Ekran włączony podczas treningu” (domyślnie włączone) ekran pozostaje aktywny, gdy ekran treningu jest zamontowany (expo-keep-awake).", "fb": "", "src": ["components/ActiveWorkout.tsx", "app/more/settings.tsx"]}, null, {"has": "yes", "how": "Ustawienie utrzymywania ekranu włączonego podczas treningu.", "fb": "", "src": ["https://www.hevyapp.com/features/workout-settings/"]}, null, null, null, null, null, null, null, null]}, {"id": "new:lifetime_purchase", "area": "new", "areaPL": "Inne (spoza listy)", "label": "lifetime purchase", "others": 1, "cells": [null, {"has": "yes", "how": "Jednorazowy zakup „Strong PRO Forever” (79,99/99,99 USD w USA).", "fb": "", "src": ["https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577", "https://help.strongapp.io/article/179-strong-terms-of-service"]}, null, null, null, null, null, null, null, null, null]}, {"id": "new:liftoscript_dsl", "area": "new", "areaPL": "Inne (spoza listy)", "label": "liftoscript dsl", "others": 1, "cells": [null, null, null, null, null, {"has": "yes", "how": "Programy to zwykły tekst: „Exercise / sets x reps weight @RPE / rest / warmup: / progress: / update: / superset:”; tygodnie „#”, dni „##”, ponowne użycie („...Bench Press”), szablony („used: none”), etykiety, opisy; skrypty w stylu JS ze zmiennymi stanu, pętlami, tagami i wbudowanymi funkcjami.", "fb": "", "src": ["https://www.liftosaur.com/features/liftoscript", "https://www.liftosaur.com/doc/liftoscript"]}, null, null, null, null, null]}, {"id": "new:live_pr", "area": "new", "areaPL": "Inne (spoza listy)", "label": "live pr", "others": 1, "cells": [{"has": "yes", "how": "Plakietka PR na żywo przy serii, która bije rekord (raz na ćwiczenie w treningu) — patrz stats_prs.", "fb": "", "src": []}, null, {"has": "yes", "how": "Baner + konfigurowalny dźwięk, gdy seria pobije PR w trakcie treningu.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/36012016405655-Hevy-Live-PR-Notifications-Get-Instant-Updates-on-Your-Best-Lifts"]}, null, null, null, null, null, null, null, null]}, {"id": "new:load_modes", "area": "new", "areaPL": "Inne (spoza listy)", "label": "load modes", "others": 0, "cells": [{"has": "yes", "how": "Każde ćwiczenie z obciążeniem ma tryb obciążenia: na hantlę (×2 w objętości, kolumna „kg/hant.”), łącznie (×1) lub jednostronnie na stronę (×2, „kg/str.”). Domyślnie: hantle → na hantlę, z wyjątkiem boju z jednym przyborem, jak Goblet Squat czy KB Swing → łącznie. Masa ciała to zawsze ×1. Zmiana sprzętu resetuje tryb. Wpływa na objętość, etykiety kolumn i etykiety e1RM/maks.", "fb": "", "src": ["lib/seed.ts:loadModeFor", "lib/seed.ts:SINGLE_IMPLEMENT", "lib/store.ts:exMult", "app/exercise/[id].tsx"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:max_effort_days", "area": "new", "areaPL": "Inne (spoza listy)", "label": "max effort days", "others": 1, "cells": [null, null, null, {"has": "yes", "how": "Planowane automatycznie dla ćwiczenia: kilka serii narastających, potem 2 serie AMRAP z ciężarem roboczym („+ reps”), by rekalibrować Estimated Strength. Nie można wywołać ręcznie ani wyłączyć globalnie (ukrywanie per ćwiczenie); nie dla gum/superserii/obwodów, 1 na mięsień w treningu, wstrzymane, gdy Focus Exercises są włączone.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360033675553-Max-Effort-Day", "https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight"]}, null, null, null, null, null, null, null]}, {"id": "new:merge_exercise_history", "area": "new", "areaPL": "Inne (spoza listy)", "label": "merge exercise history", "others": 1, "cells": [null, {"has": "yes", "how": "Edit Exercise > Transfer Exercise Data scala historię jednego ćwiczenia z innym ćwiczeniem tej samej kategorii (nieodwracalne).", "fb": "", "src": ["https://help.strongapp.io/article/209-how-do-i-merge-data-between-two-exercises"]}, null, null, null, null, null, null, null, null, null]}, {"id": "new:merge_program_workouts", "area": "new", "areaPL": "Inne (spoza listy)", "label": "merge program workouts", "others": 1, "cells": [null, null, null, null, null, null, {"has": "yes", "how": "Rozpocznij następny trening jednego śledzonego programu, potem drugiego i zaimportuj go do aktywnego treningu (nazwa łączy oba).", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-merge-two-program-workouts/"]}, null, null, null, null]}, {"id": "new:minigames", "area": "new", "areaPL": "Inne (spoza listy)", "label": "minigames", "others": 1, "cells": [null, null, null, null, null, null, {"has": "yes", "how": "Name Game, Dice Game i Card Game generują ćwiczenia/powtórzenia na bieżąco i automatycznie dodają ukończone serie.", "fb": "", "src": ["https://help.strengthlog.com/help-article/minigames/"]}, null, null, null, null]}, {"id": "new:modules_toggle", "area": "new", "areaPL": "Inne (spoza listy)", "label": "modules toggle", "others": 0, "cells": [{"has": "partial", "how": "Ustawienia → Moduły wymienia Training (zawsze włączony) oraz Diet, Sleep, Cardio, Supplements i Recommendations. Pozostałe są pokazane jako „wkrótce”, są wyłączone i nie mają implementacji. Rejestr modułów jest przechowywany w settings.modules.", "fb": "", "src": ["lib/seed.ts:MODULES", "lib/seed.ts:MODULES_AVAILABLE", "lib/store.ts:setModule", "app/more/settings.tsx"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:morning_check_in", "area": "new", "areaPL": "Inne (spoza listy)", "label": "morning check in", "others": 0, "cells": [{"has": "yes", "how": "Dostęp przez Więcej → Poranne wpisy lub kartę na Home. Pola: Body Battery, wynik snu, godziny snu i masa ciała na dziś. Rekord powstaje dopiero przy pierwszej edycji (jeden na lokalną datę). Wyświetlane jest ostatnich 14 wpisów. Home pokazuje „Dziś rano” z dzisiejszymi wartościami.", "fb": "", "src": ["app/more/morning.tsx", "lib/store.ts:todayMorning", "lib/store.ts:peekTodayMorning"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:multiple_active_programs", "area": "new", "areaPL": "Inne (spoza listy)", "label": "multiple active programs", "others": 1, "cells": [null, null, null, null, null, null, null, null, {"has": "yes", "how": "Użytkownicy mogą dołączyć do wielu programów jednocześnie i pobrać dzień z innego programu.", "fb": "", "src": ["https://fortune.com/article/boostcamp-review/"]}, null, null]}, {"id": "new:multiple_local_accounts", "area": "new", "areaPL": "Inne (spoza listy)", "label": "multiple local accounts", "others": 1, "cells": [null, null, null, null, null, {"has": "yes", "how": "Kilka lokalnych kont na jednym telefonie, każde z własnymi programami/historią/ustawieniami; przełączanie bez utraty danych.", "fb": "", "src": ["https://www.liftosaur.com/features/account"]}, null, null, null, null, null]}, {"id": "new:muscle_volume_targets", "area": "new", "areaPL": "Inne (spoza listy)", "label": "muscle volume targets", "others": 1, "cells": [null, null, null, null, null, {"has": "paid", "how": "Tygodniowe zakresy serii i cele częstotliwości na grupę mięśniową z kodowaniem kolorami i strzałkami (dodaj/usuń serie), cele podziału siła/hipertrofia, edytowalne presety; wspólne dla Week Insights i statystyk tygodnia programu.", "fb": "", "src": ["https://www.liftosaur.com/features/week-insights"]}, null, null, null, null, null]}, {"id": "new:nspi_progress_score", "area": "new", "areaPL": "Inne (spoza listy)", "label": "nspi progress score", "others": 1, "cells": [null, null, null, null, null, null, null, {"has": "paid", "how": "North Star Progress Index: tygodniowy wynik (na 100) z Strength, Stimulus Volume (Hard-Set Equivalents, ważone EMG) i Movement Balance, każdy pokazany jako powyżej/w/poniżej adaptacyjnego zakresu docelowego.", "fb": "", "src": ["https://www.jefit.com/blog/the-north-star-progress-index-nspi", "https://www.jefit.com/blog/periodization-on-your-own-plan"]}, null, null, null]}, {"id": "new:nutrition_sync_targets", "area": "new", "areaPL": "Inne (spoza listy)", "label": "nutrition sync targets", "others": 1, "cells": [null, null, null, null, null, null, null, null, null, null, {"has": "paid", "how": "Żywienie z Cronometer (bezpośrednio), MyFitnessPal/FatSecret (przez Health/Google Fit); Nutrition Wizard ustawia cele kalorii/makroskładników pokazywane vs. wartości rzeczywiste (Plus).", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257617-connected-apps-and-data-syncing-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-400-workout-library-nutrition-targets-updated-plans-screen-uxui"]}]}, {"id": "new:nutrition_tracking", "area": "new", "areaPL": "Inne (spoza listy)", "label": "nutrition tracking", "others": 0.5, "cells": [null, {"has": "partial", "how": "Kalorie i makroskładniki (białko/tłuszcze/węglowodany) importowane z aplikacji żywieniowych Apple Health / Google Fit lub wpisywane ręcznie jako Caloric Intake; cele dla każdego makroskładnika na widżetach.", "fb": "", "src": ["https://help.strongapp.io/article/240-track-nutrition-with-strong", "https://help.strongapp.io/article/239-profile-widgets"]}, null, null, null, null, null, null, null, null, null]}, {"id": "new:open_source", "area": "new", "areaPL": "Inne (spoza listy)", "label": "open source", "others": 1, "cells": [null, null, null, null, null ", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "yes", "how": "Darmowy raport niedzielny: osiągnięte rekordy, tygodniowa objętość na mięsień, regularność, lista treningów; także raport życiowy.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://fortune.com/article/boostcamp-review/"]}, null, null]}, {"id": "new:pinned_sticky_notes", "area": "new", "areaPL": "Inne (spoza listy)", "label": "pinned sticky notes", "others": 1, "cells": [null, {"has": "yes", "how": "Notatki ćwiczeń można przypiąć, by pokazywały się (na żółto) za każdym razem, gdy ćwiczenie jest wykonywane, np. ustawienia maszyny.", "fb": "Użytkownicy lubią lepkie notatki do ustawień maszyn (recenzje w Google Play 2026).", "src": ["https://help.strongapp.io/article/134-about-notes"]}, null, null, null, null, null, null, null, null, null]}, {"id": "new:platforms", "area": "new", "areaPL": "Inne (spoza listy)", "label": "platforms", "others": 4, "cells": [null, null, null, {"has": "yes", "how": "iPhone (iOS 18+; bieżąca i poprzednia wersja główna), Apple Watch (watchOS 10+), Android (bieżąca i poprzednia wersja główna), Wear OS; Mac z Apple silicon przez App Store; iPad oficjalnie niewspierany; strona internetowa tylko do onboardingu/subskrypcji.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/38144798013719-System-Requirements", "https://apps.apple.com/us/app/fitbod-gym-fitness-planner/id1041517543", "https://help.fitbod.me/hc/en-us/articles/15932124434199-How-to-Sign-Up-Log-in"]}, {"has": "yes", "how": "iOS (iPhone, iOS 15.6+; wymieniony dla Vision), Android; brak aplikacji dedykowanej iPadowi, zegarka ani webowej.", "fb": "", "src": ["https://apps.apple.com/us/app/alpha-progression/id1462277793", "https://alphaprogression.com/en/blog/alpha-progression-guide"]}, null, null, {"has": "yes", "how": "Działa na iPhone, Apple Watch, Mac z Apple Silicon i Apple Vision (iOS 15+), Androidzie i Wear OS.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://play.google.com/store/apps/details?id=je.fit"]}, null, {"has": "yes", "how": "Natywna aplikacja na iPhone, iPad (elastyczne okna, Stage Manager), Mac, Apple Watch i visionOS; jedno zsynchronizowane konto.", "fb": "", "src": ["https://smartgymapp.com/", "https://smartgymapp.com/releases/smartgym-7-5", "https://smartgymapp.com/releases/smartgym-7-7"]}, null]}, {"id": "new:prefill_carry_over", "area": "new", "areaPL": "Inne (spoza listy)", "label": "prefill carry over", "others": 0, "cells": [{"has": "yes", "how": "Wartości wstępnie wypełnione na starcie treningu są zapamiętywane (set.pre). Jeśli zmienisz serię 1 względem jej wypełnienia (np. 24 → 25 kg) i odhaczysz ją, późniejsze nieodhaczone serie tej samej rodziny, których nie ruszano i które wciąż mają to samo wypełnienie, przyjmują nową wartość. Piramidy z różnymi wartościami pozostają nietknięte.", "fb": "", "src": ["lib/store.ts:carryPrefill", "lib/store.ts:markPre"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:profile_dashboard", "area": "new", "areaPL": "Inne (spoza listy)", "label": "profile dashboard", "others": 1, "cells": [null, {"has": "yes", "how": "Konfigurowalny dashboard Profile z widżetami (cel treningów/tydzień, kalorie w tym tygodniu, dzienne makroskładniki z celami, dowolny wykres ćwiczenia lub pomiaru), z możliwością zmiany kolejności przeciąganiem.", "fb": "", "src": ["https://help.strongapp.io/article/239-profile-widgets"]}, null, null, null, null, null, null, null, null, null]}, {"id": "new:program_builder_v9", "area": "new", "areaPL": "Inne (spoza listy)", "label": "program builder v9", "others": 1, "cells": [null, null, null, null, null, null, {"has": "yes", "how": "v9.0 (wrz 2026) przebudowała Program Builder z trybami Simple i Detailed oraz Smart Blocks; filtry ulubionych/Following; duże przetasowanie nawigacji (Profile, Statistics, Library).", "fb": "Ostatnie recenzje w App Store (wrz 2026) są podzielone: „9.0 jest REWELACYJNA” vs „Nowy układ aplikacji jest okropny”, „zmienianie rzeczy dla samego zmieniania”. https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json", "src": ["https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, null, null, null, null]}, {"id": "new:program_editor_modes_and_versions", "area": "new", "areaPL": "Inne (spoza listy)", "label": "program editor modes and versions", "others": 1, "cells": [null, null, null, null, null, {"has": "yes", "how": "Edytor w aplikacji ma 4 tryby (siatka kalendarza z przeciąganiem, UI per dzień, tekst per dzień, pełny tekst) z kontekstowymi „pigułkami” zapisującymi składnię; zalogowani użytkownicy mogą przywrócić dowolną z ostatnich 100 zapisanych wersji.", "fb": "", "src": ["https://www.liftosaur.com/features/program-editor", "https://www.liftosaur.com/features/web-editor"]}, null, null, null, null, null]}, {"id": "new:program_playground", "area": "new", "areaPL": "Inne (spoza listy)", "label": "program playground", "others": 1, "cells": [null, null, null, null, null, {"has": "yes", "how": "Symulacja treningów bez ruszania historii: kończ serie, dni i przechodź przez tygodnie, aby zobaczyć zmiany ciężarów, powtórzeń i zmiennych stanu; dostępne też w podglądach programów i edytorze webowym.", "fb": "", "src": ["https://www.liftosaur.com/features/playground"]}, null, null, null, null, null]}, {"id": "new:program_variations_reviews", "area": "new", "areaPL": "Inne (spoza listy)", "label": "program variations reviews", "others": 1, "cells": [null, null, null, null, null, null, null, null, {"has": "yes", "how": "Niektóre programy oferują warianty przy dołączaniu (np. Nuñez Upper Lower: ramiona/naramienne, klatka/plecy, dominacja czworogłowych lub dwugłowych/pośladków); strony programów zawierają recenzje/wyniki użytkowników; sugestie „similar programs”.", "fb": "", "src": ["https://www.garagegymreviews.com/boostcamp-review", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, null, null]}, {"id": "new:public_api", "area": "new", "areaPL": "Inne (spoza listy)", "label": "public api", "others": 2, "cells": [null, null, {"has": "paid", "how": "REST API dla użytkowników Pro (treningi, rutyny, foldery, szablony ćwiczeń, historia, pomiary; endpoint zdarzeń do synchronizacji).", "fb": "", "src": ["https://api.hevyapp.com/docs/"]}, null, null, {"has": "paid", "how": "Klucze API (lftsk_...) dają odczyt/zapis programów, historii, pomiarów, siłowni/sprzętu, danych ćwiczeń; /api/v1/workout/* uruchamia silnik programu po stronie serwera (start, logowanie serii, zakończenie z progresjami). Wymaga Premium + konta.", "fb": "", "src": ["https://www.liftosaur.com/features/api"]}, null, null, null, null, null]}, {"id": "new:public_profile_page", "area": "new", "areaPL": "Inne (spoza listy)", "label": "public profile page", "others": 1, "cells": [null, null, null, null, null, {"has": "yes", "how": "Opcjonalna publiczna strona liftosaur.com/profile/<id> z pseudonimem, bieżącym programem, maksimami głównych/pozostałych bojów i wykresami postępów.", "fb": "", "src": ["https://www.liftosaur.com/features/sharing-workouts"]}, null, null, null, null, null]}, {"id": "new:quick_stats_per_set", "area": "new", "areaPL": "Inne (spoza listy)", "label": "quick stats per set", "others": 1, "cells": [null, null, null, null, null, null, {"has": "paid", "how": "Przesuń serię, aby zobaczyć e1RM, % 1RM, rekord powtórzeń, średnią liczbę powtórzeń przy tym ciężarze, wielokrotność masy ciała.", "fb": "", "src": ["https://help.strengthlog.com/help-article/shortcuts-in-an-active-workout/", "https://help.strengthlog.com/help-article/how-to-record-a-workout/"]}, null, null, null, null]}, {"id": "new:rep_max_calculator", "area": "new", "areaPL": "Inne (spoza listy)", "label": "rep max calculator", "others": 1, "cells": [null, null, null, null, null, {"has": "yes", "how": "Kalkulator z pola 1RM lub klawiatury ciężaru: wpisz osiągnięte powtórzen ść wszystkie dane” (z potwierdzeniem) zastępuje wszystko świeżymi danymi startowymi w języku telefonu i zatrzymuje timery.", "fb": "", "src": ["lib/store.ts:resetAll", "app/more/settings.tsx"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:rest_badge_on_tab", "area": "new", "areaPL": "Inne (spoza listy)", "label": "rest badge on tab", "others": 0, "cells": [{"has": "yes", "how": "Pozostały czas przerwy pojawia się jako plakietka na karcie Trening („2m”/„45s”, „+1m” po zakończeniu), gdy jesteś na innych kartach. VoiceOver odczytuje pełny czas.", "fb": "", "src": ["app/(tabs)/_layout.tsx"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:routine_segments_stretch", "area": "new", "areaPL": "Inne (spoza listy)", "label": "routine segments stretch", "others": 1, "cells": [null, null, null, null, null, null, null, null, null, {"has": "yes", "how": "Rutyny mogą mieć sekcje Main/Warm-Up/Cool-Down; Smart Trainer proponuje rozciąganie dla trenowanych mięśni z czasem segmentu ustawianym przez użytkownika (7.9).", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-9"]}, null]}, {"id": "new:same_exercise_multiple_blocks", "area": "new", "areaPL": "Inne (spoza listy)", "label": "same exercise multiple blocks", "others": 0, "cells": [{"has": "yes", "how": "To samo ćwiczenie może występować kilka razy w treningu lub szablonie, np. bloki ciężkie plus lekkie. Bloki są numerowane „(1)”, „(2)” dla VoiceOver. „Previously” jest dopasowywane do tego samego elementu szablonu lub do tego samego indeksu bloku ostatniej sesji.", "fb": "", "src": ["lib/store.ts:previousBlockFor", "lib/store.ts:occurrence"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:schema_versioning_and_migration", "area": "new", "areaPL": "Inne (spoza listy)", "label": "schema versioning and migration", "others": 0, "cells": [{"has": "yes", "how": "Stan ma schemaVersion (13). migrate() jest idempotentne i tolerancyjne: naprawia typy, przycina zakresy, zaokrągla kg do 0,01, odrzuca uszkodzone wpisy, w historii zachowuje tylko odhaczone serie, normalizuje superserie i uzupełnia wartości domyślne. Przyjmuje dane z weba 0.3 i natywne 0.1.0.", "fb": "", "src": ["lib/store.ts:migrate", "lib/seed.ts:SCHEMA_VERSION"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:session_progress_bar", "area": "new", "areaPL": "Inne (spoza listy)", "label": "session progress bar", "others": 0, "cells": [{"has": "yes", "how": "Cienki pasek pod zegarem treningu pokazuje odhaczone/wszystkie serie (łącznie z rozgrzewkami) jako „done/all”.", "fb": "", "src": ["components/ActiveWorkout.tsx:SessionProgress"]}, null, null, null, null, null, null, null, null, null, null]}, {"id": "new:set_cap_150", "area": "new", "areaPL": "Inne (spoza listy)", "label": "set cap 150", "others": 1, "cells": [null, null, {"has": "yes", "how": "Sztywny limit 150 serii na trening/rutynę nawet w Pro.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34896183826455-Hevy-Set-Limit-Explained-Why-Workouts-and-Routines-Have-a-150-Set-Cap"]}, null, null, null, null, null, null, null, null]}, {"id": "new:set_video_library", "area": "new", "areaPL": "Inne (spoza listy)", "label": "set video library", "others": 1, "cells": [null, null, null, null, null, null, {"has": "yes", "how": "Wgrywanie filmu do serii (bieżącej lub minionej) albo do rekordu; filmy zbierane w przeszukiwalnej bibliotece, z możliwością pobrania.", "fb": "", "src": ["https://help.strengthlog.com/help-article/using-the-video-library/"]}, null, null, null, null]}, {"id": "new:shareplay", "area": "new", "areaPL": "Inne (spoza listy)", "label": "shareplay", "others": 1, "cells": [null, null, null, null, null, null, null, null, null, {"has": "yes", "how": "SharePlay: wspólny trening przez FaceTime.", "fb": "", "src": ["https://apps.apple.com/us/app/smartgym-gym-home-workouts/id922744883"]}, null]}, {"id": "new:signing_expiry_reminder", "area": "n const SYM = {yes:'✓', paid:'$', partial:'◐', no:'✗', unknown:'?'};
const HAS = {yes:'jest', paid:'płatne', partial:'częściowo', no:'brak', unknown:'nie ustalono'};
const short = a => a.replace(' (nasza)','').replace('Alpha Progression','Alpha');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
let sel = null;

$('lede').textContent = `${KB.rows.length} funkcji × ${KB.apps.length} aplikacji (nasza + ${KB.apps.length - 1} innych). Stan na 02.10.2026; nasza kolumna z kodu, pozostałe z help center, stron producentów, App Store i recenzji — każda komórka ma źródła. Kliknij wiersz, żeby zobaczyć, jak to działa w każdej aplikacji.`;

const areas = [...new Map(KB.rows.map(r => [r.area, r.areaPL])).entries()];
$('area').innerHTML = '<option value="">Wszystkie obszary</option>' + areas.map(([a, p]) => `<option value="${a}">${esc(p)}</option>`).join('');
try { const s = JSON.parse(localStorage.getItem('kb-f') || '{}'); if (s.area) $('area').value = s.area; $('gaps').checked = !!s.gaps; $('schema').checked = !!s.schema; } catch (e) {}

$('t').tHead.innerHTML = '<tr><th class="f">Funkcja</th><th title="Ile z 10 innych aplikacji ma (◐ = 0,5)">Inni</th>' + KB.apps.map((a, i) => `<th class="app${i ? '' : ' us'}">${esc(short(a))}</th>`).join('') + '</tr>';

function rows() {
  const q = $('q').value.trim().toLowerCase(), area = $('area').value, gaps = $('gaps').checked, schema = $('schema').checked;
  return KB.rows.filter(r => {
    if (area && r.area !== area) return false;
    if (schema && r.id.startsWith('new:')) return false;
    if (gaps) { const us = r.cells[0]?.has; if (!(us == null || us === 'no' || us === 'partial') || r.others < 4) return false; }
    if (q) { const hay = (r.label + ' ' + r.areaPL + ' ' + r.cells.map(c => c ? c.how : '').join(' ')).toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
}
function render() {
  try { localStorage.setItem('kb-f', JSON.stringify({area: $('area').value, gaps: $('gaps').checked, schema: $('schema').checked})); } catch (e) {}
  const list = rows();
  $('count').textContent = `${list.length} / ${KB.rows.length}`;
  $('t').tBodies[0].innerHTML = list.map(r => `<tr tabindex="0" data-id="${esc(r.id)}"${r.id === sel ? ' class="sel"' : ''}><td class="f"><span class="area">${esc(r.areaPL)}</span>${esc(r.label)}</td><td class="n">${r.others.toLocaleString('pl-PL')}</td>` +
    r.cells.map((c, i) => `<td${i ? '' : ' class="us"'}>${c ? `<b class="s s-${c.has}" title="${esc(HAS[c.has] || c.has)}">${SYM[c.has] || '·'}</b>` : '<b class="s s-none">·</b>'}</td>`).join('') + '</tr>').join('');
  if (!sel && list.length) show(list[0].id);
}
function show(id) {
  sel = id; const r = KB.rows.find(x => x.id === id); if (!r) return;
  document.querySelectorAll('#t tbody tr').forEach(tr => tr.classList.toggle('sel', tr.dataset.id === id));
  $('detail').innerHTML = `<div><span class="muted" style="font-size:12px;letter-spacing:.06em;text-transform:uppercase">${esc(r.areaPL)} · ${esc(r.id)}</span><h2>${esc(r.label)}</h2><p class="muted" style="margin:4px 0 0">Ma ${r.others.toLocaleString('pl-PL')} z ${KB.apps.length - 1} innych aplikacji.</p></div>` +
    r.cells.map((c, i) => !c ? '' : `<div class="item"><b class="s s-${c.has}">${SYM[c.has] || '·'}</b><span class="app">${esc(KB.apps[i])} <span class="muted" style="font-weight:400">· ${esc(HAS[c.has] || c.has)}</span></span><p>${esc(c.how)}</p>${c.fb ? `<p class="fb">Opinie: ${esc(c.fb)}</p>` : ''}${c.src && c.src.length ? `<div class="src">${c.src.map(s => /^https?:/.test(s) ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60))}</a>` : `<span class="muted">${esc(s)}</span>`).join('')}</div>` : ''}</div>`).join('');
}
$('t').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) show(tr.dataset.id); });
$('t').addEventListener('keydown', e => { const tr = e.target.closest('tr[data-id]'); if (!tr) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(tr.dataset.id); } if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling; if (n) { n.focus(); show(n.dataset.id); } } });
['q', 'area', 'gaps', 'schema'].forEach(id => $(id).addEventListener(id === 'q' ? 'input' : 'change', () => { sel = null; render(); }));

$('apps').innerHTML = KB.meta.map(m => `<article class="card"><h3>${esc(m.app)}</h3><p class="muted" style="margin:0">${esc(m.positioning)}</p><dl><dt>Cena</dt><dd>${esc(m.pricing)}</dd><dt>Platformy</dt><dd>${esc(m.platforms)}</dd><dt>Sprawdzono</dt><dd>${esc(m.checked)}</dd></dl></article>`).join('');
function tab(m) { $('tab-m').setAttribute('aria-selected', m); $('tab-a').setAttribute('aria-selected', !m); $('view-m').hidden = !m; $('view-a').hidden = m; }
$('tab-m').onclick = () => tab(true); $('tab-a').onclick = () => tab(false);
if (location.hash === '#aplikacje') tab(false);
render();
</script>
