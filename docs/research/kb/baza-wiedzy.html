<style>

:root{

}

:root[data-theme="dark"]{

  --yes:#7fd19b; --yes-bg:#1d3326; --paid:#b9a6f2; --paid-bg:#2a2540; --part:#f2c25a; --part-bg:#3a3017; --no:#f0928a; --no-bg:#3d2220; --unk:#a3a9b2; --unk-bg:#272b31; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 2.1rem/1.05 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}

tbody tr.sel td{background:var(--accent-soft)}

.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;align-self:start}

.item .src a{color:var(--accent);word-break:break-all}
.muted{color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{font:700 1.2rem var(--f-display);margin:0}
.card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:14px}
.card dt{color:var(--muted)} .card dd{margin:0}
.note{font-size:13px;color:var(--muted);max-width:90ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

ujesz w serii”). Ćwiczenia ze sprzętem „masa ciała” pokazują pole ±kg zamiast ciężaru. Opcjonalne kolumny RPE i gumy pojawiają się po włączeniu.", "fb": "", "src": ["lib/seed.ts:METRICS", "components/ActiveWorkout.tsx:ExerciseBlock", "app/exercise/[id].tsx"]}, {"has": "yes", "how": "Dla ćwiczeń z obciążeniem logowany jest ciężar + powtórzenia w każdej serii; osobne typy ćwiczeń obejmują ćwiczenia z odciążeniem (assisted bodyweight), na czas (duration) i cardio (dystans/czas). Eksport CSV (6.2.x) ma kolumny: Weight (kg), Reps, RPE, Distance (meters), Seconds, Notes — czyli ciężar, powtórzenia, dystans i czas w serii. Typ ćwiczenia jest stały dla danego ćwiczenia (kategoria).", "fb": "Recenzja w App Store (2023): niektóre pary pól są niedozwolone, np. ciężar + czas (deska z obciążeniem) — obejściem jest wpisanie sekund w pole powtórzeń; typu ćwiczenia nie da się później zmienić.", "src": ["https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577", "https://play.google.com/store/apps/details?id=io.strongapp.strong", "https://github.com/DuarteSantos8/openGym/issues/302", "https://help.strongapp.io/article/226-focus-metric"]}, {"has": "yes", "how": "Typ ćwiczenia jest stały dla danego ćwiczenia: ciężar i powtórzenia, same powtórzenia, powtórzenia z masą ciała, powtórzenia z odciążeniem (assisted bodyweight), czas, ciężar i czas, dystans i czas, krótki dystans i ciężar; plus własna metryka używana do kroków/pięter. Seria = weight_kg / reps / distance / duration (+ opcjonalne RPE). Typu własnego ćwiczenia nie można edytować po zapisaniu (aby zmienić, trzeba zduplikować). Ćwiczenia HYROX/funkcjonalne dodano w maju 2026.", "fb": "Użytkownicy prosili o logowanie ciężaru pojedynczego vs podwójnego hantla — Hevy mówi, że to bada (lipiec 2026).", "src": ["https://api.hevyapp.com/docs/", "https://help.hevyapp.com/hc/en-us/articles/35688251991575-Hevy-Exercise-Library-400-Exercises-and-Custom-Exercises", "https://help.hevyapp.com/hc/en-us/articles/34264544382615-How-to-Create-Edit-and-Duplicate-Custom-Exercises-in-Hevy", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350"]}, {"has": "yes", "how": "Ciężar + powtórzenia w każdej serii dla ćwiczeń na powtórzenia; ćwiczenia na czas (czas, powtórzenia AMRAP w interwałach czasowych); ćwiczenia cardio/dystansowe śledzą dystans, czas i tempo („Split”); Watch może edytować w serii powtórzenia, ciężar, dystans, czas, opór, nachylenie lub gumę. Ciężar sztangi można pokazywać jako „Bar + Plates” lub „Plates Only”; ciężar hantli jest podawany na jeden hantel (objętość podwajana). Własne ćwiczenia obsługują tylko powtórzenia lub czas (bez dystansu).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/29486697282711-Exercise-Details-Screen-Sets-Reps-and-Weight-Fields-Explained", "https://help.fitbod.me/hc/en-us/articles/12732749777047-Fitbod-Metrics-Records", "https://help.fitbod.me/hc/en-us/articles/360006499194-Apple-Watch", "https://help.fitbod.me/hc/en-us/articles/28062570249623-Custom-Exercises", "https://help.fitbod.me/hc/en-us/articles/360041831493-Timed-Intervals"]}, {"has": "yes", "how": "8 typów metryk na ćwiczenie: ciężar+powtórzenia, przeciwwaga (odciążenie)+powtórzenia, same powtórzenia, powtórzenia+czas, sam czas, dystans+czas, ciężar+dystans, ciężar+czas. Każda seria pokazuje też wyliczoną metrykę wydajności (e1RM, e10RM lub objętość, zależnie od ustawienia).", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Każda seria ma Reps i Weight (lb/kg lub % 1RM); opcjonalnie zapisywane RPE; serie na czas zapisują czas serii (kolumna Time, L/R dla ćwiczeń jednostronnych). W dokumentacji nie znaleziono pól dystansu/cardio; ciężar można zostawić pusty i wpisać przy zakończeniu serii.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/timed-sets", "https://www.liftosaur.com/features/liftoscript"]}, {"has": "yes", "how": "Każde ćwiczenie definiuje swoje zmienne przy tworzeniu (ćwiczenia siłowe muszą zawierać ciężar; istnieją warianty z powtórzeniami, czasem i dystansem; cardio śledzi dystans/tempo). Dane można przenosić tylko między ćwiczeniami z tymi samymi zmiennymi.", "fb": "", "src": ["https://help.strengthlog.com/help-article/adding-a-new-exercise/", "https://help.strengthlog.com/help-article/how-do-i-change-delete-an-exercise/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "yes", "how": "Serie siłowe logują ciężar x powtórzenia; ćwiczenia cardio obsługują czas trwania na serię, a od v17.0.8 (maj 2026) timery interwałowe pozwalają ustawić docelowy czas serii i widzieć zalogowane czasy obok ciężaru i powtórzeń. Metryki dystansu są domniemane (poprawka konwersji stopy/metry w v17.0.15), ale nieudokumentowane.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/meet-jefits-all-new-unified-workout-editing-screen", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "yes", "how": "Serie logują ciężar x powtórzenia (+ opcjonalnie RPE/RIR); ćwiczenia na czas można programować w minutach/sekundach; serie AMRAP są obsługiwane w programach. Metryki dystansu nie są udokumentowane (aplikacja skupia się na sile, mało cardio).", "fb": "Recenzja z App Store: kreator desktopowy nie pozwala zmienić czasu trwania ćwiczenia z minut na sekundy (tylko mobilnie).", "src": ["https://www.boostcamp.app/workout-tracker", "https://www.boostcamp.app/custom-program", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455", "https://www.garagegymreviews.com/boostcamp-review"]}, {"has": "yes", "how": "Każde ćwiczenie w rutynie ma serie, powtórzenia, ciężar i przerwę; dowolne ćwiczenie można przełączyć na czasowe przełącznikiem „HIIT (Duration Based Exercise)”. Różne powtórzenia/ciężar w poszczególnych seriach dodaje się przez Edit > „Add New Set”. Tętno, kalorie i dystans pochodzą z sesji treningowej HealthKit, a nie z pól w serii.", "fb": "", "src": ["https://help.smartgymapp.com/article/75-exercise-time-based", "https://help.smartgymapp.com/article/112-add-multiple-sets-with-different-reps-and-weight", "https://smartgymapp.com/features.html"]}, {"has": "yes", "how": "Karta Track: na serię powtórzenia ALBO czas plus ciężar (typ ćwiczenia oparty na powtórzeniach lub na czasie). Hantla = ciężar jednej hantli, sztanga = ciężar łączny z gryfem. Kolejność pól Ciężar przed Powtórzeniami jest konfigurowalna (domyślna dla nowych użytkowników od 5.4). Cardio to osobny typ aktywności (czas, dystans, kalorie, tempo).", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001220076-how-do-i-log-dumbbell-weights-", "https://feedback.caliberstrong.com/announcements/caliber-540-custom-keyboard-automatic-rest-timer-default-exercise-settings-sundaymonday-start-date-g", "https://feedback.caliberstrong.com/announcements/caliber-330-new-cardio-activities-cardio-notes-activity-ui-enhancements"]}]}, {"id": "log_set_types", "area": "log", "areaPL": "Logowanie treningu", "label": "Typy serii (rozgrzewka, drop, do upadku)", "others": 8.0, "cells": [{"has": "yes", "how": "Stuknięcie numeru serii otwiera ActionSheet z opcjami Normal / Warm-up (W) / Drop set (D) / To failure (F) oraz notatką do serii. Serie rozgrzewkowe są wyłączone z objętości, rekordów i numeracji „Previously” i mogą mieć własną przerwę. Drop set nie ma przerwy przed sobą i jest wyłączony z e1RM i maksymalnych powtórzeń. „Failure” nie jest kopiowane do następnej serii ani do „Repeat last”.", "fb": "", "src": ["lib/seed.ts:SET_KINDS", "components/ActiveWorkout.tsx:setMenu", "lib/store.ts:addSet", "lib/store.ts:restAfter", "lib/stats.ts:e1rmR"]}, {"has": "yes", "how": "Stuknięcie numeru serii otwiera menu Set Tag: Warm-up, Drop Set, Failure (ponowne stuknięcie zdejmuje oznaczenie). Serie rozgrzewkowe są wyłączone z wykresów/metryk. „Failure” oznacza, że podjęto jedno dodatkowe powtórzenie i się nie udało (5 powtórzeń + Failure = nieudane 6. powtórzenie; 0 powtórzeń + Failure = nieudana próba 1RM).", "fb": "", "src": ["https://help.strongapp.io/article/166-set-tags"]}, {"has": "yes", "how": "Stuknij numer serii: W-Warm-up, Normal, F-Failure, D-Dropset. Timer przerwy nie startuje, jeśli następna seria to drop set. Failure = zapisz ostatnie ukończone powtórzenie (0 powtórzeń niedozwolone). Ustawienie „Warm-up Sets” określa, czy rozgrzewki liczą się do statystyk (łączne serie, objętość, PR) i przelicza historię.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34896293707927-Set-Types-in-Hevy-Explained-Drop-Sets-Warm-Up-Sets-and-More", "https://help.hevyapp.com/hc/en-us/articles/34953606698903-Build-a-Workout-Program-Create-Organize-Routines", "https://www.hevyapp.com/features/workout-settings/", "https://api.hevyapp.com/docs/"]}, {"has": "partial", "how": "Jawne typy serii są ograniczone: opcjonalne automatycznie generowane serie rozgrzewkowe (przełącznik w My Plan; „Add Warm-Up Set” z menu More), serie AMRAP oznaczone „+ reps” w Max Effort Days oraz serie w interwałach czasowych. Brak udokumentowanego w centrum pomocy typu drop set ani serii do upadku.", "fb": "Zewnętrzna recenzja z 2026 twierdzi o „frictionless logging for supersets, drop sets, AMRAP”, ale brak oficjalnej dokumentacji drop setów (sensai.fit).", "src": ["https://help.fitbod.me/hc/en-us/articles/360006337634-Warm-Up-Sets", "https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/360033675553-Max-Effort-Day", "https://help.fitbod.me/hc/en-us/articles/360041831493-Timed-Intervals"]}, {"has": "partial", "how": "Serie robocze, dropsety (aplikacja wylicza ciężar dropu z ostatniej serii roboczej; generator może je dodawać), superserie i serie rozgrzewkowe z kalkulatora rozgrzewki Pro — rozgrzewki nie są logowane jako serie, ale można je skopiować do notatek jednym stuknięciem. Brak udokumentowanego typu serii do upadku/AMRAP.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator"]}, {"has": "partial", "how": "Serie rozgrzewkowe (generowane automatycznie lub sekcja „warmup:”), serie robocze, AMRAP („5+”), ask-RPE („@8+”), ask-weight („100lb+” / „?+”), etykiety serii typu „(Main)”, serie na czas/zliczające w górę oraz EMOM/Tabata przez „auto”. Brak dedykowanego tagu drop setu ani upadku mięśniowego; drop sety trzeba zapisywać jako dodatkowe grupy serii.", "fb": "", "src": ["https://www.liftosaur.com/features/set-types", "https://www.liftosaur.com/features/timed-sets", "https://www.liftosaur.com/features/liftoscript"]}, {"has": "yes", "how": "Seria rozgrzewkowa vs robocza (przełączana długim przytrzymaniem numeru serii), drop sety przez „+ New drop”, flagi „Max reps” i „Fail” (upadek liczy się do objętości, ale nie do rekordów); serie specjalne: superset, circuit, complex, EMOM, Tabata, AMRAP.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/", "https://help.strengthlog.com/help-article/drop-sets/", "https://help.strengthlog.com/help-article/mark-sets-as-fails-or-max-reps/", "https://help.strengthlog.com/help-article/special-sets/"]}, {"has": "yes", "how": "Od kwi 2025 każda seria może być oznaczona jako Warm-up, Working, Drop lub Failure, zarówno w edytorze rutyny, jak i podczas logowania (dotknij serię, wybierz typ, Log); typy serii widać też na Apple Watch od paź 2025. Progresja obciążenia odfiltrowuje rozgrzewki z szacunków siły.", "fb": "", "src": ["https://www.jefit.com/blog/set-types-new-in-jefit-customize-your-workouts-with-set-types", "https://www.jefit.com/blog/newtrack-heart-rate-calories-in-real-time-with-jefit-apple-watch", "https://www.jefit.com/blog/the-science-behind-jefits-load-progression-engine", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "yes", "how": "Dotknij numeru serii, aby oznaczyć ją jako serię Work, Warm-up, Drop lub Failure; drop sety można dodać do dowolnej serii roboczej.", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.boostcamp.app/workout-tracker"]}, {"has": "yes", "how": "Serie mogą mieć typ: zwykła, rozgrzewkowa lub drop set (typy serii dodano w SmartGym 6, edycję typu na zegarku w v7). Od 7.11 (lip 2026) typ serii można zmienić bezpośrednio z własnej klawiatury w aplikacji. Brak dowodów na osobny typ serii „do upadku”.", "fb": "Starsze zbiorcze recenzje z App Store wymieniały brak drop setów (sprzed wprowadzenia typów serii) - https://justuseapp.com/en/app/922744883/smartgym-gym-home-workouts/reviews", "src": ["https://9to5mac.com/2022/05/05/smartgym-for-ios-watchos-mac-major-update/", "https://alternativeto.net/news/2023/6/smartgym-7-has-been-released-with-new-exercises-progress-tracking-and-enhanced-apple-watch-app", "https://9to5mac.com/2026/07/23/smartgym-update-makes-it-easier-to-manually-adjust-and-log-exercises-on-the-go/", "https://smartgymapp.com/releases/smartgym-7-11"]}, {"has": "partial", "how": "Tylko serie „smart warm-up”, generowane dla każdego ćwiczenia na podstawie docelowego ciężaru (dodawane/usuwane w edycji ćwiczenia). Logowanie drop setów i oznaczanie własnych serii jako rozgrzewkowych to otwarte prośby („Under Consideration”, 248 i 161 głosów). Brak oznaczenia serii do upadku.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-3119-adjustable-warm-up-targets-expanded-emoji-reactions-exercise-videos-while-offline", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/logging-dropsets", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/mark-sets-as-warmups"]}]}, {"id": "log_rpe_rir", "area": "log", "areaPL": "Logowanie treningu", "label": "RPE/RIR", "others": 7.5, "cells": [{"has": "yes", "how": "Opcjonalna kolumna RPE, domyślnie wyłączona, włącza się w Ustawieniach („RPE / RIR przy serii”). To jedno pole numeryczne na serię, 0–10 z krokiem 0,1. Nie wpływa na objętość ani rekordy. Jest pokazywane w historii i eksportowane do kolumny RPE w CSV. Nie ma osobnego pola RIR; to samo pole jest opisane jako RPE/RIR.", "fb": "", "src": ["lib/seed.ts:Settings.showRpe", "components/ActiveWorkout.tsx:ExerciseBlock", "app/more/settings.tsx", "lib/backup.ts:buildCsv"]}, {"has": "yes", "how": "RPE jest logowane dla każdej serii w skali 6–10 z krokiem co 0,5; wybierasz komórkę Reps i stukasz przycisk RPE na własnej klawiaturze (ponowne stuknięcie czyści wartość). Brak osobnego pola RIR — centrum pomocy podaje tabelę przeliczania RPE na RIR (np. RPE 8 = 2 RIR, 9,5 = 0–1). RPE można też edytować na ekranie serii na Apple Watch.", "fb": "Użytkownik wersji Premium na Androidzie (maj 2026) poprosił o wbudowane pola RIR, docelowych serii/powtórzeń, przerwy, tempa, strony ciała i sprzętu dla każdego ćwiczenia (recenzja w Google Play).", "src": ["https://help.strongapp.io/article/230-about-rpe", "https://help.strongapp.io/article/224-workout-on-apple-watch"]}, {"has": "yes", "how": "Włącz Settings > Workouts > RPE Tracking → dodatkowa kolumna RPE przy ćwiczeniach opartych na powtórzeniach; do wyboru 6, 7, 7.5, 8, 8.5, 9, 9.5, 10 z opisami RIR; można zostawić puste. Brak osobnego trybu RIR. Kolumna Previous pokazuje wtedy np. „50lbs x 10 @ 8.5”. Przeprojektowanie wiersza serii w sierpniu 2026 dodało kolorową skalę RPE. Niedostępne podczas budowania rutyn.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35687721776663-How-to-Use-RPE-Rate-of-Perceived-Exertion", "https://help.hevyapp.com/hc/en-us/articles/34490600233111-RPE-vs-RIR-What-They-Mean-and-How-to-Use-Them-in-Hevy", "https://api.hevyapp.com/docs/", "https://apps.apple.com/us/app/hevy-workout-tracker-gym-log/id1458862350", "https://www.hevyapp.com/features/exercise-programming-options/"]}, {"has": "yes", "how": "Po ćwiczeniu pojawia się pytanie o Reps in Reserve (dawniej Exertion Rating/RPE): 0, 1, 2, 3, 4+ RiR. Dla superserii/obwodów pytanie pojawia się po wszystkich seriach; można zalogować ręcznie z menu More i później edytować w logu. Nie dotyczy ćwiczeń na czas/dystans. Zasila algorytm rekomendacji (stale wysokie RiR → cięższy ciężar).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360033133174-Reps-in-Reserve-RiR-Formerly-Exertion-Rating-RPE", "https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight", "https://help.fitbod.me/hc/en-us/articles/30721437384215-How-to-Navigate-the-Exercise-Details-Screen"]}, {"has": "paid", "how": "RIR (nie RPE) to funkcja Pro, włączana per plan lub trening; dozwolone wartości połówkowe (np. 1,5). Po włączeniu RIR trzeba wpisać dla każdej serii. Plany mogą zawierać cele RIR, do których dążą rekomendacje; bez śledzenia algorytm wnioskuje RIR.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations"]}, {"has": "yes", "how": "RPE jest natywne: „@8” ustawia docelowe RPE, „@8+” prosi o podanie wykonanego RPE (0-10, krok 0,5) po serii; RPE bez ciężaru automatycznie wylicza ciężar z 1RM + powtórzeń + RPE. RIR nie jest natywnym polem (można go emulować zmienną stanu, o którą aplikacja pyta użytkownika).", "fb": "", "src": ["https://www.liftosaur.com/features/set-types", "https://www.liftosaur.com/features/liftoscript"]}, {"has": "paid", "how": "Premium: przełączanie RPE lub RiR dla serii albo na stałe dla ćwiczenia; kalkulator RPE (premium) sugeruje ciężary dla docelowych powtórzeń/RPE na podstawie ostatniej serii; RPE/RIR można też użyć przy budowaniu programów.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-activate-rpe-rir-in-your-workouts/", "https://help.strengthlog.com/help-article/rpe-calculator/", "https://help.strengthlog.com/help-article/strengthlog-premium/"]}, {"has": "no", "how": "Własna tabela porównawcza JEFIT z lipca 2026 podaje dla Jefit „RPE/RIR capture: No” („The gap: no RPE/RIR field”); wysiłek jest zamiast tego wnioskowany przez silnik ze wzorców powtórzeń/spadku.", "fb": "Recenzja z App Store „Minimal planning features”: użytkownik skarży się, że nie może wpisać RPE ani %1RM w planach (App Store).", "src": ["https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared", "https://www.jefit.com/blog/the-science-behind-jefits-load-progression-engine"]}, {"has": "yes", "how": "Każda seria ma opcjonalne pola RPE (5-10) i RIR, za darmo; zapisywane na potrzeby trendów zmęczenia w bloku i programów opartych na RPE.", "fb": "", "src": ["https://www.boostcamp.app/features", "https://www.boostcamp.app/workout-tracker", "https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared"]}, {"has": "partial", "how": "Nie znaleziono pola RPE/RIR dla pojedynczej serii. Od 7.9 (mar 2026) użytkownik po każdej sesji ocenia cały trening w „Workout Effort” (animacja zsynchronizowana z oddechem), co zasila obraz obciążenia treningowego.", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-9", "https://smartgymapp.com/features.html"]}, {"has": "no", "how": "Brak RPE dla serii: „RPE for sets” jest na tablicy jako Planned (182 głosy). Tylko suwak oceny po treningu + notatka do treningu.", "fb": "", "src": ["https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/rpe-for-sets", "https://feedback.caliberstrong.com/announcements/caliber-420-workout-overview-screen-updates", "https://feedback.caliberstrong.com/announcements/caliber-5120-realtime-prs-new-workout-summary-screen-various-bug-fixes"]}]}, {"id": "log_previous_values", "area": "log", "areaPL": "Logowanie treningu", "label": "Wartości z poprzedniego razu", "others": 9.5, "cells": [{"has": "yes", "how": "Kolumna „Previously” pokazuje odpowiadającą serię roboczą z ostatniego zakończonego treningu zawierającego to ćwiczenie. Dopasowanie następuje w obrębie rodziny serii (normal/failure ↔ normal, drop ↔ drop); serie rozgrzewkowe nie mają wartości i nie przesuwają numeracji. Sesje zawierające tylko drop sety są pomijane. Gdy ćwiczenie występuje w szablonie kilka razy, dopasowanie następuje po id elementu szablonu lub indeksie bloku. Na wąskich ekranach kolumna przenosi się pod wiersz.", "fb": "", "src": ["lib/store.ts:previousBlockFor", "lib/store.ts:hintFor", "lib/store.ts:prevCache", "components/ActiveWorkout.tsx:rowLayout"]}, {"has": "yes", "how": "Podczas treningu każda seria pokazuje poprzedni wynik w tym ćwiczeniu (z ostatniego razu, gdy było wykonywane); aplikacja na Apple Watch również pokazuje poprzedni wynik dla bieżącej serii. Focus Metric porównuje dzisiejszą metrykę z ostatnim razem, gdy ćwiczenie było wykonywane. Brak udokumentowanej opcji ograniczenia „poprzednich” wartości do tego samego szablonu.", "fb": "", "src": ["https://www.thenerdystudent.com/2021/08/strong-review/", "https://help.strongapp.io/article/226-focus-metric"]}, {"has": "yes", "how": "Kolumna PREVIOUS po lewej stronie każdej serii. Ustawienie „Previous Workout Values”: „Any workout” (ostatni raz, gdy ćwiczenie było wykonywane gdziekolwiek) lub „Same routine” (ostatni raz w tej rutynie).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/36011896355479-How-to-Use-Previous-Workout-Values-to-Improve-Performance-in-Hevy", "https://help.hevyapp.com/hc/en-us/articles/34105442929943-Previous-Workout-Values-Vs-Routine-Values-How-to-Adjust-in-Settings"]}, {"has": "partial", "how": "Ekran Exercise Details daje „quick access to your past workout data” (zakładka History z Results/Trends; notatki do przeszłych sesji). Zalecane serie są generowane przez AI, a nie dosłowną kopią ostatniej sesji; brak udokumentowanej wbudowanej kolumny „previous” jak w Strong.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/30721437384215-How-to-Navigate-the-Exercise-Details-Screen", "https://help.fitbod.me/hc/en-us/articles/21486783720087-Exercise-Notes", "https://help.fitbod.me/hc/en-us/articles/12732749777047-Fitbod-Metrics-Records"]}, {"has": "yes", "how": "Poprzednie serie i notatki pozostają widoczne w loggerze. Ustawienie „Reference workout” (Settings > Training): „Same plan day” (domyślnie; poprzedni wynik tego ćwiczenia w tym samym dniu planu, z fallbackiem do najnowszego) lub „Last workout” (najnowszy niezależnie od planu).", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations"]}, {"has": "yes", "how": "Rozwinięta seria pokazuje wyniki „Last”, „Best” i (w programach wielotygodniowych) „Same day” z datami; serie AMRAP pokazują „Best AMRAP”. „Add Set” kopiuje ostatnią serię lub ostatnią serię z poprzedniego treningu; kolumnę celu można przełączyć na „Previous Set”.", "fb": "App Store 2024-04 (3*): „pobiera moje powtórzenia i ciężar z innego dnia”, gdy to samo ćwiczenie ma różne cele w różnych dniach. https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/features/workout-screen"]}, {"has": "yes", "how": "Aplikacja pokazuje poprzedni wynik dla każdego ćwiczenia; przesuń ćwiczenie > History wylistuje wszystkie minione sesje (z komentarzami do serii) i pozwala skopiować blok (zastąp lub dodaj). Premiumowe „quick stats” dla serii pokazują rekord powtórzeń przy danym ciężarze i średnią liczbę powtórzeń.", "fb": "", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/", "https://help.strengthlog.com/help-article/retrieve-from-training-log/", "https://www.strengthlog.com/strengthlog-bodybuilding-app/"]}, {"has": "yes", "how": "Ekran logowania wstępnie wypełnia ostatnio zalogowany ciężar/powtórzenia dla ćwiczenia („remember weights you lifted last time”); historia ćwiczenia i wykresy zostały w 2026 połączone w jedną stronę (dotknij punkt na wykresie, aby zobaczyć logi z tego dnia).", "fb": "", "src": ["https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://play.google.com/store/apps/details?id=je.fit"]}, {"has": "yes", "how": "Ekran logowania pokazuje kolumnę „previous” z seriami, powtórzeniami i ciężarem z ostatniej sesji (w programach z poprzedniego tygodnia); szczegóły ćwiczenia pokazują miniony wynik i rekordy.", "fb": "Recenzje z App Store: poprzednie ciężary czasem brakują (np. OHP w programie Candito); użytkownik chciałby, aby zapisywała też liczbę powtórzeń.", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.garagegymreviews.com/boostcamp-review", "https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared"]}, {"has": "yes", "how": "Podczas treningu przycisk „Vs Previous” pozwala wybrać metrykę i porównać bieżące ćwiczenie z ostatnim razem; porównanie aktualizuje się na żywo w miarę logowania serii (7.4). Inline Logging (7.11) pokazuje w każdym polu plakietkę z wartością planowaną (z rutyny).", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-4", "https://smartgymapp.com/releases/smartgym-7-11", "https://smartgymapp.com/features.html"]}, {"has": "yes", "how": "Pod każdym polem serii pokazywana jest ostatnio zalogowana wartość z poprzedniej sesji tego ćwiczenia (np. „Last: 95 lbs”); karta History ćwiczenia (także na ekranie rozgrzewki) pokazuje wcześniejsze sesje i daty PR.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-3119-adjustable-warm-up-targets-expanded-emoji-reactions-exercise-videos-while-offline", "https://feedback.caliberstrong.com/announcements/caliber-5122-reset-exercise-prs-see-their-dates"]}]}, {"id": "log_autofill", "area": "log", "areaPL": "Logowanie treningu", "label": "Automatyczne wypełnianie", "others": 9.0, "cells": [{"has": "yes", "how": "Start z szablonu wstępnie wypełnia każdą serię seriami roboczymi z poprzedniej sesji, a w razie braku - ciężarem startowym z szablonu. Cele czasowe pochodzą z szablonu, nigdy z dawnego wyniku. Odhaczenie pustej serii wypełnia jej puste pola z widocznej podpowiedzi „Previously” lub powtórzenia z minimum zakresu powtórzeń szablonu. Pola wpisane ręcznie kopiują się do następnej nieodhaczonej serii tej samej rodziny; czas nie. Cofnięcie odhaczenia czyści tylko wartości wypełnione automatycznie.", "fb": "", "src": ["lib/store.ts:startFromTemplate", "lib/store.ts:fillFromHints", "lib/store.ts:toggleDone"]}, {"has": "partial", "how": "Szablony przechowują własne ciężary/powtórzenia; po treningu opartym na szablonie komunikat „Update Values Only” / „Update Template and Values” zapisuje użyte ciężary i powtórzenia z powrotem do szablonu, więc kolejna sesja zaczyna się od ostatnich wartości. Brak udokumentowanego automatycznego uzupełniania pustej serii z historii poza wyświetlaniem „poprzednich” wartości.", "fb": "", "src": ["https://help.strongapp.io/article/177-update-template"]}, {"has": "yes", "how": "Dodanie ćwiczenia, które już robiłeś, wstępnie wypełnia liczbę serii, ciężar i powtórzenia; wartości ciężaru/powtórzeń w rutynie aktualizują się automatycznie po każdym treningu, chyba że na ekranie zapisu wyłączysz „Update Routine Values”; ćwiczenia z Rep Range nie są aktualizowane. Zmiany struktury rutyny (zmiana kolejności/dodanie/usunięcie) wywołują pytanie „Update Routine” vs „Keep Original Routine”.", "fb": "", "src": ["https://www.hevyapp.com/features/exercise-programming-options/", "https://help.hevyapp.com/hc/en-us/articles/34105442929943-Previous-Workout-Values-Vs-Routine-Values-How-to-Adjust-in-Settings", "https://help.hevyapp.com/hc/en-us/articles/38387296276375-Update-Routine-vs-Keep-Original-Routine"]}, {"has": "yes", "how": "Każdy wygenerowany trening wstępnie wypełnia serie, powtórzenia i ciężar z algorytmu (historia + wariacja mStrength). Zapisane treningi można wczytać jako „Maintain sets, reps, and weight”, „Generate new sets, reps, and weight” lub „Generate new weight only” (zróżnicowane schematy powtórzeń zostają ujednolicone).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/43489869175063-How-does-Fitbod-decide-my-sets-reps-and-weight", "https://help.fitbod.me/hc/en-us/articles/6259258835863-Save-a-Workout"]}, {"has": "yes", "how": "Edytowalne pola ciężaru/powtórzeń są wstępnie wypełnione wartościami z treningu referencyjnego; rekomendacja Pro pokazywana osobno jako niebieski dymek pod tą samą serią.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-progression-recommendations"]}, {"has": "yes", "how": "Cele pochodzą z tekstu programu po uruchomieniu skryptów progresji; cele w % 1RM i RPE są przeliczane na konkretne ciężary i zaokrąglane do talerzy, które masz do dyspozycji. Dla ćwiczeń wymienionych w treningu ciężary są przeliczane z historii przy najbliższej liczbie powtórzeń/RPE albo z 1RM/domyślnego ciężaru startowego.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/changing-a-workout"]}, {"has": "yes", "how": "Pole wyboru „Copy sets from last workout” przy dodawaniu ćwiczenia; szablony/programy mogą używać „Retrieve from log” (znajduje ostatnią serię z taką samą liczbą powtórzeń lub cięższą z większą liczbą powtórzeń; rozgrzewki pasują do rozgrzewek); „Train again” klonuje cały miniony trening (premium: hurtowe +/- ciężar/powtórzenia).", "fb": "", "src": ["https://help.strengthlog.com/help-article/copy-sets-from-last-workout/", "https://help.strengthlog.com/help-article/retrieve-from-training-log/", "https://help.strengthlog.com/help-article/train-again/"]}, {"has": "yes", "how": "Serie są wstępnie wypełniane z ostatniego logu lub z celów planu; przy Elite Load Progression / Periodization ciężar i cele powtórzeń następnej sesji są zapisywane automatycznie i zaokrąglane do sprzętu użytkownika.", "fb": "", "src": ["https://www.jefit.com/blog/best-progressive-overload-apps-for-beginners-in-2026-top-5-reviewed-and-compared", "https://www.jefit.com/blog/periodization-on-your-own-plan", "https://www.jefit.com/blog/the-science-behind-jefits-load-progression-engine"]}, {"has": "yes", "how": "Dotknij kolumny previous, aby skopiować ciężar/powtórzenia do dzisiejszej serii; autoprogresja programu wstępnie ładuje ciężary następnej sesji (podbija po osiągnięciu powtórzeń, obniża po niepowodzeniach).", "fb": "", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.boostcamp.app/workout-tracker"]}, {"has": "yes", "how": "Model to „zawsze rutyna bazowa”: planowane serie/powtórzenia/ciężar pochodzą z rutyny (własnej, gotowej lub od Smart Trainera), a jedno stuknięcie w numer serii loguje wartości planowane. „Log Different Sets” zapisuje w historii wartości odbiegające od planu bez nadpisywania rutyny; edycja ćwiczenia nadpisuje ją dla przyszłych sesji.", "fb": "Użytkownicy narzekają, że zapisanie faktycznych powtórzeń/ciężaru innych niż w planie jest niewygodne („no ability to record actual weight and actual rep count ... without changing for that set”) - https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json", "src": ["https://help.smartgymapp.com/article/106-log-exercises", "https://help.smartgymapp.com/article/60-log-different-sets"]}, {"has": "partial", "how": "Pola nie są wypełniane automatycznie; stuknięcie tekstu „Last” lub przycisku „Last” na własnej klawiaturze (5.4) kopiuje poprzedni ciężar/powtórzenia/czas do pola. Domyślne cele ćwiczeń (serie/powtórzenia/czas/przerwa) dotyczą ćwiczeń bez własnych celów.", "fb": "„having to constantly edit and add weights instead of it having a baseline button that fills in last workouts numbers” - https://itunes.apple.com/us/rss/customerreviews/page=2/id=1482405410/sortby=mostrecent/json", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-540-custom-keyboard-automatic-rest-timer-default-exercise-settings-sundaymonday-start-date-g"]}]}, {"id": "log_notes", "area": "log", "areaPL": "Logowanie treningu", "label": "Notatki", "others": 9.5, "cells": [{"has": "yes", "how": "Są trzy poziomy notatek. Notatka do treningu to pole tekstowe na dole aktywnego treningu (maks. 1000 znaków). Notatkę do serii dodaje się z menu numeru serii (maks. 300 znaków) i pokazuje jako • plus tekst pod serią. „Notatki techniczne” ćwiczenia (maks. 2000 znaków) są w edytorze ćwiczenia, ale nie są pokazywane podczas treningu. Notatki do serii i treningu trafiają do kolumn CSV Notes / Workout Notes.", "fb": "", "src": ["components/ActiveWorkout.tsx", "app/exercise/[id].tsx", "lib/backup.ts:buildCsv"]}, {"has": "yes", "how": "Trzy rodzaje notatek: Workout Notes (u góry ekranu Log Workout, widoczne w History), Exercise Notes (przez menu ćwiczenia ... > Add a Note, osobno dla każdego treningu) oraz przypięte/„lepkie” notatki (przypięta notatka ćwiczenia jest wyświetlana na żółto za każdym razem, gdy ćwiczenie jest wykonywane, ale nie w History). Brak limitu długości. Notatki do pojedynczych serii nie są udokumentowane.", "fb": "Użytkownik Androida: zamiana ćwiczenia usuwa jego notatki i lepkie notatki (recenzja w Google Play, maj 2026).", "src": ["https://help.strongapp.io/article/134-about-notes"]}, {"has": "yes", "how": "Notatki rutyny dla ćwiczenia (zostają przy każdym użyciu rutyny, mogą zawierać klikalne linki, niewidoczne dla innych) oraz notatki ćwiczenia w treningu (zapisywane z sesją, widoczne dla obserwujących; wyświetlane wyszarzone jednorazowo w następnej sesji). Opis treningu na ekranie zakończenia. Trwałe notatki na poziomie ćwiczenia zapowiedziane jako „on our radar” (lipiec 2026).", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34463684392983-How-do-the-exercise-notes-routine-and-workout-notes-work", "https://help.hevyapp.com/hc/en-us/articles/36011779117591-How-to-Use-Exercise-Notes-in-Hevy-for-Better-Workout-Tracking", "https://www.hevyapp.com/community-updates/july-26/"]}, {"has": "partial", "how": "Notatki per ćwiczenie (More > Notes) zapisywane per sesja i widoczne później w History > Results; można je dołączać w zapisanych treningach. Brak udokumentowanych notatek na poziomie treningu ani serii.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/21486783720087-Exercise-Notes", "https://help.fitbod.me/hc/en-us/articles/30721437384215-How-to-Navigate-the-Exercise-Details-Screen"]}, {"has": "yes", "how": "Dowolna liczba notatek na ćwiczenie w treningu. Dwa rodzaje: tymczasowe notatki treningu (później pokazywane jako informacja o poprzednim treningu) i przypięte notatki ćwiczenia (pokazywane za każdym razem, edytowalne na stronie ćwiczenia); przełączane przez przypięcie/odpięcie. Notatki nie są dołączane przy udostępnianiu planów.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Notatki do treningu (menu kebab > Show Workout Notes) i notatki do ćwiczenia w treningu, pokazywane następnym razem jako „Previous Note” przez dwa miesiące; stałe notatki Markdown do ćwiczenia na ekranie ćwiczenia; opisy programu w Markdown dla ćwiczenia/dnia/tygodnia (linie „//”). Nie znaleziono notatek do pojedynczych serii.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/workout-history", "https://www.liftosaur.com/features/liftoscript"]}, {"has": "yes", "how": "Komentarze do serii (przesuń serię), przypięte komentarze do ćwiczenia pokazywane za każdym razem (ustawienia maszyny/wskazówki), komentarze do ćwiczenia specyficzne dla treningu (v9.0) oraz komentarz do treningu i nazwa przy zapisie.", "fb": "App Store 2026-09 (1*): po 9.0 „trudniej dostać się do notatek do treningów”. https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json", "src": ["https://help.strengthlog.com/help-article/adding-set-comments/", "https://help.strengthlog.com/help-article/exercise-comments/", "https://apps.apple.com/us/app/strengthlog-workout-tracker/id1434229662"]}, {"has": "yes", "how": "Każde ćwiczenie można śledzić z seriami, powtórzeniami, ciężarem i notatkami; notatki do ćwiczeń są w menu trzech kropek ekranu logowania; treningi przyjmują notatki i zdjęcia postępów. Notatki można też zamienić w 140-znakowe „Audio Cue Tips” czytane na głos podczas ćwiczenia (Elite).", "fb": "etechshout (sty 2026) wymienia „dodawanie notatek w kalendarzu” jako brakujące; starsza recenzja z App Store skarżyła się, że do planu nie można dodać notatek/opisów.", "src": ["https://www.jefit.com/support/faq", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/jefits-new-personal-audio-coach-feature"]}, {"has": "yes", "how": "Notatki do treningu (ogólne) plus notatki do konkretnych ćwiczeń (gru 2024); programy zawierają notatki trenera dla dnia/tygodnia.", "fb": "", "src": ["https://www.boostcamp.app/blogs/new-boostcamp-lifting-app-features-december-2024", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "yes", "how": "Rutyny mają pole Notes; v7 dodała notatki do rutyn i ćwiczeń w History; notatki do ćwiczeń są widoczne na zegarku pod przyciskiem More ćwiczenia. Brak dowodów na notatki do pojedynczych serii.", "fb": "", "src": ["https://help.smartgymapp.com/article/57-create-custom-routine", "https://alternativeto.net/news/2023/6/smartgym-7-has-been-released-with-new-exercises-progress-tracking-and-enhanced-apple-watch-app", "https://help.smartgymapp.com/article/59-apple-watch-app"]}, {"has": "yes", "how": "Karta notatek ćwiczenia obok Track (powiększona w 5.12), opcjonalna notatka do treningu + ocena przy zakończeniu (dla wszystkich użytkowników od 4.2), własne instrukcje treningu w szablonach; Premium: notatki cardio dla trenera.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://feedback.caliberstrong.com/announcements/caliber-316-streamlined-rest-timer-stopwatch-revamped-exercise-notes", "https://feedback.caliberstrong.com/announcements/caliber-420-workout-overview-screen-updates", "https://feedback.caliberstrong.com/announcements/caliber-5120-realtime-prs-new-workout-summary-screen-various-bug-fixes", "https://feedback.caliberstrong.com/announcements/caliber-330-new-cardio-activities-cardio-notes-activity-ui-enhancements"]}]}, {"id": "log_supersets", "area": "log", "areaPL": "Logowanie treningu", "label": "Supersety/obwody", "others": 10, "cells": [{"has": "yes", "how": "„⇅ SS” łączy ćwiczenie z następnym, w treningu lub szablonie; „✂” usuwa połączenie. Grupy muszą być ciągłe i mieć 2+ ćwiczeń (normalizeGroups) i są oznaczane SS A, B, C… Grupy mogą mieć N ćwiczeń, więc działają obwody. Timer przerwy startuje dopiero po zamknięciu rundy, liczonej według ukończonych serii, a nie kolejności odhaczeń. Używana jest przerwa ostatniego ćwiczenia grupy.", "fb": "", "src": ["lib/store.ts:linkWithNext", "lib/store.ts:normalizeGroups", "lib/store.ts:restAfter", "lib/store.ts:roundRest"]}, {"has": "yes", "how": "Superserie/obwody grupują ćwiczenia oznaczone pionową linią; przycisk „Next” przeskakuje do następnej serii w kolejności superserii (A1, B1, A2, B2…). iPhone: Add Exercise > wielokrotny wybór > Superset; Android: ... > Create Superset i połączenie ikoną łańcucha. Dostępne także na Apple Watch (menu ćwiczenia ...).", "fb": "Sam Strong przyznaje, że UX superserii różni się między iPhonem a Androidem i zostanie ujednolicony później; recenzenci uważają interfejs za przestarzały w porównaniu z Hevy (aitoolsbakery).", "src": ["https://help.strongapp.io/article/98-supersets-and-circuits", "https://help.strongapp.io/article/224-workout-on-apple-watch"]}, {"has": "yes", "how": "Ćwiczenie ... > „+ Add To Superset” i wybór partnera; dodawanie kolejnych ćwiczeń tworzy giant sety/obwody; wiele superserii ma różne kolory. „Smart Superset Scrolling” automatycznie przewija do następnego ćwiczenia superserii po ukończeniu serii; timer przerwy przy ostatnim ćwiczeniu wyznacza rundę obwodu.", "fb": "Aplikacja na zegarek podobno laguje podczas superserii z szybkimi przejściami (findyouredge).", "src": ["https://help.hevyapp.com/hc/en-us/articles/35650286563095-The-Complete-Guide-to-Supersets-and-Smart-Superset-Scrolling", "https://help.hevyapp.com/hc/en-us/articles/36954623739415-Circuits-Intervals-and-Supersets-Explained-How-to-Build-Them-in-the-Hevy-App"]}, {"has": "yes", "how": "Superserie (2 ćwiczenia) i obwody (3+, bez limitu) mogą być generowane automatycznie (przełącznik w My Plan) lub budowane ręcznie przez „...” > Build superset/circuit, przed lub w trakcie treningu. Menu grupy: Add Exercises, Log All Exercises, Duplicate, Normalize Weights (tylko iOS; ten sam ciężar w grupie), Reorder Sections, Unbundle. Długie przytrzymanie pozwala przeciągać grupy lub przenosić ćwiczenia do/z grupy.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006427813-Circuits-Supersets", "https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod"]}, {"has": "yes", "how": "Superserie obsługiwane w planach i treningach (można ich też użyć do skrócenia sesji); wynik generatora można edytować, by dodać superserie. Brak udokumentowanej terminologii obwodów/giant setów.", "fb": "Starsza recenzja: nie można modyfikować superserii w trakcie treningu (thefitnesstribe, bez daty/starsza).", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/blog/alpha-progression-workout-plan-generator"]}, {"has": "yes", "how": "Dowolna liczba ćwiczeń ma wspólną nazwę grupy („superset: A”); po każdej serii roboczej ekran przeskakuje do następnego ćwiczenia w grupie, pomijając ukończone; kolorowa linia pod miniaturami. Grupy można ustawić w tekście programu, w edytorze lub ad hoc w trakcie treningu; osobny timer przerwy „Superset”.", "fb": "", "src": ["https://www.liftosaur.com/features/supersets"]}, {"has": "yes", "how": "„+ Special set” > Superset to dokładnie dwa ćwiczenia (każde oznaczane jako ukończone osobno; można rozdzielić lub zmienić kolejność); Circuit dla 3+ ćwiczeń/rund; Complex dla sekwencji ze sztangą o tym samym ciężarze wykonywanych jako jedna seria.", "fb": "", "src": ["https://help.strengthlog.com/help-article/special-sets/"]}, {"has": "yes", "how": "Ćwiczenia można grupować w superserie z menu trzech kropek na ekranie logowania i w kreatorze rutyn (także w planerze webowym). Zachowanie circuit/giant-set nie jest udokumentowane.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens", "https://www.jefit.com/blog/stay-ahead-with-jefit-online-workout-planner-enhancements"]}, {"has": "yes", "how": "Grupowanie ćwiczeń w superserie w edytorze treningu i kreatorze programów.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://www.boostcamp.app/custom-program"]}, {"has": "yes", "how": "Superserię tworzy się, włączając przełącznik superserii przy każdym ćwiczeniu z grupy poza ostatnim (2+ ćwiczeń, czyli także obwody); opcjonalna przerwa na końcu rundy. Od 7.5.4 można ją przełączać przesunięciem wiersza ćwiczenia.", "fb": "Recenzje: przebieg superserii jest „not intuitive and will not automatically revert back to the first exercise”; inna: „Doesn't support circuits” - https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json", "src": ["https://help.smartgymapp.com/article/74-create-supersets", "https://help.smartgymapp.com/article/65-superset", "https://help.smartgymapp.com/article/57-create-custom-routine"]}, {"has": "paid", "how": "Superserie tworzy się/edytuje w dolnym arkuszu na ekranie treningu (5.3); automatyczny timer przerw włącza się między ćwiczeniami superserii; klawisz „Next Set” na klawiaturze przeskakuje do następnego ćwiczenia superserii. W App Store wymieniona jako funkcja Plus. Zamiana ćwiczenia wewnątrz superserii ma status „In Progress”.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-530-exercise-search-screen-revamp-and-more", "https://feedback.caliberstrong.com/announcements/caliber-540-custom-keyboard-automatic-rest-timer-default-exercise-settings-sundaymonday-start-date-g", "https://apps.apple.com/us/app/caliber-strength-training/id1482405410", "https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/substitute-exercises-in-supersets"]}]}, {"id": "log_reorder", "area": "log", "areaPL": "Logowanie treningu", "label": "Zmiana kolejności w treningu", "others": 8.0, "cells": [{"has": "yes", "how": "„≡ Kolejność” otwiera ekran zmiany kolejności przeciąganiem, dostępny podczas treningu i w edytorze szablonu. Przeciąga się za uchwyt ≡ z odpowiedzią haptyczną i automatycznym przewijaniem przy krawędziach. Superseria przesuwa się jako jeden blok, a wewnątrz niej kolejność zmienia się jej własnymi uchwytami; przynależność nigdy się nie zmienia. VoiceOver ma akcje przesuń w górę/w dół. Edytor szablonu ma też przyciski ↑/↓.", "fb": "", "src": ["app/reorder.tsx", "components/DragList.tsx", "lib/store.ts:moveBlockOf", "lib/store.ts:moveInGroup"]}, {"has": "yes", "how": "Przeciągnij i upuść na nazwie ćwiczenia podczas treningu (telefon); na Apple Watch zmiana kolejności przez ... na ekranie Workout Overview.", "fb": "", "src": ["https://help.strongapp.io/article/229-my-first-workout", "https://help.strongapp.io/article/224-workout-on-apple-watch"]}, {"has": "yes", "how": "Menu ćwiczenia ... > Reorder (przeciąganie i upuszczanie) w rutynach i trwających treningach; także w treningach Trainera.", "fb": "", "src": ["https://www.hevyapp.com/features/exercise-programming-options/", "https://www.hevyapp.com/features/workout-plan-generator/"]}, {"has": "yes", "how": "Przytrzymaj ćwiczenie i przeciągnij, by zmienić kolejność w zakładce Workout; superserie/obwody i interwały czasowe również można przeciągać.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/360006427813-Circuits-Supersets", "https://help.fitbod.me/hc/en-us/articles/360041831493-Timed-Intervals"]}, {"has": "yes", "how": "Długie przytrzymanie miniatury ćwiczenia w nagłówku treningu i przeciągnięcie; edytor planu pozwala przenosić ćwiczenia między dniami (v6.4, styczeń 2026) i importować treningi/dni z innych planów.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Przytrzymaj miniaturę ćwiczenia w górnym pasku i przeciągnij, aby zmienić kolejność w trakcie treningu; siatka edytora programu obsługuje przeciąganie ćwiczeń/dni/tygodni.", "fb": "", "src": ["https://www.liftosaur.com/features/workout-screen", "https://www.liftosaur.com/features/program-editor"]}, {"has": "yes", "how": "Długie przytrzymanie krawędzi ćwiczenia (lub ... > Handle exercise > Reorder) otwiera listę drag-and-drop; serie można przesuwać w górę/w dół strzałkami w menu serii.", "fb": "", "src": ["https://help.strengthlog.com/help-article/reorder-exercises/", "https://help.strengthlog.com/help-article/how-to-record-a-workout/"]}, {"has": "partial", "how": "Kreator rutyn (2025) obsługuje zmianę kolejności ćwiczeń/dni przeciąganiem; zmiana kolejności w trwającym treningu nie jest udokumentowana. Przesunięcie w lewo/prawo przełącza między ćwiczeniami podczas logowania.", "fb": "", "src": ["https://www.jefit.com/blog/introducing-new-routine-builder-workout-planning-simplified", "https://www.jefit.com/blog/stay-ahead-with-jefit-online-workout-planner-enhancements", "https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens"]}, {"has": "unknown", "how": "Nie udokumentowano.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker"]}, {"has": "partial", "how": "Kolejność ćwiczeń zmienia się w trybie edycji rutyny: przytrzymaj uchwyt z trzema kreskami i przeciągnij. Brak dowodów na zmianę kolejności w trakcie aktywnej sesji bez edycji rutyny.", "fb": "", "src": ["https://help.smartgymapp.com/article/72-change-the-order-of-the-exercises", "https://help.smartgymapp.com/article/57-create-custom-routine"]}, {"has": "yes", "how": "Przytrzymaj ćwiczenie na ekranie Workout Overview, aby zmienić kolejność przeciąganiem (4.2), także wewnątrz superserii; szablony zmienia się kolejnością w Plans ikoną zmiany kolejności.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-420-workout-overview-screen-updates", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "log_replace_exercise", "area": "log", "areaPL": "Logowanie treningu", "label": "Zamiana ćwiczenia w trakcie", "others": 10, "cells": [{"has": "no", "how": "Nie ma akcji zamiany. Podczas treningu można tylko „usuń” ćwiczenie i „+ Dodaj ćwiczenie” inne, które jest dopisywane na końcu.", "fb": "", "src": ["components/ActiveWorkout.tsx:ExerciseBlock", "lib/store.ts:addExerciseToActive"]}, {"has": "yes", "how": "Zamiana ćwiczenia przez menu More (...) ćwiczenia; Apple Watch dostał opcję „Replace exercise” w wersji 6.1.0 (czerwiec 2025). Osobna funkcja „Transfer Exercise Data” scala historię zapisaną pod błędnym ćwiczeniem (tylko ta sama kategoria, nieodwracalne).", "fb": "Zamiana ćwiczenia usuwa jego notatki/lepkie notatki (użytkownik Androida, recenzja w Google Play 2026).", "src": ["https://help.strongapp.io/article/224-workout-on-apple-watch", "https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577", "https://help.strongapp.io/article/209-how-do-i-merge-data-between-two-exercises"]}, {"has": "yes", "how": "Ćwiczenie ... > Replace Exercise z biblioteki; w Hevy Trainer wybierasz spośród 4 sugerowanych alternatyw i decydujesz, czy zamiana dotyczy tylko tej sesji, czy jest trwała.", "fb": "", "src": ["https://www.hevyapp.com/features/exercise-programming-options/", "https://www.hevyapp.com/features/workout-plan-generator/", "https://www.hevyapp.com/community-updates/july-26/"]}, {"has": "yes", "how": "Przesuń w lewo > Replace. Listę zamienników można sortować wg Best Replacements / Most Logged / Least Logged / Never Logged i filtrować wg Your Equipment, No Equipment, Same Equipment, Different Equipment. Zamiany są też traktowane przez algorytm jako sygnały preferencji.", "fb": "Skarga: „Difficult exercise replacement interface” (agregacja recenzji justuseapp).", "src": ["https://help.fitbod.me/hc/en-us/articles/360006335593-Editing-Workouts-in-Fitbod", "https://help.fitbod.me/hc/en-us/articles/43489509474455-How-does-Fitbod-choose-which-exercises-to-give-me"]}, {"has": "yes", "how": "Replace pokazuje listę podobnych ćwiczeń (np. na innym sprzęcie, gdy maszyna jest zajęta) lub zwykłe wyszukiwanie/filtry; cele są w miarę możliwości zachowane (v6.5). Na koniec treningu pytanie, czy zastosować zmiany w planie, czy zachować je tylko na dziś.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://apps.apple.com/us/app/alpha-progression/id1462277793"]}, {"has": "yes", "how": "Cog > Swap Exercise; selektor ma zakładki „Ad-hoc” i „From Program”, sortowanie „Similar Muscles” oraz listę „Recent” (ostatnie 5 wymian). Ciężary dla nowego ćwiczenia są przeliczane z historii; wymiana dotyczy tylko tego treningu; predefiniowane alternatywy z własną progresją można zachować przez „used: none”.", "fb": "", "src": ["https://www.liftosaur.com/features/changing-a-workout", "https://www.liftosaur.com/features/exercise-library"]}, {"has": "yes", "how": "Przesuń ćwiczenie > Change: otwiera się biblioteka z podobnymi ćwiczeniami sugerowanymi jako pierwsze; ciężary zostają bez zmian (lub pobierane z historii/aktualizacja 1RM).", "fb": "", "src": ["https://help.strengthlog.com/help-article/similar-exercises/", "https://help.strengthlog.com/help-article/shortcuts-in-an-active-workout/"]}, {"has": "yes", "how": "Swap Exercise w menu trzech kropek ekranu logowania; v17.0.9 (cze 2026) dodała mądrzejsze, uwzględniające kontuzje rekomendacje zamienników; zamiany w Adaptive Plan pozostają w tym samym wzorcu ruchowym, a podgląd tygodnia wyjaśnia, dlaczego ćwiczenie zamieniono (kontuzja, trudność, sprzęt).", "fb": "", "src": ["https://www.jefit.com/blog/upcoming-enhancements-revamped-workout-tab-and-improved-exercise-screens", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/adaptive-mesocycle-training-jefits-smarter-way-to-progress"]}, {"has": "yes", "how": "Ikona swap pokazuje alternatywy sugerowane przez trenera (lub „•••”, aby wybrać dowolne ćwiczenie); ciężary przechodzą na zamiennik, a aplikacja pyta, czy zastosować zamianę tylko dziś, czy w przyszłych treningach. Rekomendacje „Similar Exercises” dla każdego ćwiczenia dodane w paź 2026.", "fb": "Recenzja ze Sklepu Play (lut 2025): część funkcji zamiany zablokowana za subskrypcją; recenzja z App Store: tylko około połowa zamian „save for future” się utrzymuje.", "src": ["https://www.boostcamp.app/blogs/tips-and-tricks-to-using-boostcamp-app", "https://www.garagegymreviews.com/boostcamp-review", "https://www.boostcamp.app/features", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "yes", "how": "„Alternative exercise” (7.4): zamiana ćwiczenia tylko na bieżącą sesję (rutyna pozostaje nienaruszona); Smart Trainer proponuje najbardziej podobne ćwiczenia, filtrowane według listy sprzętu z rutyny; działa offline na Apple Watch. „Edit > Replace Exercise” zmienia je na stałe. W 7.6 dodano wyszukiwanie w alternatywach.", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-4", "https://smartgymapp.com/releases/smartgym-7-6", "https://help.smartgymapp.com/article/136-different-equipment-lists", "https://smartgymapp.com/watch.html"]}, {"has": "paid", "how": "Zamiana z aktywnego treningu lub szablonu; lista zamienników jest wstępnie filtrowana według głównej grupy mięśniowej (3.0.4), a od 5.14 szeregowana według popularności ćwiczenia. Po zakończeniu aplikacja pyta, czy zapisać zmiany w szablonie. „Swap exercises” wymienione jako Plus.", "fb": "„Smart exercise substitutions” wciąż Planned (1617 głosów) - https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/smart-exercise-substitutions", "src": ["https://feedback.caliberstrong.com/announcements/caliber-304-exercise-substitution-improvements", "https://feedback.caliberstrong.com/announcements/caliber-514-515-improvements-to-exercise-search-progress-photo-gallery-revamp-mcp-support-for-chatgp", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide", "https://apps.apple.com/us/app/caliber-strength-training/id1482405410"]}]}, {"id": "log_plate_calculator", "area": "log", "areaPL": "Logowanie treningu", "label": "Kalkulator talerzy", "others": 8, "cells": [{"has": "no", "how": "Brak kalkulatora talerzy w kodzie. Sprzęt jest tylko atrybutem ćwiczenia; nie ma zasobu gryfów ani talerzy.", "fb": "", "src": ["lib/seed.ts", "components/ActiveWorkout.tsx"]}, {"has": "paid", "how": "Tylko PRO. Stuknij pole ciężaru w ćwiczeniu ze sztangą/maszyną, potem przycisk kalkulatora talerzy na klawiaturze; pokazuje najbardziej efektywny zestaw talerzy na stronę. Uwzględnia ciężar gryfu; domyślny gryf olimpijski to 20 kg/45 lb, typ gryfu można zmienić dla ćwiczenia w menu ... Brak na Apple Watch; drobne różnice między iOS a Androidem.", "fb": "Recenzja w App Store z 2020: ograniczenie do typowych ciężarów gryfów (brak opcji gryfu 25 lb do Smitha).", "src": ["https://help.strongapp.io/article/169-plate-calculator", "https://help.strongapp.io/article/132-strong-pro"]}, {"has": "yes", "how": "Darmowy; włącz w Settings > Workouts. W ćwiczeniu ze sztangą/gryfem EZ stuknij ciężar > „Calculator” nad klawiaturą; wybierz dostępne talerze i ciężar gryfu; jeśli dokładny ciężar jest niemożliwy, pokazuje najbliższy osiągalny. „Manage” pozwala dodać własne gryfy i talerze.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/34518876511383-How-to-use-the-Plate-Calculator-Logging-and-Adding-Custom-Plates-and-Bars", "https://www.hevyapp.com/features/workout-settings/"]}, {"has": "yes", "how": "Dla ćwiczeń ze sztangą: przycisk obok History lub przesunięcie serii w prawo; dla innego sprzętu na talerze (gryf EZ, trap bar, Smith, yoke, leg press, hack squat, maszyna na łydki, Hammer Strength, T-bar) przesuń serię w prawo. Używa gryfów/talerzy z dostępnego sprzętu; jeśli dokładny ciężar jest niemożliwy, pokazuje najbliższy możliwy do załadowania. Brak własnego ciężaru gryfu dla sztangi; nie ma na Watch/Wear OS.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360007700013-Plate-Calculator"]}, {"has": "paid", "how": "Pro: wbudowany w picker ciężaru dla ćwiczeń ze sztangą i talerzami (używa ciężaru gryfu + zestawu talerzy aktywnej siłowni); jeśli celu nie da się zbudować, pokazuje następny niższy osiągalny ciężar.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/subscribe"]}, {"has": "paid", "how": "Talerze na stronę są pokazane pod rozwiniętą serią, pod klawiaturą ciężaru i w kolumnie „Plates”; darmowi użytkownicy widzą link „See plates for each side”. Samo zaokrąglanie do możliwych do załadowania ciężarów jest darmowe.", "fb": "", "src": ["https://www.liftosaur.com/features/premium", "https://www.liftosaur.com/features/equipment-and-gyms"]}, {"has": "yes", "how": "Za darmo: obrazek załadunku nad klawiaturą dla ćwiczeń ze sztangą, pełny kalkulator w Settings > Calculators; profile dla każdej siłowni z liczbą talerzy, kolorami talerzy, gryfami i zaciskami; ćwiczenia można powiązać z konkretnym gryfem (np. sztanga trap 28 kg; gryf 0 kg dla maszyn obciążanych talerzami).", "fb": "", "src": ["https://help.strengthlog.com/help-article/plate-calculator/"]}, {"has": "unknown", "how": "Brak wzmianki o kalkulatorze załadunku talerzy w FAQ JEFIT, opisach w sklepach ani na blogu; ciężary są jednak zaokrąglane przez silnik progresji do deklarowanych przez użytkownika talerzy/hantli.", "fb": "", "src": ["https://www.jefit.com/support/faq", "https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/blog/periodization-on-your-own-plan"]}, {"has": "yes", "how": "Darmowy kalkulator talerzy podaje, jakie talerze załadować po każdej stronie gryfu dla każdej serii.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://www.garagegymreviews.com/boostcamp-review"]}, {"has": "no", "how": "Brak kalkulatora talerzy w centrum pomocy, na stronie funkcji i w notatkach wydania; recenzja z App Store z maja 2026 wprost wymienia „No Built-in Plate Calculator” jako poważny brak.", "fb": "", "src": ["https://itunes.apple.com/us/rss/customerreviews/page=3/id=922744883/sortby=mostrecent/json", "https://smartgymapp.com/features.html"]}, {"has": "paid", "how": "Ikona sztangi na ekranie Track: optymalna konfiguracja talerzy na podstawie docelowego ciężaru, wagi gryfu (domyślnie 45 lb/20 kg, edytowalna) i edytowalnego zasobu talerzy; działa dla sztangi, Smitha, Hammer Strength, Landmine, EZ i gryfu trap bar; wstępnie ładuje ostatni cel (przydatne przy rozgrzewkach). „Plate Math Calculator” to funkcja Plus.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/caliber-3123-introducing-plate-calculator-1", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257778-account-management-user-guide"]}]}, {"id": "log_warmup_calculator", "area": "log", "areaPL": "Logowanie treningu", "label": "Kalkulator rozgrzewki", "others": 7.5, "cells": [{"has": "no", "how": "Brak generatora serii rozgrzewkowych. Serie rozgrzewkowe dodaje się ręcznie, oznaczając serię jako W.", "fb": "", "src": ["components/ActiveWorkout.tsx:setMenu"]}, {"has": "paid", "how": "Tylko PRO. Ćwiczenie ... > Add (lub Update) Warm-up Sets dodaje zbiorczo oznaczone serie rozgrzewkowe dla ćwiczeń ze sztangą, hantlami i na maszynach; formuła konfigurowalna w Settings (iPhone) lub podczas treningu (Android). Brak na Apple Watch.", "fb": "", "src": ["https://help.strongapp.io/article/171-warm-up-calculator", "https://help.strongapp.io/article/132-strong-pro"]}, {"has": "paid", "how": "Pro. Włącz w Settings > Workouts; konfigurowalna „Warmup Method” (% i powtórzenia każdej serii, dodawanie/usuwanie serii; domyślnie zaczyna od 40%), zaokrąglanie talerzy i hantli. Ćwiczenie ... > Add Warm Up Sets, wpisz docelowy ciężar > Insert Warmup Sets.", "fb": "", "src": ["https://help.hevyapp.com/hc/en-us/articles/35650921359639-How-to-Use-the-Warm-Up-Calculator-for-Percentage-Based-Warm-Up-Sets", "https://help.hevyapp.com/hc/en-us/articles/33882110558743-Workout-Settings-Preferences-Timer-Warm-up-calculator-Plate-Calculator-Smart-Superset-Scrolling", "https://help.hevyapp.com/hc/en-us/articles/35119778922263-Hevy-Pro-Subscription-How-to-get-Pro-and-What-Does-It-Include"]}, {"has": "yes", "how": "Przełącznik „Warm-Up Sets” w My Plan > Training Format automatycznie dodaje narastające serie rozgrzewkowe (rosnący ciężar, mniej powtórzeń) do kwalifikujących się ćwiczeń. Pomijane dla ćwiczeń z masą ciała/gumą, akcesoryjnych/core/z odciążeniem/na czas, ćwiczeń Max Effort lub gdy ciężar roboczy jest za niski na sensowną progresję.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/360006337634-Warm-Up-Sets", "https://help.fitbod.me/hc/en-us/articles/34336407191191-My-Plan"]}, {"has": "paid", "how": "Pro: dopasowane serie rozgrzewkowe przed seriami roboczymi, skalowane wg ćwiczenia, ciężaru pierwszej serii roboczej, docelowych powtórzeń, dostępnych ciężarów i doświadczenia. Konfigurowalna liczba dla ćwiczeń złożonych/średnich/izolowanych i dla mięśni zimnych/rozgrzanych, dodatkowe/mniej serii przy bardzo niskich/wysokich powtórzeniach oraz % ciężaru roboczego dla każdej serii rozgrzewkowej (np. 35%, 65%).", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/subscribe"]}, {"has": "yes", "how": "Rozgrzewki są domyślnie dodawane automatycznie dla każdego ćwiczenia; można je dostosować dla ćwiczenia przez „warmup: 1x5 45lb, 1x3 80%”, gdzie % dotyczy ciężaru pierwszej serii roboczej, lub „warmup: none”.", "fb": "", "src": ["https://www.liftosaur.com/doc/liftoscript", "https://github.com/astashov/liftosaur"]}, {"has": "partial", "how": "Kalkulator „Warm-up for max attempt” planuje serie rozgrzewkowe dla docelowego ciężaru i może utworzyć trening; nie znaleziono automatycznego generowania rozgrzewek dla zwykłych serii roboczych.", "fb": "", "src": ["https://help.strengthlog.com/help-article/calculators/", "https://www.strengthlog.com/"]}, {"has": "unknown", "how": "Serie rozgrzewkowe można oznaczać ręcznie, ale nie udokumentowano automatycznego generatora serii rozgrzewkowych.", "fb": "", "src": ["https://www.jefit.com/blog/set-types-new-in-jefit-customize-your-workouts-with-set-types"]}, {"has": "yes", "how": "Konfigurowalne szablony serii rozgrzewkowych, które można zastosować do dowolnego ciężaru roboczego oraz zapisywać/używać ponownie (obecnie za darmo; starsza recenzja mówi, że serie rozgrzewkowe były w Premium).", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker", "https://www.boostcamp.app/features", "https://apps.apple.com/us/app/boostcamp-workout-programs/id1529354455"]}, {"has": "unknown", "how": "Nie znaleziono kalkulatora serii rozgrzewkowych. Istnieje typ serii „warm-up”, a Smart Trainer (7.9) proponuje rozciąganie mobilizujące na rozgrzewkę/schłodzenie (segmenty rutyny), ale to inna funkcja.", "fb": "", "src": ["https://smartgymapp.com/releases/smartgym-7-9", "https://9to5mac.com/2026/07/23/smartgym-update-makes-it-easier-to-manually-adjust-and-log-exercises-on-the-go/"]}, {"has": "yes", "how": "„Smart warmups” dla każdego ćwiczenia generują serie rozgrzewkowe na podstawie ciężaru roboczego; docelowy ciężar regulowany (kroki ±5 lb) na ekranie rozgrzewki; dostępna tam karta historii (3.1.19).", "fb": "Prośba o możliwość ustawienia 1-6 serii rozgrzewkowych zamiast stałych 3-4 (Planned) - https://feedback.caliberstrong.com/b/7vz226vy/feature-ideas/custom-number-of-warm-up-sets", "src": ["https://feedback.caliberstrong.com/announcements/caliber-3119-adjustable-warm-up-targets-expanded-emoji-reactions-exercise-videos-while-offline", "https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "log_bodyweight_assisted", "area": "log", "areaPL": "Logowanie treningu", "label": "Masa ciała z dociążeniem/asystą", "others": 6.0, "cells": [{"has": "yes", "how": "Ćwiczenia z masą ciała logują „±kg”: plus to dodatkowe obciążenie, minus to odciążenie. Ćwiczenia oznaczone „Asysta gumą” (np. Pull Up, Chin Up, Dip, Nordic) mają kolumnę gumy; stuknięcie przełącza cyklicznie gumy użytkownika według poziomu (od P-001 gumy nie mają kg — wybór gumy nie zmienia ±kg). Masa ciała nigdy nie jest używana w obliczeniach (schema 13). Rekord to suma powtórzeń bez asysty, a e1RM/objętość używają tylko dodanego obciążenia.", "fb": "", "src": ["lib/store.ts:setLoad", "lib/store.ts:effectiveLoad", "lib/store.ts:cycleBand", "components/ActiveWorkout.tsx", "lib/stats.ts:totalKind"]}, {"has": "partial", "how": "App Store podaje obsługę wielu typów ćwiczeń, „w tym Assisted Bodyweight i Duration Exercises”. Sposób, w jaki masa ciała wchodzi do objętości, nie jest udokumentowany; według recenzji użytkownika kombinacja ciężar + czas nie jest obsługiwana.", "fb": "", "src": ["https://apps.apple.com/us/app/strong-workout-tracker-gym-log/id464254577", "https://play.google.com/store/apps/details?id=io.strongapp.strong"]}, {"has": "yes", "how": "Trzy typy: masa ciała (bodyweight), z odciążeniem (assisted; efektywne obciążenie = masa ciała − pomoc) i z dodatkowym obciążeniem (weighted; masa ciała + dodatek). Dla ćwiczeń z biblioteki wykorzystujących 100% masy ciała (podciągnięcia, chin-upy, dipy, HSPU) i zalogowanej masy ciała masa ciała jest wliczana do objętości; własne ćwiczenia z masą ciała nigdy jej nie uwzględniają. Masę ciała można zaktualizować z menu ... ćwiczenia w trakcie treningu. Ćwiczenia z odciążeniem mają tylko PR oparte na powtórzeniach.", "fb": "Użytkownicy narzekają, że przysiady z masą ciała nie dodają objętości (recenzja w App Store 2025); objętość przy pracy z masą ciała różni się od Strava.", "src": ["https://help.hevyapp.com/hc/en-us/articles/38386262243223-Bodyweight-Exercises-in-Hevy-Bodyweight-vs-Assisted-vs-Weighted", "https://help.hevyapp.com/hc/en-us/articles/38387131819799-Weighted-Bodyweight-Exercises-Is-Bodyweight-Included-in-Volume", "https://help.hevyapp.com/hc/en-us/articles/34380762441111-Assisted-Bodyweight-Exercises-How-it-Calculates-Volume-and-PRs"]}, {"has": "partial", "how": "Ćwiczenia z masą ciała: pole Weight loguje tylko dodatkowy opór („Added Weight”, np. kamizelka); szacowana siła dla masy ciała opiera się tylko na powtórzeniach. Istnieją ćwiczenia z odciążeniem (np. Assisted Pull Up), ale sposób logowania pomocy nie jest udokumentowany. Gumy oporowe: użytkownik definiuje zestaw gum (Handle/Mini/Loop, kolory, napięcia); ćwiczenia z gumami są zalecane w powtórzeniach, nie w ciężarze.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/29486697282711-Exercise-Details-Screen-Sets-Reps-and-Weight-Fields-Explained", "https://help.fitbod.me/hc/en-us/articles/16254175592215-Fitbod-s-Algorithm-Q-A", "https://help.fitbod.me/hc/en-us/articles/12732749777047-Fitbod-Metrics-Records", "https://help.fitbod.me/hc/en-us/articles/4404204105367-Resistance-Bands-Collections", "https://help.fitbod.me/hc/en-us/articles/42459670227223-Exercise-Percentile-Ranking"]}, {"has": "yes", "how": "Każde wbudowane ćwiczenie z masą ciała zapisuje % masy ciała, który jest przemieszczany (własne ćwiczenia: użytkownik ustawia 0–100%). Użytkownik loguje tylko dodatkowy ciężar lub odciążenie (np. −15 kg przy dipach z asystą); masa ciała jest wliczana do e1RM/e10RM i rekomendacji. Gumy oporowe dostępne jako sprzęt.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "yes", "how": "Przełączniki sprzętu „Bodyweight for Bar” i „Is assisting?” modelują podciągania/dipy z obciążeniem i z asystą; gumy dodaje się jako „talerze” z ciężarem asysty. Wymaga małego skryptu aktualizacji (weights = bodyweight +/- originalWeights) opisanego w dokumentacji z przykładami.", "fb": "", "src": ["https://www.liftosaur.com/features/equipment-and-gyms"]}, {"has": "partial", "how": "Ćwiczenia mogą mieć „bodyweight factor”, który dodaje część masy ciała do podnoszonego ciężaru/objętości (edytowalny lub 0, aby wykluczyć). Nie udokumentowano dedykowanego trybu asysty/gum.", "fb": "", "src": ["https://help.strengthlog.com/help-article/bodyweight-factors/", "https://help.strengthlog.com/help-article/adding-a-new-exercise/"]}, {"has": "partial", "how": "Ćwiczenia z asystą są rozpoznawane przez silnik progresji obciążenia („less resistance means harder”, v17.2.4, wrz 2026). Logowanie dodatkowego ciężaru przy ćwiczeniach z masą ciała lub gumach nie jest udokumentowane; lista sprzętu zawiera Bands i Body Weight.", "fb": "", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000", "https://www.jefit.com/exercises"]}, {"has": "unknown", "how": "Ćwiczenia z masą ciała są obsługiwane; logowanie dodatkowego/asystującego obciążenia nie jest udokumentowane.", "fb": "", "src": ["https://www.boostcamp.app/free-workout-app"]}, {"has": "unknown", "how": "Ćwiczenia z masą własną ciała są w bibliotece 730+ ćwiczeń, ale nie znaleziono dokumentacji, jak loguje się dodatkowe/odciążone obciążenie czy gumy.", "fb": "", "src": ["https://smartgymapp.com/features.html"]}, {"has": "yes", "how": "Przy ćwiczeniach z pełną masą ciała (podciąganie, chin-up, dipy, muscle-up...) ostatnio zalogowana masa ciała jest dodawana automatycznie - użytkownik loguje tylko dodatkowy ciężar; przy ćwiczeniach z odciążeniem pomoc jest odejmowana od masy ciała. Uwzględniane w PR, Strength Score i (od 5.13) wykresach.", "fb": "", "src": ["https://feedback.caliberstrong.com/announcements/bodyweightassisted-exercise-adjustment-excluding-high-rep-sets-from-1rm", "https://feedback.caliberstrong.com/announcements/caliber-5130-progress-section-revamp-1"]}]}, {"id": "log_unilateral", "area": "log", "areaPL": "Logowanie treningu", "label": "Strona lewa/prawa", "others": 3.0, "cells": [{"has": "partial", "how": "Ćwiczenie może mieć tryb obciążenia „unilateral” (na stronę, ×2 w objętości). Kolumna ma wtedy nagłówek „kg/str.”, a e1RM/maksymalny ciężar są opisane „per side”. Nie ma osobnych powtórzeń ani ciężarów dla lewej/prawej strony w serii.", "fb": "", "src": ["lib/seed.ts:LoadMode", "lib/store.ts:loadLabel", "app/more/progress.tsx"]}, {"has": "partial", "how": "Brak udokumentowanego logowania serii osobno dla strony lewej/prawej. W iOS jest Settings > Bonus Options > „Count Dumbbells Twice”, co podwaja ciężar hantli w objętości treningu i na wykresach objętości; na Androidzie ciężar hantli jest zawsze podwajany.", "fb": "Użytkownik Premium na Androidzie poprosił o wbudowane pole strony ciała (recenzja w Google Play, maj 2026).", "src": ["https://help.strongapp.io/article/101-how-are-dumbbell-exercises-counted"]}, {"has": "no", "how": "Brak udokumentowanego logowania serii per strona; szef produktu Hevy mówi, że logowanie pojedynczego vs podwójnego ciężaru jest badane (lipiec 2026). Trainer pokazuje ćwiczenia z dwoma hantlami jako ciężar łączny.", "fb": "", "src": ["https://www.hevyapp.com/community-updates/july-26/", "https://help.hevyapp.com/hc/en-us/articles/43572343844247-How-Hevy-Trainer-Settings-Work"]}, {"has": "yes", "how": "Ćwiczenia oznaczone „per arm”/„per leg”: powtórzenia i ciężar są per strona; ciężar maszyny logowany dla jednej strony (nie podwajany). Własne ćwiczenia można oznaczyć jako jednostronne lub dwustronne. Etykiety mogą nie pokazywać się na Watch/Wear OS.", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/29486697282711-Exercise-Details-Screen-Sets-Reps-and-Weight-Fields-Explained", "https://help.fitbod.me/hc/en-us/articles/28062570249623-Custom-Exercises"]}, {"has": "unknown", "how": "Brak udokumentowanego śledzenia per strona; instrukcje „Misc” ćwiczenia mówią, czy logować jeden hantel, czy oba.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide", "https://alphaprogression.com/en/support"]}, {"has": "yes", "how": "Ćwiczenia oznaczone „Is Unilateral” mają osobne pola powtórzeń L: i R:; AMRAP pyta o powtórzenia lewej/prawej strony; serie na czas uruchamiają dwa zegary. Objętość sumuje obie strony; e1RM używa średniej z obu stron.", "fb": "", "src": ["https://www.liftosaur.com/features/set-types", "https://www.liftosaur.com/features/timed-sets"]}, {"has": "partial", "how": "Ćwiczenia jednostronne mają opcję „Enter for only one side”: wpisujesz powtórzenia/ciężar jednej strony raz, a aplikacja podwaja objętość; brak osobnych pól L/R.", "fb": "", "src": ["https://help.strengthlog.com/help-article/one-sided-exercises/"]}, {"has": "unknown", "how": "Nie udokumentowano logowania per strona.", "fb": "Recenzja z App Store prosi o funkcję rozróżniania powtórzeń dla każdej ręki/nogi w ćwiczeniach jednokończynowych.", "src": ["https://apps.apple.com/us/app/jefit-workout-planner-gym-log/id449810000"]}, {"has": "unknown", "how": "Nie udokumentowano.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker"]}, {"has": "unknown", "how": "Nie znaleziono dokumentacji logowania osobno dla każdej strony.", "fb": "", "src": ["https://smartgymapp.com/features.html"]}, {"has": "unknown", "how": "Nie udokumentowano logowania osobno dla każdej strony.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "log_tempo", "area": "log", "areaPL": "Logowanie treningu", "label": "Tempo", "others": 0.5, "cells": [{"has": "partial", "how": "Każde ćwiczenie ma opcjonalne pole tekstowe tempa (np. „3-1-1”, maks. 20 znaków). Pojawia się w nagłówku ćwiczenia podczas treningu i na liście ćwiczeń. Nie ma tempa dla pojedynczej serii ani metronomu/timera tempa.", "fb": "", "src": ["lib/seed.ts:Exercise.tempo", "app/exercise/[id].tsx", "components/ActiveWorkout.tsx:headMeta"]}, {"has": "no", "how": "Brak pola tempa w udokumentowanych polach serii ani w kolumnach eksportu CSV; recenzja w Google Play z 2026 od użytkownika Premium prosi o wbudowane pole tempa.", "fb": "", "src": ["https://github.com/DuarteSantos8/openGym/issues/302", "https://play.google.com/store/apps/details?id=io.strongapp.strong"]}, {"has": "unknown", "how": "Brak pola tempa w schemacie serii API ani w centrum pomocy.", "fb": "", "src": ["https://api.hevyapp.com/docs/"]}, {"has": "unknown", "how": "Nie znaleziono pola tempa w centrum pomocy (sprawdzono 99 artykułów).", "fb": "", "src": ["https://help.fitbod.me/hc/en-us/articles/30721437384215-How-to-Navigate-the-Exercise-Details-Screen"]}, {"has": "unknown", "how": "Brak udokumentowanego pola tempa.", "fb": "", "src": ["https://alphaprogression.com/en/blog/alpha-progression-guide"]}, {"has": "partial", "how": "W Liftoscript nie ma pola tempa ani timera tempa; tempo można zapisać tylko jako opis ćwiczenia (Markdown „//”) lub etykietę serii (maks. 8 znaków).", "fb": "App Store 2026-06 (5*): użytkownik trzyma „tempa, cele RIR ... wszystko” w tekście Liftoscript. https://itunes.apple.com/us/rss/customerreviews/id=1661880849/sortBy=mostRecent/json", "src": ["https://www.liftosaur.com/doc/liftoscript"]}, {"has": "no", "how": "W help center nie znaleziono pola tempa ani timera tempa; użytkownicy o to proszą.", "fb": "App Store 2026-07 (5*): „potrzebny tylko timer tempa z fazą koncentryczną i ekscentryczną”. https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json", "src": ["https://help.strengthlog.com/help-article/how-to-record-a-workout/", "https://itunes.apple.com/us/rss/customerreviews/id=1434229662/sortBy=mostRecent/json"]}, {"has": "unknown", "how": "Tylko własny marketingowy listicle JEFIT twierdzi, że w wersji darmowej jest logowanie tempa; nie znaleziono w FAQ, tekstach sklepowych ani postach produktowych.", "fb": "", "src": ["https://www.jefit.com/blog/best-strength-training-apps-for-2026-7-options-tested-by-lifters"]}, {"has": "unknown", "how": "Nie udokumentowano.", "fb": "", "src": ["https://www.boostcamp.app/workout-tracker"]}, {"has": "unknown", "how": "Nie udokumentowano pola tempa.", "fb": "", "src": ["https://smartgymapp.com/features.html"]}, {"has": "unknown", "how": "Nie udokumentowano pola tempa.", "fb": "", "src": ["https://caliberstrong.freshdesk.com/support/solutions/articles/48001257776-caliber-app-user-guide"]}]}, {"id": "log_empty_workout", "area": "log", "areaPL": "Logowanie treningu", "label": "Pusty trening", "others": 8.5, "cells": [{"has": "yes", "how": "Przycisk „Pusty trening” na karcie Trening rozpoczyna trening bez szablonu; ćwiczenia dodaje się selektorem.", "fb": "", "src": ["lib/store.ts:startEmpty", "app/(tabs)/index.tsx:Home"]}, {"has": "yes", "how": "Rozpocznij Empty Workout lub szablon z zakładki Start Workout; po zakończeniu pustego treningu aplikacja proponuje zapisanie go jako nowego szablonu.", "fb": "", "src": ["https://help.strongapp.io/article/229-my-first-workout", "https://help
