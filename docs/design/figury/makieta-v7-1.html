const EXERCISES_DB = {};
for (const [exName, rawObj] of Object.entries(RAW_CATALOG)) {
 EXERCISES_DB[exName] = compileCatalogEntry(exName, rawObj);
}
const allExerciseNames = Object.keys(EXERCISES_DB);

for (const exName of allExerciseNames) {
 const ex = EXERCISES_DB[exName];
 let bestSwap = allExerciseNames[0], bestScore = -1;
 for (const candName of allExerciseNames) {
  if (candName === exName) continue;
  const cand = EXERCISES_DB[candName];
  let score = 0;
  ex.muscles.primary.forEach(m => {
   if (cand.muscles.primary.includes(m)) score += 12;
   else if (cand.muscles.secondary.includes(m)) score += 4;
  });
  ex.muscles.secondary.forEach(m => {
   if (cand.muscles.primary.includes(m) || cand.muscles.secondary.includes(m)) score += 3;
  });
  if (cand.pattern === ex.pattern) score += 6;
  if (cand.rig === ex.rig) score += 4;
  if (cand.subVariant === ex.subVariant) score += 5;
  if (score > bestScore) { bestScore = score; bestSwap = candName; }
 }
 ex.e2DefaultSwap = bestSwap;
}

function evaluateMuscleTension(u, phase, curveType = 'stretch-peak', isPrimary = true) {
 const minOp = isPrimary ? 0.32 : 0.18, maxOp = isPrimary ? 0.90 : 0.48;
 let act = u;
 if (curveType === 'stretch-peak') act = Math.pow(u, 1.25);
 else if (curveType === 'lockout-peak') act = Math.pow(u, 2.0);
 else if (curveType === 'mid-range') act = 0.25 + 0.75 * Math.sin(u * Math.PI);

function solveIK(A, B, L1, L2, hintPt) {

 const d = clamp(rawDist, Math.abs(L1 - L2) + 0.01, (L1 + L2) * 0.999);

  return `<g transform="translate(${pos[0].toFixed(1)}, ${pos[1].toFixed(1)})"><circle cx="0" cy="0" r="${radius}" fill="var(--weight-dark)" fill-opacity="${dashed ? 0.22 : 0.72}" stroke="var(--bench-frame)" stroke-width="5" ${dashed ? 'stroke-dasharray="18 6"' : ''}/><circle cx="0" cy="0" r="7" fill="var(--bg-card)" stroke="var(--bench-frame)" stroke-width="3"/></g>`;
 },
 dumbbellSide(pos, angleDeg = 0) {
  return `<g transform="translate(${pos[0].toFixed(1)}, ${pos[1].toFixed(1)}) rotate(${angleDeg.toFixed(1)})"><rect x="-20" y="-3" width="40" height="6" rx="2" fill="var(--weight-dark)"/><rect x="-16" y="-11" width="5.5" height="22" rx="2" fill="var(--weight-mid)"/><rect x="10.5" y="-11" width="5.5" height="22" rx="2" fill="var(--weight-mid)"/><rect x="-22" y="-15" width="5.5" height="30" rx="2" fill="var(--weight-dark)"/><rect x="16.5" y="-15" width="5.5" height="30" rx="2" fill="var(--weight-dark)"/></g>`;
 },
 kettlebellSide(wristPos) {
  return `<g transform="translate(${wristPos[0].toFixed(1)}, ${wristPos[1].toFixed(1)})"><path d="M -8 0 C -11 -12, 11 -12, 8 0" fill="none" stroke="var(--bench-frame)" stroke-width="4.5" stroke-linecap="round"/><circle cx="0" cy="14" r="14.5" fill="var(--weight-dark)" stroke="var(--bench-frame)" stroke-width="2.5"/></g>`;
 },
 resistanceBand(anchorPt, gripPt, tensionU) {
  const t = clamp(tensionU, 0, 1);
  const r = Math.round(lerp(67, 239, t)), g = Math.round(lerp(176, 68, t)), b = Math.round(lerp(111, 68, t));
  return `<g><circle cx="${anchorPt[0].toFixed(1)}" cy="${anchorPt[1].toFixed(1)}" r="6" fill="var(--bench-frame)"/><line x1="${anchorPt[0].toFixed(1)}" y1="${anchorPt[1].toFixed(1)}" x2="${gripPt[0].toFixed(1)}" y2="${gripPt[1].toFixed(1)}" stroke="rgb(${r},${g},${b})" stroke-width="${lerp(6.5, 3.6, t).toFixed(1)}" stroke-linecap="round"/></g>`;
 },
 cablePulley(originPt, wristPt) {
  return `<g><line x1="${originPt[0].toFixed(1)}" y1="${originPt[1].toFixed(1)}" x2="${wristPt[0].toFixed(1)}" y2="${wristPt[1].toFixed(1)}" stroke="var(--traj-line)" stroke-width="3" stroke-linecap="round"/><circle cx="${originPt[0].toFixed(1)}" cy="${originPt[1].toFixed(1)}" r="10" fill="var(--weight-dark)" stroke="var(--bench-frame)" stroke-width="3"/><circle cx="${originPt[0].toFixed(1)}" cy="${originPt[1].toFixed(1)}" r="3.5" fill="var(--bg-card)"/></g>`;
 },
 adjustableBench(hipPt, benchAngleDeg = 0) {
  if (benchAngleDeg === null) return '';
  const hx = hipPt[0], hy = hipPt[1] + 15;
  const pivotX = hx + 12, pivotY = hy + 7;
  const distAlongPad = 105;
  const aRad = rad(benchAngleDeg);
  const supTopX = pivotX + distAlongPad * Math.cos(aRad);
  const supTopY = pivotY - distAlongPad * Math.sin(aRad) + 4;
  const supHeight = Math.max(12, 390 - supTopY);
  return `
   <g>
    <rect x="${hx - 45}" y="${hy}" width="62" height="14" rx="5" fill="var(--bench-pad)"/>
    <rect x="${hx - 25}" y="${hy + 14}" width="11" height="${390 - hy - 14}" fill="var(--bench-frame)"/>
    <rect x="${(supTopX - 5.5).toFixed(1)}" y="${supTopY.toFixed(1)}" width="11" height="${supHeight.toFixed(1)}" fill="var(--bench-frame)"/>
    <g transform="translate(${pivotX}, ${pivotY}) rotate(${-benchAngleDeg})">
     <rect x="0" y="-7" width="165" height="14" rx="5" fill="var(--bench-pad)"/>
    </g>
   </g>
  `;
 },
 autoLoadAtPoint(cfg, wristPt, u, defaultOrigin = [265, 386], forceDashed = null, elbowPt = null) {
  const ls = cfg.loadSource, req = cfg.requires || [], n = cfg.name.toLowerCase();
  let extra = '';
  if (ls === 'smith' || req.includes('smith')) {
   extra += `<line x1="${wristPt[0].toFixed(1)}" y1="45" x2="${wristPt[0].toFixed(1)}" y2="390" stroke="var(--bench-frame)" stroke-width="6" opacity="0.55"/>`;
  }
  if (req.includes('landmine') || req.includes('t_bar')) {
   extra += `<line x1="425" y1="388" x2="${wristPt[0].toFixed(1)}" y2="${wristPt[1].toFixed(1)}" stroke="var(--bench-frame)" stroke-width="7" stroke-linecap="round"/><circle cx="425" cy="386" r="8" fill="var(--weight-dark)"/>`;
  }
  if (req.includes('chains')) {
   extra += `<line x1="${wristPt[0].toFixed(1)}" y1="${wristPt[1].toFixed(1)}" x2="${wristPt[0].toFixed(1)}" y2="388" stroke="var(--weight-mid)" stroke-width="4" stroke-dasharray="4 3"/>`;
  }
  if (req.includes('suspension') || req.includes('rings')) {
   extra += `<line x1="${wristPt[0].toFixed(1)}" y1="45" x2="${wristPt[0].toFixed(1)}" y2="${wristPt[1].toFixed(1)}" stroke="var(--traj-line)" stroke-width="3" stroke-dasharray="6 2"/>`;
  }
  if (ls === 'band' || req.includes('bands')) return extra + this.resistanceBand(defaultOrigin, wristPt, u);
  if (ls === 'cable' || req.some(r => r.startsWith('cable'))) {
   const isBehind = n.includes('bayesian') || n.includes('pull through') || n.includes('overhead') || n.includes('standing cable chest');
   const orig = (req.includes('cable.high') || req.includes('lat_pulldown') || n.includes('face pull') || n.includes('high'))
    ? [385, 78]
    : (req.includes('cable.mid') ? [415, 225] : (isBehind ? [115, 380] : [385, 380]));
   return extra + this.cablePulley(orig, wristPt);
  }
  if (ls === 'kettlebell' || req.includes('kb')) return extra + this.kettlebellSide(wristPt);
  if (ls === 'barbell' || ls === 'ez_bar' || ls === 'smith' || ls === 'trap_bar') {
   const isDashed = forceDashed !== null ? forceDashed : (cfg.rig === 'hinge' || cfg.rig === 'horizontalPull' || cfg.rig === 'hipThrust');
   return extra + this.barbellSide(wristPt, 38, isDashed);
  }
  if (ls === 'dumbbell' || req.includes('db')) {
   const armAng = elbowPt ? ((Math.atan2(wristPt[1] - elbowPt[1], wristPt[0] - elbowPt[0]) * 180) / Math.PI - 90) : 0;
   return extra + this.dumbbellSide(wristPt, armAng);
  }
  if (req.includes('med_ball') || req.includes('stability_ball') || req.includes('atlas_stones')) {
   const r = req.includes('stability_ball') ? 32 : 16;
   return extra + `<circle cx="${wristPt[0].toFixed(1)}" cy="${wristPt[1].toFixed(1)}" r="${r}" fill="var(--weight-mid)" stroke="var(--bench-frame)" stroke-width="3"/>`;
  }
  return extra;
 }
};

function renderSideMuscles(cfg, muscles, u, phase = 'eccentric') {
 if (!muscles) return '';
 const { hip, shoulder, midSpine, kneeNear, ankleNear, elbowNear, wristNear, chestDir, thighFrontDir, shankFrontDir, armFrontDir, faultHighlightMuscle, faultSeverity = 1 } = cfg;
 const pri = muscles.primary || [], sec = muscles.secondary || [];
 const getRole = name => pri.includes(name) ? 'pri' : (sec.includes(name) ? 'sec' : null);
 const getColOp = (key, role) => ({
  col: role === 'pri' ? 'var(--muscle-pri)' : 'var(--muscle-sec)',
  op: evaluateMuscleTension(u, phase, DEFAULT_TENSION_CURVES[key] || 'stretch-peak', role === 'pri'),
  isPri: role === 'pri'
 });

 let mSvg = '';
 const addSeg = (key, A, B, fProf, bProf, hint) => {
  const r = getRole(key);
  if (!r) return;
  const { col, op, isPri } = getColOp(key, r);
  mSvg += drawMuscleSegmentGPU(A, B, fProf, bProf, col, op, hint, isPri);
 };
 const spinePt = midSpine || [(hip[0] + shoulder[0]) * 0.5, (hip[1] + shoulder[1]) * 0.5];

 addSeg('quads', hip, kneeNear, P_MUSCLE.quadsFront, P_MUSCLE.quadsBack, thighFrontDir);
 addSeg('hamstrings', hip, kneeNear, P_MUSCLE.hamsFront, P_MUSCLE.hamsBack, thighFrontDir);
 addSeg('calves', kneeNear, ankleNear, P_MUSCLE.calvesFront, P_MUSCLE.calvesBack, shankFrontDir);
 addSeg('chest', hip, shoulder, P_MUSCLE.chestFront, P_MUSCLE.chestBack, chestDir);
 addSeg('lats', hip, shoulder, P_MUSCLE.latsFront, P_MUSCLE.latsBack, chestDir);
 addSeg('core', hip, shoulder, P_MUSCLE.coreFront, P_MUSCLE.coreBack, chestDir);
 addSeg('obliques', hip, shoulder, P_MUSCLE.obliquesFront, P_MUSCLE.obliquesBack, chestDir);
 addSeg('serratus', hip, shoulder, P_MUSCLE.serratusFront, P_MUSCLE.serratusBack, chestDir);
 addSeg('erectors', hip, spinePt, [[0.1, -2], [0.9, -2]], [[0.1, 15], [0.5, 14], [0.9, 13]], chestDir);
 addSeg('traps_upper', hip, shoulder, P_MUSCLE.trapsUpFront, P_MUSCLE.trapsUpBack, chestDir);
 addSeg('triceps', shoulder, elbowNear, P_MUSCLE.tricepsFront, P_MUSCLE.tricepsBack, armFrontDir);
 addSeg('biceps', shoulder, elbowNear, P_MUSCLE.bicepsFront, P_MUSCLE.bicepsBack, armFrontDir);
 addSeg('forearms', elbowNear, wristNear, P_MUSCLE.forearmsFront, P_MUSCLE.forearmsBack, armFrontDir);

 if (faultHighlightMuscle === 'lower_back' && faultSeverity > 0.08) {
  mSvg += drawMuscleSegmentGPU(hip, spinePt, [[0, -2], [1, -2]], [[0, 17], [0.5, 19], [1, 16]], 'var(--accent-red)', lerp(0.22, 0.92, clamp(faultSeverity, 0, 1)), chestDir, true);
 }

 const gRole = getRole('glutes') || getRole('abductors');
 if (gRole) {
  const { col, op, isPri } = getColOp('glutes', gRole);
  const dx = shoulder[0] - hip[0], dy = shoulder[1] - hip[1], len = Math.hypot(dx, dy) || 1;
  let nx = -dy / len, ny = dx / len;
  if (nx * chestDir[0] + ny * chestDir[1] < 0) { nx = -nx; ny = -ny; }
  const gx = (hip[0] - nx * 7.0).toFixed(1), gy = (hip[1] - ny * 7.0).toFixed(1);
  mSvg += isPri
   ? `<circle cx="${gx}" cy="${gy}" r="17" fill="${col}" fill-opacity="${(op * 0.22).toFixed(2)}"/><circle cx="${gx}" cy="${gy}" r="14" fill="${col}" fill-opacity="${op.toFixed(2)}" stroke="#ffffff" stroke-width="0.85"/>`
   : `<circle cx="${gx}" cy="${gy}" r="13.5" fill="${col}" fill-opacity="${(op * 0.75).toFixed(2)}"/>`;
 }

 const dEnd = [lerp(shoulder[0], elbowNear[0], 0.38), lerp(shoulder[1], elbowNear[1], 0.38)];
 ['delts_front', 'delts_side', 'delts_rear'].forEach(dKey => {
  const r = getRole(dKey);
  if (!r) return;
  const { col, op, isPri } = getColOp(dKey, r);
  mSvg += drawMuscleSegmentGPU(shoulder, dEnd, dKey === 'delts_rear' ? [[0,0],[1,0]] : [[0,11.5],[1,8.5]], dKey === 'delts_front' ? [[0,0],[1,0]] : [[0,11.5],[1,8.5]], col, op, armFrontDir, isPri);
 });
 return mSvg;
}

function drawHead(hipOrMid, shoulder, faceHintVec, headTiltDeg = 0) {
 const dx = shoulder[0] - hipOrMid[0], dy = shoulder[1] - hipOrMid[1], baseAng = Math.atan2(dy, dx) + rad(headTiltDeg);
 const ux = Math.cos(baseAng), uy = Math.sin(baseAng);
 let fx = -uy, fy = ux;
 if (fx * faceHintVec[0] + fy * faceHintVec[1] < 0) { fx = -fx; fy = -fy; }
 const neckA = [shoulder[0] + ux * 4, shoulder[1] + uy * 4], neckB = [shoulder[0] + ux * 20, shoulder[1] + uy * 20], headC = [shoulder[0] + ux * 26, shoulder[1] + uy * 26];
 const pt = (u, f) => [headC[0] + ux * u + fx * f, headC[1] + uy * u + fy * f];
 const facePts = [pt(-14, -12.5), pt(-2, -17.5), pt(13.5, -14.5), pt(19.5, -2), pt(16.5, 12.5), pt(6.5, 15.0), pt(1.5, 20.2), pt(-3.5, 16.0), pt(-10.5, 16.5), pt(-14.5, 6.0)];
 const hairPts = [pt(-11.5, -13.0), pt(0, -19.2), pt(14.8, -15.2), pt(20.8, -1), pt(17.8, 13.5), pt(11.5, 8.5), pt(7.0, -2.0), pt(-4.5, -7.5)];
 const ear = pt(-2, 1.5);
 const sterno1 = [shoulder[0] + ux * 4 + fx * 3, shoulder[1] + uy * 4 + fy * 3];
 return `
  ${drawSegment(neckA, neckB, [[0, 8.8], [1, 8.0]], [[0, 8.8], [1, 8.0]], 'var(--skin-near)', faceHintVec)}
  <line x1="${ear[0].toFixed(1)}" y1="${ear[1].toFixed(1)}" x2="${sterno1[0].toFixed(1)}" y2="${sterno1[1].toFixed(1)}" stroke="var(--skin-line)" stroke-width="1.3" opacity="0.5"/>
  <path data-head="${headC[0].toFixed(1)},${headC[1].toFixed(1)}" d="${smoothClosedPath(facePts, 0.22)}" fill="var(--skin-near)" stroke="var(--skin-line)" stroke-width="0.7"/>
  <circle cx="${ear[0].toFixed(1)}" cy="${ear[1].toFixed(1)}" r="4.0" fill="var(--skin-far)"/>
  <path d="${smoothClosedPath(hairPts, 0.22)}" fill="var(--shoe)"/>
 `;
}

function drawShoe(ankle, toeDirX = 1, soleAngleDeg = 0, isFar = false, isPushUpToe = false) {

function renderAthlete(cfg) {
 const {

 cfg.shoulder = shoulder;
 cfg.midSpine = midSpine;

 let svg = '';
 svg += drawSegment(hip, kneeFar, P_ANAT.thighFront, P_ANAT.thighBack, 'var(--skin-far)', thighFrontDir);
 svg += drawSegment(kneeFar, ankleFar, P_ANAT.shankFront, P_ANAT.shankBack, 'var(--skin-far)', shankFrontDir);

 }
 svg += backLayerExtra;
 svg += drawHead(midSpine, shoulder, chestDir, headTilt);
 svg += drawSegment(kneeNear, ankleNear, P_ANAT.shankFront, P_ANAT.shankBack, 'var(--skin-near)', shankFrontDir, true, 'shankNear');

 svg += drawJoint(hip, 16.5, 'var(--shorts)');
 svg += drawSegment(hip, kneeNear, P_ANAT.shortsFront, P_ANAT.shortsBack, 'var(--shorts)', thighFrontDir);
 svg += drawShoe(ankleNear, toeDirX, shoeAngleNear, false, isPushUpToe);

 if (Math.abs(spinalFlexionDeg) < 0.5) {
  svg += drawSegment(hip, shoulder, P_ANAT.trunkFront, P_ANAT.trunkBack, 'var(--shirt)', chestDir, false, 'trunk');
 } else {
  svg += drawSegment(hip, midSpine, P_ANAT.lumbarFront, P_ANAT.lumbarBack, 'var(--shirt)', chestDir, false, 'trunk');
  svg += drawJoint(midSpine, 13.8, 'var(--shirt)');
  svg += drawSegment(midSpine, shoulder, P_ANAT.thoraxFront, P_ANAT.thoraxBack, 'var(--shirt)', chestDir);
 }
 svg += drawJoint(shoulder, 13.0, 'var(--shirt)');
 svg += drawSegment(shoulder, elbowNear, P_ANAT.uarmFront, P_ANAT.uarmBack, 'var(--skin-near)', armFrontDir, true, 'uarmNear');
 svg += drawSegment(shoulder, elbowNear, P_ANAT.sleeveFront, P_ANAT.sleeveBack, 'var(--shirt-sleeve)', armFrontDir);
 svg += drawJoint(elbowNear, 7.8, 'var(--skin-near)');
 svg += drawSegment(elbowNear, wristNear, P_ANAT.farmFront, P_ANAT.farmBack, 'var(--skin-near)', armFrontDir, true, 'farmNear');
 if (showMuscles && muscles) svg += renderSideMuscles(cfg, muscles, u, phase);
 svg += drawHandSide(elbowNear, wristNear, 'var(--skin-near)');
 svg += frontLayerExtra;
 return svg;
}

function renderAtlasFrontLegProfile(cx, u, showGuides, showMuscles, isDeadlift = false, faultMode = false, ex = null) {
 const floorY = 390;
 const pri = (ex && ex.muscles && ex.muscles.primary) || [], sec = (ex && ex.muscles && ex.muscles.secondary) || [];
 const hasM = k => pri.includes(k) ? 'pri' : (sec.includes(k) ? 'sec' : null);
 const isCalf = hasM('calves') === 'pri';
 const calfLift = isCalf ? lerp(0, 18, u) : 0;

 const hipY  = isCalf ? 206 - calfLift : (isDeadlift ? lerp(248, 206, u) : lerp(206, 282, u));
 const shY   = isCalf ? 108 - calfLift : (isDeadlift ? lerp(180, 108, u) : lerp(108, 192, u));

 const footSpread = isDeadlift ? 36 : 48;
 const kneeSpread = isCalf ? 44 : (faultMode ? (isDeadlift ? lerp(36, 18, Math.sin(u * Math.PI)) : lerp(40, 20, u)) : (isDeadlift ? lerp(38, 36, u) : lerp(40, 60, u)));
 const ankleL = [cx - footSpread, floorY - 15 - calfLift], ankleR = [cx + footSpread, floorY - 15 - calfLift], kneeL = [cx - kneeSpread, kneeY], kneeR = [cx + kneeSpread, kneeY], hipL = [cx - 22, hipY], hipR = [cx + 22, hipY];

 let out = `<rect x="${cx - 165}" y="18" width="330" height="414" rx="18" fill="var(--bg-panel)" stroke="${faultMode ? 'var(--accent-red)' : 'var(--floor)'}" stroke-width="1.8"/><line x1="${cx - 135}" y1="${floorY}" x2="${cx + 135}" y2="${floorY}" stroke="var(--floor)" stroke-width="5" stroke-linecap="round"/>`;
 if (showGuides && !faultMode) {
  out += drawFloorGlowGPU(ankleL[0], floorY, 22, 4.5) + drawFloorGlowGPU(ankleR[0], floorY, 22, 4.5);
  out += drawTrajectoryCurve(cx, 98, cx, 185, cx, 272, 'var(--traj-line)', true, true);
 }

 if (!isDeadlift) {
  const barY = shY + 6;
  out += `

   ${drawSegment([cx + 72, shY + 42], [cx + 86, barY], [[0, 7.5], [1, 5.5]], [[0, 7.5], [1, 5.5]], 'var(--skin-near)', [1, 0])}
   <circle cx="${cx - 86}" cy="${barY}" r="6.5" fill="var(--skin-near)"/>
   <circle cx="${cx + 86}" cy="${barY}" r="6.5" fill="var(--skin-near)"/>
  `;
 }

 const drawCleanAnatomicalFrontLeg = (hPt, kPt, aPt, sSign) => {
  const hx = hPt[0], hy = hPt[1], kx = kPt[0], ky = kPt[1], ax = aPt[0], ay = aPt[1];
  const shankD = `M ${kx - sSign * 10.5} ${ky} C ${kx - sSign * 13.5} ${lerp(ky, ay, 0.30)}, ${ax - sSign * 8} ${lerp(ky, ay, 0.70)}, ${ax - sSign * 6} ${ay} L ${ax + sSign * 6} ${ay} C ${ax + sSign * 8} ${lerp(ky, ay, 0.70)}, ${kx + sSign * 15.5} ${lerp(ky, ay, 0.28)}, ${kx + sSign * 11} ${ky} Z`;

 // 10. Hinge
 hinge(u, uFar, cfg, showGuides, showMuscles, phaseInfo, faultMode) {
  const ankleNear = [255, FLOOR_Y - 17], barX = 286;
  const posU = cfg.topDownHinge ? 1 - u : u;
  const isRDL = cfg.topDownHinge, isSingleLeg = cfg.subVariant === 'single_leg_rdl', isClean = cfg.subVariant === 'clean', isSnatch = cfg.subVariant === 'snatch';
  const isSwing = cfg.name.includes('Swing'), isGoodMorning = cfg.name.toLowerCase().includes('good morning');
  const armLen = BONE.uarm + BONE.farm - 4;

  const stateAt = pU => {
   const sTilt = lerp(isRDL ? 4 : 12, 0, clamp(pU / 0.55, 0, 1));
   const kN = [ankleNear[0] + Math.sin(rad(sTilt)) * BONE.shank, ankleNear[1] - Math.cos(rad(sTilt)) * BONE.shank];
   const tTilt = lerp(isRDL ? -24 : -54, 0, faultMode ? Math.pow(pU, 0.45) : smoothstep(pU));
   const h = [kN[0] + Math.sin(rad(tTilt)) * BONE.thigh, kN[1] - Math.cos(rad(tTilt)) * BONE.thigh];
   const trTilt = lerp(faultMode ? 68 : 58, 2, Math.pow(pU, faultMode ? 1.7 : 1.15));
   const sh = [h[0] + Math.sin(rad(trTilt)) * BONE.trunk, h[1] - Math.cos(rad(trTilt)) * BONE.trunk];
   const cBarX = faultMode ? lerp(barX + 24, 282, pU) : lerp(barX, 278, pU * pU);
   const dyA = Math.sqrt(Math.max(80, armLen * armLen - (cBarX - sh[0]) ** 2));
   let wr;
   if (isGoodMorning) wr = [sh[0] - 2, sh[1] + 4];
   else if (isSwing) wr = [sh[0] + Math.sin(rad(lerp(-25, 85, pU))) * armLen, sh[1] + Math.cos(rad(lerp(-25, 85, pU))) * armLen];
   else if (isSnatch && pU > 0.55) { const p = (pU - 0.55) / 0.45; wr = [lerp(cBarX, sh[0], p), lerp(sh[1] + dyA, sh[1] - 116, p)]; }
   else if (isClean && pU > 0.55) { const p = (pU - 0.55) / 0.45; wr = [lerp(cBarX, sh[0] + 18, p), lerp(sh[1] + dyA, sh[1] + 10, p)]; }
   else wr = [cBarX, sh[1] + dyA];
   return { kN, h, sh, wr };
  };

  const cur = stateAt(posU), kneeNear = cur.kN, hip = cur.h, shoulder = cur.sh, wristNear = cur.wr;
  const backLegAng = isSingleLeg ? rad(lerp(76, 4, posU)) : 0;
  const kneeFar  = isSingleLeg ? [hip[0] - Math.sin(backLegAng) * BONE.thigh, hip[1] + Math.cos(backLegAng) * BONE.thigh] : [kneeNear[0] - 6, kneeNear[1] - 2];
  const ankleFar = isSingleLeg ? [kneeFar[0] - Math.sin(backLegAng) * BONE.shank, kneeFar[1] + Math.cos(backLegAng) * BONE.shank] : [249, FLOOR_Y - 17];
  const elbowNear = solveIK(shoulder, wristNear, BONE.uarm, BONE.farm, isGoodMorning ? [shoulder[0] - 45, shoulder[1] + 55] : [shoulder[0] - 20, shoulder[1] + 60]);
  const wristFar = [wristNear[0] - 5, wristNear[1] - 3], elbowFar = [elbowNear[0] - 5, elbowNear[1] - 3];
  const catBackFlex = faultMode ? lerp(34, 0, posU * posU) : 0;

  let out = `<line x1="65" y1="${FLOOR_Y}" x2="485" y2="${FLOOR_Y}" stroke="var(--floor)" stroke-width="5" stroke-linecap="round"/>`;
  if (showGuides) {
   out += `<use href="${faultMode ? '#top-cross-badge' : '#top-check-badge'}" x="180" y="52"/>${drawBreathTempoHUD(82, 54, phaseInfo, u, faultMode)}<line x1="${barX}" y1="150" x2="${barX}" y2="${FLOOR_Y}" stroke="${faultMode ? 'var(--accent-red)' : 'var(--accent-green)'}" stroke-width="2.2" stroke-dasharray="5 5"/>`;
   out += drawEquipmentPathGuide(t => stateAt(t).wr, posU, faultMode, isSwing ? 0 : 54, 0);
  }
  const bandAnchor = isGoodMorning ? [262, FLOOR_Y - 6] : [265, 386];
  out += renderAthlete({ hip, shoulder, kneeNear, ankleNear, kneeFar, ankleFar, elbowNear, wristNear, elbowFar, wristFar, chestDir: [1, 0], thighFrontDir: [1, -1], shankFrontDir: [1, 0], armFrontDir: [1, 0], toeDirX: 1, headTilt: lerp(10, 0, posU), spinalFlexionDeg: catBackFlex, frontLayerExtra: Equipment.autoLoadAtPoint(cfg, wristNear, u, bandAnchor, !isGoodMorning && !isClean && !isSnatch, elbowNear), muscles: cfg.muscles, u, phase: phaseInfo.phase, showMuscles, faultHighlightMuscle: faultMode ? 'lower_back' : null, faultSeverity: 1 - posU });
  if (showGuides) {

   out += drawJointAngleGauge(shoulder, hip, kneeNear, 28, posU > 0.85 && !faultMode, faultMode, [-42, -8]) + ((faultMode && posU < 0.88) ? renderCueIcon('cross', midSpine[0] - 26, midSpine[1] - 10, 'hinge_rounded_back') : renderCueIcon('check', hip[0] - 46, hip[1] + 22, 'hinge_neutral_back'));
  }

 // 12. Bench Press + Fly + Skullcrusher + Pullover (NAPRAWIONA POZYCJA ŁOKCIA POD NADGARSTKIEM I TOR RUCHU SPRZĘTU!)

  const ankleNear = faultMode ? [158, FLOOR_Y - 34] : [142, FLOOR_Y - 17], ankleFar = faultMode ? [146, FLOOR_Y - 34] : [128, FLOOR_Y - 17];

   } else if (cfg.subVariant === 'pullover') {

    return { el, wr: [el[0] + Math.cos(pAng - 0.25) * BONE.farm, el[1] + Math.sin(pAng - 0.25) * BONE.farm] };
   } else if (cfg.subVariant === 'fly') {

  if (showGuides) out += drawJointAngleGauge(shoulder, elbowNear, wristNear, 24, u > 0.75 && !faultMode, faultMode, [-28, 16]) + (faultMode ? renderCueIcon('cross', shoulder[0] + 10, shoulder[1], 'elbow_flare_90') : renderCueIcon('check', shoulder[0], shoulder[1], 'bench_arch_scap'));

 // 15. Vertical Pull

  const ankleNear = isCable ? [318, FLOOR_Y - 17] : [hip[0] - 26, Math.min(372, hip[1] + 132)];

 // 17. Isolation Arm / Incline Curl / Preacher Curl / Calf

   if (showGuides) out += `<use href="${faultMode ? '#top-cross-badge' : '#top-check-badge'}" x="245" y="52"/>${drawBreathTempoHUD(82, 54, phaseInfo, u, faultMode)}${drawEquipmentPathGuide(wrAt, u, faultMode, 25, 0)}`;

   const kneeNear = solveIK(hip, ankleNear, BONE.thigh, BONE.shank, [330, 260]), kneeFar = [kneeNear[0] - 6, kneeNear[1] - 2];

   out += renderAthlete({ hip, shoulder, kneeNear, ankleNear, kneeFar, ankleFar, elbowNear, wristNear, elbowFar: null, wristFar: null, chestDir: [1, 0], thighFrontDir: [0, -1], shankFrontDir: [1, 0], armFrontDir: [1, 0], toeDirX: 1, shoeAngleNear: lerp(0, -24, u), shoeAngleFar: lerp(0, -24, u), frontLayerExtra: Equipment.autoLoadAtPoint(cfg, [kneeNear[0] - 8, kneeNear[1] - 18], u, [265, 386], false, elbowNear), muscles: cfg.muscles, u, phase: phaseInfo.phase, showMuscles });

  const isCalf = cfg.subVariant === 'calf', isRaise = cfg.subVariant === 'raise', isTriceps = cfg.subVariant === 'triceps', isShrug = cfg.subVariant === 'shrug', isPreacher = cfg.subVariant === 'preacher_curl';
  const calfLift = isCalf ? lerp(0, 22, u) : 0;

 standingCore(u, uFar, cfg, showGuides, showMuscles, phaseInfo, faultMode) {

 spinalCrunch(u, uFar, cfg, showGuides, showMuscles, phaseInfo, faultMode) {

 cardioMobilityCarry(u, uFar, cfg, showGuides, showMuscles, phaseInfo, faultMode) {
  let out = `<line x1="45" y1="${FLOOR_Y}" x2="495" y2="${FLOOR_Y}" stroke="var(--floor)" stroke-width="5" stroke-linecap="round"/>`;
  if (cfg.subVariant === 'smr') {
   const rollX = lerp(225, 285, u);
   const hip = [rollX, 342], shoulder = [rollX + 95, 295], ankleNear = [rollX - 165, 355];
   const kneeNear = solveIK(hip, ankleNear, BONE.thigh, BONE.shank, [rollX - 85, 320]);
   const wristNear = [rollX + 108, 384], elbowNear = solveIK(shoulder, wristNear, BONE.uarm, BONE.farm, [rollX + 75, 355]);
   out += `<circle cx="255" cy="368" r="18" fill="var(--bench-frame)" stroke="#ffffff" stroke-width="2"/>`;
   if (showGuides) out += `<use href="#top-check-badge" x="180" y="52"/>${drawBreathTempoHUD(82, 54, phaseInfo, u, faultMode)}`;
   out += renderAthlete({ hip, shoulder, kneeNear, ankleNear, kneeFar: kneeNear, ankleFar: ankleNear, elbowNear, wristNear, elbowFar: null, wristFar: null, chestDir: [0, 1], thighFrontDir: [0, 1], shankFrontDir: [0, 1], armFrontDir: [1, 0], toeDirX: -1, muscles: cfg.muscles, u, phase: phaseInfo.phase, showMuscles });
   return out;
  }
  if (cfg.subVariant === 'stretch_seated') {
   const hip = [215, FLOOR_Y - 18], ankleNear = [382, FLOOR_Y - 16], kneeNear = solveIK(hip, ankleNear, BONE.thigh, BONE.shank, [300, 340]);
   const torsoAng = rad(lerp(12, 48, u));
   const shoulder = [hip[0] + Math.sin(torsoAng) * BONE.trunk, hip[1] - Math.cos(torsoAng) * BONE.trunk];
   const wristNear = [lerp(285, 358, u), FLOOR_Y - 28], elbowNear = solveIK(shoulder, wristNear, BONE.uarm, BONE.farm, [shoulder[0] - 10, shoulder[1] + 55]);
   if (showGuides) out += `<use href="#top-check-badge" x="180" y="52"/>${drawBreathTempoHUD(82, 54, phaseInfo, u, faultMode)}${drawJointAngleGauge(shoulder, hip, kneeNear, 28, u > 0.7, false)}`;
   out += renderAthlete({ hip, shoulder, kneeNear, ankleNear, kneeFar: kneeNear, ankleFar: ankleNear, elbowNear, wristNear, elbowFar: null, wristFar: null, chestDir: [1, 0], thighFrontDir: [0, -1], shankFrontDir: [0, -1], armFrontDir: [1, 0], toeDirX: 1, shoeAngleNear: -65, shoeAngleFar: -65, spinalFlexionDeg: lerp(6, 22, u), muscles: cfg.muscles, u, phase: phaseInfo.phase, showMuscles });
   return out;
  }
  if (cfg.subVariant === 'stretch_kneeling') {
   const kneeFar = [195, FLOOR_Y - 12], ankleFar = [115, FLOOR_Y - 14], ankleNear = [335, FLOOR_Y - 17];
   const hip = [lerp(235, 268, u), lerp(285, 298, u)];
   const shoulder = [hip[0] + 8, hip[1] - BONE.trunk];
   const kneeNear = solveIK(hip, ankleNear, BONE.thigh, BONE.shank, [380, 250]);
   const wristNear = [shoulder[0] + 18, shoulder[1] - lerp(12, 95, u)], elbowNear = solveIK(shoulder, wristNear, BONE.uarm, BONE.farm, [shoulder[0] + 45, shoulder[1] - 20]);
   if (showGuides) out += `<use href="#top-check-badge" x="180" y="52"/>${drawBreathTempoHUD(82, 54, phaseInfo, u, faultMode)}${drawJointAngleGauge(hip, kneeNear, ankleNear, 26, u > 0.7, false)}`;
   out += renderAthlete({ hip, shoulder, kneeNear, ankleNear, kneeFar, ankleFar, elbowNear, wristNear, elbowFar: null, wristFar: null, chestDir: [1, 0], thighFrontDir: [1, -1], shankFrontDir: [1, 0], armFrontDir: [1, 0], toeDirX: 1, shoeAngleFar: 75, muscles: cfg.muscles, u, phase: phaseInfo.phase, showMuscles });
   return out;
  }
  if (cfg.subVariant === 'stretch_standing') {
   const ankleNear = [258, FLOOR_Y - 17], ankleFar = [248, FLOOR_Y - 17], kneeNear = [262, ankleNear[1] - BONE.shank], kneeFar = [252, ankleFar[1] - BONE.shank];
   const hip = [255, kneeNear[1] - BONE.thigh];
   const torsoAng = rad(lerp(4, 38, u));
   const shoulder = [hip[0] + Math.sin(torsoAng) * BONE.trunk, hip[1] - Math.cos(torsoAng) * BONE.trunk];
   const wristNear = [shoulder[0] + 35, shoulder[1] + lerp(20, 75, u)], elbowNear = solveIK(shoulder, wristNear, BONE.uarm, BONE.farm, [shoulder[0] - 15, shoulder[1] + 45]);
   if (showGuides) out += `<use href="#top-check-badge" x="180" y="52"/>${drawBreathTempoHUD(82, 54, phaseInfo, u, faultMode)}${drawJointAngleGauge(shoulder, hip, kneeNear, 28, u > 0.7, false)}`;
   out += renderAthlete({ hip, shoulder, kneeNear, ankleNear, kneeFar, ankleFar, elbowNear, wristNear, elbowFar: null, wristFar: null, chestDir: [1, 0], thighFrontDir: [1, 0], shankFrontDir: [1, 0], armFrontDir: [1, 0], toeDirX: 1, muscles: cfg.muscles, u, phase: phaseInfo.phase, showMuscles });
   return out;
  }

  const isSled = cfg.subVariant === 'sled_push', isOHCarry = cfg.subVariant === 'overhead_carry', isFrontCarry = cfg.subVariant === 'front_rack_carry', isJump = cfg.subVariant === 'jump';
  const jumpY = isJump ? lerp(0, -48, Math.sin(u * Math.PI)) : 0;
  const strideNear = lerp(-24, 24, u), strideFar = lerp(24, -24, u);
  const ankleNear = [235 + strideNear, FLOOR_Y - 17 + jumpY], ankleFar = [235 + strideFar, FLOOR_Y - 17 + jumpY];
  const hip = [isSled ? 215 : 238, (isSled ? 238 : 210) + jumpY], leanDeg = isSled ? 44 : (faultMode ? 28 : 6);
  const shoulder = [hip[0] + Math.sin(rad(leanDeg)) * BONE.trunk, hip[1] - Math.cos(rad(leanDeg)) * BONE.trunk];
  const kneeNear = solveIK(hip, ankleNear, BONE.thigh, BONE.shank, [350, 280]), kneeFar = solveIK(hip, ankleFar, BONE.thigh, BONE.shank, [350, 280]);

  const wristNear = isOHCarry
   ? [shoulder[0] + 4, shoulder[1] - 116]
   : (isFrontCarry ? [shoulder[0] + 22, shoulder[1] + 18] : (isSled ? [388, 222] : [shoulder[0] + 8, shoulder[1] + BONE.uarm + BONE.farm - 6]));
  const elbowNear = solveIK(shoulder, wristNear, BONE.uarm, BONE.farm, [shoulder[0] + (isOHCarry ? -25 : 20), shoulder[1] + (isOHCarry ? -55 : 48)]);

  if (isSled) out += `<line x1="365" y1="386" x2="455" y2="386" stroke="var(--bench-frame)" stroke-width="8" stroke-linecap="round"/><line x1="388" y1="185" x2="388" y2="386" stroke="var(--bench-frame)" stroke-width="8" stroke-linecap="round"/><rect x="405" y="340" width="36" height="42" rx="4" fill="var(--weight-dark)"/>`;
  if (cfg.requires.includes('box')) out += `<rect x="335" y="310" width="75" height="80" rx="6" fill="var(--bench-pad)" stroke="var(--bench-frame)" stroke-width="2"/>`;
  if (showGuides) out += `<use href="${faultMode ? '#top-cross-badge' : '#top-check-badge'}" x="180" y="52"/>${drawBreathTempoHUD(82, 54, phaseInfo, u, faultMode)}${drawJointAngleGauge(hip, kneeNear, ankleNear, 26, !faultMode, faultMode)}`;
  out += renderAthlete({ hip, shoulder, kneeNear, ankleNear, kneeFar, ankleFar, elbowNear, wristNear, elbowFar: null, wristFar: null, chestDir: [1, 0], thighFrontDir: [1, 0], shankFrontDir: [1, 0], armFrontDir: [1, 0], toeDirX: 1, spinalFlexionDeg: faultMode ? 24 : 0, frontLayerExtra: isSled ? '' : Equipment.autoLoadAtPoint(cfg, wristNear, u, [265, 386], false, elbowNear), muscles: cfg.muscles, u, phase: phaseInfo.phase, showMuscles });
  if (showGuides) out += faultMode ? renderCueIcon('cross', hip[0] - 26, hip[1], 'hinge_rounded_back') : renderCueIcon('check', shoulder[0] - 22, shoulder[1], 'hinge_neutral_back');
  return out;
 }
};

/* ============================================================================
   7. CZYSTE API POD BRAMKĘ TESTOWĄ I SKALOWANA PORÓWNYWARKA E2
   ============================================================================ */
function renderAtlasDispatcher(atlasType, cx, u, showGuides, showMuscles, faultMode, ex) {
 const muscles = ex ? ex.muscles : null;
 if (atlasType === 'scapula') return renderAtlasScapulaProfile(cx, u, showGuides, showMuscles, false, faultMode, muscles);
 if (atlasType === 'scapula_bench') return renderAtlasScapulaProfile(cx, u, showGuides, showMuscles, true, faultMode, muscles);
 if (atlasType === 'front_squat') return renderAtlasFrontLegProfile(cx, u, showGuides, showMuscles, false, faultMode, ex);
 if (atlasType === 'front_deadlift') return renderAtlasFrontLegProfile(cx, u, showGuides, showMuscles, true, faultMode, ex);
 if (atlasType === 'back_pull') return renderAtlasBackPullProfile(cx, u, showGuides, showMuscles, faultMode, ex);
 return renderAtlasFrontUpperProfile(cx, u, showGuides, showMuscles, faultMode, muscles, ex);
}

function generateExerciseFrame(exerciseId, u, opts = {}) {
 const ex = EXERCISES_DB[exerciseId];
 if (!ex) throw new Error(`Unknown exerciseId: ${exerciseId}`);
 const {
  uFar = 1 - u, showGuides = true, showMuscles = true, faultMode = false, layout = 'dual',
  phaseInfo = { u, phase: u > 0.85 ? 'hold' : 'concentric', shortCode: `${Math.round(u * 100)}%`, label: '' }
 } = opts;

 const rigFn = RIG_ARCHETYPES[ex.rig] || RIG_ARCHETYPES.squat;
 const sideSvg = rigFn(u, uFar, ex, showGuides, showMuscles, phaseInfo, faultMode);
 const atlasU = ex.topDownHinge ? 1 - u : u;

 let svgString = '';
 if (layout === 'dual') svgString = sideSvg + renderAtlasDispatcher(ex.atlas, 710, atlasU, showGuides, showMuscles, faultMode, ex);
 else if (layout === 'side-only') svgString = sideSvg;
 else if (layout === 'atlas-only') svgString = renderAtlasDispatcher(ex.atlas, 260, atlasU, showGuides, showMuscles, faultMode, ex);

 return { exerciseId, u, faultMode, muscles: ex.muscles, svgString };
}

function renderE2ComparisonFrame(exIdA, exIdB, u, uFar, showMuscles, phaseInfo) {
 const exA = EXERCISES_DB[exIdA], exB = EXERCISES_DB[exIdB];
 const uB = (exA.startsAtBottom !== exB.startsAtBottom) ? (1 - u) : u;
 const uFarB = (exA.startsAtBottom !== exB.startsAtBottom) ? (1 - uFar) : uFar;
 const svgA = RIG_ARCHETYPES[exA.rig](u, uFar, exA, false, showMuscles, phaseInfo, false);
 const svgB = RIG_ARCHETYPES[exB.rig](uB, uFarB, exB, false, showMuscles, phaseInfo, false);
 const setA = new Set([...exA.muscles.primary, ...exA.muscles.secondary]), setB = new Set([...exB.muscles.primary, ...exB.muscles.secondary]);
 let shared = 0;
 setA.forEach(m => { if (setB.has(m)) shared++; });
 const matchPct = Math.round((shared / Math.max(1, Math.min(setA.size, setB.size))) * 100);
 return `
  <g transform="translate(8, 36) scale(0.84)">${svgA}</g>
  <line x1="450" y1="25" x2="450" y2="425" stroke="var(--floor)" stroke-width="2.5" stroke-dasharray="6 6"/>
  <g transform="translate(454, 36) scale(0.84)">${svgB}</g>
  <rect x="330" y="14" width="240" height="32" rx="16" fill="var(--accent-green)"/>
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="800">Zgodność E2: ${matchPct}% (${exA.pattern})</text>
 `;
}

/* ============================================================================
   8. BRAMKA TESTOWA v7.1 I EKSPORT WATCH
   ============================================================================ */
function runCheckFiguresGate() {
 const drawer = document.getElementById('devDrawer');
 drawer.classList.add('open');
 const t0 = performance.now();
 const sampleUs = [0, 0.25, 0.5, 0.75, 1.0];
 const allKnownMuscles = new Set(Object.keys(DEFAULT_TENSION_CURVES));
 const rigStats = {};
 let totalFrames = 0, totalE2Match = 0, errors = [];

 for (const exId of allExerciseNames) {
  const ex = EXERCISES_DB[exId];
  rigStats[ex.rig] = (rigStats[ex.rig] || 0) + 1;
  const swapEx = EXERCISES_DB[ex.e2DefaultSwap];
  if (swapEx) {
   const sA = new Set([...ex.muscles.primary, ...ex.muscles.secondary]);
   const sB = new Set([...swapEx.muscles.primary, ...swapEx.muscles.secondary]);
   let sh = 0; sA.forEach(m => { if (sB.has(m)) sh++; });
   totalE2Match += (sh / Math.max(1, Math.min(sA.size, sB.size))) * 100;
  }
  [...ex.muscles.primary, ...ex.muscles.secondary].forEach(m => {
   if (!allKnownMuscles.has(m)) errors.push(`[${exId}] Nieznana grupa mięśniowa: ${m}`);
  });
  for (const faultMode of [false, true]) {
   for (const u of sampleUs) {
    totalFrames++;
    const res = generateExerciseFrame(exId, u, { faultMode, layout: 'dual' });
    if (res.svgString.includes('NaN') || res.svgString.includes('Infinity')) {
     errors.push(`[${exId}] Wykryto NaN/Infinity dla u=${u}, faultMode=${faultMode}`);
    }
    const attrMatches = res.svgString.match(/(?:cx|cy|x1|y1|x2|y2)="(-?\d+(?:\.\d+)?)"/g) || [];
    for (const attr of attrMatches) {
     const val = parseFloat(attr.split('"')[1]);
     if (val < -45 || val > 920) {
      errors.push(`[${exId}] Atrybut poza BoundingBox: ${attr} przy u=${u}`);
      break;
     }
    }
   }
  }
 }

 const dt = performance.now() - t0;
 const usPerFrame = ((dt * 1000) / totalFrames).toFixed(1);
 const avgE2 = (totalE2Match / allExerciseNames.length).toFixed(1);
 const distStr = Object.entries(rigStats).map(([k, v]) => `${k}: ${v}`).join(' | ');

 drawer.textContent = errors.length === 0
  ? `✅ [PASS] Audyt Produkcyjny v7.1 check:figures (${dt.toFixed(1)} ms | ${usPerFrame} µs/klatkę)\n• Zwalidowano ćwiczeń: ${allExerciseNames.length} / ${allExerciseNames.length} (Osie odniesienia kątów + Tory ruchu sprzętu OK)\n• Przetestowano klatek SVG: ${totalFrames} (0 NaN/Infinity, 100% BoundingBox OK)\n• Średnia zgodność mięśniowa zamienników E2: ${avgE2}%\n• Rozkład na 18 Rigów: ${distStr}`
  : `❌ [FAIL] Błędy:\n` + errors.slice(0, 15).join('\n');
}

function exportWatchKeyframes() {
 const drawer = document.getElementById('devDrawer');
 drawer.classList.add('open');
 const f0 = generateExerciseFrame(activeKey, 0.0, { showGuides: false, showMuscles: false, layout: 'side-only' });
 const f1 = generateExerciseFrame(activeKey, 1.0, { showGuides: false, showMuscles: false, layout: 'side-only' });

 const targetSegs = ['trunk', 'thighNear', 'shankNear', 'uarmNear', 'farmNear'];
 const extractCoreSegments = svg => {
  const out = {};
  const headMatch = svg.match(/data-head="([^"]+)"/);
  if (headMatch) out.headCenter = headMatch[1].split(',').map(Number);
  for (const segName of targetSegs) {
   const m = svg.match(new RegExp(`data-seg="${segName}"\\s+d="([^"]+)"`));
   if (m) out[segName] = m[1];
  }
  return out;
 };

 const payload = {
  id: activeKey, pattern: EXERCISES_DB[activeKey].pattern, rig: EXERCISES_DB[activeKey].rig,
  tempo: EXERCISES_DB[activeKey].tempo, muscles: EXERCISES_DB[activeKey].muscles.primary,
  keyframes: { u0: extractCoreSegments(f0.svgString), u1: extractCoreSegments(f1.svgString) }
 };
 const jsonStr = JSON.stringify(payload, null, 2);
 drawer.textContent = `⌚ Eksport Keyframes v7.1 (5 segmentów + headCenter) dla targets/watch-app/ (${(jsonStr.length / 1024).toFixed(2)} KB):\n` + jsonStr;
}

/* ============================================================================
   9. OBSŁUGA UI I PĘTLA ANIMACJI
   ============================================================================ */
const exerciseSelect = document.getElementById('exerciseSelect');
const e2SwapSelect = document.getElementById('e2SwapSelect');
const sceneLayer = document.getElementById('sceneLayer');
const viewport = document.getElementById('viewport');
const mainCard = document.getElementById('mainCard');
const scrubber = document.getElementById('scrubber');
const phasePct = document.getElementById('phasePct');
const playBtn = document.getElementById('playBtn');
const tempoBadge = document.getElementById('tempoBadge');
const cueBanner = document.getElementById('cueBanner');
const cueText = document.getElementById('cueText');
const activeMusclesList = document.getElementById('activeMusclesList');

let filteredNames = [...allExerciseNames];
let activeKey = allExerciseNames[2]; // Domyślnie Incline Bench Press (sztanga), żebyś od razu widział różnicę!
let isPlaying = true;
let customTempoOverride = null;

allExerciseNames.forEach(k => {
 const opt = document.createElement('option');
 opt.value = k; opt.textContent = `Zamiennik: ${k}`;
 e2SwapSelect.appendChild(opt);
});

function populateExerciseDropdown() {
 exerciseSelect.innerHTML = '';
 filteredNames.forEach((name, idx) => {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = `${idx + 1}. ${name} [${EXERCISES_DB[name].rig}:${EXERCISES_DB[name].subVariant}]`;
  exerciseSelect.appendChild(opt);
 });
 document.getElementById('metaCount').textContent = `Wyświetlono: ${filteredNames.length} / ${allExerciseNames.length} ćwiczeń`;
 if (filteredNames.length > 0) {
  if (!filteredNames.includes(activeKey)) activeKey = filteredNames[0];
  exerciseSelect.value = activeKey;
  selectExercise(activeKey);
 }
}

function filterExercises() {
 const q = document.getElementById('searchInput').value.trim().toLowerCase();
 const pat = document.getElementById('patternFilter').value;
 filteredNames = allExerciseNames.filter(name => {
  const ex = EXERCISES_DB[name];
  const matchPat = pat === 'ALL' || ex.pattern === pat;
  const matchQ = !q || name.toLowerCase().includes(q) || ex.rig.toLowerCase().includes(q) || ex.subVariant.toLowerCase().includes(q) || ex.loadSource.toLowerCase().includes(q);
  return matchPat && matchQ;
 });
 populateExerciseDropdown();
}

function stepExercise(delta) {
 if (filteredNames.length === 0) return;
 const idx = filteredNames.indexOf(activeKey);
 const nextIdx = (idx + delta + filteredNames.length) % filteredNames.length;
 selectExercise(filteredNames[nextIdx]);
}

function selectExercise(key) {
 if (!EXERCISES_DB[key]) return;
 activeKey = key;
 exerciseSelect.value = key;
 tempoEmitter.reset();
 const ex = EXERCISES_DB[key];
 if (ex.e2DefaultSwap) e2SwapSelect.value = ex.e2DefaultSwap;
 document.getElementById('metaPattern').textContent = `Pattern: ${ex.pattern}`;
 document.getElementById('metaRig').textContent = `Archetyp Rig: ${ex.rig} (${ex.subVariant})`;
 document.getElementById('metaAtlas').textContent = `Profil 2 Atlas: ${ex.atlas}`;
 document.getElementById('metaLoad').textContent = `LoadSource: ${ex.loadSource}`;
 activeMusclesList.textContent = `Główne: ${ex.muscles.primary.join(', ')} | Pomocnicze: ${ex.muscles.secondary.join(', ')}`;
 onFaultModeToggle();
}

function onFaultModeToggle() {
 const faultMode = document.getElementById('toggleError').checked;
 const ex = EXERCISES_DB[activeKey];
 const cueId = faultMode ? ex.faultCue : ex.primaryCue;
 const cueObj = CUES_CATALOG[cueId];
 if (cueObj) {
  cueText.textContent = cueObj.text;
  cueBanner.classList.toggle('error', cueObj.isErr);
 }
}

populateExerciseDropdown();

function updateViewMode() {
 const mode = document.getElementById('viewModeSelect').value;
 e2SwapSelect.style.display = mode === 'e2-compare' ? 'inline-block' : 'none';
 if (mode === 'dual' || mode === 'e2-compare') {
  viewport.setAttribute('viewBox', '0 0 900 450');
  mainCard.classList.remove('compact-view');
 } else {
  viewport.setAttribute('viewBox', '0 0 520 450');
  mainCard.classList.add('compact-view');
 }
}

function changeTempoPreset() {
 const val = document.getElementById('tempoPresetSelect').value;
 customTempoOverride = val === 'default' ? null : val.split(',').map(Number);
 tempoEmitter.reset();
}
function togglePlay() {
 isPlaying = !isPlaying;
 playBtn.textContent = isPlaying ? '⏸ Pauza' : '▶ Odtwórz';
}
scrubber.addEventListener('input', () => { if (isPlaying) togglePlay(); });

viewport.addEventListener('click', (e) => {
 const cueGroup = e.target.closest('[data-cue-id]');
 if (!cueGroup) return;
 const cueId = cueGroup.getAttribute('data-cue-id');
 const cueObj = CUES_CATALOG[cueId];
 if (cueObj) {
  cueText.textContent = cueObj.text;
  cueBanner.classList.toggle('error', cueObj.isErr);
  tempoEmitter.speak(cueObj.text.replace('✓ ', '').replace('✕ CZĘSTY BŁĄD: ', 'Uwaga: '));
 }
});

function animate(ms) {
 const ex = EXERCISES_DB[activeKey];
 const activeTempo = customTempoOverride || ex.tempo;

 let tempoInfo, uFar = 0;
 if (isPlaying) {
  tempoInfo = tempoEmitter.update(ms, activeTempo, ex.startsAtBottom, ex.primaryCue, ex.isIsometric);
  const farInfo = tempoEmitter.computeAtTime(ms + tempoInfo.cycleMs * 0.5, activeTempo, ex.startsAtBottom, ex.isIsometric);
  uFar = farInfo.u;
  scrubber.value = Math.round(tempoInfo.u * 1000);
 } else {
  const manualU = Number(scrubber.value) / 1000;
  const romLabel = manualU > 0.88 ? 'Szczyt napięcia (100% ROM)' : (manualU < 0.12 ? 'Pozycja wyjściowa (0% ROM)' : `Zakres ruchu: ${Math.round(manualU * 100)}% ROM`);
  tempoInfo = { u: manualU, phase: manualU > 0.88 ? 'hold' : 'concentric', shortCode: `${Math.round(manualU * 100)}%`, label: `Suwak: ${romLabel}` };
  uFar = 1 - manualU;
 }

 const u = tempoInfo.u;
 phasePct.textContent = `${Math.round(u * 100)}%`;
 tempoBadge.textContent = tempoInfo.label;

 const showGuides = document.getElementById('toggleGuides').checked;
 const showMuscles = document.getElementById('toggleMuscles').checked;
 const faultMode = document.getElementById('toggleError').checked;
 const viewMode = document.getElementById('viewModeSelect').value;

 if (viewMode === 'e2-compare') {
  sceneLayer.innerHTML = renderE2ComparisonFrame(activeKey, e2SwapSelect.value, u, uFar, showMuscles, tempoInfo);
 } else {
  const frame = generateExerciseFrame(activeKey, u, { uFar, showGuides, showMuscles, faultMode, layout: viewMode, phaseInfo: tempoInfo });
  sceneLayer.innerHTML = frame.svgString;
 }
 requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
