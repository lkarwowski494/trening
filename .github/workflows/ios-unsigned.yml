# Sprawdzenie kompilacji natywnej (bez podpisu) na darmowej maszynie macOS w GitHub Actions — nie daje pliku do instalacji.
# Aplikację instalujemy tylko przez TestFlight (testflight.yml; decyzja właściciela 09.10.2026, docs/18 — paczka do instalacji
# z komputera i podpis ad hoc usunięte). Uruchamianie: zakładka Actions → "iOS — kompilacja" → Run workflow.
#
# Audyt 0.8.1: Xcode wybierany jawnie (od T-051: najnowszy Xcode 26.x z obrazu — scripts/ci/select-xcode.sh; wcześniej 16.2
# dla SDK 52), xcbeautify zamiast nieistniejącego xcpretty, pipefail zamiast „|| true” (błąd kompilacji nie jest już ukrywany), log kompilacji jako
# artefakt przy porażce, sprawdzenie, że binarka, bundle JS i widżet istnieją.
name: iOS — kompilacja
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # SDK 56+ wymaga Xcode 26.4+, a macos-15 ma najwyżej 26.3 — od SDK 56 macos-26 (docs/13, B5). Obraz 20260907:
    # Xcode 26.0.1 … 26.4.1, 26.5, 26.6 (domyślny); wybierany jawnie najnowszy 26.x (26.6, SDK iOS 26.5).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.x
        # Od SDK 54 buildy do App Store Connect / TestFlight tylko z Xcode 26+, od SDK 56 Expo wymaga 26.4+. Najnowszy 26.x
        # z obrazu; brak — błąd z listą dostępnych.
        run: bash scripts/ci/select-xcode.sh 26
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checks (TypeScript, tłumaczenia, testy logiki)
        run: npm run typecheck && npm run check:i18n && npm test -- --maxWorkers=2  # 7 GB RAM na maszynie — mniej procesów Jesta
      - name: Natywna konfiguracja (warstwa D planu testów — runda 58)
        run: npm run verify:native
      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Build number = numer przebiegu (aplikacja i widżet muszą mieć ten sam CFBundleVersion)
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/Trening/Info.plist
      - name: Install pods
        run: cd ios && pod install
      - name: Platforma iOS zgodna z SDK wybranego Xcode (pobranie tylko, gdy jej brak)
        run: bash scripts/ci/ensure-ios-platform.sh
      - name: Build (no code signing)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -workspace Trening.xcworkspace -scheme Trening -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee xcodebuild.log | xcbeautify
          APP=build/Build/Products/Release-iphoneos/Trening.app
          test -f "$APP/Trening" && test -f "$APP/main.jsbundle" && test -d "$APP/PlugIns/RestWidget.appex"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          retention-days: 1
          path: ios/xcodebuild.log
