# Wgranie zrzutów ekranu sklepu (iPhone, opcjonalnie Apple Watch; wszystkie lokalizacje) z artefaktów workflowów `store-screenshots.yml` i `watch-sim.yml`
# do edytowalnej wersji aplikacji w App Store Connect przez API (decyzja właściciela 25.10.2026, D2 w docs/48; skrypt scripts/asc/zrzuty.mjs, interfejs App Asset Library).
# Tylko ręcznie. Tryb dry-run (domyślny): tylko odczyt — lista, co zostałoby wgrane; job bez środowiska (sekrety repozytorium, jak asc-metadane.yml).
# Tryb apply: osobny job w środowisku `release` (zatwierdzenie właściciela, jak testflight.yml, asc-metadane.yml i asc-iap-localizations.yml; M1-048, DEC-06 a);
# wgrywa i układa zrzuty, nie usuwa, pomija grupy, które mają już zrzuty.
# Tryb „zamień” (decyzja właściciela 15.11.2026, W-23, D2 w docs/48): zamien-podglad = tylko lista (co zostałoby usunięte i wgrane), zamien-zapis = za środowiskiem `release`
# usuwa placementy zrzutów grup wybranych lokalizacji (wejścia `lokalizacja` + `zrodlo`, wymagane przy zapisie; jedno źródło na przebieg) i wgrywa nowe z plików;
# obrazów biblioteki nie usuwa. Od 16.11.2026 (KO-082, zmienia KO-077) `lokalizacja` to jeden kod, lista po przecinku (np. pl,en-US,de-DE) albo `wszystkie`; lokalizacje idą kolejno,
# błąd zatrzymuje przebieg i wypisuje stan (ukończone / przerwana / nietknięte); ponowne uruchomienie z tą samą listą jest bezpieczne. Model L-001: pierwszy zapis na jednym elemencie. Bez nowych sekretów i uprawnień. Wyjątek od L-001 dla workflowów uruchamianych tylko ręcznie (decyzja 25.10.2026):
# scalenie przed przebiegiem dowodowym, pierwszy przebieg to dry-run, przy porażce cofnięcie.
# Sekrety jak w testflight.yml: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (bez nowych). Repozytorium jest publiczne: logi bez identyfikatorów klucza
# (maskowanie), klucz tylko w RUNNER_TEMP i usuwany zawsze; adresy wgrywania Apple nie trafiają do logu.
name: ASC zrzuty ekranu
on:
  workflow_dispatch:
    inputs:
      tryb:
        description: 'dry-run = tylko lista, co zostałoby wgrane; apply = wgraj i ułóż (nie usuwa; wymaga zatwierdzenia release); zamien-podglad = lista, co zostałoby usunięte i wgrane; zamien-zapis = usuń zrzuty wybranej grupy i wgraj nowe (wymaga lokalizacji; zatwierdzenie release)'
        type: choice
        options: [dry-run, apply, zamien-podglad, zamien-zapis]
        default: dry-run
      zrzuty_z_przebiegu:
        description: 'Numer przebiegu store-screenshots.yml z artefaktem sklep-zrzuty-ramki (żyje 3 dni)'
        required: true
        type: string
      rozmiar:
        description: 'Który rozmiar iPhone wgrać: 6.9 (1320 × 2868, wystarcza — Apple skaluje w dół) albo 6.3 (1206 × 2622)'
        type: choice
        options: ['6.9', '6.3']
        default: '6.9'
      zegarek_z_przebiegu:
        description: 'Numer przebiegu watch-sim.yml z artefaktem zegarek-zrzuty (opcjonalnie; pusty = bez zegarka)'
        required: false
        type: string
        default: ''
      jezyki:
        description: 'Tylko te języki aplikacji, np. cs albo cs,en (kody katalogów artefaktu; pusty = wszystkie) — do przebiegu dowodowego'
        required: false
        type: string
        default: ''
      lokalizacja:
        description: 'Tryb zamień: kod lokalizacji sklepu (np. pl), lista po przecinku (np. pl,en-US,de-DE) albo słowo wszystkie (wszystkie lokalizacje, dla których artefakt ma zrzuty wybranego źródła) — wymagane przy zamien-zapis'
        required: false
        type: string
        default: ''
      zrodlo:
        description: 'Tryb zamień: typ wyświetlacza (źródło zrzutów) — iphone albo zegarek'
        type: choice
        options: [iphone, zegarek]
        default: iphone
permissions:
  contents: read
  actions: read
concurrency:
  group: asc-zrzuty
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: sklep-zrzuty-ramki
          path: sklep-ramki
          run-id: ${{ inputs.zrzuty_z_przebiegu }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.zegarek_z_przebiegu != '' }}
        with:
          name: zegarek-zrzuty
          path: zegarek-zrzuty
          run-id: ${{ inputs.zegarek_z_przebiegu }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Klucz API do pliku tymczasowego (maskowany)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || { echo "::error::Brak sekretu $v (docs/15 — kroki właściciela)"; exit 1; }; done
          echo "::add-mask::$ASC_KEY_ID"; echo "::add-mask::$ASC_ISSUER_ID"
          printf '%s\n' "$ASC_KEY_P8" | while IFS= read -r line; do case "$line" in -----*) ;; *) [ ${#line} -ge 20 ] && echo "::add-mask::$line" ;; esac; done; true
          umask 077; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Plan (tylko odczyt)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ROZMIAR: ${{ inputs.rozmiar }}
          JEZYKI: ${{ inputs.jezyki }}
          TRYB: ${{ inputs.tryb }}
          LOKALIZACJA: ${{ inputs.lokalizacja }}
          ZRODLO: ${{ inputs.zrodlo }}
        run: |
          set -o pipefail
          if [ "$TRYB" = zamien-zapis ] && [ -z "$LOKALIZACJA" ]; then echo "::error::zamien-zapis wymaga wejścia lokalizacja (kod, lista po przecinku albo wszystkie)"; exit 1; fi
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          ARGS=(--iphone "sklep-ramki/$ROZMIAR" --dry-run)
          case "$TRYB" in
            zamien-podglad|zamien-zapis)
              ARGS+=(--zamien --zrodlo "$ZRODLO")
              [ -n "$LOKALIZACJA" ] && ARGS+=(--lokalizacja "$LOKALIZACJA");;
          esac
          [ -d zegarek-zrzuty ] && ARGS+=(--zegarek zegarek-zrzuty)
          [ -n "$JEZYKI" ] && ARGS+=(--jezyki "$JEZYKI")
          node scripts/asc/zrzuty.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Usunięcie klucza z maszyny
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  zapis:
    needs: plan
    if: ${{ inputs.tryb == 'apply' || inputs.tryb == 'zamien-zapis' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: sklep-zrzuty-ramki
          path: sklep-ramki
          run-id: ${{ inputs.zrzuty_z_przebiegu }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.zegarek_z_przebiegu != '' }}
        with:
          name: zegarek-zrzuty
          path: zegarek-zrzuty
          run-id: ${{ inputs.zegarek_z_przebiegu }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Klucz API do pliku tymczasowego (maskowany)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || { echo "::error::Brak sekretu $v (docs/15 — kroki właściciela)"; exit 1; }; done
          echo "::add-mask::$ASC_KEY_ID"; echo "::add-mask::$ASC_ISSUER_ID"
          printf '%s\n' "$ASC_KEY_P8" | while IFS= read -r line; do case "$line" in -----*) ;; *) [ ${#line} -ge 20 ] && echo "::add-mask::$line" ;; esac; done; true
          umask 077; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Wgranie zrzutów (apply nie usuwa; zamien-zapis usuwa tylko zrzuty wybranej grupy)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ROZMIAR: ${{ inputs.rozmiar }}
          JEZYKI: ${{ inputs.jezyki }}
          TRYB: ${{ inputs.tryb }}
          LOKALIZACJA: ${{ inputs.lokalizacja }}
          ZRODLO: ${{ inputs.zrodlo }}
        run: |
          set -o pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          ARGS=(--iphone "sklep-ramki/$ROZMIAR" --apply)
          case "$TRYB" in
            zamien-zapis)
              ARGS+=(--zamien --zrodlo "$ZRODLO")
              [ -n "$LOKALIZACJA" ] && ARGS+=(--lokalizacja "$LOKALIZACJA");;
          esac
          [ -d zegarek-zrzuty ] && ARGS+=(--zegarek zegarek-zrzuty)
          [ -n "$JEZYKI" ] && ARGS+=(--jezyki "$JEZYKI")
          node scripts/asc/zrzuty.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Usunięcie klucza z maszyny
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
