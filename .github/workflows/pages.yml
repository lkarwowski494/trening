# Strona aplikacji (polityka prywatności, wsparcie): GitHub Pages z katalogu site/ przez Actions (12.10.2026, audyt przed App Store, F2).
# Publikowany jest wyłącznie site/ — nie docs/. Bez sekretów; token tylko do odczytu treści i wdrożenia Pages.
name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
