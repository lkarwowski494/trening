# Instalacja „ad hoc” na iPhonie BEZ zużywania limitu buildów Expo (decyzja 03.10.2026: build to ostateczność,
# 15 buildów iOS/mies. w darmowym planie Expo dzielą 3 aplikacje). Repozytorium publiczne (ADR-031), więc maszyna macOS
# w GitHub Actions jest darmowa: kompilacja odbywa się tutaj (`eas build --local`, te same certyfikaty i profile z EAS),
# a do Expo trafia tylko gotowy plik (`eas upload`), który daje link do instalacji, jak przy buildzie w chmurze.
#
# Uruchamianie: Actions → „iPhone (lokalnie, bez limitu Expo)” → Run workflow (gałąź do wyboru w polu „Use workflow from”).
# Wymagany sekret: EXPO_TOKEN. Nowe urządzenia rejestruje się osobno (T-061) — ten workflow używa profilu, który już jest.
name: iPhone (lokalnie, bez limitu Expo)
on:
  workflow_dispatch:
    inputs:
      wyslij:
        description: 'Wyślij plik do Expo i daj link do instalacji (nie = tylko sprawdź, czy build przechodzi)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: iphone-local
  cancel-in-progress: false
env:
  EAS_CLI: 24.8.0
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  # eas-cli 24.8.0 wysyła do Apple odrzucany PATCH uprawnień (expo/eas-cli#3986); uprawnienia (HealthKit) są już włączone.
  EXPO_NO_CAPABILITY_SYNC: '1'
  # Logi są publiczne: UDID z listy urządzeń profilu zastępujemy znacznikiem (jak w iphone-eas.yml).
  UDID_SED: 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{16}/<UDID>/g; s/(^|[^0-9A-Za-z])[0-9a-fA-F]{40}([^0-9A-Za-z]|$)/\1<UDID>\2/g; s/(^|[^0-9A-Za-z])[0-9a-fA-F]{40}([^0-9A-Za-z]|$)/\1<UDID>\2/g'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.x
        # SDK 54 (T-051): najnowszy Xcode 26.x z obrazu macos-15 — `eas build --local` buduje Xcode wybranym na tej maszynie
        # (obraz z eas.json dotyczy tylko buildów w chmurze Expo). Build z Xcode 26 nadaje się też do App Store Connect.
        run: bash scripts/ci/select-xcode.sh 26
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Sekret
        run: '[ -n "$EXPO_TOKEN" ] || { echo "::error::Brak sekretu EXPO_TOKEN"; exit 1; }'
      - run: npm ci
      - name: Testy (jak w buildzie w chmurze)
        run: npm run typecheck && npm run check:i18n && npm test -- --maxWorkers=3
      - name: Projekt Expo (połączenie po nazwie)
        run: npx --yes eas-cli@$EAS_CLI init --non-interactive --force
      - name: Platforma iOS zgodna z SDK wybranego Xcode (pobranie tylko, gdy jej brak)
        # Bez niej xcodebuild nie znajduje celu „Any iOS Device” (przebieg 37123785083 na Xcode 16.2: „iOS 18.2 is not installed”).
        # Dla Xcode 26.2/26.3 obraz ma iOS 26.2, więc zwykle nic nie jest pobierane.
        run: bash scripts/ci/ensure-ios-platform.sh
      - name: Build na tej maszynie (eas build --local)
        run: |
          set -o pipefail
          mkdir -p build
          npx --yes eas-cli@$EAS_CLI build -p ios --profile adhoc --local --non-interactive --output build/Trening.ipa 2>&1 | sed -E "$UDID_SED"
          test -s build/Trening.ipa
          ls -la build/Trening.ipa
          unzip -l build/Trening.ipa | grep -E "Payload/[^/]+\.app/(Info\.plist|embedded\.mobileprovision)$|PlugIns/[^/]+\.appex/$" || { echo "::error::IPA bez Info.plist, profilu albo rozszerzenia widżetu"; exit 1; }
      - name: Link do instalacji (eas upload — bez buildu w chmurze)
        if: inputs.wyslij
        run: |
          set -o pipefail
          npx --yes eas-cli@$EAS_CLI upload -p ios --build-path build/Trening.ipa --json --non-interactive > upload.json 2> >(sed -E "$UDID_SED" >&2)
          cat upload.json | sed -E "$UDID_SED"
          URL=$(node -e "const j=require('./upload.json'); const s=JSON.stringify(j); const m=s.match(/https:\/\/expo\.dev\/[^\"]+/); console.log(m?m[0]:'')")
          [ -n "$URL" ] || { echo "::error::eas upload nie zwrócił linku (zawartość upload.json powyżej)"; exit 1; }
          { echo "## Instalacja na iPhonie (build lokalny, bez limitu Expo)"; echo; echo "Otwórz w Safari na iPhonie i kliknij **Install**:"; echo; echo "$URL"; } >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
