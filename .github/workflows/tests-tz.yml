# Testy Jest w wielu strefach czasowych (polecenie właściciela 06.10.2026 — najpełniejsze darmowe testy automatyczne).
# Lokalnie i w verify testy biegną w Europe/Warsaw (tests/global-setup.js); tu ten sam zestaw biegnie w strefach z dużym
# przesunięciem, bez zmiany czasu, z półgodzinnym przesunięciem i z półgodzinną zmianą czasu. TZ ustawiamy przed startem
# procesu (zmiana w trakcie nie działa — global-setup.js). Listę stref pilnuje tests/matrix-time.test.ts (CI_ZONES).
# ubuntu-latest jest darmowy dla publicznego repozytorium; bez sekretów. Nocą gałęzie z NIGHTLY_REFS (jak nightly.yml — audyt TST-01).
name: tests-tz

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: tests-tz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: jest (${{ matrix.ref }}, TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tz:
          - Europe/Warsaw
          - UTC
          - America/Los_Angeles
          - Pacific/Kiritimati
          - Pacific/Pago_Pago
          - Asia/Kolkata
          - Australia/Lord_Howe
        ref: ${{ fromJSON(github.event_name == 'schedule' && (vars.NIGHTLY_REFS || '["main"]') || format('["{0}"]', github.ref_name)) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tagi i pełna historia: tests/audit-m1-050-release-log.test.ts wymaga tagów v*-b* w CI (tests/ci-tagi-jest.test.ts, 01.11.2026)
          fetch-tags: true
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: jest w strefie ${{ matrix.tz }}
        run: TZ=${{ matrix.tz }} npx jest --maxWorkers=2

  # 25.10.2026 (decyzja właściciela, docs/18; L-NNN w docs/40): zmiana czasu wypadła w nocy, a testy zależne od „teraz” padły dopiero wtedy.
  # Ten sam zestaw biegnie z zegarem przypiętym do chwili tuż po zmianie czasu (PIN_NOW — tests/pin-now.js; zegar idzie dalej): Europa jesienią i wiosną
  # (Europe/Warsaw), USA jesienią (America/Los_Angeles). Chwile są PRZYSZŁE (przejścia roku następnego, liczone — zadanie „chwile”) — dawne daty w danych testowych (2026) nie stają się „przyszłością”.
  # Pliki, które same ustawiają zegar (useFakeTimers z now / setSystemTime), są pominięte — scripts/ci/pin-wykluczenia.mjs. Bez sekretów, tylko odczyt.
  # 07-jakosc-006 (01.11.2026): chwile przypięcia NIE są wpisane na sztywno — wylicza je scripts/ci/przejscia-czasu.js z bazy stref (przejścia PRZYSZŁEGO roku),
  # więc przebieg nie wygasa po 2027. Zadanie „chwile” tylko liczy macierz (bez npm ci, bez sekretów).
  chwile:
    name: chwile zmiany czasu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lista: ${{ steps.macierz.outputs.lista }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: macierz
        run: echo "lista=$(node scripts/ci/przejscia-czasu.js macierz)" >> "$GITHUB_OUTPUT"

  zmiana-czasu:
    name: jest (${{ matrix.ref }}, ${{ matrix.strefa_chwila }})
    needs: chwile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # „strefa|chwila UTC” — jedna pozycja = jedno zadanie; lista z zadania „chwile” (Europa jesienią i wiosną, USA jesienią)
        strefa_chwila: ${{ fromJSON(needs.chwile.outputs.lista) }}
        ref: ${{ fromJSON(github.event_name == 'schedule' && (vars.NIGHTLY_REFS || '["main"]') || format('["{0}"]', github.ref_name)) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tagi i pełna historia: tests/audit-m1-050-release-log.test.ts wymaga tagów v*-b* w CI (tests/ci-tagi-jest.test.ts, 01.11.2026)
          fetch-tags: true
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: jest z zegarem przypiętym do chwili zmiany czasu
        env:
          STREFA_CHWILA: ${{ matrix.strefa_chwila }}
        run: TZ="${STREFA_CHWILA%%|*}" PIN_NOW="${STREFA_CHWILA##*|}" npx jest --maxWorkers=2 --testPathIgnorePatterns "$(node scripts/ci/pin-wykluczenia.mjs)"
