# TestFlight — testy wewnętrzne (decyzja właściciela 06.10.2026, docs/15: limit Expo na buildy lokalne wyczerpany do 01.11.2026).
# Build i podpis wyłącznie narzędziami Apple (bez Expo/EAS): xcodebuild archive z automatycznym podpisem przez klucz App Store Connect API,
# eksport z wysyłką do App Store Connect. Tester wewnętrzny (właściciel) dostaje build w aplikacji TestFlight bez recenzji Apple.
# Uruchamianie: Actions → „TestFlight (testy wewnętrzne)” → Run workflow (tylko ręcznie; sekrety niedostępne dla forków).
#
# Sekrety repozytorium (Settings → Secrets and variables → Actions) — nigdy w repo:
#   ASC_KEY_ID     — identyfikator klucza API (10 znaków)
#   ASC_ISSUER_ID  — Issuer ID (UUID z App Store Connect → Users and Access → Integrations)
#   ASC_KEY_P8     — pełna treść pliku AuthKey_XXXX.p8 (razem z liniami BEGIN/END)
# Numer buildu: BUILD_BASE + numer przebiegu tego workflow — tylko rośnie (App Store wymaga rosnących numerów). BUILD_BASE to zmienna
# repozytorium (Settings → Secrets and variables → Actions → Variables), domyślnie 1000. Licznik przebiegów liczy się osobno dla pliku
# workflow — po zmianie nazwy lub ponownym utworzeniu pliku ustaw BUILD_BASE powyżej ostatniego numeru w App Store Connect (audyt NAT-03).
name: TestFlight (testy wewnętrzne)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.x
        run: bash scripts/ci/select-xcode.sh 26
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Sekrety obecne (bez wypisywania wartości)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || { echo "::error::Brak sekretu $v (docs/15 — kroki właściciela)"; exit 1; }; done
      - run: npm ci
      - name: Testy (jak przed każdym buildem — pełne npm run verify)
        # 09.10.2026 (run 37921922549): matrix-dim-langs-routes (wtedy jeszcze jeden plik; od 12.10.2026 sześć części) przekroczył domyślny limit sterty Node na macOS (~2 GB przy 7 GB RAM maszyny;
        # na Ubuntu w tests.yml limit jest wyższy) — 3 GB na proces × 2 procesy mieści się w pamięci maszyny (Jest na 3 rdzeniach: 2 procesy robocze).
        # TST2-09 (audyt kontrolny 1): ta sama lista sprawdzeń co verify w tests.yml (wskazówki, figury, licencje, eksport iOS) — jedno źródło: package.json.
        # Przed uruchomieniem tego workflow: zielone E2E (e2e-ios.yml) na tym samym commicie (CLAUDE.md „Audyty i wydania”, pkt 2).
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm run verify
      - name: Logika zegarka — testy jednostkowe Swift (targets/watch-tests)
        run: cd targets && swift test
      - name: Straż 0.17.0 — build dla telefonu ma prawdziwy sklep i prawdziwy zegarek (bez sztucznych, które są tylko w E2E)
        run: |
          if [ -n "${EXPO_PUBLIC_STORE_FAKE:-}" ]; then echo "::error::EXPO_PUBLIC_STORE_FAKE ustawione w buildzie TestFlight"; exit 1; fi
          if [ -n "${EXPO_PUBLIC_WATCH_FAKE:-}" ]; then echo "::error::EXPO_PUBLIC_WATCH_FAKE ustawione w buildzie TestFlight"; exit 1; fi
      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Numer buildu (aplikacja, widżet i zegarek ten sam CFBundleVersion)
        # BUILD_BASE + numer przebiegu (wyrażenia GitHub Actions nie liczą — liczy powłoka)
        env:
          BUILD_BASE: ${{ vars.BUILD_BASE || '1000' }}
        run: |
          echo "BUILD_NUMBER=$((BUILD_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILD_NUMBER=$((BUILD_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"  # widoczny w „O aplikacji” (lib/version.ts)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $((BUILD_BASE + GITHUB_RUN_NUMBER))" ios/Trening/Info.plist
      - name: Install pods
        run: cd ios && pod install
      - name: Manifest prywatności (powstaje przy pod install — audyt NAT-04; ostrzeżenie, nie błąd)
        run: |
          f=$(ls ios/*/PrivacyInfo.xcprivacy 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "::warning::Brak PrivacyInfo.xcprivacy po pod install (docs/25 NAT-04)"; exit 0; fi
          for c in NSPrivacyAccessedAPICategoryFileTimestamp NSPrivacyAccessedAPICategoryUserDefaults NSPrivacyAccessedAPICategorySystemBootTime NSPrivacyAccessedAPICategoryDiskSpace; do
            grep -q "$c" "$f" || echo "::warning::$f bez kategorii $c (docs/25 NAT-04)"
          done
          echo "Manifest prywatności: $f"
      - name: Platforma iOS zgodna z SDK wybranego Xcode (pobranie tylko, gdy jej brak)
        run: bash scripts/ci/ensure-ios-platform.sh
      - name: Klucz API na dysk (dopiero po npm ci, testach, prebuild i pod install — audyt 06.10, ŚREDNIE)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: umask 077; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archiwum (bez podpisu — podpis dystrybucyjny dopiero przy eksporcie, 13.10.2026; uprawnienia osadza następny krok, 14.10.2026)
        # Świeży runner nie ma klucza prywatnego poprzedniego certyfikatu Apple Development, więc archiwum z podpisem automatycznym
        # tworzyło nowy certyfikat przy każdym przebiegu (limit -> build 1011). Certyfikat dystrybucyjny jest jeden na zespół (cloud-managed).
        run: |
          set -o pipefail
          TEAM=$(node -p "require('./app.json').expo.ios.appleTeamId")
          cd ios
          xcodebuild -workspace Trening.xcworkspace -scheme Trening -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Trening.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            2>&1 | tee xcodebuild.log | xcbeautify
      - name: Zegarek w archiwum (osadzony, ta sama wersja i numer buildu, HealthKit)
        # 0.20: cel pl.lukasz.trening.watchkitapp podpisuje się automatycznie tym samym kluczem API. Pierwszy przebieg tworzy App ID i profil zegarka —
        # jeśli Apple odmówi (HealthKit na App ID), właściciel dodaje App ID ręcznie (docs/35-zegarek-apple, latki-zegarek/README). Archiwum musi zawierać zegarek.
        run: |
          APP="$RUNNER_TEMP/Trening.xcarchive/Products/Applications/Trening.app"
          W="$APP/Watch/TreningWatch.app"
          test -d "$W" || { echo "::error::Brak zegarka w archiwum ($APP/Watch)"; exit 1; }
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$2"; }
          [ "$(pb CFBundleShortVersionString "$W/Info.plist")" = "$(pb CFBundleShortVersionString "$APP/Info.plist")" ] || { echo "::error::Wersja zegarka różni się od wersji aplikacji"; exit 1; }
          [ "$(pb CFBundleVersion "$W/Info.plist")" = "$BUILD_NUMBER" ] || { echo "::error::Numer buildu zegarka ≠ $BUILD_NUMBER"; exit 1; }
          [ "$(pb WKCompanionAppBundleIdentifier "$W/Info.plist")" = "pl.lukasz.trening" ] || { echo "::error::Zegarek wskazuje inną aplikację towarzyszącą"; exit 1; }
          # archiwum jest bez podpisu (podpis dopiero przy eksporcie), więc sprawdzamy plik uprawnień celu, nie podpis
          grep -q "com.apple.developer.healthkit" ios/.targets/TreningWatch/generated.entitlements || { echo "::error::Zegarek bez uprawnienia HealthKit (generated.entitlements)"; exit 1; }
      - name: Uprawnienia w archiwum (podpis ad hoc z plikami uprawnień — 14.10.2026, błąd Zdrowia w 0.18/1015)
        # Archiwum bez podpisu nie zawiera uprawnień (HealthKit): eksport podpisał aplikację i zegarek bez nich, więc „Pokazuj dane z Apple Health” kończyło się
        # alertem (przebieg doświadczenia 38549517589: .ipa miał tylko team-identifier). Xcode 26 nie pozwala na podpis ad hoc w archiwum (tożsamość „-” → błąd
        # „Ad Hoc code signing is not allowed with SDK”), więc osadzamy uprawnienia ręcznie: codesign -s - z plikami uprawnień celów (od środka na zewnątrz).
        # Podpis ad hoc nie tworzy certyfikatu; eksport i tak podpisuje dystrybucyjnie (cloud-managed) i zachowuje te uprawnienia (sprawdzone w tym samym przebiegu).
        # 19.10.2026: lista wymaganych (scripts/ci/required-entitlements-*.txt: HealthKit, time-sensitive) — strażnik pada także, gdy prebuild zgubi uprawnienie z pliku celu.
        run: |
          APP="$RUNNER_TEMP/Trening.xcarchive/Products/Applications/Trening.app"
          codesign --force -s - --entitlements ios/.targets/TreningWatch/generated.entitlements "$APP/Watch/TreningWatch.app"
          for x in "$APP"/PlugIns/*.appex; do codesign --force -s - "$x"; done
          codesign --force -s - --entitlements ios/Trening/Trening.entitlements "$APP"
          bash scripts/ci/check-entitlements.sh "$APP" ios/Trening/Trening.entitlements "archiwum: aplikacja" scripts/ci/required-entitlements-app.txt
          bash scripts/ci/check-entitlements.sh "$APP/Watch/TreningWatch.app" ios/.targets/TreningWatch/generated.entitlements "archiwum: zegarek" scripts/ci/required-entitlements-watch.txt
      - name: Eksport do pliku .ipa (jeszcze bez wysyłki)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KID="$ASC_KEY_ID"; ISS="$ASC_ISSUER_ID"; unset ASC_KEY_ID ASC_ISSUER_ID
          TEAM=$(node -p "require('./app.json').expo.ios.appleTeamId")
          for D in export upload; do
          cat > "$RUNNER_TEMP/ExportOptions-$D.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$D</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          done
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Trening.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" 2>&1 | tee export.log | xcbeautify
      - name: Strażnik uprawnień w .ipa (aplikacja i zegarek) — brak uprawnienia zatrzymuje przebieg przed wysyłką
        run: |
          mkdir "$RUNNER_TEMP/ipa" && (cd "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/export/*.ipa)
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
          rc=0
          bash scripts/ci/check-entitlements.sh "$APP" ios/Trening/Trening.entitlements "ipa: aplikacja" scripts/ci/required-entitlements-app.txt || rc=1
          bash scripts/ci/check-entitlements.sh "$APP/Watch/TreningWatch.app" ios/.targets/TreningWatch/generated.entitlements "ipa: zegarek" scripts/ci/required-entitlements-watch.txt || rc=1
          exit $rc
      - name: Wysyłka do App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KID="$ASC_KEY_ID"; ISS="$ASC_ISSUER_ID"; unset ASC_KEY_ID ASC_ISSUER_ID
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Trening.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" 2>&1 | tee -a export.log | xcbeautify
          echo "## TestFlight: build $BUILD_NUMBER wysłany" >> "$GITHUB_STEP_SUMMARY"
          echo "Po przetworzeniu przez Apple (zwykle 10–30 min) pojawi się w aplikacji TestFlight na iPhonie." >> "$GITHUB_STEP_SUMMARY"
      - name: Usunięcie klucza z maszyny
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Identyfikatory klucza wycięte z logów przed artefaktem (xcodebuild wypisuje pełną linię poleceń — audyt SEC-02)
        if: failure()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] || exit 0
          for f in ios/xcodebuild.log export.log; do
            [ -f "$f" ] || continue
            sed -i '' -e "s/${ASC_KEY_ID}/<KEY_ID>/g" -e "s/${ASC_ISSUER_ID}/<ISSUER_ID>/g" "$f"
            if grep -qF -e "$ASC_KEY_ID" -e "$ASC_ISSUER_ID" "$f"; then rm -f "$f"; echo "::warning::$f usunięty — maskowanie nie zadziałało"; fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testflight-logi
          retention-days: 1
          path: |
            ios/xcodebuild.log
            export.log
  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag wydania
        env:
          BUILD_BASE: ${{ vars.BUILD_BASE || '1000' }}
        run: |
          V=$(node -p "require('./app.json').expo.version")
          T="v$V-b$((BUILD_BASE + GITHUB_RUN_NUMBER))"
          git tag "$T" && git push origin "$T"
          echo "## Tag $T" >> "$GITHUB_STEP_SUMMARY"
