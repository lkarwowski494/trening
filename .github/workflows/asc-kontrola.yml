# Kontrola ustawień App Store Connect — TYLKO ODCZYT (decyzja właściciela 21.10.2026: „Super pomysl z tym workflow sprawdzajacym. Rob go.”).
# Cienka warstwa tej aplikacji: wywołuje workflow wspólny z repozytorium narzędzi studia (lkarwowski494/apps4brew-narzedzia), PRZYPIĘTY do pełnego SHA
# (nie do gałęzi — wersję narzędzia podnosimy świadomie; zmiana SHA to zmiana workflow, opisana w PR). Narzędzie i jego testy: tamto repozytorium.
# Konfiguracja aplikacji: store/asc-kontrola.json. Tylko ręcznie. Zmian w App Store Connect nie robi (żądania GET).
# Sekrety przekazane jawnie (dziedziczenie wszystkich sekretów GitHub dokumentuje dla repozytoriów jednej organizacji): tylko ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8.
name: ASC kontrola ustawień
on:
  workflow_dispatch:
    inputs:
      szczegoly:
        description: 'Dołącz szczegóły (listy terytoriów, odpowiedzi wiekowe, lokalizacje)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: asc-kontrola
  cancel-in-progress: false
jobs:
  kontrola:
    uses: lkarwowski494/apps4brew-narzedzia/.github/workflows/asc-kontrola.yml@43afe81aa37a117dd32259f6452196a1efccd0ec
    with:
      config: store/asc-kontrola.json
      szczegoly: ${{ inputs.szczegoly }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
