# Testy E2E na symulatorze iPhone'a (Maestro) — uruchamiane ręcznie przed wydaniem (Actions → „E2E iOS (symulator)”).
# Od 03.10.2026 repozytorium publiczne (ADR-031): standardowe maszyny GitHuba, także macOS, bez limitu minut. Nadal tylko ręcznie.
# Artefakty trzymane 1 dzień (publicznie widoczne dla zalogowanych użytkowników GitHuba).
# Build Release na symulator nie wymaga podpisu ani konta Apple. Wynik: zrzuty ekranu i raport jako artefakty.
name: E2E iOS (symulator)
on:
  # decyzja właściciela 06.10.2026 (wariant A): samoczynnie po wypchnięciu na main i gałęzie integracyjne (bez zmian tylko w dokumentacji)
  push:
    branches: [main, 'integration/**']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      aplikacja_z_przebiegu:
        description: 'Numer przebiegu z gotową aplikacją (pusty = zbuduj od nowa; ~30 min mniej, gdy zmieniasz tylko scenariusze .maestro)'
        required: false
        default: ''
      urzadzenie:
        description: 'Wzorzec nazwy symulatora (grep -E), np. "iPhone SE|iPhone 16e" — mały ekran; pusty = iPhone 17'
        required: false
        default: ''
      wyglad:
        description: 'Wygląd systemu symulatora: light albo dark'
        required: false
        default: 'light'
  workflow_call:  # nocny przebieg (nightly.yml, 06.10.2026): inne urządzenie i ciemny wygląd
    inputs:
      aplikacja_z_przebiegu: { type: string, required: false, default: '' }
      urzadzenie: { type: string, required: false, default: '' }
      wyglad: { type: string, required: false, default: 'light' }
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  e2e:
    runs-on: macos-26  # SDK 56+: Xcode 26.4+ (macos-15 ma najwyżej 26.3)
    permissions:
      contents: read
      actions: read
    timeout-minutes: 140  # build ~30 + symulator ~8 + 2 × strażnik 50 min (07.10.2026: scenariusz 11; 10 scenariuszy trwało 38 min); przy za małym limicie powtórzenie było ucinane bez podsumowania porażki
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.x
        # T-051: najnowszy Xcode 26.x z obrazu macos-26 — dziś 26.6 (jak ios-unsigned.yml i iphone-local.yml).
        run: bash scripts/ci/select-xcode.sh 26
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: inputs.aplikacja_z_przebiegu == ''
        run: npm ci
      - name: Generate native iOS project (expo prebuild)
        if: inputs.aplikacja_z_przebiegu == ''
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install pods
        if: inputs.aplikacja_z_przebiegu == ''
        run: cd ios && pod install
      - name: Build (Release, symulator, bez podpisu)
        if: inputs.aplikacja_z_przebiegu == ''
        run: |
          set -o pipefail
          cd ios
          xcodebuild -workspace Trening.xcworkspace -scheme Trening -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify
          test -d build/Build/Products/Release-iphonesimulator/Trening.app
      - name: Zapis aplikacji (do ponownego użycia)
        if: inputs.aplikacja_z_przebiegu == ''
        run: cd ios/build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Trening-sim.zip" Trening.app
      - uses: actions/upload-artifact@v4
        if: inputs.aplikacja_z_przebiegu == ''
        with:
          name: trening-sim-app
          path: Trening-sim.zip
          retention-days: 1
      - uses: actions/download-artifact@v4
        if: inputs.aplikacja_z_przebiegu != ''
        with:
          name: trening-sim-app
          run-id: ${{ inputs.aplikacja_z_przebiegu }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rozpakowanie aplikacji z wcześniejszego przebiegu
        if: inputs.aplikacja_z_przebiegu != ''
        run: mkdir -p ios/build/Build/Products/Release-iphonesimulator && unzip -q Trening-sim.zip -d ios/build/Build/Products/Release-iphonesimulator
      - name: Simulator
        # Obraz macos-26 (20260907) ma symulatory iOS 26.2/26.4/26.5 z iPhone 17 (bez iPhone 16) — wybieramy z wersji zgodnej
        # z SDK wybranego Xcode (dla 26.6: iOS 26.5), a gdy jej nie ma, z całej listy. Kolejność: iPhone 17, iPhone 16 (macos-15,
        # testy do SDK 54), dowolny iPhone. Wzorzec z „ (” — bez iPhone 17 Pro/17e/16e.
        env:
          WANT: ${{ inputs.urzadzenie }}
          WYGLAD: ${{ inputs.wyglad }}
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          LIST=$(xcrun simctl list devices available | awk -v h="-- iOS $SDK --" '$0 == h { f = 1; next } /^-- / { f = 0 } f')
          [ -n "$LIST" ] || { echo "Brak symulatorów iOS $SDK — wybór z całej listy"; LIST=$(xcrun simctl list devices available); }
          DEV=""
          for pat in ${WANT:+"$WANT"} "iPhone 17 \(" "iPhone 16 \(" "iPhone"; do  # WANT: wejście „urzadzenie” (nocny przebieg — mały ekran)
            DEV=$(printf '%s\n' "$LIST" | grep -m1 -E "$pat" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/' || true)  # || true: krok działa z -eo pipefail
            [ -n "$DEV" ] && break
          done
          [ -n "$DEV" ] || { echo "::error::Brak dostępnego symulatora iPhone'a"; xcrun simctl list devices available; exit 1; }
          echo "Symulator: $(printf '%s\n' "$LIST" | grep -m1 "$DEV" | sed -E 's/^ +//') (SDK symulatora $SDK)"
          echo "SIM=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          [ "$WYGLAD" = dark ] && xcrun simctl ui "$DEV" appearance dark || true  # wejście „wyglad” (nocny przebieg)
          xcrun simctl install "$DEV" ios/build/Build/Products/Release-iphonesimulator/Trening.app
      - name: Install Maestro
        # audyt 08.10.2026 (TST-11, SEC-05): wersja w logu; zmienna repozytorium MAESTRO_VERSION przypina wersję (pusta = najnowsza)
        env:
          MAESTRO_VERSION: ${{ vars.MAESTRO_VERSION }}
        run: |
          [ -n "$MAESTRO_VERSION" ] || unset MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version || true
      - name: Maestro
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000'  # świeżo uruchomiony symulator potrzebuje więcej czasu na sterownik XCTest (04.10.2026: 2× „driver not ready” przy 240 s po 8-min. rozruchu symulatora)
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          mkdir -p e2e-out
          # Jedno powtórzenie TYLKO, gdy sterownik XCTest nie wystartował (awaria maszyny przed pierwszym scenariuszem — CLAUDE.md);
          # błąd w scenariuszu nie jest powtarzany.
          set +e
          # Strażnik czasu (04.10.2026, run 37229659437: po błędzie sterownika Maestro wisiał 68 min do limitu zadania): 40 min na podejście
          # (06.10.2026: 10 scenariuszy zamiast 7 — przebieg 56 z 7 scenariuszami trwał ~21 min);
          # Maestro w osobnej grupie procesów — po czasie TERM/KILL całej grupy (java uruchamiana przez skrypt maestro trzymałaby potok do tee).
          guard() { perl -e '$t=shift; $p=fork; if(!$p){setpgrp(0,0); exec @ARGV; exit 127} $SIG{ALRM}=sub{kill "TERM",-$p; sleep 5; kill "KILL",-$p; exit 124}; alarm $t; waitpid($p,0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' "${MAESTRO_ALARM:-3000}" "$@"; }
          guard maestro --device "$SIM" test .maestro --format junit --output e2e-out/report.xml --test-output-dir e2e-out 2>&1 | tee /tmp/maestro-1.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] && grep -qE "iOS driver not ready in time|deviceInfo failed" /tmp/maestro-1.log; then
            echo "::warning::Sterownik XCTest nie wystartował — jedno powtórzenie (awaria maszyny, nie scenariusza)"
            rm -rf e2e-out && mkdir -p e2e-out
            guard maestro --device "$SIM" test .maestro --format junit --output e2e-out/report.xml --test-output-dir e2e-out
            rc=$?
          fi
          exit $rc
      - name: Podsumowanie porażki (nieudane polecenie i teksty z ekranu — artefakty bywają nieosiągalne)
        if: failure()
        run: |
          python3 scripts/ci/maestro-failures.py e2e-out /tmp/zrzuty.txt
          # Zrzut nieudanego kroku jako tekst w logu (base64 JPEG ~480 px) — artefakty bywają nieosiągalne; tylko ekran aplikacji w symulatorze.
          head -4 /tmp/zrzuty.txt | while IFS= read -r f; do
            echo "=== ZRZUT-BLEDU: $f"; sips -Z 480 -s format jpeg -s formatOptions 35 "$f" --out /tmp/zrzut.jpg >/dev/null 2>&1 || continue
            echo "BEGIN-B64"; base64 -b 1000 -i /tmp/zrzut.jpg; echo "END-B64"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ios
          retention-days: 1
          path: |
            e2e-out
            *.png
            .maestro/*.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log-sim
          retention-days: 1
          path: ios/xcodebuild.log
