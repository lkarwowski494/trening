# Testy E2E na symulatorze iPhone'a (Maestro) — uruchamiane ręcznie przed wydaniem (Actions → „E2E iOS (symulator)”).
# Od 03.10.2026 repozytorium publiczne (ADR-031): standardowe maszyny GitHuba, także macOS, bez limitu minut. Nadal tylko ręcznie.
# Artefakty trzymane 1 dzień (publicznie widoczne dla zalogowanych użytkowników GitHuba).
# Build Release na symulator nie wymaga podpisu ani konta Apple. Wynik: zrzuty ekranu i raport jako artefakty.
# 13.10.2026 (decyzja właściciela): aplikacja budowana RAZ (zadanie „build”), scenariusze Maestro dzielone na 3 równoległe maszyny macOS
# (zadanie „e2e”, macierz „shard” 1–3). Podział: scripts/ci/e2e-shards.mjs + e2e-shards.json (wagi = czasy scenariuszy; nowy scenariusz
# bez wagi też trafia do jednej części). Test aktualizacji (33–34) wykonuje jedna część. Artefakt porażek: e2e-ios-<numer części>.
# 19.10.2026 (decyzja właściciela): PAKIET — „podstawowy” (domyślnie; kluczowe przepływy z scripts/ci/e2e-podstawowy.json na 2 maszynach, ~20–25 min; blokuje TestFlight)
# albo „pelny” (cały katalog na 3 maszynach; nocą w nightly.yml, niewiążąco). Nieudany scenariusz jest ponawiany RAZ (osobne uruchomienie tylko jego); drugi czerwony = porażka.
# `tryb_scisly` = true: pełny katalog BEZ ponowień — opcjonalny pomiar niestabilności, nie bramka. Bramka App Store (CLAUDE.md, właściciel 21.10 i 26.10.2026):
# `pakiet: pelny` w trybie zwykłym na standardowym iPhonie — jedno ponowienie scenariusza dozwolone (M1-audytor-generalny-023). Podsumowanie przebiegu wypisuje scenariusze zielone dopiero w ponowieniu (niestabilność
# widoczna, nie ukryta) i zapisuje czasy per scenariusz w artefakcie e2e-wyniki (scripts/ci/e2e-wyniki.mjs; pilnuje tests/e2e-pakiet.test.ts).
name: E2E iOS (symulator)
# Tytuł przebiegu czyta bramka TestFlight (scripts/ci/bramka-e2e.sh, audyt M1-018): „E2E iOS · <pakiet>” bez dopisków = przebieg pełnowartościowy na tym commicie.
run-name: ${{ format('E2E iOS · {0}{1}{2}', (inputs.tryb_scisly == true && 'ścisły') || inputs.pakiet || 'podstawowy', inputs.tylko_scenariusze != '' && ' · tylko wybrane' || '', inputs.aplikacja_z_przebiegu != '' && ' · aplikacja z innego przebiegu' || '') }}
on:
  # decyzja właściciela 06.10.2026 (wariant A): samoczynnie po wypchnięciu na main i gałęzie integracyjne (bez zmian tylko w dokumentacji)
  push:
    branches: [main, 'integration/**']
    paths-ignore: ['docs/**', '**/*.md', 'tests/**', '.claude/**']
  workflow_dispatch:
    inputs:
      aplikacja_z_przebiegu:
        description: 'Numer przebiegu z gotową aplikacją (pusty = zbuduj od nowa; ~30 min mniej, gdy zmieniasz tylko scenariusze .maestro)'
        required: false
        default: ''
      urzadzenie:
        description: 'Wzorzec nazwy symulatora (grep -E), np. "iPhone SE|iPhone 16e" — mały ekran; pusty = iPhone 17'
        required: false
        default: ''
      wyglad:
        description: 'Wygląd systemu symulatora: light albo dark'
        required: false
        default: 'light'
      rozmiar_tekstu:
        description: 'Rozmiar tekstu systemu symulatora (simctl ui content_size), np. accessibility-extra-extra-extra-large; pusty = domyślny'
        required: false
        default: ''
      poprzednia_wersja_z_przebiegu:
        description: 'Test aktualizacji (scenariusze 33–34): numer przebiegu z aplikacją POPRZEDNIEJ wersji (artefakt trening-sim-app). Pusty = ostatni zielony przebieg na main (artefakty żyją 1 dzień — gdy wygasł, test aktualizacji jest pomijany z ostrzeżeniem); „brak” = bez testu aktualizacji'
        required: false
        default: ''
      tylko_scenariusze:
        description: 'Tylko wybrane scenariusze: numery po spacji, np. "31 35" (33 i 34 uruchamiają test aktualizacji); pusty = wg pakietu. Do szybkiego powtórzenia po poprawce scenariusza'
        required: false
        default: ''
      pakiet:
        description: 'Pakiet scenariuszy: podstawowy (kluczowe przepływy, 2 maszyny, ~20–25 min) albo pelny (cały katalog, 3 maszyny)'
        type: choice
        options: [podstawowy, pelny]
        default: podstawowy
      tryb_scisly:
        description: 'Tryb ścisły (opcjonalny pomiar, nie bramka App Store): pełny katalog BEZ ponowień. Bramka App Store = pakiet pelny w trybie zwykłym (jedno ponowienie)'
        type: boolean
        default: false
  workflow_call:  # nocny przebieg (nightly.yml, 06.10.2026): inne urządzenie i ciemny wygląd
    inputs:
      aplikacja_z_przebiegu: { type: string, required: false, default: '' }
      urzadzenie: { type: string, required: false, default: '' }
      wyglad: { type: string, required: false, default: 'light' }
      rozmiar_tekstu: { type: string, required: false, default: '' }
      poprzednia_wersja_z_przebiegu: { type: string, required: false, default: '' }
      tylko_scenariusze: { type: string, required: false, default: '' }
      pakiet: { type: string, required: false, default: 'podstawowy' }
      tryb_scisly: { type: boolean, required: false, default: false }
# uprawnienia na poziomie przepływu — dotyczą wszystkich zadań (build i części)
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  build:
    if: inputs.aplikacja_z_przebiegu == ''
    runs-on: macos-26  # SDK 56+: Xcode 26.4+ (macos-15 ma najwyżej 26.3)
    timeout-minutes: 90  # build ~40 min (run 38411267312: pods 2 min + xcodebuild 36 min)
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.x
        # T-051: najnowszy Xcode 26.x z obrazu macos-26 — dziś 26.6 (jak ios-unsigned.yml i iphone-local.yml).
        run: bash scripts/ci/select-xcode.sh 26
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install pods
        run: cd ios && pod install
      - name: Platformy iOS i watchOS zgodne z SDK wybranego Xcode (pobranie tylko, gdy ich brak)
        if: inputs.aplikacja_z_przebiegu == ''
        run: bash scripts/ci/ensure-ios-platform.sh
      - name: Build (Release, symulator, bez podpisu)
        env:
          # 0.17.0 (docs/27 7.2): sztuczny sklep + włączony przełącznik subskrypcji, limit 1 trening — TYLKO ten build E2E; testflight.yml ma straż (tests/store-adapter.test.ts)
          EXPO_PUBLIC_STORE_FAKE: '1'
          # 14.10.2026: udawany zegarek (panel „Test watch”, scenariusz 50) — TYLKO ten build E2E, razem ze sztucznym sklepem; testflight.yml ma straż (tests/watch-test-mode.test.tsx)
          EXPO_PUBLIC_WATCH_FAKE: '1'
        run: |
          set -o pipefail
          cd ios
          # 0.20: bez „-sdk iphonesimulator” — wymuszałby SDK iOS także dla zegarka osadzonego w aplikacji (cel watchOS buduje się z watchsimulator)
          xcodebuild -workspace Trening.xcworkspace -scheme Trening -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify
          test -d build/Build/Products/Release-iphonesimulator/Trening.app
      - name: Zapis aplikacji (do ponownego użycia)
        run: cd ios/build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Trening-sim.zip" Trening.app
      - uses: actions/upload-artifact@v4
        with:
          name: trening-sim-app
          path: Trening-sim.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log-sim
          retention-days: 1
          path: ios/xcodebuild.log
  e2e:
    name: e2e (część ${{ matrix.shard }})
    needs: build
    # build pominięty (wejście aplikacja_z_przebiegu) = aplikacja z innego przebiegu; build nieudany = części się nie uruchamiają
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-26
    strategy:
      fail-fast: false  # porażka jednej części nie przerywa pozostałych — wynik wszystkich scenariuszy w jednym przebiegu
      max-parallel: 3  # decyzja właściciela 27.10.2026 (A+C): najwyżej 3 z 5 maszyn macOS planu darmowego naraz; wartość w scripts/ci/store-shards.mjs (MACOS_MAX_PARALLEL), pilnuje tests/macos-max-parallel.test.ts
      matrix:
        shard: [1, 2, 3]  # liczba części = „czesci” w scripts/ci/e2e-shards.json (pilnuje tests/e2e-shards.test.ts)
    timeout-minutes: 300  # 13.10.2026: scenariusze „z życia” 31–35 (+~20 min) i test aktualizacji — strażnik 100 min na podejście; wcześniej 180: symulator ~8 + 2 × strażnik (11.10.2026: 18 scenariuszy ~50 min — strażnik 50 min uciął ostatni, run 38153866859); przy za małym limicie powtórzenie było ucinane bez podsumowania porażki. Część to ~30 min scenariuszy, limit zostaje zapasowy
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.x
        run: bash scripts/ci/select-xcode.sh 26
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Plan części (które scenariusze wykonuje ta maszyna)
        # Wejście „tylko_scenariusze” działa tak jak dawniej, tylko na każdej maszynie osobno: część bez wybranych scenariuszy kończy się od razu (bez symulatora).
        id: plan
        env:
          ONLY: ${{ inputs.tylko_scenariusze }}
          PAKIET: ${{ inputs.tryb_scisly == true && 'pelny' || inputs.pakiet }}  # tryb ścisły wymusza pełny katalog; puste (push) = podstawowy
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/e2e-shards.mjs czesc "$SHARD" --out .maestro-czesc
      - uses: actions/setup-java@v4
        if: steps.plan.outputs.any == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.any == 'true' && inputs.aplikacja_z_przebiegu != ''
        with:
          name: trening-sim-app
          run-id: ${{ inputs.aplikacja_z_przebiegu }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.any == 'true' && inputs.aplikacja_z_przebiegu == ''
        with:
          name: trening-sim-app
      - name: Rozpakowanie aplikacji
        if: steps.plan.outputs.any == 'true'
        run: mkdir -p ios/build/Build/Products/Release-iphonesimulator && unzip -q Trening-sim.zip -d ios/build/Build/Products/Release-iphonesimulator
      - name: Simulator
        if: steps.plan.outputs.any == 'true'
        # Obraz macos-26 (20260907) ma symulatory iOS 26.2/26.4/26.5 z iPhone 17 (bez iPhone 16) — wybieramy z wersji zgodnej
        # z SDK wybranego Xcode (dla 26.6: iOS 26.5), a gdy jej nie ma, z całej listy. Kolejność: iPhone 17, iPhone 16 (macos-15,
        # testy do SDK 54), dowolny iPhone. Wzorzec z „ (” — bez iPhone 17 Pro/17e/16e.
        env:
          WANT: ${{ inputs.urzadzenie }}
          WYGLAD: ${{ inputs.wyglad }}
          ROZMIAR_TEKSTU: ${{ inputs.rozmiar_tekstu }}
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          LIST=$(xcrun simctl list devices available | awk -v h="-- iOS $SDK --" '$0 == h { f = 1; next } /^-- / { f = 0 } f')
          [ -n "$LIST" ] || { echo "Brak symulatorów iOS $SDK — wybór z całej listy"; LIST=$(xcrun simctl list devices available); }
          DEV=""
          for pat in ${WANT:+"$WANT"} "iPhone 17 \(" "iPhone 16 \(" "iPhone"; do  # WANT: wejście „urzadzenie” (nocny przebieg — mały ekran)
            DEV=$(printf '%s\n' "$LIST" | node scripts/ci/sim-wybor.mjs "$pat" || true)  # najwęższy z pasujących (M1-058); || true: krok działa z -eo pipefail
            [ -n "$DEV" ] && break
          done
          [ -n "$DEV" ] || { echo "::error::Brak dostępnego symulatora iPhone'a"; xcrun simctl list devices available; exit 1; }
          echo "Symulator: $(printf '%s\n' "$LIST" | grep -m1 "$DEV" | sed -E 's/^ +//') (SDK symulatora $SDK)"
          echo "Ekran: $(printf '%s\n' "$LIST" | node scripts/ci/sim-wybor.mjs "$pat" --opis)"  # szerokość ekranu wybranego symulatora w logu (M1-058)
          echo "SIM=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          [ "$WYGLAD" = dark ] && xcrun simctl ui "$DEV" appearance dark || true  # wejście „wyglad” (nocny przebieg)
          [ -z "$ROZMIAR_TEKSTU" ] || xcrun simctl ui "$DEV" content_size "$ROZMIAR_TEKSTU"  # wejście „rozmiar_tekstu” (duży tekst dostępności, scenariusz 58)
          xcrun simctl install "$DEV" ios/build/Build/Products/Release-iphonesimulator/Trening.app
      - name: Install Maestro
        if: steps.plan.outputs.any == 'true'
        # audyt 08.10.2026 (TST-11, SEC-05): wersja w logu; zmienna repozytorium MAESTRO_VERSION przypina wersję (pusta = najnowsza)
        env:
          MAESTRO_VERSION: ${{ vars.MAESTRO_VERSION }}
        run: |
          [ -n "$MAESTRO_VERSION" ] || unset MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version || true
      - name: Maestro
        if: steps.plan.outputs.main == 'true'
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000'  # świeżo uruchomiony symulator potrzebuje więcej czasu na sterownik XCTest (04.10.2026: 2× „driver not ready” przy 240 s po 8-min. rozruchu symulatora)
          MAESTRO_CLI_NO_ANALYTICS: '1'
          STRICT: ${{ inputs.tryb_scisly == true && 'true' || 'false' }}
        run: |
          mkdir -p e2e-out
          # Katalog części (scenariusze tej maszyny + subflows) przygotował krok „Plan części”; wejście „tylko_scenariusze” zawęża go tam.
          DIR=.maestro-czesc
          # Jedno powtórzenie TYLKO, gdy sterownik XCTest nie wystartował (awaria maszyny przed pierwszym scenariuszem — CLAUDE.md);
          # błąd w scenariuszu nie jest powtarzany.
          set +e
          # Strażnik czasu (04.10.2026, run 37229659437: po błędzie sterownika Maestro wisiał 68 min do limitu zadania): 40 min na podejście
          # (06.10.2026: 10 scenariuszy zamiast 7 — przebieg 56 z 7 scenariuszami trwał ~21 min; 13.10.2026: 40 min → 100 min — 21 scenariuszy trwało ~58 min, doszły długie 31, 32, 35);
          # Maestro w osobnej grupie procesów — po czasie TERM/KILL całej grupy (java uruchamiana przez skrypt maestro trzymałaby potok do tee).
          guard() { perl -e '$t=shift; $p=fork; if(!$p){setpgrp(0,0); exec @ARGV; exit 127} $SIG{ALRM}=sub{kill "TERM",-$p; sleep 5; kill "KILL",-$p; exit 124}; alarm $t; waitpid($p,0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' "${MAESTRO_ALARM:-6000}" "$@"; }
          guard maestro --device "$SIM" test "$DIR" --exclude-tags=aktualizacja --format junit --output e2e-out/report.xml --test-output-dir e2e-out 2>&1 | tee /tmp/maestro-1.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] && grep -qE "iOS driver not ready in time|deviceInfo failed" /tmp/maestro-1.log; then
            echo "::warning::Sterownik XCTest nie wystartował — jedno powtórzenie (awaria maszyny, nie scenariusza)"
            rm -rf e2e-out && mkdir -p e2e-out
            guard maestro --device "$SIM" test "$DIR" --exclude-tags=aktualizacja --format junit --output e2e-out/report.xml --test-output-dir e2e-out
            rc=$?
          fi
          # Ponowienie POJEDYNCZEGO nieudanego scenariusza (decyzja właściciela 19.10.2026): raz, osobnym uruchomieniem tylko jego; drugi czerwony = porażka.
          # Tryb ścisły (opcjonalny pomiar niestabilności) — bez ponowień. Wynik (przeszedł / w ponowieniu / padł dwa razy) zbiera krok „Wyniki scenariuszy”.
          if [ "$rc" -ne 0 ] && [ "$STRICT" != "true" ]; then
            FAILED=$(node scripts/ci/e2e-wyniki.mjs nieudane e2e-out/report.xml "$DIR")
            if [ -n "$FAILED" ]; then
              rc=0; mkdir -p e2e-out/ponowienie
              for f in $FAILED; do
                echo "::warning::Ponowienie scenariusza $f (jedno, osobno)"
                guard maestro --device "$SIM" test "$DIR/$f" --format junit --output "e2e-out/ponowienie/${f%.yaml}.xml" --test-output-dir "e2e-out/ponowienie/${f%.yaml}" || rc=1
              done
            fi
          fi
          exit $rc
      - name: Aktualizacja — wybór poprzedniej wersji
        # 20.10.2026 (M1-062, DEC-27; zmienia decyzję 06.10.2026 o artefaktach 1 dzień — dla TEGO pliku): poprzednia wersja = plik Trening-sim.zip przy tagu wydania
        # (zadanie „tag” w testflight.yml; build symulatora bez podpisu i sekretów). Brak poprzedniej wersji = PORAŻKA z komunikatem (scripts/ci/poprzednia-wersja.sh),
        # nie zielone pominięcie. Wejście poprzednia_wersja_z_przebiegu: numer przebiegu z artefaktem trening-sim-app (ręcznie) albo „brak” (świadome pominięcie,
        # np. pierwsze wydanie — tylko ręczny przebieg).
        id: prev
        if: ${{ !cancelled() && steps.plan.outputs.update == 'true' && inputs.poprzednia_wersja_z_przebiegu != 'brak' }}  # update=true tylko w jednej części (wybranej przez e2e-shards.mjs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT_RUN: ${{ inputs.poprzednia_wersja_z_przebiegu }}
        run: |
          if [ -n "$WANT_RUN" ]; then
            echo "run=$WANT_RUN" >> "$GITHUB_OUTPUT"; echo "Poprzednia wersja: z artefaktu trening-sim-app przebiegu $WANT_RUN (wskazanego ręcznie)"
          else
            bash scripts/ci/poprzednia-wersja.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" poprzednia-wersja
            echo "wydanie=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        id: prevapp
        if: ${{ !cancelled() && steps.prev.outputs.run != '' }}
        with:
          name: trening-sim-app
          run-id: ${{ steps.prev.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: poprzednia-wersja
      - name: Aktualizacja (poprzednia wersja → dane przez UI → bieżąca wersja bez odinstalowania → sprawdzenie)
        if: ${{ !cancelled() && (steps.prev.outputs.run != '' || steps.prev.outputs.wydanie == 'true') }}
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
          STRICT: ${{ inputs.tryb_scisly == true && 'true' || 'false' }}
        run: |
          set -o pipefail
          NEW=ios/build/Build/Products/Release-iphonesimulator/Trening.app
          mkdir -p poprzednia-wersja/app e2e-out/aktualizacja
          unzip -q poprzednia-wersja/Trening-sim.zip -d poprzednia-wersja/app
          test -d poprzednia-wersja/app/Trening.app || { echo "::error::Poprzednia wersja (Trening-sim.zip) bez Trening.app — test aktualizacji nie może się odbyć"; exit 1; }
          guard() { perl -e '$t=shift; $p=fork; if(!$p){setpgrp(0,0); exec @ARGV; exit 127} $SIG{ALRM}=sub{kill "TERM",-$p; sleep 5; kill "KILL",-$p; exit 124}; alarm $t; waitpid($p,0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' "${MAESTRO_ALARM_UPD:-1500}" "$@"; }
          echo "Poprzednia wersja: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' poprzednia-wersja/app/Trening.app/Info.plist) (build $(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' poprzednia-wersja/app/Trening.app/Info.plist)); bieżąca: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$NEW/Info.plist")"
          # Para 33–34 jest jednym scenariuszem aktualizacji: ponowienie (raz, tryb zwykły) powtarza OBIE części od czystej instalacji poprzedniej wersji; tryb ścisły — bez ponowień
          faza() {
            OUT=$1; mkdir -p "$OUT"; r=0
            xcrun simctl terminate "$SIM" pl.lukasz.trening || true
            xcrun simctl uninstall "$SIM" pl.lukasz.trening || true
            xcrun simctl install "$SIM" poprzednia-wersja/app/Trening.app
            guard maestro --device "$SIM" test .maestro/33-aktualizacja-przygotuj.yaml --format junit --output "$OUT/przygotuj.xml" --test-output-dir "$OUT/przygotuj" || r=1
            # instalacja bieżącej wersji NA TEJ SAMEJ instalacji (bez uninstall) — dane, ustawienia i trening w toku zostają
            xcrun simctl terminate "$SIM" pl.lukasz.trening || true
            xcrun simctl install "$SIM" "$NEW"
            guard maestro --device "$SIM" test .maestro/34-aktualizacja-sprawdz.yaml --format junit --output "$OUT/sprawdz.xml" --test-output-dir "$OUT/sprawdz" || r=1
            return $r
          }
          faza e2e-out/aktualizacja; rc=$?
          if [ "$rc" -ne 0 ] && [ "$STRICT" != "true" ]; then
            echo "::warning::Ponowienie testu aktualizacji (33–34) — jedno, od czystej instalacji poprzedniej wersji"
            faza e2e-out/aktualizacja/ponowienie; rc=$?
          fi
          exit $rc
      - name: Wyniki scenariuszy (przeszedł / w ponowieniu / padł dwa razy, czasy)
        if: ${{ always() && steps.plan.outputs.any == 'true' }}
        run: node scripts/ci/e2e-wyniki.mjs wyniki e2e-out "${{ matrix.shard }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Podsumowanie porażki (nieudane polecenie i teksty z ekranu — artefakty bywają nieosiągalne)
        if: failure()
        run: |
          echo "Część E2E: ${{ matrix.shard }}"
          python3 scripts/ci/maestro-failures.py e2e-out /tmp/zrzuty.txt
          # Zrzut nieudanego kroku jako tekst w logu (base64 JPEG ~480 px) — artefakty bywają nieosiągalne; tylko ekran aplikacji w symulatorze.
          head -4 /tmp/zrzuty.txt | while IFS= read -r f; do
            echo "=== ZRZUT-BLEDU: $f"; sips -Z 480 -s format jpeg -s formatOptions 35 "$f" --out /tmp/zrzut.jpg >/dev/null 2>&1 || continue
            echo "BEGIN-B64"; base64 -b 1000 -i /tmp/zrzut.jpg; echo "END-B64"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ios-${{ matrix.shard }}  # numer części w nazwie — artefakty porażek się nie nadpisują
          retention-days: 1
          path: |
            e2e-out
            *.png
            .maestro/*.png
  # Scenariusze eksperymentalne 40–42 (decyzja właściciela 14.10.2026: osobno, niewiążąco; awans do głównego po 3 zielonych przebiegach)
  eksperymenty:
    name: eksperymenty (niewiążące)
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') && inputs.tylko_scenariusze == '' && (inputs.pakiet == 'pelny' || inputs.tryb_scisly == true) }}  # eksperymenty tylko z pełnym katalogiem (nocą, tryb ścisły)
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.x
        run: bash scripts/ci/select-xcode.sh 26
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        if: inputs.aplikacja_z_przebiegu != ''
        with:
          name: trening-sim-app
          run-id: ${{ inputs.aplikacja_z_przebiegu }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: inputs.aplikacja_z_przebiegu == ''
        with:
          name: trening-sim-app
      - name: Rozpakowanie aplikacji
        run: mkdir -p ios/build/Build/Products/Release-iphonesimulator && unzip -q Trening-sim.zip -d ios/build/Build/Products/Release-iphonesimulator
      - name: Simulator
        # Obraz macos-26 (20260907) ma symulatory iOS 26.2/26.4/26.5 z iPhone 17 (bez iPhone 16) — wybieramy z wersji zgodnej
        # z SDK wybranego Xcode (dla 26.6: iOS 26.5), a gdy jej nie ma, z całej listy. Kolejność: iPhone 17, iPhone 16 (macos-15,
        # testy do SDK 54), dowolny iPhone. Wzorzec z „ (” — bez iPhone 17 Pro/17e/16e.
        env:
          WANT: ${{ inputs.urzadzenie }}
          WYGLAD: ${{ inputs.wyglad }}
          ROZMIAR_TEKSTU: ${{ inputs.rozmiar_tekstu }}
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          LIST=$(xcrun simctl list devices available | awk -v h="-- iOS $SDK --" '$0 == h { f = 1; next } /^-- / { f = 0 } f')
          [ -n "$LIST" ] || { echo "Brak symulatorów iOS $SDK — wybór z całej listy"; LIST=$(xcrun simctl list devices available); }
          DEV=""
          for pat in ${WANT:+"$WANT"} "iPhone 17 \(" "iPhone 16 \(" "iPhone"; do  # WANT: wejście „urzadzenie” (nocny przebieg — mały ekran)
            DEV=$(printf '%s\n' "$LIST" | node scripts/ci/sim-wybor.mjs "$pat" || true)  # najwęższy z pasujących (M1-058); || true: krok działa z -eo pipefail
            [ -n "$DEV" ] && break
          done
          [ -n "$DEV" ] || { echo "::error::Brak dostępnego symulatora iPhone'a"; xcrun simctl list devices available; exit 1; }
          echo "Symulator: $(printf '%s\n' "$LIST" | grep -m1 "$DEV" | sed -E 's/^ +//') (SDK symulatora $SDK)"
          echo "Ekran: $(printf '%s\n' "$LIST" | node scripts/ci/sim-wybor.mjs "$pat" --opis)"  # szerokość ekranu wybranego symulatora w logu (M1-058)
          echo "SIM=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          [ "$WYGLAD" = dark ] && xcrun simctl ui "$DEV" appearance dark || true  # wejście „wyglad” (nocny przebieg)
          [ -z "$ROZMIAR_TEKSTU" ] || xcrun simctl ui "$DEV" content_size "$ROZMIAR_TEKSTU"  # wejście „rozmiar_tekstu” (duży tekst dostępności, scenariusz 58)
          xcrun simctl install "$DEV" ios/build/Build/Products/Release-iphonesimulator/Trening.app
      - name: Install Maestro
        # audyt 08.10.2026 (TST-11, SEC-05): wersja w logu; zmienna repozytorium MAESTRO_VERSION przypina wersję (pusta = najnowsza)
        env:
          MAESTRO_VERSION: ${{ vars.MAESTRO_VERSION }}
        run: |
          [ -n "$MAESTRO_VERSION" ] || unset MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version || true
      - name: Maestro (eksperymenty, każdy plik osobno)
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          mkdir -p e2e-out; rc=0
          for f in $(grep -l -E '^  - eksperyment$' .maestro/[0-9][0-9]-*.yaml | sort); do
            echo "=== EKSPERYMENT $f"; mkdir -p "e2e-out/$(basename "$f" .yaml)"
            xcrun simctl terminate "$SIM" pl.lukasz.trening || true
            maestro --device "$SIM" test "$f" --format junit --output "e2e-out/$(basename "$f" .yaml).xml" --test-output-dir "e2e-out/$(basename "$f" .yaml)" || { echo "::warning::Eksperyment $f nie przeszedł (niewiążący)"; rc=1; }
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ios-eksperymenty
          retention-days: 1
          path: e2e-out
  wyniki:
    name: wyniki przebiegu (niestabilność)
    needs: e2e
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true  # części bez scenariuszy nie mają wyników; pusty zbiór = pusta tabela
        with:
          pattern: e2e-ios-[0-9]
          path: wyniki-czesci
      - name: "Podsumowanie przebiegu i artefakt e2e-wyniki (pomiar niestabilności — przeszedł, w ponowieniu, padł dwa razy, czasy)"
        run: |
          mkdir -p wyniki-czesci
          node scripts/ci/e2e-wyniki.mjs zbierz wyniki-czesci --out e2e-wyniki.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-wyniki
          # repozytorium publiczne (ADR-031: artefakty 1 dzień); trwały ślad pomiaru to podsumowanie przebiegu (GITHUB_STEP_SUMMARY)
          retention-days: 1
          path: e2e-wyniki.json
