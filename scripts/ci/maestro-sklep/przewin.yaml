# Zrzuty do sklepu: sekcja strażnika progresji — nagłówek „Strażnik progresji” u góry, pod nim sylwetka, legenda i wiersze partii, niezależnie od
# rozmiaru ekranu i od tego, czy łącze ?s=guard zdążyło przewinąć. Historia: 39149701858/39162600481 — stały procent ucinał sylwetkę;
# 39175724214 — legenda ukryta dla VoiceOver (Maestro jej nie widzi); 39219483481 — łącze przewinęło do sekcji i przesunięcie od sylwetki
# wypchnęło nagłówek. Teraz: sylwetka do kadru, nagłówek (przycisk ⓘ ma etykietę dostępności) na środek, powolne przesunięcie o 32% bez rozpędu.
# ⓘ nie jest dotykany — objaśnienie zostaje zwinięte.
appId: pl.lukasz.trening
---
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { id: "guard-map-pg" }
    direction: DOWN
    centerElement: true
    timeout: 20000
- scrollUntilVisible:
    element: { id: "info-guard-method" }
    direction: UP
    centerElement: true
    timeout: 10000
- swipe:
    start: "50%, 66%"
    end: "50%, 34%"
    duration: 2000
- waitForAnimationToEnd
