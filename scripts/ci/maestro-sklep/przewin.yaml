# Zrzuty do sklepu: sekcja strażnika progresji — legenda sylwetki na środku ekranu (sylwetka nad nią, wiersze partii pod nią), niezależnie od
# rozmiaru ekranu (przebiegi 39149701858 i 39162600481: przewinięcie o stały procent ucinało sylwetkę albo zostawiało objaśnienie).
appId: pl.lukasz.trening
---
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { id: "guard-legend-pg" }
    direction: DOWN
    centerElement: true
    timeout: 20000
