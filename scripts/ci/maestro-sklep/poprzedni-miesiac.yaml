# Zrzuty do sklepu: Plan → kalendarz na poprzedni (pełny) miesiąc (strzałka „‹”, testID month-prev w components/HistoryCalendar.tsx).
# Po zmianie miesiąca pojawia się „Pokaż wszystkie” — dowód, że stuknięcie zadziałało (przebieg 39169554299: stuknięcie bywało gubione).
appId: pl.lukasz.trening
---
- extendedWaitUntil: { visible: { id: "month-prev" }, timeout: 20000 }
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn: { id: "month-prev" }
      - assertVisible: "Pokaż wszystkie|Show all"
